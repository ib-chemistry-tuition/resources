            position: sticky;
            top: 10px;
            z-index: 100;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 22px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 25px;
            box-sizing: border-box;
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: border-color 0.3s;
            background: #ffffff;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        .plant-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .plant-card {
            background-color: var(--card-background);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .plant-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.1);
        }

        .scientific-name {
            font-size: 1.4em;
            font-weight: bold;
            font-style: italic;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .common-names {
            font-size: 0.9em;
            background-color: #f4f1ea;
            padding: 8px 12px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .common-names span {
            display: block;
        }

        .lang-label {
            font-weight: bold;
            color: var(--secondary-color);
        }

        .section-title {
            font-weight: bold;
            color: var(--secondary-color);
            margin-top: 10px;
            text-transform: uppercase;
            font-size: 0.8em;
            letter-spacing: 1px;
        }

        .description {
            font-size: 0.95em;
        }

        .load-more-container {
            text-align: center;
            margin: 40px 0;
        }

        .load-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;

        }

        .load-btn:hover {
            background-color: var(--secondary-color);
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            font-size: 0.85em;
            color: #777;
        }

</head>

    // -----------------------------------------------------------------
    // APPLICATION LOGIC & BATCH RENDERING
    // -----------------------------------------------------------------
    let currentIndex = 0;
    const batchSize = 100;

    function renderPlantCard(plant) {
        return `
        <div class="plant-card">
            <h2 class="scientific-name">${plant.id}. ${plant.name}</h2>
            <div class="common-names">
                <span><strong class="lang-label">EN:</strong> ${plant.en || 'N/A'}</span>
                <span><strong class="lang-label">DE:</strong> ${plant.de || 'N/A'}</span>
                <span><strong class="lang-label">FR:</strong> ${plant.fr || 'N/A'}</span>
            </div>
            <div class="description">
                <div class="section-title">Ecology & Entomology</div>
                <p>${plant.ecology || 'Data pending compilation.'}</p>
                <div class="section-title">Medicine & History</div>
                <p>${plant.medicine || 'Data pending compilation.'}</p>
                <div class="section-title">Folklore & Science</div>
                <p>${plant.folklore || 'Data pending compilation.'}</p>
            </div>
        </div>`;
    }

    function loadNextBatch() {
        const grid = document.getElementById('plantGrid');
        const nextBatch = plantData.slice(currentIndex, currentIndex + batchSize);
        
        let html = '';
        nextBatch.forEach(plant => {
            html += renderPlantCard(plant);
        });
        
        grid.insertAdjacentHTML('beforeend', html);
        currentIndex += batchSize;

        if (currentIndex >= plantData.length) {
            document.getElementById('loadMoreBtn').style.display = 'none';
        }
    }

    function filterPlants() {
        const input = document.getElementById('searchInput');
        const filter = input.value.toLowerCase().trim();
        const grid = document.getElementById('plantGrid');

        if (filter === "") {
            grid.innerHTML = "";
            currentIndex = 0;
            loadNextBatch();
            document.getElementById('loadMoreBtn').style.display = 'inline-block';
            return;
        }

        // Instant search across all 500 items in memory
        const filtered = plantData.filter(plant => 
            plant.name.toLowerCase().includes(filter) || 
            (plant.en && plant.en.toLowerCase().includes(filter)) ||
            (plant.de && plant.de.toLowerCase().includes(filter)) ||
            (plant.fr && plant.fr.toLowerCase().includes(filter)) ||
            (plant.ecology && plant.ecology.toLowerCase().includes(filter)) ||
            (plant.medicine && plant.medicine.toLowerCase().includes(filter)) ||
            (plant.folklore && plant.folklore.toLowerCase().includes(filter))
        );

        grid.innerHTML = filtered.map(renderPlantCard).join('');
        document.getElementById('loadMoreBtn').style.display = 'none';
    }

    // Automatically trigger next batch load when user nears bottom of page
    window.onscroll = function() {
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
            const searchInput = document.getElementById('searchInput');
            if (searchInput.value.trim() === "" && currentIndex < plantData.length) {
                loadNextBatch();
            }
        }
    };

    // Initialize initial batch on load
    document.addEventListener('DOMContentLoaded', loadNextBatch);
</script>
