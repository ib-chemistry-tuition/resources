<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vögel in Deutschland · Birds of Germany — Lern- & Quiztool</title>
<style>

  header{padding:22px 20px 6px;max-width:1180px;margin:0 auto}
  .titlebar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
  h1{font-size:clamp(1.3rem,2.6vw,2rem);margin:0;letter-spacing:.2px}

  main{max-width:1180px;margin:0 auto;padding:16px 20px 60px}
  .intro{color:var(--muted);font-size:.92rem;margin:2px 0 16px;max-width:820px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .12s,border-color .12s}

  .cname{font-weight:700;font-size:1.02rem}
  .cname small{display:block;font-weight:500;color:var(--muted);font-size:.82rem}
  .csci{font-style:italic;color:var(--accent);font-size:.82rem}
  .meta{color:var(--muted);font-size:.78rem}

  .callnote{font-size:.8rem;color:var(--muted);background:#12211a;border:1px dashed var(--line);border-radius:8px;padding:6px 8px}

  .kv b{color:var(--muted);font-weight:600}
  .section{padding:0 22px 8px}

  .qmedia img{width:100%;max-height:340px;object-fit:contain;display:block}
  .qprompt{font-size:1.05rem;font-weight:600;margin-bottom:12px}
  .opts{display:grid;gap:10px}
  .opt{text-align:left;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;font-size:1rem;font-weight:600;transition:.1s}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt.correct{background:rgba(78,194,122,.18);border-color:var(--good);color:#c7f2d6}
  .opt.wrong{background:rgba(226,104,95,.16);border-color:var(--bad);color:#f6cdc9}
  .opt small{display:block;font-weight:500;color:var(--muted);font-style:italic}
  .fb{margin-top:14px;font-size:.95rem;min-height:1.2em}
  .quiz-setup{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
  .scorebar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:10px 0 0}
  .scorebar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .result{text-align:center;padding:10px}
  .result .big{font-size:2.6rem;font-weight:800;color:var(--accent)}
  footer{max-width:1180px;margin:0 auto;padding:8px 20px 40px;color:var(--muted);font-size:.8rem}
  footer code{background:var(--panel2);padding:1px 6px;border-radius:5px}
  .badge{display:inline-block;font-size:.7rem;background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}

  @media(max-width:620px){.sheet .top{grid-template-columns:1fr}}
</style>
</head>

let LANG = "de";
function t(k){ return (I18N[LANG==="both"?"de":LANG][k]) || I18N.de[k]; }

/* ---------- names helper (respects DE/EN/both) ---------- */
function nameMain(s){ if(LANG==="en")return s.en; if(LANG==="both")return s.de+" · "+s.en; return s.de; }
function nameSub(s){ if(LANG==="en")return s.de; if(LANG==="both")return ""; return s.en; }
function field(s,key){ // returns localized string; 'both' shows DE then EN
  if(LANG==="en") return s[key+"_en"];
  if(LANG==="both") return s[key+"_de"]+"  ·  "+s[key+"_en"];
  return s[key+"_de"];
}
function fam(s){ if(LANG==="en")return s.fam_en; if(LANG==="both")return s.fam_de+" · "+s.fam_en; return s.fam_de; }

/* ---------- Wikimedia media loader (runs in the student's browser) ---------- */
const imgCache={}, audCache={};
async function getImage(s){
  if(imgCache[s.id]!==undefined) return imgCache[s.id];
  // Offline bundle: use embedded photo if the builder injected one.
  if(window.BUNDLED_IMG && BUNDLED_IMG[s.id]){ imgCache[s.id]=BUNDLED_IMG[s.id]; return imgCache[s.id]; }
  const tries = [["de",s.art_de],["en",s.art_en]];
  for(const [lang,title] of tries){
    try{
      const url=`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}?origin=*`;
      const r=await fetch(url); if(!r.ok) continue;
      const j=await r.json();
      const src=(j.originalimage&&j.originalimage.source)||(j.thumbnail&&j.thumbnail.source);
      if(src){ // ask for a reasonably sized thumb
        const thumb = src.replace(/\/(\d+)px-/,'/640px-');
        imgCache[s.id]=thumb; return thumb;
      }
    }catch(e){}
  }
  imgCache[s.id]=null; return null;
}
// Score an audio filename for "is this a good song/call clip?"
function scoreAudio(title){
  const t=title.toLowerCase(); let sc=0;
  if(/song|gesang|ruf|call|vocal|voice|stimme|singing/.test(t)) sc+=5;
  if(/\.oga$|\.ogg$/.test(t)) sc+=2;
  if(/\.mp3$/.test(t)) sc+=2;
  if(/\.wav$/.test(t)) sc+=1;
  if(/drum|trommel/.test(t)) sc+=1;
  if(/flight|flug/.test(t)) sc-=1;
  return sc;
}
async function getAudio(s){
  if(audCache[s.id]!==undefined) return audCache[s.id];
  // Offline bundle: use embedded call if the builder injected one.
  if(window.BUNDLED_AUDIO && BUNDLED_AUDIO[s.id]){ audCache[s.id]={url:BUNDLED_AUDIO[s.id],title:"bundled",bundled:true}; return audCache[s.id]; }
  const tries=[["de",s.art_de],["en",s.art_en]];
  for(const [lang,title] of tries){
    try{
      const api=`https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*`+
        `&generator=images&gimlimit=200&titles=${encodeURIComponent(title)}`+
        `&prop=imageinfo&iiprop=url|mime`;
      const r=await fetch(api); if(!r.ok) continue;
      const j=await r.json();
      const pages=j.query&&j.query.pages; if(!pages) continue;
      let best=null,bestScore=-99;
      for(const k in pages){
        const p=pages[k]; const ii=p.imageinfo&&p.imageinfo[0]; if(!ii) continue;
        if(!/audio\//.test(ii.mime||"")) continue;
        const sc=scoreAudio(p.title||ii.url||"");
        if(sc>bestScore){bestScore=sc;best={url:ii.url,title:(p.title||"").replace(/^File:/,"")};}
      }
      if(best){ audCache[s.id]=best; return best; }
    }catch(e){}
  }
  audCache[s.id]=null; return null;
}

/* ---------- Build gallery ---------- */
const grid=document.getElementById('grid');
function renderGrid(){
  grid.innerHTML='';
  SPECIES.forEach(s=>{
    const card=document.createElement('div'); card.className='card';
    card.innerHTML=`
      <div class="thumb" data-img="${s.id}">
        <div class="ld"><span class="spinner"></span><span>${t('loadingImg')}</span></div>
      </div>
      <div class="cbody">
        <div class="cname">${nameMain(s)}${nameSub(s)?`<small>${nameSub(s)}</small>`:''}</div>
        <div class="csci">${s.sci}</div>
        <div class="meta">${fam(s)} · ${s.len}</div>
        <div class="aud" data-aud="${s.id}"><div class="callnote"><span class="spinner" style="display:inline-block;vertical-align:-2px"></span> ${t('loadingAud')}</div></div>
      </div>`;
    card.querySelector('.cname').style.cursor='pointer';
    card.addEventListener('click',e=>{ if(e.target.closest('audio')||e.target.closest('a')) return; openDetail(s); });
    grid.appendChild(card);
    // lazy-load media
    getImage(s).then(src=>{
      const box=card.querySelector('.thumb');
      if(src){ box.innerHTML=`<img loading="lazy" src="${src}" alt="${nameMain(s)}">`; }
      else { box.querySelector('.ld').innerHTML=`<span>🪶 ${s.de}</span>`; }
    });
    const xc=`https://xeno-canto.org/explore?query=${encodeURIComponent(s.sci)}`;
    getAudio(s).then(a=>{
      const box=card.querySelector('.aud');
      if(a){ box.innerHTML=`<audio controls preload="none" src="${a.url}"></audio>
        <a class="callnote listen" href="${xc}" target="_blank" rel="noopener" style="display:block;margin-top:6px;text-decoration:none">🔊 ${t('xc')} ↗</a>`; }
      else { box.innerHTML=`<a class="callnote listen" href="${xc}" target="_blank" rel="noopener" style="display:block;text-decoration:none">🔊 ${t('listenXC')} ↗</a>`; }
    });
  });
}

/* ---------- Detail modal ---------- */

function closeDetail(){ modal.classList.remove('on'); sheet.innerHTML=''; }
modal.addEventListener('click',e=>{ if(e.target===modal) closeDetail(); });

/* ---------- Quiz engine ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const QN=10;
let quiz={mode:null,order:[],i:0,score:0,answered:false};

function startQuiz(mode){
  quiz={mode,order:shuffle(SPECIES).slice(0,QN),i:0,score:0,answered:false};
  renderQuestion();
}
function optionsFor(correct){
  const others=shuffle(SPECIES.filter(s=>s.id!==correct.id)).slice(0,3);
  return shuffle([correct,...others]);
}
function quizContainer(){ return document.getElementById(quiz.mode==='photo'?'view-quizPhoto':'view-quizCall'); }

function renderQuestion(){
  const cont=quizContainer();
  if(quiz.i>=quiz.order.length){ return renderResult(cont); }
  const s=quiz.order[quiz.i];
  const opts=optionsFor(s);
  const label = quiz.mode==='photo'? t('whichBird') : t('whichCall');
  cont.innerHTML=`
    <div class="quizwrap">
      <div class="qcard">
        <div class="qtop"><span>${t('q')} ${quiz.i+1}/${quiz.order.length}</span><span class="js-score">${t('score')}: ${quiz.score}</span></div>
        <div class="scorebar"><i style="width:${(quiz.i/quiz.order.length)*100}%"></i></div>
        <div class="qmedia js-media" style="margin-top:14px">
          <div class="ld"><span class="spinner"></span></div>
        </div>
        <div class="qprompt">${label}</div>
        <div class="opts js-opts">
          ${opts.map(o=>`<button class="opt" data-id="${o.id}">${quizOptionLabel(o)}</button>`).join('')}
        </div>
        <div class="fb js-fb"></div>
        <div style="margin-top:14px;text-align:right"><button class="btn primary hidden js-next">${quiz.i+1>=quiz.order.length?t('finish'):t('next')}</button></div>
      </div>
    </div>`;
  // media
  const mbox=cont.querySelector('.js-media');
  if(quiz.mode==='photo'){
    getImage(s).then(src=>{ mbox.innerHTML = src?`<img src="${src}" alt="?">`:`<div class="ld">🪶</div>`; });
  }else{
    getAudio(s).then(a=>{
      if(a){ mbox.innerHTML=`<div style="width:100%;padding:16px"><audio controls autoplay src="${a.url}" style="width:100%"></audio><div class="callnote" style="margin-top:8px;text-align:center">🔊 ${t('play')}</div></div>`; }
      else { mbox.innerHTML=`<div class="ld" style="padding:20px;text-align:center">${t('noAud')}</div>`; }
    });
  }
  quiz.answered=false;
  cont.querySelectorAll('.js-opts .opt').forEach(b=>b.addEventListener('click',()=>choose(cont,b,s)));
  cont.querySelector('.js-next').addEventListener('click',()=>{ quiz.i++; renderQuestion(); });
}
function quizOptionLabel(o){
  if(LANG==='en') return `${o.en}<small>${o.sci}</small>`;
  if(LANG==='both') return `${o.de} · ${o.en}<small>${o.sci}</small>`;
  return `${o.de}<small>${o.sci}</small>`;
}
function choose(cont,btn,correct){
  if(quiz.answered) return; quiz.answered=true;
  const chosen=btn.dataset.id;
  cont.querySelectorAll('.js-opts .opt').forEach(b=>{
    b.disabled=true;
    if(b.dataset.id===correct.id) b.classList.add('correct');
    else if(b.dataset.id===chosen) b.classList.add('wrong');
  });
  const fb=cont.querySelector('.js-fb');
  if(chosen===correct.id){ quiz.score++; fb.innerHTML=`<span style="color:var(--good)">✔ ${t('correct')}</span>`; }
  else { fb.innerHTML=`<span style="color:var(--bad)">✗ ${t('wrong')} <b>${LANG==='en'?correct.en:correct.de}</b></span>`; }
  cont.querySelector('.js-score').textContent=`${t('score')}: ${quiz.score}`;
  cont.querySelector('.js-next').classList.remove('hidden');
}
function renderResult(cont){
  const pct=Math.round(quiz.score/quiz.order.length*100);
  let emoji = pct>=90?'🏆':pct>=70?'🌟':pct>=50?'👍':'🌱';
  cont.innerHTML=`
    <div class="quizwrap"><div class="qcard result">
      <div style="font-size:3rem">${emoji}</div>
      <div class="big">${quiz.score}/${quiz.order.length}</div>
      <p>${t('result_lead')} ${quiz.score} ${t('of')} ${quiz.order.length} (${pct}%)</p>
      <button class="btn primary js-restart">${t('restart')}</button>
    </div></div>`;
  cont.querySelector('.js-restart').addEventListener('click',()=>startQuiz(quiz.mode));
}
function renderQuizStart(mode,cont){
  cont.innerHTML=`
    <div class="quizwrap"><div class="qcard" style="text-align:center">
      <p style="font-size:1.05rem;margin-top:4px">${mode==='photo'?t('intro_qphoto'):t('intro_qcall')}</p>
      <p class="meta" style="color:var(--muted)">${QN} ${t('q').toLowerCase()}s · ${SPECIES.length} ${LANG==='en'?'species':'Arten'}</p>
      <button class="btn primary js-start" style="font-size:1.05rem;padding:12px 26px;margin-top:8px">${t('start')}</button>
    </div></div>`;
  cont.querySelector('.js-start').addEventListener('click',()=>startQuiz(mode));
}

/* ---------- View switching ---------- */
const views={browse:document.getElementById('view-browse'),
             quizPhoto:document.getElementById('view-quizPhoto')};
let current='browse';
function setView(v){
  current=v;
  Object.entries(views).forEach(([k,el])=>el.classList.toggle('hidden',k!==v));
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  const intro=document.getElementById('intro');
  if(v==='browse'){ intro.textContent=t('intro_browse'); }
  else { intro.textContent=''; renderQuizStart('photo',views.quizPhoto); }
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));

/* ---------- Language switching ---------- */
document.querySelectorAll('#langseg button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#langseg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); LANG=b.dataset.lang;
  document.documentElement.lang = LANG==='en'?'en':'de';
  applyStatic(); renderGrid();
  // reset quiz to start screen for chosen language
  renderQuizStart('photo',views.quizPhoto);
  if(current!=='browse') setView(current);
}));

function applyStatic(){
  document.querySelector('[data-i18n="title"]').childNodes[0].nodeValue=t('title');
  document.querySelector('[data-i18n="subtitle"]').textContent=t('subtitle');
  document.querySelector('[data-view="browse"]').textContent=t('tab_browse');
  document.querySelector('[data-view="quizPhoto"]').textContent=t('tab_qphoto');
  document.getElementById('footnote').textContent=t('foot');
  document.getElementById('intro').textContent = current==='browse'?t('intro_browse'):'';
}

/* ---------- init ---------- */
applyStatic();
renderGrid();
setView('browse');
</script>
