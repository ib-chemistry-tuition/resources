<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'">
<title>Notes</title>
<style>
  :root{
    --bg:#ece7d8;--bg-panel:#ece7d8;--row-sel:#ded5bc;--row-hover:#e5e0cf;
    --line:#d6cfba;--ink:#2c2a25;--ink-soft:#8f8873;--link:#5b6f93;--toolbar:#e3ddcb;--chip:#e2d9bf;
  }
  body.dark{
    --bg:#211f1a;--bg-panel:#211f1a;--row-sel:#38332b;--row-hover:#2c2823;
    --line:#3c372f;--ink:#ece7d8;--ink-soft:#9a917b;--link:#93a8cf;--toolbar:#1b1915;--chip:#3a3327;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--bg);display:flex;flex-direction:column;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;}
  button,input,textarea,select{font-family:inherit;}
  /* ---- night mode overrides for the (non-variable) surface colours ---- */
  body.dark #toolbar .title,body.dark .tbtn,body.dark #detailHead .dbtn,body.dark #empty .ebtn,body.dark #dropzone strong,body.dark #empty h1{color:#d8cfb4;}
  body.dark .tbtn,body.dark #search,body.dark .menu,body.dark #detailHead .dbtn,body.dark #empty .ebtn,body.dark #editor{background:#2a2721;}
  body.dark .tbtn:hover,body.dark #search:focus,body.dark #detailHead .dbtn:hover,body.dark #empty .ebtn:hover,body.dark #editor:focus{background:#332f28;}
  body.dark #search:focus,body.dark #editor:focus,body.dark #tagAdd:focus{border-color:#6f6549;}
  body.dark .menu{box-shadow:0 8px 24px rgba(0,0,0,.45);}
  body.dark .menu .mhead,body.dark #recentBlock .rhead,body.dark .chk,body.dark .mrow .msc,body.dark .mcount,body.dark #noteMeta,body.dark #wc,body.dark #saveState,body.dark .risub,body.dark .hint,body.dark #footer,body.dark #recentBlock .rclear,body.dark .mclear,body.dark .mdel,body.dark .ritem .ridel,body.dark .tag .x{color:#9a917b;}
  body.dark .mrow.disabled{color:#6a6350;}
  body.dark .tag{color:#d8cfb4;}
  body.dark #tagAdd{border-color:#5a5238;color:#9a917b;}
  body.dark #dropzone,body.dark .ritem,body.dark .badge{background:#26231f;}
  body.dark .badge{color:#b9ad8c;}
  body.dark #dropzone{border-color:#5a5238;}
  body.dark #dropzone:hover,body.dark #dropzone.drag,body.dark .ritem:hover{background:#2a2721;border-color:#6f6549;}
  body.dark #toast{background:#f0ead9;color:#2a2620;}
  body.dark .mdel:hover{background:#3a352c;}
  body.dark .mdel:hover,body.dark .ritem .ridel:hover,body.dark .tag .x:hover,body.dark .mclear:hover,body.dark #recentBlock .rclear:hover,body.dark #dropzone:hover strong{color:#ece7d8;}
  body.dark body.dragging #empty,body.dark #dropzone.drag{outline-color:#6f6549;}
  #toolbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--toolbar);border-bottom:1px solid var(--line);flex:0 0 auto;position:relative;z-index:30;}
  #toolbar .title{font-weight:600;font-size:14px;color:#5a5540;white-space:nowrap;}
  #search{flex:1 1 auto;max-width:340px;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:#fbf9f2;color:var(--ink);outline:none;}
  #search:focus{border-color:#b9ad8c;background:#fff;}
  .chk{display:flex;align-items:center;gap:5px;font-size:13px;color:#6c6650;white-space:nowrap;cursor:pointer;user-select:none;}
  .spacer{flex:1 1 auto;}
  .tbtn{font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:7px;background:#fbf9f2;color:#5a5540;cursor:pointer;white-space:nowrap;}
  .tbtn:hover{background:#fff;}
  .tbtn[hidden]{display:none;}
  #saveState{font-size:12px;color:var(--ink-soft);white-space:nowrap;min-width:64px;text-align:right;}
  .menu{position:absolute;top:44px;background:#fbf9f2;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(70,60,30,.18);padding:6px;z-index:40;display:none;min-width:230px;max-height:70vh;overflow:auto;}
  .menu.open{display:block;}
  .menu .mhead{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#a09979;padding:6px 8px 4px;}
  .mrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--ink);}
  .mrow:hover{background:var(--row-hover);}
  .mrow.disabled{color:#b6ae95;cursor:default;}
  .mrow.disabled:hover{background:transparent;}
  .mrow .msc{margin-left:auto;font-size:12px;color:var(--ink-soft);}
  .mrow.active{background:var(--row-sel);}
  .msep{height:1px;background:var(--line);margin:5px 4px;}
  .mname{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mcount{font-size:11px;color:var(--ink-soft);margin-left:auto;}
  .mdel{flex:0 0 auto;font-size:13px;color:#b3aa8d;padding:2px 6px;border-radius:5px;}
  .mdel:hover{background:#e0d8c0;color:#7a6f4a;}
  .mclear{font-size:12px;color:#8a7f5f;text-align:center;padding:8px;cursor:pointer;border-top:1px solid var(--line);margin-top:4px;}
  .mclear:hover{color:#6a5f3f;text-decoration:underline;}
  #main{flex:1 1 auto;display:flex;min-height:0;position:relative;}
  #list{width:340px;flex:0 0 340px;overflow-y:auto;border-right:1px solid var(--line);background:var(--bg-panel);position:relative;}
  #listSpacer{position:relative;width:100%;}
  .row{position:absolute;left:0;right:0;height:56px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--bg-panel);}
  .row:hover{background:var(--row-hover);}
  .row.sel{background:var(--row-sel);}
  .rline{display:flex;align-items:baseline;gap:10px;}
  .row .rtitle{flex:1 1 auto;min-width:0;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row.sel .rtitle{font-weight:600;}
  .row .rdate{flex:0 0 auto;font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .row .rsub{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #detail{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;background:var(--bg-panel);}
  #detailHead{display:flex;align-items:center;gap:12px;padding:16px 30px 0;max-width:900px;}
  #noteMeta{flex:1 1 auto;font-size:12px;color:var(--ink-soft);}
  #wc{flex:0 0 auto;font-size:11px;color:var(--ink-soft);white-space:nowrap;}
  #detailHead .dbtn{flex:0 0 auto;font-size:12px;padding:4px 12px;border:1px solid var(--line);border-radius:6px;background:#fbf9f2;color:#5a5540;cursor:pointer;}
  #detailHead .dbtn:hover{background:#fff;}
  #detailHead .dbtn[hidden]{display:none;}
  .badge{display:inline-block;margin-left:8px;padding:1px 7px;border:1px solid var(--line);border-radius:10px;font-size:11px;color:#8a7f5f;background:#f3efe2;}
  #tagsBar{display:none;padding:8px 30px 0;max-width:900px;align-items:center;gap:6px;flex-wrap:wrap;}
  #tagsBar.show{display:flex;}
  .tag{display:inline-flex;align-items:center;gap:5px;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:2px 9px;font-size:12px;color:#5f5738;}
  .tag .x{cursor:pointer;color:#9a8f68;font-size:12px;}
  .tag .x:hover{color:#6a5f3f;}
  #tagAdd{border:1px dashed #c3b993;border-radius:12px;padding:2px 8px;font-size:12px;color:#8a7f5f;background:transparent;outline:none;min-width:80px;}
  #tagAdd:focus{border-color:#a9995f;color:var(--ink);}
  #detailBody{flex:1 1 auto;overflow:hidden;padding:12px 24px 18px;display:flex;}
  .mdview{font-size:15px;line-height:1.6;color:var(--ink);max-width:820px;word-wrap:break-word;overflow-wrap:anywhere;}
  .mdview.plain{white-space:pre-wrap;}
  .mdview a{color:var(--link);text-decoration:none;} .mdview a:hover{text-decoration:underline;}
  .mdview h1,.mdview h2,.mdview h3,.mdview h4,.mdview h5,.mdview h6{margin:.6em 0 .3em;line-height:1.25;font-weight:700;}
  .mdview h1{font-size:1.6em;} .mdview h2{font-size:1.35em;} .mdview h3{font-size:1.15em;} .mdview h4{font-size:1.03em;} .mdview h5,.mdview h6{font-size:.95em;color:var(--ink-soft);}
  .mdview p{margin:.5em 0;} .mdview ul,.mdview ol{margin:.4em 0 .4em 1.5em;padding:0;} .mdview li{margin:.15em 0;}
  .mdview blockquote{margin:.5em 0;padding:.2em .9em;border-left:3px solid var(--line);color:var(--ink-soft);}
  .mdview hr{border:none;border-top:1px solid var(--line);margin:1em 0;}
  .mdview code{background:#f0ead9;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;}
  .mdview pre{background:#f0ead9;border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;}
  .mdview pre code{background:none;border:none;padding:0;}
  .mdview strong{font-weight:700;} .mdview em{font-style:italic;}
  body.dark .mdview code,body.dark .mdview pre{background:#26231f;}
  #noteText{display:none;} /* kept only for printing */
  #editor{display:block;flex:1 1 auto;width:100%;min-height:0;resize:none;border:1px solid var(--line);border-radius:8px;padding:14px 18px;font-family:inherit;font-size:16px;line-height:1.65;color:var(--ink);background:#fbf9f2;outline:none;}
  #editor:focus{border-color:#b9ad8c;background:#fff;}
  #editor[hidden]{display:none;}
  #footer{flex:0 0 auto;text-align:center;padding:7px;font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line);background:var(--bg-panel);user-select:none;}
  #footer.saveable{cursor:pointer;}
  #footer.saveable:hover{color:var(--ink);text-decoration:underline dotted;text-underline-offset:3px;}
  #footer.saved{color:var(--ink);}
  #empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:#7a7358;padding:30px;background:var(--bg);}
  #empty h1{font-size:20px;font-weight:600;margin:0;color:#5a5540;}
  #empty p{margin:0;font-size:14px;max-width:470px;line-height:1.5;}
  #dropzone{border:2px dashed #c3b993;border-radius:14px;padding:30px 40px;background:#f3efe2;cursor:pointer;transition:background .15s,border-color .15s;}
  #dropzone:hover,#dropzone.drag{background:#fbf9f2;border-color:#a9995f;}
  #dropzone strong{color:#5a5540;}
  #empty .btnrow{display:flex;gap:10px;}
  #empty .ebtn{font-size:13px;padding:8px 16px;border:1px solid var(--line);border-radius:8px;background:#fbf9f2;color:#5a5540;cursor:pointer;}
  #empty .ebtn:hover{background:#fff;}
  .hint{font-size:12px;color:#9a927f;}
  body.dragging #empty{outline:3px solid #b9ad8c;outline-offset:-8px;}
  #recentBlock{display:none;width:min(520px,90vw);margin-top:4px;}
  #recentBlock .rhead{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#a09979;text-align:left;padding:0 4px 6px;display:flex;justify-content:space-between;align-items:center;}
  #recentBlock .rclear{cursor:pointer;text-transform:none;letter-spacing:0;font-size:12px;color:#8a7f5f;}
  #recentBlock .rclear:hover{text-decoration:underline;}
  #recentList{display:flex;flex-direction:column;gap:6px;}
  .ritem{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f3efe2;border:1px solid var(--line);border-radius:9px;cursor:pointer;text-align:left;}
  .ritem:hover{background:#fbf9f2;border-color:#b9ad8c;}
  .ritem .riname{flex:1 1 auto;min-width:0;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ritem .risub{flex:0 0 auto;font-size:11px;color:var(--ink-soft);}
  .ritem .ridel{flex:0 0 auto;font-size:15px;color:#b3aa8d;padding:0 4px;}
  .ritem .ridel:hover{color:#7a6f4a;}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#3b382e;color:#f4efe0;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;}
  #toast.show{opacity:.96;}
  @media print{
    #toolbar,#list,#footer,#detailHead,#tagsBar,#empty,#toast{display:none !important;}
    body,#main,#detail,#detailBody{display:block;height:auto;overflow:visible;background:#fff;}
    #detailBody{padding:0;} #noteText{max-width:none;color:#000;display:block !important;white-space:normal;} #editor{display:none !important;}
  }

  /* ---- phone layout: single-pane, swap between the note list and the open note ---- */
  #backBtn{display:none;}
  @media (max-width:700px){
    #toolbar{flex-wrap:wrap;row-gap:6px;padding:8px 8px;}
    #toolbar .title{display:none;}
    #toolbar #search{order:5;flex:1 1 100%;max-width:none;}
    #toolbar .chk{display:none;}
    #main{position:relative;overflow:hidden;}
    #list{position:absolute;inset:0;width:100%;flex:none;z-index:5;
      transform:translateX(0);transition:transform .18s ease;}
    #detail{position:absolute;inset:0;width:100%;z-index:6;background:var(--bg-panel);
      transform:translateX(100%);transition:transform .18s ease;}
    #main.show-detail #list{transform:translateX(-100%);}
    #main.show-detail #detail{transform:translateX(0);}
    #backBtn{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;font-size:13px;
      padding:4px 10px 4px 6px;border:1px solid var(--line);border-radius:6px;background:#fbf9f2;
      color:#5a5540;cursor:pointer;}
    body.dark #backBtn{background:#2a2721;color:#d8cfb4;}
    #detailHead{padding:12px 12px 0;flex-wrap:wrap;}
    #detailBody{padding:10px 14px 16px;}
    /* 16px min font size keeps iOS Safari from auto-zooming when the field gets focus */
    #editor,#search{font-size:16px;}
    .row{padding:0 16px;}
  }
</style>
</head>
<body>
  <div id="toolbar">
    <span class="title">Notes</span>
    <button id="fileBtn" class="tbtn">File ▾</button>
    <button id="tagBtn" class="tbtn" hidden>Tags ▾</button>
    <button id="sortBtn" class="tbtn" hidden>Sort ▾</button>
    <button id="recentBtn" class="tbtn" hidden>Recent ▾</button>
    <input id="search" type="search" placeholder="Search notes… (⌘F)" autocomplete="off" disabled>
    <label class="chk"><input type="checkbox" id="showArchived"> Show archived</label>
    <span class="spacer"></span>
    <button id="themeBtn" class="tbtn" title="Switch to night mode">☾</button>
    <span id="saveState"></span>
    <input id="file" type="file" accept=".csv,text/csv" hidden>
    <div id="fileMenu" class="menu"></div>
    <div id="tagMenu" class="menu"></div>
    <div id="sortMenu" class="menu"></div>
    <div id="recentMenu" class="menu"></div>
  </div>

  <div id="main">
    <div id="list" aria-label="Note list"></div>
    <div id="detail">
      <div id="detailHead">
        <button id="backBtn" type="button">‹ Notes</button>
        <div id="noteMeta"></div>
        <span id="wc"></span>
        <button id="mdBtn" class="dbtn" hidden>MD: Auto</button>
        <button id="copyBtn" class="dbtn" hidden title="Copy note text">Copy</button>
        <button id="previewBtn" class="dbtn" hidden title="Show the note rendered">Preview</button>
        <button id="editBtn" class="dbtn" hidden>Edit</button>
        <button id="doneBtn" class="dbtn" hidden title="Save and show the note">Save</button>
      </div>
      <div id="tagsBar"></div>
      <div id="detailBody">
        <div id="noteText" class="mdview"></div>
        <textarea id="editor" spellcheck="false" autocorrect="off" autocapitalize="off" placeholder="Write your note…"></textarea>
      </div>
    </div>
    <div id="empty">
      <h1>Notes</h1>
      <p>Start writing straight away, or open a notes file you saved before. Your notes stay
         in this browser, on your own device.</p>
      <div class="btnrow"><button class="ebtn" id="newDocBtn">Start writing</button></div>
      <div id="dropzone">…or drop a notes file here, or <strong>click to open one</strong></div>
      <div id="recentBlock">
        <div class="rhead"><span>Recent files</span><span class="rclear" id="rclearEmpty">Clear</span></div>
        <div id="recentList"></div>
      </div>
      <p class="hint" id="emptyHint"></p>
    </div>
  </div>

  <div id="footer">No file loaded</div>
  <div id="toast"></div>

<script>
"use strict";
(function(){
  const $=s=>document.querySelector(s);
  const listEl=$("#list"),textEl=$("#noteText"),metaEl=$("#noteMeta"),wcEl=$("#wc"),editorEl=$("#editor"),
        detailBody=$("#detailBody"),emptyEl=$("#empty"),footerEl=$("#footer"),searchEl=$("#search"),
        fileEl=$("#file"),dropEl=$("#dropzone"),archEl=$("#showArchived"),tagsBar=$("#tagsBar"),
        fileBtn=$("#fileBtn"),fileMenu=$("#fileMenu"),tagBtn=$("#tagBtn"),tagMenu=$("#tagMenu"),
        recentBtn=$("#recentBtn"),recentMenu=$("#recentMenu"),recentBlock=$("#recentBlock"),
        recentList=$("#recentList"),rclearEmpty=$("#rclearEmpty"),editBtn=$("#editBtn"),doneBtn=$("#doneBtn"),
        saveState=$("#saveState"),toastEl=$("#toast"),newDocBtn=$("#newDocBtn"),emptyHint=$("#emptyHint"),themeBtn=$("#themeBtn"),
        mdBtn=$("#mdBtn"),sortBtn=$("#sortBtn"),sortMenu=$("#sortMenu"),copyBtn=$("#copyBtn"),previewBtn=$("#previewBtn"),
        backBtn=$("#backBtn"),mainEl=$("#main");
  const isPhoneLayout=()=>window.matchMedia("(max-width:700px)").matches;
  function mobileShowDetail(){ if(isPhoneLayout()) mainEl.classList.add("show-detail"); }
  function mobileShowList(){ mainEl.classList.remove("show-detail"); }
  backBtn.addEventListener("click",()=>{ if(editing)flushEditorToModel(); mobileShowList(); });
  const pref=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}};
  let globalMd=pref("nfMarkdown","1")==="1";
  let mdPasteLinks=pref("nfMdPaste","1")==="1";
  let sortKey=pref("nfSort","modified-desc");
  let lastSavedAt=null, selNote=null;

  /* ============ night mode ============ */
  function applyTheme(t){ const dark=(t==="dark"); document.body.classList.toggle("dark",dark);
    themeBtn.textContent=dark?"☀":"☾"; themeBtn.title=dark?"Switch to day mode":"Switch to night mode"; }
  function setTheme(t){ applyTheme(t); try{localStorage.setItem("nfTheme",t);}catch(e){} }
  function toggleTheme(){ setTheme(document.body.classList.contains("dark")?"light":"dark"); }
  (function initTheme(){ let t=null; try{t=localStorage.getItem("nfTheme");}catch(e){}
    if(!t){ t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"; }
    applyTheme(t); })();

  const NATIVE = !!(window.api);
  const HAS_FS = (typeof window.showOpenFilePicker==="function"&&typeof window.showSaveFilePicker==="function");
  let notes=[],view=[],selIndex=-1,editing=false,dirty=false,docName="Untitled",saveHandle=null,savedOnce=false,
      currentPath=null,tagFilter=null,editorNote=null;

  emptyHint.textContent = NATIVE
    ? "Edits save to your iCloud CSV. Edit on one Mac at a time and let iCloud sync before switching."
    : "Your notes are kept in this browser. Use File ▸ Save to download a copy you can keep, back up, or hand in.";

  /* ============ IndexedDB (browser recents + working-doc safety net) ============ */
  const DB_NAME="NotefileEditor",R_STORE="recents",D_STORE="doc",MAX_RECENT=8;
  let dbP=null;
  function idb(){ if(dbP)return dbP;
    dbP=new Promise((res,rej)=>{ let rq; try{rq=indexedDB.open(DB_NAME,1);}catch(e){return rej(e);}
      rq.onupgradeneeded=()=>{const db=rq.result;
        if(!db.objectStoreNames.contains(R_STORE))db.createObjectStore(R_STORE,{keyPath:"id"});
        if(!db.objectStoreNames.contains(D_STORE))db.createObjectStore(D_STORE,{keyPath:"key"});};
      rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error);
    }).catch(e=>{dbP=null;throw e;}); return dbP; }
  function stx(s,m){return idb().then(db=>db.transaction(s,m).objectStore(s));}
  function idbAll(s){return stx(s,"readonly").then(o=>new Promise((res,rej)=>{const r=o.getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);})).catch(()=>[]);}
  function idbGet(s,k){return stx(s,"readonly").then(o=>new Promise((res,rej)=>{const r=o.get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error);})).catch(()=>null);}
  function idbPut(s,v){return stx(s,"readwrite").then(o=>new Promise((res,rej)=>{const r=o.put(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);})).catch(()=>{});}
  function idbDel(s,k){return stx(s,"readwrite").then(o=>new Promise((res,rej)=>{const r=o.delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);})).catch(()=>{});}
  function idbClear(s){return stx(s,"readwrite").then(o=>new Promise((res,rej)=>{const r=o.clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error);})).catch(()=>{});}

  /* ============ helpers ============ */
  function toast(m){toastEl.textContent=m;toastEl.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove("show"),1700);}
  function base(p){return (p||"").split(/[\\/]/).pop()||"Untitled";}
  function pad(n){return String(n).padStart(2,"0");}
  function fmtNow(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());}
  function uuid(){try{return crypto.randomUUID();}catch(e){return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.floor(Math.random()*16),v=c==="x"?r:(r&0x3|0x8);return v.toString(16);});}}

  function htmlToTextWithLinks(html){

        walk(n);

    if(!ok){ const s=editorEl.selectionStart,e2=editorEl.selectionEnd; editorEl.setRangeText(text,s,e2,"end"); editorEl.dispatchEvent(new Event("input",{bubbles:true})); }
  }
  function onEditorPaste(e){
    const dt=e.clipboardData||window.clipboardData; if(!dt) return;
    const html=dt.getData("text/html"); if(!html) return; // plain text: let the normal paste happen
    const text=htmlToTextWithLinks(html); if(text==null) return;
    e.preventDefault(); insertIntoEditor(text);
  }

  function markDirty(){
    if(!dirty){ dirty=true; updateSaveState(); } // only touch the toolbar on the first change, not every keystroke
    // File autosave when we have a durable target (native file, or a chosen browser file)
    if(hasAutosaveTarget()) scheduleFileAutosave();
    // IndexedDB working-copy safety net (also covers an unsaved brand-new doc)
    if(!NATIVE||!currentPath) scheduleWorkingSave();
  }
  function hasAutosaveTarget(){ return NATIVE ? !!currentPath : !!saveHandle; }

  /* ============ autosave ============ */
  const AS_PAUSE=1500;   // save this long after you STOP typing
  const AS_MAX=10000;    // and at least this often while you KEEP typing
  let asPauseT=null, asMaxT=null, saving=false;
  function scheduleFileAutosave(){
    clearTimeout(asPauseT);
    asPauseT=setTimeout(runAutosave, AS_PAUSE);        // the "pause in activity" trigger
    if(!asMaxT) asMaxT=setTimeout(runAutosave, AS_MAX); // the "during continuous activity" trigger
  }
  function flushEditorToModel(){
    const nt=editorNote; if(!nt||editorEl.hidden)return;
    const val=editorEl.value;
    if(val!==nt.text){ nt.text=val; nt.title=firstLine(val); nt.modified=fmtNow(); nt.mts=Date.now();
      const idx=view.indexOf(nt);
      if(idx>=0){ const row=listEl.querySelector('.row[data-idx="'+idx+'"]');
        if(row){row.querySelector(".rtitle").textContent=nt.title;row.querySelector(".rdate").textContent=relDate(nt.mts);} }
    }
  }
  async function runAutosave(){
    clearTimeout(asPauseT); clearTimeout(asMaxT); asMaxT=null;
    if(saving) return;
    flushEditorToModel();
    if(!dirty || !hasAutosaveTarget()) return;
    saving=true; updateSaveState();
    try{
      const data=buildCSV();
      if(NATIVE){ const r=await window.api.save(currentPath,data); if(!(r&&r.ok)) throw new Error(r&&r.error||"save failed"); }
      else{ const w=await saveHandle.createWritable(); await w.write(data); await w.close(); docName=saveHandle.name; clearWorking(); }
      markSaved();
    }catch(e){ /* keep dirty; a later change (or manual Save) retries */ }
    finally{ saving=false; updateSaveState(); }
  }

  /* IndexedDB working-copy safety net (unsaved / browser) */
  let asT=null;
  function scheduleWorkingSave(){clearTimeout(asT);asT=setTimeout(persistWorking,700);}
  function persistWorking(){ idbPut(D_STORE,{key:"working",name:docName,savedAt:Date.now(),
    notes:notes.map(n=>({text:n.text,title:n.title,created:n.created,modified:n.modified,archived:n.archived,tags:n.tags,format:n.format,uuid:n.uuid,mts:n.mts}))}); }
  function clearWorking(){idbDel(D_STORE,"working");}

  function pad2(n){return String(n).padStart(2,"0");}
  function fmtClock(ts){const d=new Date(ts);return pad2(d.getHours())+":"+pad2(d.getMinutes());}
  function fmtStamp(){const d=new Date();return d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+"-"+pad2(d.getHours())+pad2(d.getMinutes());}
  function markSaved(){dirty=false;savedOnce=true;lastSavedAt=Date.now();updateSaveState();}
  function updateSaveState(){
    if(!notes.length){saveState.textContent="";return;}
    const savedLbl="Saved"+(lastSavedAt?(" "+fmtClock(lastSavedAt)):"");
    saveState.textContent = saving ? "Saving…" : (dirty ? (hasAutosaveTarget()?"Unsaved…":"Unsaved") : ((saveHandle||savedOnce||currentPath)?savedLbl:"Loaded"));
    saveState.title = (currentPath||docName)+(lastSavedAt?("  ·  last saved "+fmtClock(lastSavedAt)):"");
  }

  /* ============ deriving / save / export / share / print ============ */
  function deriveSaveName(){let b=(docName&&docName!=="Untitled")?docName.replace(/\.csv$/i,""):"My notes";
    return b+".csv";}

  async function saveCSV(){
    if(!notes.length){toast("Nothing to save");return;}
    if(editing)commitEdit();
    const data=buildCSV();
    if(NATIVE){
      if(currentPath){ const r=await window.api.save(currentPath,data);
        if(r&&r.ok){markSaved();toast("Saved");}else{alert("Save failed: "+(r&&r.error||"unknown"));} }
      else{ await saveAsCSV(); }
      return;
    }
    if(HAS_FS){
      try{ if(!saveHandle){saveHandle=await window.showSaveFilePicker({suggestedName:deriveSaveName(),types:[{description:"CSV",accept:{"text/csv":[".csv"]}}]});}
        const w=await saveHandle.createWritable();await w.write(data);await w.close();
        docName=saveHandle.name;markSaved();clearWorking();toast("Saved to "+saveHandle.name);return;
      }catch(e){if(e&&e.name==="AbortError")return;}
    }
    downloadBlob(data,deriveSaveName(),"text/csv");markSaved();toast("CSV downloaded");
  }
  async function saveAsCSV(){
    if(!notes.length){toast("Nothing to save");return;}
    if(editing)commitEdit();
    const data=buildCSV();
    if(NATIVE){ const r=await window.api.saveAs(deriveSaveName(),data);
      if(r&&r.path){currentPath=r.path;docName=base(r.path);markSaved();toast("Saved");} return; }
    saveHandle=null;saveCSV();
  }
  async function backupNow(){
    if(!notes.length){toast("Nothing to back up");return;}
    if(editing)commitEdit();
    const data=buildCSV();
    const baseName=(docName&&docName!=="Untitled")?docName.replace(/\.csv$/i,""):"Notefile";
    const name=baseName+"-backup-"+fmtStamp()+".csv";
    if(NATIVE){ const r=await window.api.backup(name,data); if(r&&r.path)toast("Backed up: "+base(r.path)); else toast("Backup failed"); return; }
    downloadBlob(data,name,"text/csv"); toast("Backup downloaded");
  }
  function copyNote(){
    const nt=view[selIndex]; if(!nt){toast("No note selected");return;}
    const text=editing?editorEl.value:(nt.text||"");
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(()=>toast("Note copied")).catch(()=>toast("Couldn't copy")); }
    else toast("Clipboard unavailable");
  }
  function openMostRecent(){
    if(NATIVE){ window.api.openLast(); return; }
    (async()=>{ const all=(await idbAll(R_STORE)).sort((a,b)=>b.savedAt-a.savedAt); if(all[0])openRecent(all[0]); else toast("No recent file"); })();
  }
  function downloadBlob(content,filename,type){
    const blob=new Blob([content],{type:type+";charset=utf-8"});const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},400);
  }
  function safeName(s){return (s||"note").replace(/[\/\\:*?"<>|]+/g,"_").replace(/\s+/g,"_").slice(0,60);}
  async function exportNote(fmt){
    if(editing)commitEdit();const cur=view[selIndex];if(!cur){toast("No note selected");return;}
    const content = fmt==="md" ? "# "+firstLine(cur.text)+"\n\n"+cur.text+"\n" : cur.text+"\n";
    const fname = safeName(firstLine(cur.text))+(fmt==="md"?".md":".txt");
    if(NATIVE){ const r=await window.api.exportFile(fname,content); if(r&&r.path)toast("Exported"); return; }
    downloadBlob(content,fname,fmt==="md"?"text/markdown":"text/plain");toast("Note exported");
  }
  async function exportAll(){
    if(!notes.length){toast("Nothing to export");return;}
    const parts=notes.map(n=>"# "+firstLine(n.text)+"\n"+(n.modified?"_"+n.modified+"_":"")+((n.tags&&n.tags.length)?"  ["+n.tags.map(t=>"#"+t).join(" ")+"]":"")+"\n\n"+n.text+"\n");
    const content=parts.join("\n---\n\n");
    if(NATIVE){ const r=await window.api.exportFile("Notefile-all-notes.md",content); if(r&&r.path)toast("Exported"); return; }
    downloadBlob(content,"Notefile-all-notes.md","text/markdown");toast("All notes exported");
  }
  async function shareNote(){
    if(editing)commitEdit();const nt=view[selIndex];if(!nt){toast("No note selected");return;}
    const text=nt.text||"";
    if(navigator.share){try{await navigator.share({text});return;}catch(e){if(e&&e.name==="AbortError")return;}}
    try{await navigator.clipboard.writeText(text);toast("Note copied to clipboard");}catch(e){toast("Couldn't share here");}
  }
  function printNote(){ const nt=view[selIndex]; if(!nt)return;
    // render the current text (rendered Markdown) into the reading pane so printing shows it
    const txt=editing?editorEl.value:(nt.text||""); renderInto(textEl,txt,mdEffective(nt,txt));
    window.print();
  }
  function revealFile(){ if(NATIVE&&currentPath)window.api.reveal(currentPath); else toast("Save the file first"); }
  function showHelp(){ alert("Notefile Editor\n\n• Click a note, then just type — it's always editable and autosaves.\n• Click a link to open it; double-click a link to edit it.\n• New note: ⌘N · Duplicate: ⌘D · Delete: ⌘⌫ · Find: ⌘F · Print: ⌘P\n• ⌘S or click the status bar to save right now.\n\nEdit on one Mac at a time and let iCloud finish syncing before switching Macs."); }

  /* ============ action dispatch (native menu + in-app) ============ */
  function doAction(a){
    switch(a){
      case "new":newNote();break; case "open":openViaButton();break;
      case "save":saveCSV();break; case "saveAs":saveAsCSV();break;
      case "duplicate":duplicateNote();break; case "delete":deleteNote();break;
      case "export-txt":exportNote("txt");break; case "export-md":exportNote("md");break; case "export-all":exportAll();break;
      case "share":shareNote();break; case "print":printNote();break;
      case "find":focusFind();break; case "reveal":revealFile();break;
      case "backup":backupNow();break; case "copy":copyNote();break; case "open-recent":openMostRecent();break;
      case "toggle-archived":archEl.checked=!archEl.checked;refreshTagMenu();render();break;
      case "toggle-theme":toggleTheme();break;
      case "toggle-markdown":globalMd=!globalMd;try{localStorage.setItem("nfMarkdown",globalMd?"1":"0");}catch(e){}
        if(view[selIndex]){ if(editing&&previewing())renderPreview(); else if(!editing)renderInto(textEl,view[selIndex].text||"",mdEffective(view[selIndex])); }
        updateMdBtn();toast("Markdown rendering "+(globalMd?"on":"off"));break;
      case "toggle-mdpaste":mdPasteLinks=!mdPasteLinks;try{localStorage.setItem("nfMdPaste",mdPasteLinks?"1":"0");}catch(e){}
        toast("Pasted links: "+(mdPasteLinks?"Markdown [text](url)":"text (url)"));break;
      case "help":showHelp();break;
    }
  }
  function focusFind(){searchEl.focus();searchEl.select();}

  /* ============ in-app File menu (for browser + parity) ============ */
  function buildFileMenu(){
    const has=notes.length>0,sel=selIndex>=0&&view.length>0;
    const items=[
      {label:"New Note",sc:"⌘N",fn:newNote},
      {label:"Open…",sc:"⌘O",fn:openViaButton},
      {label:"Open Most Recent",fn:openMostRecent},
      {label:"Find",sc:"⌘F",fn:focusFind,dis:!has},
      {sep:1},
      {label:"Save",sc:"⌘S",fn:saveCSV,dis:!has},
      {label:"Save As…",sc:"⇧⌘S",fn:saveAsCSV,dis:!has},
      {label:"Back Up a Copy…",fn:backupNow,dis:!has},
      {sep:1},
      {label:"Duplicate Note",sc:"⌘D",fn:duplicateNote,dis:!sel},
      {label:"Copy Note",fn:copyNote,dis:!sel},
      {label:"Delete Note",sc:"⌘⌫",fn:deleteNote,dis:!sel},
      {sep:1},
      {label:"Export note as text (.txt)",fn:()=>exportNote("txt"),dis:!sel},
      {label:"Export note as Markdown (.md)",fn:()=>exportNote("md"),dis:!sel},
      {label:"Export all notes (.md)",fn:exportAll,dis:!has},
      {label:"Share / Copy note",fn:shareNote,dis:!sel},
      {sep:1},
      {label:"Print…",sc:"⌘P",fn:printNote,dis:!sel},
    ];
    fileMenu.innerHTML="";
    items.forEach(it=>{ if(it.sep){const d=document.createElement("div");d.className="msep";fileMenu.appendChild(d);return;}
      const r=document.createElement("div");r.className="mrow"+(it.dis?" disabled":"");
      r.innerHTML='<span class="mname"></span>'+(it.sc?'<span class="msc">'+it.sc+'</span>':'');
      r.querySelector(".mname").textContent=it.label;
      if(!it.dis)r.addEventListener("click",()=>{closeMenus();it.fn();});
      fileMenu.appendChild(r); });
  }

  /* ============ open flow ============ */
  async function confirmDiscard(){ if(dirty && !confirm("You have unsaved edits. Discard them and open another file?"))return false; return true; }
  async function openViaButton(){
    if(!(await confirmDiscard()))return;
    if(NATIVE){ window.api.open(); return; }
    if(HAS_FS){ try{ const [handle]=await window.showOpenFilePicker({types:[{description:"CSV",accept:{"text/csv":[".csv"]}}],multiple:false});
        const file=await handle.getFile();loadText(await file.text(),file.name);await saveRecent({name:file.name,size:file.size,handle});return;
      }catch(e){if(e&&e.name==="AbortError")return;} }
    fileEl.click();
  }
  function readFileObj(file){ if(!file)return;
    if(NATIVE&&file.path){ window.api.readPath(file.path).then(r=>{ if(r){currentPath=r.path;loadText(r.text,base(r.path));savedOnce=true;dirty=false;updateSaveState();} }); return; }
    const reader=new FileReader();
    reader.onload=()=>{loadText(reader.result,file.name);saveRecent({name:file.name,size:file.size,text:reader.result});};
    reader.onerror=()=>alert("Sorry, couldn't read that file.");reader.readAsText(file);
  }

  /* ============ recents (browser mode) ============ */
  async function saveRecent(entry){
    if(NATIVE)return;
    const id=entry.name+"|"+entry.size;
    await idbPut(R_STORE,{id,name:entry.name,size:entry.size,savedAt:Date.now(),kind:entry.handle?"handle":"text",handle:entry.handle||null,text:entry.handle?null:entry.text||null});
    const all=(await idbAll(R_STORE)).sort((a,b)=>b.savedAt-a.savedAt);
    for(const old of all.slice(MAX_RECENT))await idbDel(R_STORE,old.id);
    await refreshRecents();
  }
  function fmtBytes(n){if(!n&&n!==0)return"";const u=["B","KB","MB","GB"];let i=0,x=n;while(x>=1024&&i<u.length-1){x/=1024;i++;}return (x>=10||i===0?Math.round(x):x.toFixed(1))+" "+u[i];}
  function fmtAgo(ts){const d=Date.now()-ts;if(d<60000)return"just now";if(d<3600000)return Math.round(d/60000)+"m ago";if(d<86400000)return Math.round(d/3600000)+"h ago";return Math.round(d/86400000)+"d ago";}
  async function refreshRecents(){
    if(NATIVE){recentBtn.hidden=true;recentBlock.style.display="none";return;}
    const all=(await idbAll(R_STORE)).sort((a,b)=>b.savedAt-a.savedAt);const has=all.length>0;
    recentBtn.hidden=!has;recentBlock.style.display=has?"block":"none";
    recentList.innerHTML="";recentMenu.innerHTML=has?'<div class="mhead">Recent files</div>':"";
    all.forEach(rec=>{
      const it=document.createElement("div");it.className="ritem";it.title=rec.name;
      it.innerHTML='<span class="riname"></span><span class="risub"></span><span class="ridel" title="Remove">✕</span>';
      it.querySelector(".riname").textContent=rec.name;
      it.querySelector(".risub").textContent=(rec.kind==="handle"?"live":fmtBytes(rec.size))+" · "+fmtAgo(rec.savedAt);
      it.addEventListener("click",e=>{if(e.target.classList.contains("ridel")){e.stopPropagation();removeRecent(rec.id);}else openRecent(rec);});
      recentList.appendChild(it);
      const mi=document.createElement("div");mi.className="mrow";mi.title=rec.name;
      mi.innerHTML='<span class="mname"></span><span class="mdel" title="Remove">✕</span>';
      mi.querySelector(".mname").textContent=rec.name;
      mi.addEventListener("click",e=>{if(e.target.classList.contains("mdel")){e.stopPropagation();removeRecent(rec.id);}else{closeMenus();openRecent(rec);}});
      recentMenu.appendChild(mi);
    });
    if(has){const c=document.createElement("div");c.className="mclear";c.textContent="Clear recent files";c.onclick=clearRecents;recentMenu.appendChild(c);}
  }
  async function removeRecent(id){await idbDel(R_STORE,id);await refreshRecents();}
  async function clearRecents(){if(confirm("Clear the recent-files list? (Your CSV and notes are not affected.)")){await idbClear(R_STORE);closeMenus();await refreshRecents();}}
  async function openRecent(rec){
    if(!(await confirmDiscard()))return;
    try{
      if(rec.kind==="handle"&&rec.handle){let p=await rec.handle.queryPermission({mode:"read"});if(p!=="granted")p=await rec.handle.requestPermission({mode:"read"});
        if(p!=="granted"){alert("Permission to read that file was declined.");return;}
        const file=await rec.handle.getFile();loadText(await file.text(),rec.name);await saveRecent({name:rec.name,size:file.size,handle:rec.handle});
      }else if(rec.text!=null){loadText(rec.text,rec.name);await idbPut(R_STORE,{...rec,savedAt:Date.now()});await refreshRecents();}
      else{alert("That recent file can't be reopened automatically. Use Open… to pick it again.");}
    }catch(e){alert("Couldn't reopen that file. Use Open… to select it again.");}
  }

  /* ============ menus ============ */
  function closeMenus(){fileMenu.classList.remove("open");tagMenu.classList.remove("open");sortMenu.classList.remove("open");recentMenu.classList.remove("open");}
  function toggleMenu(menu,btn,build){const open=menu.classList.contains("open");closeMenus();if(!open){if(build)build();menu.style.left=btn.offsetLeft+"px";menu.classList.add("open");}}
  fileBtn.addEventListener("click",e=>{e.stopPropagation();toggleMenu(fileMenu,fileBtn,buildFileMenu);});
  tagBtn.addEventListener("click",e=>{e.stopPropagation();toggleMenu(tagMenu,tagBtn,refreshTagMenu);});
  sortBtn.addEventListener("click",e=>{e.stopPropagation();toggleMenu(sortMenu,sortBtn,refreshSortMenu);});
  recentBtn.addEventListener("click",e=>{e.stopPropagation();toggleMenu(recentMenu,recentBtn,null);});
  document.addEventListener("click",e=>{if(![fileMenu,tagMenu,sortMenu,recentMenu].some(m=>m.contains(e.target))&&![fileBtn,tagBtn,sortBtn,recentBtn].includes(e.target))closeMenus();});

  /* ============ events ============ */
  listEl.addEventListener("click",e=>{const row=e.target.closest(".row");if(row)select(+row.dataset.idx,false);});
  listEl.addEventListener("scroll",renderRows);
  // The note pane is always editable. Each keystroke is cheap: mark dirty now, and update
  // the note's title/date/word-count a moment after you pause. Autosave persists it.
  let _pvT=null;
  editorEl.addEventListener("input",()=>{
    markDirty();
    clearTimeout(_pvT);
    _pvT=setTimeout(()=>{
      const nt=editorNote; if(!nt)return; const val=editorEl.value;
      if(val!==nt.text){ nt.text=val; nt.title=firstLine(val); nt.modified=fmtNow(); nt.mts=Date.now();
        const idx=view.indexOf(nt); if(idx>=0){ const row=listEl.querySelector('.row[data-idx="'+idx+'"]');
          if(row){row.querySelector(".rtitle").textContent=nt.title;row.querySelector(".rdate").textContent=relDate(nt.mts);} } }
      updateWC(val);
    }, editorEl.value.length>60000?350:150);
  });
  editorEl.addEventListener("paste",onEditorPaste);
  editorEl.addEventListener("blur",flushEditorToModel);
  // Single-click a link to open it; double-click to edit it. Wait briefly so the first click
  // of a double-click doesn't also open the link.
  let _linkT=null;
  editorEl.addEventListener("click",e=>{
    clearTimeout(_linkT);
    if(e.detail>1)return;                                     // 2nd/3rd click of a multi-click → don't open
    if(editorEl.selectionStart!==editorEl.selectionEnd)return; // a drag-selection, not a plain click
    const u=urlAtPos(editorEl.value,editorEl.selectionStart);
    if(!u)return;
    _linkT=setTimeout(()=>{ // only open if it was really a single click (no double-click cancelled it)
      if(editorEl.selectionStart===editorEl.selectionEnd && urlAtPos(editorEl.value,editorEl.selectionStart)===u){
        try{window.open(u,"_blank");}catch(_){}
      }
    },280);
  });
  editorEl.addEventListener("dblclick",()=>{ clearTimeout(_linkT); });
  function urlAtPos(text,pos){
    if(pos==null)return null; let s=pos,e=pos;
    while(s>0&&!/\s/.test(text[s-1]))s--;
    while(e<text.length&&!/\s/.test(text[e]))e++;
    const m=text.slice(s,e).match(/https?:\/\/[^\s]+/);
    return m?m[0].replace(/[.,;:!?)\]}'"]+$/,""):null;
  }
  searchEl.addEventListener("input",render);
  archEl.addEventListener("change",()=>{refreshTagMenu();render();});
  dropEl.addEventListener("click",openViaButton);
  newDocBtn.addEventListener("click",newDocument);
  themeBtn.addEventListener("click",toggleTheme);
  copyBtn.addEventListener("mousedown",e=>e.preventDefault());
  copyBtn.addEventListener("click",copyNote);
  footerEl.addEventListener("click",()=>{ if(notes.length) saveNow(); });
  fileEl.addEventListener("change",e=>readFileObj(e.target.files[0]));
  rclearEmpty.addEventListener("click",clearRecents);

  document.addEventListener("keydown",e=>{
    const meta=e.metaKey||e.ctrlKey;const inEditor=document.activeElement===editorEl;const inSearch=document.activeElement===searchEl;const inTag=document.activeElement&&document.activeElement.id==="tagAdd";
    if(!NATIVE){ // native provides these via the menu bar
      if(meta&&e.key.toLowerCase()==="s"){e.preventDefault();if(e.shiftKey)saveAsCSV();else saveCSV();return;}
      if(meta&&e.key.toLowerCase()==="o"){e.preventDefault();openViaButton();return;}
      if(meta&&e.key.toLowerCase()==="f"){e.preventDefault();focusFind();return;}
      if(meta&&e.key.toLowerCase()==="n"){e.preventDefault();newNote();return;}
      if(meta&&e.key.toLowerCase()==="d"){e.preventDefault();duplicateNote();return;}
      if(meta&&e.key.toLowerCase()==="p"){e.preventDefault();printNote();return;}
      if(meta&&e.key==="Backspace"){if(!inEditor&&!inSearch&&!inTag){e.preventDefault();deleteNote();}return;}
    }
    if(!inEditor&&!inSearch&&!inTag&&view.length){
      if(e.key==="ArrowDown"){e.preventDefault();select(Math.min(selIndex+1,view.length-1),true);}
      else if(e.key==="ArrowUp"){e.preventDefault();select(Math.max(selIndex-1,0),true);}
    }
  });
  window.addEventListener("blur",()=>{ if(dirty&&hasAutosaveTarget()) runAutosave(); }); // save when leaving the app
  window.addEventListener("beforeunload",e=>{ if(dirty&&hasAutosaveTarget()) runAutosave(); if(dirty){e.preventDefault();e.returnValue="";} });

  ["dragenter","dragover"].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();document.body.classList.add("dragging");dropEl.classList.add("drag");}));
  ["dragleave","drop"].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();
    if(ev==="drop"){const f=e.dataTransfer.files[0];if(f)readFileObj(f);}
    document.body.classList.remove("dragging");dropEl.classList.remove("drag");}));

  /* ============ native bridge ============ */
  if(NATIVE){
    window.api.onMenu(doAction);
    window.api.onLoadFile(({path,text})=>{ currentPath=path; loadText(text,base(path)); savedOnce=true; dirty=false; updateSaveState(); });
    window.api.onExternalChange(({path,text})=>{
      if(path!==currentPath)return;
      if(dirty){ toast("This file changed on another Mac — Save to keep your version"); return; }
      const keep=selIndex; currentPath=path; loadText(text,base(path)); savedOnce=true; selIndex=keep; render(); toast("Updated from iCloud");
    });
  }

  /* ============ startup ============ */
  (async function init(){
    await refreshRecents();
    if(!NATIVE){
      const w=await idbGet(D_STORE,"working");
      if(w&&w.notes&&w.notes.length){
        if(confirm("Restore your unsaved working copy from last time? ("+w.notes.length+" notes)\n\nChoose Cancel to start fresh.")){
          notes=w.notes.map(n=>({...n,tags:n.tags||[],format:n.format||""}));docName=w.name||"Untitled";dirty=true;
          emptyEl.style.display="none";searchEl.disabled=false;refreshTagMenu();refreshSortMenu();render();updateSaveState();
        }else{clearWorking();}
      }
    }
  })();
})();
</script>
</body>
