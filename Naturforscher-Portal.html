 pleins d'esprit et d'énergie sur les champignons. Non contente d'illustrer les champignons avec une incroyable précision, elle rédigea aussi des mises en garde hilarantes sur les champignons sauvages qui rendent malade et ceux qui sont délicieux dans un ragoût.","birth_de":"Leek, England","birth_fr":"Leek, Angleterre"},"Elizabeth Twining":{"name":"Elizabeth Twining","bio_de":"Englische botanische Künstlerin und Philanthropin, am bekanntesten für ihr wunderschönes zweibändiges Meisterwerk *Illustrations of the Natural Orders of Plants*.","bio_fr":"Artiste botaniste et philanthrope anglaise surtout connue pour son magnifique chef-d'œuvre en deux volumes, *Illustrations of the Natural Orders of Plants*.","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"Frederick Smith":{"name":"Frederick Smith","bio_de":"Britischer Entomologe am Natural History Museum in London, berühmt für seine umfassende Klassifizierung und Katalogisierung der Hautflügler (Hymenoptera: Ameisen, Bienen und Wespen).","bio_fr":"Entomologiste britannique au Natural History Museum de Londres, réputé pour son vaste travail de classification et de catalogage des hyménoptères (Hymenoptera : fourmis, abeilles et guêpes).","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"Hugo von Mohl":{"name":"Hugo von Mohl","bio_de":"Wegweisender Pflanzenanatom, der den Begriff „Protoplasma\" prägte und das wissenschaftliche Verständnis der Zellteilung bei Pflanzen entscheidend voranbrachte.","bio_fr":"Anatomiste des plantes pionnier qui inventa le terme « protoplasme » et fit progresser de façon décisive la compréhension scientifique de la division cellulaire chez les plantes.","birth_de":"Stuttgart (Neckar), Deutschland","birth_fr":"Stuttgart (Neckar), Allemagne"},"Isidore Geoffroy Saint-Hilaire":{"name":"Isidore Geoffroy Saint-Hilaire","bio_de":"Prägte den Begriff „Ethologie\" (Verhalten der Tiere), gründete die Akklimatisationsgesellschaft und betrieb frühe Forschung über anatomische Fehlbildungen (Teratologie).","bio_fr":"Il inventa le terme « éthologie » (le comportement animal), fonda la Société d'acclimatation et mena de premières recherches sur les anomalies anatomiques (la tératologie).","birth_de":"Paris (Seine), Frankreich","birth_fr":"Paris (Seine), France"},"John Obadiah Westwood":{"name":"John Obadiah Westwood","bio_de":"Der erste Hope-Professor für Zoologie in Oxford. Er war ein spektakulärer Illustrator und einer der produktivsten entomologischen Autoren der viktorianischen Zeit.","bio_fr":"Le premier professeur de zoologie « Hope » à Oxford. C'était un illustrateur spectaculaire et l'un des auteurs entomologiques les plus prolifiques de l'époque victorienne.","birth_de":"Sheffield (River Don), England","birth_fr":"Sheffield (River Don), Angleterre"},"Michael Sars":{"name":"Michael Sars","bio_de":"Ein Priester, der seine Freizeit damit verbrachte, die eiskalten, pechschwarzen Tiefen der norwegischen Fjorde abzusuchen, und bewies, dass gruselige, außerirdisch anmutende Lebensformen tatsächlich am Grund des tiefen Ozeans leben!","bio_fr":"Un prêtre qui passait son temps libre à draguer les profondeurs glaciales et noires comme l'encre des fjords norvégiens, prouvant que d'inquiétantes formes de vie dignes d'extraterrestres vivaient bel et bien au fond des océans !","birth_de":"Bergen (Byfjorden / Vågen), Norwegen","birth_fr":"Bergen (Byfjorden / Vågen), Norvège"},"Alphonse de Candolle":{"name":"Alphonse de Candolle","bio_de":"De Candolle wollte wissen, *warum* Pflanzen dort wachsen, wo sie wachsen. Er kartierte die weltweite Pflanzengeografie, fand heraus, woher die wichtigsten Nutzpflanzen ursprünglich stammten, und schuf das internationale Regelwerk, das Wissenschaftler noch heute verwenden, um neue Pflanzenarten zu benennen.","bio_fr":"De Candolle voulait savoir *pourquoi* les plantes poussent là où elles poussent. Il cartographia la géographie végétale mondiale, découvrit d'où provenaient à l'origine les principales plantes cultivées et créa le code international de règles que les scientifiques utilisent encore aujourd'hui pour nommer de nouvelles espèces végétales.","birth_de":"Paris, Frankreich","birth_fr":"Paris, France"},"Anne Pratt":{"name":"Anne Pratt","bio_de":"Pratt war eine autodidaktische viktorianische Künstlerin, die aus gesundheitlichen Gründen keinen Sport im Freien treiben konnte und deshalb ihre Kindheit mit dem Zeichnen von Pflanzen verbrachte. Später schrieb und illustrierte sie über 20 populäre Pflanzenbücher und machte die Wissenschaft mit leuchtenden Farben für Millionen ganz normaler Leser zugänglich.","bio_fr":"Pratt était une artiste victorienne autodidacte qui ne pouvait pas pratiquer de sports en plein air pour des raisons de santé ; elle passa donc son enfance à dessiner des plantes. Elle écrivit et illustra ensuite plus de 20 livres populaires sur les plantes, utilisant des couleurs vives pour rendre la science accessible à des millions de lecteurs ordinaires.","birth_de":"Strood, England","birth_fr":"Strood, Angleterre"},"Friedrich Welwitsch":{"name":"Friedrich Welwitsch","bio_de":"Österreichischer Botaniker, am bekanntesten für die Entdeckung der einzigartigen Wüstenpflanze *Welwitschia mirabilis* in Angola.","bio_fr":"Botaniste autrichien surtout connu pour avoir découvert l'étonnante plante du désert *Welwitschia mirabilis* en Angola.","birth_de":"Maria Saal (Glan), Österreich","birth_fr":"Maria Saal (Glan), Autriche"},"William Chapman Hewitson":{"name":"William Chapman Hewitson","bio_de":"Ein wohlhabender Sammler und Künstler, der Tausende exquisiter, handkolorierter Drucke tropischer Schmetterlinge veröffentlichte und eine der großartigsten Schmetterlingssammlungen der Geschichte aufbaute!","bio_fr":"Un collectionneur et artiste fortuné qui publia des milliers de gravures raffinées et coloriées à la main de papillons tropicaux, constituant l'une des plus grandes collections de papillons de l'histoire !","birth_de":"Newcastle upon Tyne (River Tyne), England","birth_fr":"Newcastle upon Tyne (River Tyne), Angleterre"},"Benjamin Waterhouse Hawkins":{"name":"Benjamin Waterhouse Hawkins","bio_de":"Der Bildhauer, der die allerersten lebensgroßen Dinosaurierstatuen der Welt für den Crystal-Palace-Park in London schuf – und sogar eine berühmte Dinnerparty im Inneren eines hohlen Iguanodon-Modells veranstaltete, bevor es fertig war!","bio_fr":"Le sculpteur qui créa les toutes premières statues de dinosaures grandeur nature au monde pour le parc du Crystal Palace à Londres, allant jusqu'à organiser un célèbre dîner à l'intérieur d'un modèle creux d'Iguanodon avant qu'il ne soit terminé !","birth_de":"London, England","birth_fr":"London, Angleterre"},"Hermann Burmeister":{"name":"Hermann Burmeister","bio_de":"Deutsch-argentinischer Naturforscher, der die Paläontologie und Zoologie in Südamerika revolutionierte und das Nationalmuseum in Buenos Aires leitete.","bio_fr":"Naturaliste germano-argentin qui révolutionna la paléontologie et la zoologie en Amérique du Sud et dirigea le musée national de Buenos Aires.","birth_de":"Stralsund (Strelasund (Meerenge)), Deutschland","birth_fr":"Stralsund (Strelasund (détroit)), Allemagne"},"Hermann Loew":{"name":"Hermann Loew","bio_de":"Der weltweit führende Experte für Zweiflügler (Diptera, die echten Fliegen) im 19. Jahrhundert, der akribisch Tausende von Arten in Europa und Nordamerika klassifizierte.","bio_fr":"Le plus grand spécialiste mondial des diptères (Diptera, les mouches véritables) au XIXe siècle, qui classa méticuleusement des milliers d'espèces à travers l'Europe et l'Amérique du Nord.","birth_de":"Weissenfels (Saale), Deutschland","birth_fr":"Weissenfels (Saale), Allemagne"},"Jane Loudon":{"name":"Jane Loudon","bio_de":"Schuf äußerst beliebte, leicht verständliche Gartenbücher, die akademische Hürden durchbrachen und den Gartenbau für viktorianische Frauen zugänglich machten.","bio_fr":"Créa des manuels de jardinage très populaires et accessibles qui firent tomber les barrières académiques et démocratisèrent l'horticulture auprès des femmes de l'époque victorienne.","birth_de":"Edgbaston (River Rea), England","birth_fr":"Edgbaston (River Rea), Angleterre"},"Louis Agassiz":{"name":"Louis Agassiz","bio_de":"Er betrachtete riesige zerkratzte Felsen und erkannte, dass die ganze Erde einst unter gewaltigen Gletschern fest gefroren war – und verblüffte alle mit der revolutionären Idee der „Eiszeiten\"!","bio_fr":"Il observa d'énormes rochers rayés et comprit que la Terre entière avait autrefois été entièrement gelée sous d'immenses glaciers, sidérant tout le monde avec l'idée révolutionnaire des « âges glaciaires » !","birth_de":"Môtier (Murtensee), Schweiz","birth_fr":"Môtier (lac de Morat), Suisse"},"Camillo Rondani":{"name":"Camillo Rondani","bio_de":"Ein italienischer Entomologe, der sein Leben der Erforschung der Fliegen (Diptera) widmete und entdeckte, welch wichtige Rolle zweiflügelige Insekten in der Landwirtschaft und bei der Bekämpfung von Ernteschädlingen spielen.","bio_fr":"Un entomologiste italien qui consacra sa vie à l'étude des mouches (Diptera), découvrant le rôle essentiel que jouent les insectes à deux ailes dans l'agriculture et la lutte contre les ravageurs des cultures.","birth_de":"Parma, Italien","birth_fr":"Parma, Italie"},"Hugh Falconer":{"name":"Hugh Falconer","bio_de":"Entdeckte unglaubliche Fossilienlager von Säugetieren in den Siwalik-Hügeln Indiens und trug maßgeblich zum Aufbau der indischen Teeindustrie bei.","bio_fr":"Mit au jour d'incroyables gisements de fossiles de mammifères dans les collines de Siwalik en Inde et joua un rôle déterminant dans la création de l'industrie indienne du thé.","birth_de":"Forres (River Findhorn), Schottland","birth_fr":"Forres (River Findhorn), Ecosse"},"Achille Guenée":{"name":"Achille Guenée","bio_de":"Ein brillanter Entomologe, der sein Leben der Klassifizierung Tausender Nachtfalterarten widmete und die maßgeblichen weltweiten Nachschlagewerke für nachtaktive Insekten schrieb. Tagsüber war er als Anwalt tätig, doch nachts gehörte sein Herz ganz den Schmetterlingen und Nachtfaltern – er schützte sogar seine kostbaren Insektensammlungen, als seine Heimatstadt im Krieg brannte!","bio_fr":"Un brillant entomologiste qui consacra sa vie à classer des milliers d'espèces de papillons de nuit, rédigeant les guides mondiaux de référence sur les insectes nocturnes. Le jour, il exerçait le droit, mais la nuit, son cœur appartenait tout entier aux papillons de jour et de nuit – il alla jusqu'à protéger ses précieuses collections d'insectes quand sa ville natale brûla pendant la guerre !","birth_de":"Chartres, Frankreich","birth_fr":"Chartres, France"},"Asa Fitch":{"name":"Asa Fitch","bio_de":"Als erster offiziell ernannter Berufsentomologe Amerikas verbrachte Fitch Jahre damit, landwirtschaftliche Schädlinge zu untersuchen und Bauern zu zeigen, wie Insekten die Ernte beeinflussen – und begründete so das Fachgebiet der ökonomischen Entomologie.","bio_fr":"Premier entomologiste professionnel officiellement nommé d'Amérique, Fitch passa des années à étudier les ravageurs agricoles et à montrer aux agriculteurs comment les insectes affectaient les cultures, faisant œuvre de pionnier dans le domaine de l'entomologie économique.","birth_de":"Salem, New York, USA","birth_fr":"Salem, New York, États-Unis"},"Charles Darwin":{"name":"Charles Darwin","bio_de":"Stellte die Theorie der Evolution durch **natürliche Selektion** auf und erklärte, wie sich Merkmale über Generationen verändern, während sich Organismen ans Überleben anpassen – und veränderte damit die Biologie für immer grundlegend.","bio_fr":"Proposa la théorie de l'évolution par la **sélection naturelle**, expliquant comment les caractères changent au fil des générations à mesure que les organismes s'adaptent pour survivre, bouleversant à jamais la biologie.","birth_de":"Shrewsbury, England","birth_fr":"Shrewsbury, Angleterre"},"Francis Walker":{"name":"Francis Walker","bio_de":"Englischer Entomologe am British Museum, bekannt für die Katalogisierung immenser Mengen von Insektenarten – trotz Kontroversen über seine schnellen taxonomischen Methoden.","bio_fr":"Entomologiste anglais au British Museum, connu pour avoir catalogué un nombre immense d'espèces d'insectes, malgré les controverses sur ses méthodes taxonomiques expéditives.","birth_de":"Southgate (River Lea), England","birth_fr":"Southgate (River Lea), Angleterre"},"Franz Wilhelm Junghuhn":{"name":"Franz Wilhelm Junghuhn","bio_de":"Oft als „Humboldt von Java\" bezeichnet, kartierte dieser Forscher die Vulkane Indonesiens und stellte einen grundlegenden Zusammenhang zwischen der Pflanzenwelt der Region und ihren unterschiedlichen Höhenlagen her.","bio_fr":"Souvent appelé le « Humboldt de Java », cet explorateur cartographia les volcans d'Indonésie et établit un lien fondamental entre la végétation de la région et ses différentes altitudes.","birth_de":"Mansfeld (Böse Sieben), Deutschland","birth_fr":"Mansfeld (Böse Sieben), Allemagne"},"Friedrich August Quenstedt":{"name":"Friedrich August Quenstedt","bio_de":"Führender deutscher Geologe, bekannt für detaillierte stratigrafische und paläontologische Untersuchungen der Jura-Geologie Schwabens.","bio_fr":"Éminent géologue allemand connu pour ses études stratigraphiques et paléontologiques détaillées de la géologie jurassique de la Souabe.","birth_de":"Eisleben (Böse Sieben), Deutschland","birth_fr":"Eisleben (Böse Sieben), Allemagne"},"Karl Bodmer":{"name":"Karl Bodmer","bio_de":"Reiste in den 1830er-Jahren tief den wilden Missouri hinauf! Er malte einige der wahnsinnig detailreichen, legendären Porträts indianischer Häuptlinge und Krieger, die je festgehalten wurden.","bio_fr":"Il remonta profondément le sauvage Missouri dans les années 1830 ! Il peignit certains des portraits les plus incroyablement détaillés et légendaires de chefs et de guerriers amérindiens jamais réalisés.","birth_de":"Zurich (Limmat), Schweiz","birth_fr":"Zurich (Limmat), Suisse"},"Oswald Heer":{"name":"Oswald Heer","bio_de":"Er untersuchte Blattfossilien, die aus dem eisigen Arktisboden ausgegraben wurden, und bewies eine verblüffende Wahrheit: Vor Millionen von Jahren war der eiskalte Nordpol in Wirklichkeit ein heißer, dampfender tropischer Dschungel!","bio_fr":"Il examina des fossiles de feuilles extraits de la glace arctique et démontra une vérité stupéfiante : il y a des millions d'années, le pôle Nord glacial était en réalité une jungle tropicale chaude et humide !","birth_de":"Niederutzwil (Thur), Schweiz","birth_fr":"Niederutzwil (Thur), Suisse"},"Wilhelm Ferdinand Erichson":{"name":"Wilhelm Ferdinand Erichson","bio_de":"Meisterhafter Käferdetektiv am Berliner Museum, der systematisch Tausende von Insektenarten benannte und ordnete, die von Expeditionen aus aller Welt eingesandt wurden!","bio_fr":"Détective des coléoptères de génie au musée de Berlin, qui nomma et classa systématiquement des milliers d'espèces d'insectes envoyées par des expéditions du monde entier !","birth_de":"Stralsund (Strelasund (Ostsee)), Deutschland","birth_fr":"Stralsund (Strelasund (mer Baltique)), Allemagne"},"Asa Gray":{"name":"Asa Gray","bio_de":"Gray gilt als der bedeutendste amerikanische Botaniker des 19. Jahrhunderts. Er vereinheitlichte die Klassifizierung nordamerikanischer Pflanzen und war Charles Darwins wichtigster Fürsprecher und Verbündeter in den Vereinigten Staaten.","bio_fr":"Considéré comme le plus important botaniste américain du XIXe siècle, Gray unifia la classification des plantes d'Amérique du Nord et fut le principal défenseur et allié de Charles Darwin aux États-Unis.","birth_de":"Sauquoit, New York, USA","birth_fr":"Sauquoit, New York, États-Unis"},"Edward Blyth":{"name":"Edward Blyth","bio_de":"Englischer Zoologe und Pionier der indischen Ornithologie. Als Kurator der Asiatic Society of Bengal beeinflusste seine akribische Arbeit Charles Darwin stark.","bio_fr":"Zoologiste anglais et pionnier de l'ornithologie indienne. En tant que conservateur de l'Asiatic Society of Bengal, son travail méticuleux influença fortement Charles Darwin.","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"Edward Doubleday":{"name":"Edward Doubleday","bio_de":"Englischer Entomologe, gefeiert für sein wegweisendes, exquisit illustriertes Werk über Schmetterlinge, *The Genera of Diurnal Lepidoptera*.","bio_fr":"Entomologiste anglais célèbre pour son ouvrage majeur et magnifiquement illustré sur les papillons, *The Genera of Diurnal Lepidoptera*.","birth_de":"Epping (River Roding), England","birth_fr":"Epping (River Roding), Angleterre"},"Francis Orpen Morris":{"name":"Francis Orpen Morris","bio_de":"In Irland geborener Geistlicher, dessen leicht verständliche, wunderschön illustrierte Bücher über britische Vögel und Schmetterlinge zu Bestsellern der viktorianischen Zeit wurden.","bio_fr":"Ecclésiastique né en Irlande dont les livres très accessibles et magnifiquement illustrés sur les oiseaux et les papillons britanniques devinrent des best-sellers de l'époque victorienne.","birth_de":"Cobh (River Lee), Irland","birth_fr":"Cobh (River Lee), Irlande"},"Philip Henry Gosse":{"name":"Philip Henry Gosse","bio_de":"Er erfand im Londoner Zoo das allererste öffentliche Meerwasseraquarium der Welt in einem Innenraum! Ganz allein löste er den riesigen Trend aus, bunte Seeanemonen und Fische in Glasbecken zu halten!","bio_fr":"Il inventa le tout premier aquarium public d'eau de mer en intérieur au monde, au zoo de Londres ! À lui seul, il lança la mode gigantesque d'élever des anémones de mer et des poissons colorés dans des bacs en verre !","birth_de":"Worcester (River Severn), England","birth_fr":"Worcester (River Severn), Angleterre"},"Pierre Edmond Boissier":{"name":"Pierre Edmond Boissier","bio_de":"Erforschte abgelegene Gebirge von Spanien bis in den gesamten Nahen Osten und veröffentlichte eine gewaltige fünfbändige Enzyklopädie mit Beschreibungen von über 12.000 Wüsten- und Alpenpflanzen!","bio_fr":"Explora des montagnes reculées depuis l'Espagne jusqu'à travers tout le Moyen-Orient, publiant une gigantesque encyclopédie en 5 volumes contenant la description de plus de 12 000 plantes désertiques et alpines !","birth_de":"Geneva (Rhône), Schweiz","birth_fr":"Geneva (Rhône), Suisse"},"Theodor Schwann":{"name":"Theodor Schwann","bio_de":"Mitbegründer der Zelltheorie! Er bewies, dass alle lebenden tierischen Gewebe aus mikroskopisch kleinen Zellen bestehen, entdeckte die Schwann-Zellen der Nerven und isolierte das Verdauungsenzym Pepsin!","bio_fr":"Cofondateur de la théorie cellulaire ! Il prouva que tous les tissus animaux vivants sont composés de cellules microscopiques, découvrit les cellules de Schwann des nerfs et isola l'enzyme digestive qu'est la pepsine !","birth_de":"Neuss (Rhein), Deutschland","birth_fr":"Neuss (Rhin), Allemagne"},"William Griffith":{"name":"William Griffith","bio_de":"Ein furchtloser botanischer Forscher, der unter brutalen Bedingungen durch Indien, Myanmar und Afghanistan zog und über 12.000 Pflanzenarten für die Wissenschaft sammelte, bevor er auf tragische Weise jung starb!","bio_fr":"Un explorateur botaniste intrépide qui parcourut l'Inde, le Myanmar et l'Afghanistan dans des conditions terribles, récoltant plus de 12 000 espèces de plantes pour la science avant de mourir tragiquement jeune !","birth_de":"Ham (London) (Themse), England","birth_fr":"Ham (London) (la Tamise), Angleterre"},"Isaac Sprague":{"name":"Isaac Sprague","bio_de":"Der herausragendste amerikanische botanische Künstler seiner Zeit, der eng mit Legenden wie Asa Gray und John James Audubon zusammenarbeitete.","bio_fr":"Le plus grand artiste botaniste américain de son époque, qui travailla en étroite collaboration avec des légendes comme Asa Gray et John James Audubon.","birth_de":"Hingham (Weir River), USA","birth_fr":"Hingham (Weir River), États-Unis"},"Thomas C. Jerdon":{"name":"Thomas C. Jerdon","bio_de":"Ein britischer Chirurg in Indien, der Hunderte indische Vögel, Säugetiere und Reptilien kartierte und dabei Dutzende neuer Arten entdeckte – darunter den seltenen Jerdon's Courser!","bio_fr":"Un chirurgien britannique en Inde qui a répertorié des centaines d'oiseaux, de mammifères et de reptiles indiens, identifiant des dizaines de nouvelles espèces, dont le rare Jerdon's Courser !","birth_de":"Durham (River Wear), England","birth_fr":"Durham (River Wear), Angleterre"},"William Henry Harvey":{"name":"William Henry Harvey","bio_de":"Der ultimative Jäger von Meeresalgen! Er reiste durch Südafrika, Australien und die Pazifikinseln und sammelte, benannte und klassifizierte Tausende bunter Meeresalgen.","bio_fr":"Le chasseur d'algues marines par excellence ! Il a parcouru l'Afrique du Sud, l'Australie et les îles du Pacifique, récoltant, nommant et classant des milliers d'algues marines aux mille couleurs.","birth_de":"Limerick (River Shannon), Irland","birth_fr":"Limerick (River Shannon), Irlande"},"Edward Lear":{"name":"Edward Lear","bio_de":"Bevor er als Dichter von Unsinnsgedichten berühmt wurde, war er ein meisterhafter Naturkünstler, dessen Werk *Illustrations of the Family of Psittacidae, or Parrots* die Vogelillustration revolutionierte.","bio_fr":"Avant de devenir célèbre comme poète de l'absurde, il était un artiste naturaliste hors pair dont l'ouvrage *Illustrations of the Family of Psittacidae, or Parrots* a révolutionné l'illustration des oiseaux.","birth_de":"Holloway (London) (Themse), England","birth_fr":"Holloway (London) (la Tamise), Angleterre"},"Robert Fortune":{"name":"Robert Fortune","bio_de":"Ein echter Pflanzenspion! Er verkleidete sich als einheimischer Kaufmann, um verbotene Teepflanzen und Geheimnisse aus China nach Indien zu schmuggeln – und veränderte damit den Welthandel und die Teekultur für immer!","bio_fr":"Un véritable espion des plantes ! Il s'est déguisé en marchand local pour faire sortir clandestinement de Chine des plants de thé interdits et leurs secrets, jusqu'en Inde, bouleversant à jamais le commerce mondial et la culture du thé !","birth_de":"Kelloe (Blackadder Water), Schottland","birth_fr":"Kelloe (Blackadder Water), Écosse"},"David Livingstone":{"name":"David Livingstone","bio_de":"Furchtloser schottischer Entdecker und Arzt, der riesige, unerforschte afrikanische Flusssysteme kartierte, die Victoriafälle benannte, unzählige Wildtiere dokumentierte und leidenschaftlich für das Ende des Sklavenhandels kämpfte!","bio_fr":"Explorateur et médecin écossais intrépide qui a cartographié d'immenses réseaux fluviaux africains inexplorés, baptisé les chutes Victoria, recensé d'innombrables animaux sauvages et lutté avec passion pour mettre fin à la traite des esclaves !","birth_de":"Blantyre (River Clyde), Schottland","birth_fr":"Blantyre (River Clyde), Écosse"},"James Dwight Dana":{"name":"James Dwight Dana","bio_de":"Eine überragende Figur der amerikanischen Wissenschaft, die das Standardwerk *System of Mineralogy* verfasste und die Entstehung von Korallenriffen grundlegend erklärte.","bio_fr":"Une figure majeure de la science américaine, auteur de l'ouvrage de référence *System of Mineralogy*, qui a expliqué de façon fondamentale la formation des récifs coralliens.","birth_de":"Utica (Mohawk River), USA","birth_fr":"Utica (Mohawk River), États-Unis"},"Japetus Steenstrup":{"name":"Japetus Steenstrup","bio_de":"Dänischer Biologe, der das Verständnis der Fortpflanzung veränderte, indem er das Phänomen des \"Generationswechsels\" bei Tiergruppen entdeckte.","bio_fr":"Biologiste danois qui a transformé la compréhension de la reproduction en découvrant le phénomène d'« alternance des générations » chez certains groupes d'animaux.","birth_de":"Vang (Limfjord), Dänemark","birth_fr":"Vang (Limfjord), Danemark"},"John Cassin":{"name":"John Cassin","bio_de":"Ein Gigant der amerikanischen Vogelkunde des 19. Jahrhunderts. Er benannte fast 200 Vogelarten und betreute die riesigen Sammlungen der Philadelphia Academy of Natural Sciences.","bio_fr":"Un géant de l'ornithologie américaine du XIXe siècle. Il a nommé près de 200 espèces d'oiseaux et géré les immenses collections de la Philadelphia Academy of Natural Sciences.","birth_de":"Upper Providence (Schuylkill River), USA","birth_fr":"Upper Providence (Schuylkill River), États-Unis"},"August Grisebach":{"name":"August Grisebach","bio_de":"Ein Pionier der Pflanzengeografie, der weltweite Vegetationszonen nach dem Klima kartierte und damit früh die Grundlagen für ökologische Studien darüber legte, wie die Umwelt das Pflanzenleben prägt.","bio_fr":"Un pionnier de la géographie botanique qui a cartographié les zones de végétation du monde entier en fonction du climat, posant très tôt les bases des études écologiques sur la façon dont l'environnement façonne la vie des plantes.","birth_de":"Hanover, Deutschland","birth_fr":"Hanover, Allemagne"},"Carl Bergmann":{"name":"Carl Bergmann","bio_de":"Er formulierte die \"Bergmann'sche Regel\" und entdeckte, dass warmblütige Tierarten in kalten Klimazonen meist größer sind als ihre Verwandten in heißen Regionen – um so ihre Körperwärme zu bewahren!","bio_fr":"Il a formulé la « règle de Bergmann », découvrant que les espèces animales à sang chaud vivant dans les climats froids ont tendance à être plus grandes que leurs cousines des climats chauds, afin de conserver leur chaleur corporelle !","birth_de":"Göttingen, Deutschland","birth_fr":"Göttingen, Allemagne"},"Gustav Hartlaub":{"name":"Gustav Hartlaub","bio_de":"Deutscher Arzt und Ornithologe, der sich auf die Katalogisierung von Vogelarten aus Afrika und Ozeanien spezialisierte und an wichtigen taxonomischen Bestimmungswerken mitarbeitete.","bio_fr":"Médecin et ornithologue allemand spécialisé dans le recensement des espèces d'oiseaux d'Afrique et d'Océanie, coauteur d'importants guides taxonomiques.","birth_de":"Bremen (Weser), Deutschland","birth_fr":"Bremen (la Weser), Allemagne"},"Heinrich Gätke":{"name":"Heinrich Gätke","bio_de":"Naturforscher auf der Insel Helgoland, der bahnbrechende Langzeitstudien über die Zugmuster von Vögeln und deren Zusammenhang mit dem Wetter durchführte.","bio_fr":"Naturaliste installé sur l'île d'Héligoland, qui a mené des études pionnières à long terme sur les schémas de migration des oiseaux et leurs liens avec la météo.","birth_de":"Pritzwalk (Dömnitz), Deutschland","birth_fr":"Pritzwalk (Dömnitz River), Allemagne"},"Thomas Mayo Brewer":{"name":"Thomas Mayo Brewer","bio_de":"Ein führender amerikanischer Vogelexperte, der sich auf die Erforschung von Vogelnestern und -eiern spezialisierte und an klassischen Standardwerken über die Vogelwelt Nordamerikas mitschrieb!","bio_fr":"Un grand expert américain des oiseaux, spécialisé dans l'étude des nids et des œufs, coauteur d'ouvrages classiques et incontournables sur les oiseaux d'Amérique du Nord !","birth_de":"Boston (Charles River), USA","birth_fr":"Boston (Charles River), États-Unis"},"Jean Cabanis":{"name":"Jean Cabanis","bio_de":"Er gründete das renommierte *Journal für Ornithologie* und festigte Deutschlands Rolle in der Vogelkunde mit der am längsten erscheinenden ornithologischen Fachzeitschrift der Welt.","bio_fr":"Il a fondé la prestigieuse revue *Journal für Ornithologie*, consolidant le rôle de l'Allemagne dans la science des oiseaux grâce à la plus ancienne revue ornithologique encore publiée au monde.","birth_de":"Berlin (Spree), Deutschland","birth_fr":"Berlin (la Sprée), Allemagne"},"Paul Gervais":{"name":"Paul Gervais","bio_de":"Ein leidenschaftlicher Fossilienjäger! Er setzte die bizarren Knochen ausgestorbener Riesensäugetiere wieder zusammen und half der Menschheit zu begreifen, wie seltsam die urzeitliche Erde tatsächlich aussah.","bio_fr":"Un vrai chasseur de fossiles ! Il a reconstitué les os étranges de gigantesques mammifères disparus et a aidé l'humanité à comprendre à quel point la Terre préhistorique était bizarre.","birth_de":"Paris (Seine), Frankreich","birth_fr":"Paris (la Seine), France"},"Albert von Kölliker":{"name":"Albert von Kölliker","bio_de":"Kölliker verbrachte sein Leben damit, durch frühe Mikroskope zu blicken, und machte bahnbrechende Entdeckungen: Er bewies, dass Eizellen und Spermien einzelne Zellen sind, und war einer der Ersten, der Mitochondrien (die \"Kraftwerke der Zelle\") im Muskelgewebe entdeckte!","bio_fr":"Kölliker a passé sa vie à scruter les premiers microscopes et a fait des découvertes révolutionnaires : il a prouvé que les ovules et les spermatozoïdes sont des cellules à part entière et fut l'un des premiers à repérer les mitochondries (les « centrales énergétiques de la cellule ») dans le tissu musculaire !","birth_de":"Zürich, Schweiz","birth_fr":"Zürich, Suisse"},"Berthe Hoola van Nooten":{"name":"Berthe Hoola van Nooten","bio_de":"Eine botanische Illustratorin, die nach Java reiste und ein prachtvolles, gefeiertes Illustrationsbuch über die wilden tropischen Früchte und Blumen Ostindiens schuf.","bio_fr":"Une illustratrice botanique qui s'est rendue à Java et a réalisé un magnifique et célèbre livre d'illustrations présentant les fruits et fleurs tropicaux sauvages des Indes orientales.","birth_de":"Utrecht, Niederlande","birth_fr":"Utrecht, Pays-Bas"},"Hermann August Hagen":{"name":"Hermann August Hagen","bio_de":"Führender Experte für Neuroptera (Netzflügler) und der allererste Professor für Entomologie an einer Universität in den USA (Harvard).","bio_fr":"Grand spécialiste des Neuroptera (les insectes à ailes en réseau) et tout premier professeur d'entomologie dans une université des États-Unis (Harvard).","birth_de":"Königsberg (Pregel), Deutschland","birth_fr":"Königsberg (Pregel River), Allemagne"},"Joseph Dalton Hooker":{"name":"Joseph Dalton Hooker","bio_de":"Einer der größten britischen Botaniker aller Zeiten. Er erforschte den Himalaya, folgte seinem Vater als Direktor der Kew Gardens nach und war Charles Darwins engster Vertrauter.","bio_fr":"L'un des plus grands botanistes britanniques de tous les temps. Il a exploré l'Himalaya, succédé à son père à la direction des Kew Gardens et fut le confident le plus proche de Charles Darwin.","birth_de":"Halesworth (River Blyth), England","birth_fr":"Halesworth (River Blyth), Angleterre"},"Richard Spruce":{"name":"Richard Spruce","bio_de":"Er verbrachte 15 brutale Jahre damit, das Amazonasbecken zu kartieren! Er sammelte Samen des Cinchona-Baums, sodass Ärzte Chinin in großem Maßstab gewinnen und Millionen Menschen vor Malaria retten konnten!","bio_fr":"Il a passé 15 années éprouvantes à cartographier le bassin amazonien ! Il a récolté des graines de l'arbre Cinchona, permettant aux médecins de cultiver la quinine à grande échelle et de sauver des millions de personnes du paludisme !","birth_de":"Ganthorpe (River Derwent), England","birth_fr":"Ganthorpe (River Derwent), Angleterre"},"Walter Hood Fitch":{"name":"Walter Hood Fitch","bio_de":"Einer der produktivsten wissenschaftlichen Künstler der Menschheitsgeschichte! Er schuf über 10.000 hochdetaillierte Lithografien exotischer Pflanzen – darunter riesige Amazonas-Seerosen – für die Kew Gardens!","bio_fr":"L'un des artistes scientifiques les plus prolifiques de l'histoire ! Il a réalisé plus de 10 000 lithographies ultra-détaillées de plantes exotiques – dont les gigantesques nénuphars d'Amazonie – pour les Kew Gardens !","birth_de":"Glasgow (River Clyde), Schottland","birth_fr":"Glasgow (River Clyde), Écosse"},"Pieter Bleeker":{"name":"Pieter Bleeker","bio_de":"Ein niederländischer Militärarzt in Indonesien, der über 12.000 Fischexemplare zusammentrug und einen legendären Atlas mit 3.000 Illustrationen schuf, der die Unterwasserwelt des Indopazifiks im Detail zeigt!","bio_fr":"Un chirurgien militaire néerlandais en Indonésie qui a rassemblé plus de 12 000 spécimens de poissons et créé un atlas légendaire de 3 000 illustrations détaillant le monde sous-marin de la vie marine de l'Indo-Pacifique !","birth_de":"Zaandam (Zaan River), Niederlande","birth_fr":"Zaandam (Zaan River), Pays-Bas"},"Alfred Riocreux":{"name":"Alfred Riocreux","bio_de":"Bevor Kameras gestochen scharfe Nahaufnahmen machen konnten, verließen sich Wissenschaftler auf Künstler wie Riocreux, um die mikroskopische Anatomie von Pflanzen zu sehen. Seine botanischen Zeichnungen waren so makellos genau und detailliert, dass führende Botaniker aus aller Welt ihre Forschung nur veröffentlichen wollten, wenn Riocreux die Illustrationen anfertigte.","bio_fr":"Avant que les appareils photo ne puissent capturer des gros plans nets, les scientifiques comptaient sur des artistes comme Riocreux pour observer l'anatomie microscopique des plantes. Ses dessins botaniques étaient si parfaitement précis et détaillés que les plus grands botanistes du monde refusaient de publier leurs recherches à moins que Riocreux n'en réalise les illustrations.","birth_de":"Sèvres, Frankreich","birth_fr":"Sèvres, France"},"Herbert Spencer":{"name":"Herbert Spencer","bio_de":"Er verband die Evolutionstheorie mit Philosophie und Soziologie und prägte den berühmten Ausdruck \"Überleben des Stärkeren\".","bio_fr":"Il a intégré la théorie de l'évolution à la philosophie et à la sociologie, inventant la célèbre expression « survie du plus apte ».","birth_de":"Derby (River Derwent), England","birth_fr":"Derby (River Derwent), Angleterre"},"Joseph Wolf":{"name":"Joseph Wolf","bio_de":"Er galt als der absolute Meister der Tiermalerei im viktorianischen Zeitalter und verband strenge wissenschaftliche Genauigkeit mit außergewöhnlicher, lebensechter künstlerischer Ausdruckskraft.","bio_fr":"Considéré comme le maître absolu de la peinture animalière à l'époque victorienne, il alliait une rigueur scientifique extrême à une vitalité artistique extraordinaire et pleine de vie.","birth_de":"Mörz (Mosel), Deutschland","birth_fr":"Mörz (la Moselle), Allemagne"},"Henry Constantine Richter":{"name":"Henry Constantine Richter","bio_de":"Er schuf einige der beeindruckendsten und wissenschaftlich genauesten Lithografien für John Goulds höchst einflussreiche Prachtbände über Vögel und Säugetiere.","bio_fr":"Il a réalisé certaines des lithographies les plus superbes et les plus scientifiquement exactes pour les très influents recueils d'oiseaux et de mammifères de John Gould.","birth_de":"Brompton (London) (Themse), England","birth_fr":"Brompton (London) (la Tamise), Angleterre"},"John MacGillivray":{"name":"John MacGillivray","bio_de":"Schottischer Naturforscher, der an mehreren großen Vermessungsreisen der Royal Navy teilnahm und dabei wichtige biologische und ethnografische Daten im Pazifik und in Australien sammelte.","bio_fr":"Naturaliste écossais qui a participé à plusieurs grandes expéditions d'exploration de la Royal Navy, recueillant de précieuses données biologiques et ethnographiques à travers le Pacifique et l'Australie.","birth_de":"Aberdeen (River Dee), Schottland","birth_fr":"Aberdeen (River Dee), Écosse"},"Fritz Mueller":{"name":"Fritz Mueller","bio_de":"Er lieferte frühe Feldbeweise, die Darwins Theorie stützten. Bekannt wurde er für die Entdeckung der Müller'schen Mimikry bei Schmetterlingen.","bio_fr":"Il a fourni les premières preuves de terrain à l'appui de la théorie de Darwin. Il est connu pour avoir identifié le mimétisme müllérien chez les papillons.","birth_de":"Windischholzhausen (Gera), Deutschland","birth_fr":"Windischholzhausen (Gera River), Allemagne"},"Fritz Müller":{"name":"Fritz Müller","bio_de":"Er lieferte frühe Feldbeweise, die Darwins Theorie stützten. Bekannt wurde er für die Entdeckung der Müller'schen Mimikry bei Schmetterlingen.","bio_fr":"Il a fourni les premières preuves de terrain à l'appui de la théorie de Darwin. Il est connu pour avoir identifié le mimétisme müllérien chez les papillons.","birth_de":"Windischholzhausen (Gera), Deutschland","birth_fr":"Windischholzhausen (Gera River), Allemagne"},"Gregor Mendel":{"name":"Gregor Mendel","bio_de":"\"Vater der modernen Genetik.\" Er entdeckte die grundlegenden Vererbungsgesetze durch systematische Kreuzungsversuche mit Erbsenpflanzen.","bio_fr":"« Père de la génétique moderne. » Il a mis au jour les lois fondamentales de l'hérédité grâce à des expériences de croisement rigoureuses menées sur des plants de pois.","birth_de":"Heinzendorf (Oder), Tschechien","birth_fr":"Heinzendorf (l'Oder), République tchèque"},"Henry Tibbats Stainton":{"name":"Henry Tibbats Stainton","bio_de":"Er spezialisierte sich auf Microlepidoptera (Kleinschmetterlinge) und gab *The Entomologist's Weekly Intelligencer* heraus, wodurch er eine lebendige Gemeinschaft von Amateurforschern förderte.","bio_fr":"Spécialiste des Microlepidoptera (les petits papillons de nuit), il a dirigé la revue *The Entomologist's Weekly Intelligencer*, favorisant une communauté dynamique de scientifiques amateurs.","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"Rudolf Leuckart":{"name":"Rudolf Leuckart","bio_de":"Der \"Vater der Parasitologie\"! Er entschlüsselte die erschreckenden, komplexen Lebenszyklen parasitischer Bandwürmer und Fadenwürmer und half Ärzten, unzählige Menschen- und Tierleben zu retten!","bio_fr":"Le « père de la parasitologie » ! Il a percé les cycles de vie complexes et effrayants des vers parasites – ténias et ascaris –, aidant les médecins à sauver d'innombrables vies humaines et animales !","birth_de":"Helmstedt (Aller (in der Nähe)), Deutschland","birth_fr":"Helmstedt (Aller River (à proximité)), Allemagne"},"Thomas Vernon Wollaston":{"name":"Thomas Vernon Wollaston","bio_de":"Ein besessener Käferjäger, der Tausende einzigartiger Insektenarten auf abgelegenen Atlantikinseln wie Madeira und den Kanaren sammelte und so zeigte, wie sich Inselarten im Laufe der Zeit entwickeln!","bio_fr":"Un chasseur de coléoptères obsédé qui a récolté des milliers d'espèces d'insectes uniques sur des îles atlantiques isolées comme Madère et les Canaries, révélant comment les espèces insulaires évoluent au fil du temps !","birth_de":"Scotter (River Trent), England","birth_fr":"Scotter (River Trent), Angleterre"},"William Henry Edwards":{"name":"William Henry Edwards","bio_de":"Die führende amerikanische Schmetterlingsautorität des 19. Jahrhunderts! Er verfasste das dreibändige Meisterwerk *Butterflies of North America* und entdeckte, dass Schmetterlinge je nach Jahreszeit ihre Farbe ändern!","bio_fr":"La plus grande autorité américaine sur les papillons au XIXe siècle ! Il est l'auteur du chef-d'œuvre en trois volumes *Butterflies of North America* et a découvert que les papillons changent de couleur selon la saison !","birth_de":"Hunter (Schoharie Creek), USA","birth_fr":"Hunter (Schoharie Creek), États-Unis"},"Alfred Russel Wallace":{"name":"Alfred Russel Wallace","bio_de":"Wallace entdeckte die Evolutionstheorie gemeinsam mit Charles Darwin, doch seine Reise war ein einziger Überlebenskampf gegen alle Widrigkeiten. Er überlebte einen Schiffsbrand, der all seine Sammlungsstücke vernichtete, überstand Malaria in tropischen Dschungeln und kartierte in Indonesien jene Linie, an der die asiatische Tierwelt endet und die australische beginnt (heute *Wallace Line* genannt).","bio_fr":"Wallace a codécouvert la théorie de l'évolution aux côtés de Charles Darwin, mais son parcours fut une véritable lutte pour la survie. Il a survécu à l'incendie d'un navire qui a détruit tous ses spécimens, a survécu au paludisme dans les jungles tropicales et a cartographié, en Indonésie, la ligne où s'arrête la faune asiatique et où commence la faune australienne (aujourd'hui appelée la *Wallace Line*).","birth_de":"Usk, Wales","birth_fr":"Usk, Pays de Galles"},"Jean-Henri Fabre":{"name":"Jean-Henri Fabre","bio_de":"Der \"Dichter der Wissenschaft.\" Berühmt für seine außergewöhnlich gut geschriebenen Beobachtungsbücher über das komplexe, dramatische Leben lebender Insekten in freier Wildbahn.","bio_fr":"Le « poète de la science ». Célèbre pour ses livres d'observation exceptionnellement bien écrits sur la vie complexe et mouvementée des insectes vivants dans la nature.","birth_de":"Saint-Léons (Muze River), Frankreich","birth_fr":"Saint-Léons (Muze River), France"},"Joseph Leidy":{"name":"Joseph Leidy","bio_de":"Der \"Vater der amerikanischen Wirbeltierpaläontologie.\" Er beschrieb das erste relativ vollständige Dinosaurierskelett (*Hadrosaurus*) und machte gewaltige Fortschritte in der Parasitologie.","bio_fr":"Le « père de la paléontologie des vertébrés américaine ». Il a décrit le premier squelette de dinosaure relativement complet (*Hadrosaurus*) et a fait faire des bonds de géant à la parasitologie.","birth_de":"Philadelphia (Delaware River), USA","birth_fr":"Philadelphia (Delaware River), États-Unis"},"Spencer Fullerton Baird":{"name":"Spencer Fullerton Baird","bio_de":"Der zweite Sekretär der Smithsonian Institution! Er trug persönlich riesige naturkundliche Sammlungen zusammen und erfasste die Fische, Vögel und Säugetiere Nordamerikas.","bio_fr":"Le deuxième secrétaire de la Smithsonian Institution ! Il a personnellement rassemblé d'immenses collections d'histoire naturelle et répertorié les poissons, oiseaux et mammifères d'Amérique du Nord.","birth_de":"Reading (Schuylkill River), USA","birth_fr":"Reading (Schuylkill River), États-Unis"},"Carl Gustaf Thomson":{"name":"Carl Gustaf Thomson","bio_de":"Ein schwedischer Entomologe, der jahrzehntelang an der Universität Lund systematisch Zehntausende skandinavischer Käfer, Fliegen und Schlupfwespen benannte.","bio_fr":"Un entomologiste suédois qui a passé des décennies à l'université de Lund à nommer méthodiquement des dizaines de milliers de coléoptères, de mouches et de guêpes parasites de Scandinavie.","birth_de":"Mellan-Grevie, Schweden","birth_fr":"Mellan-Grevie, Suède"},"Wilhelm Hofmeister":{"name":"Wilhelm Hofmeister","bio_de":"Ein autodidaktisches Genie, das den \"Generationswechsel\" bei Pflanzen entdeckte und bewies, dass einfache Moose, Farne und riesige Bäume alle einer einzigen tiefen Abstammungslinie entstammen!","bio_fr":"Un génie autodidacte qui a découvert l'« alternance des générations » chez les plantes, prouvant que les mousses simples, les fougères et les arbres géants partagent tous une seule et même lignée évolutive profonde !","birth_de":"Leipzig (Weiße Elster), Deutschland","birth_fr":"Leipzig (White Elster River), Allemagne"},"Berthold Carl Seemann":{"name":"Berthold Carl Seemann","bio_de":"Ein weitgereister Botaniker, der den Pazifik, Fidschi und Mittelamerika erkundete, Hunderte neuer Pflanzen bestimmte und dabei bedeutende internationale Botanikzeitschriften herausgab.","bio_fr":"Un botaniste globe-trotteur qui a exploré le Pacifique, les Fidji et l'Amérique centrale, identifiant des centaines de nouvelles plantes tout en dirigeant de grandes revues internationales de botanique.","birth_de":"Hanover, Deutschland","birth_fr":"Hanover, Allemagne"},"Ferdinand von Mueller":{"name":"Ferdinand von Mueller","bio_de":"Deutsch-australischer Botaniker, der als erster Regierungsbotaniker von Victoria wirkte, das National Herbarium gründete und Tausende australischer Pflanzen entdeckte.","bio_fr":"Botaniste germano-australien qui fut le premier botaniste officiel de l'État de Victoria, fondant le National Herbarium et découvrant des milliers de plantes australiennes.","birth_de":"Rostock (Warnow), Deutschland","birth_fr":"Rostock (Warnow River), Allemagne"},"Henry Walter Bates":{"name":"Henry Walter Bates","bio_de":"Er erforschte den Amazonas gemeinsam mit Alfred Russel Wallace. Er formulierte das Konzept der *Batesian mimicry* und lieferte damit einen frühen konkreten Beweis für die natürliche Selektion.","bio_fr":"Il a exploré l'Amazonie aux côtés d'Alfred Russel Wallace. Il a formulé le concept de *Batesian mimicry*, fournissant une première preuve concrète de la sélection naturelle.","birth_de":"Leicester (River Soar), England","birth_fr":"Leicester (River Soar), Angleterre"},"Karl Möbius":{"name":"Karl Möbius","bio_de":"Beim Studium von Austernbänken erkannte er, dass alle Pflanzen und Tiere eines Gebiets heimlich voneinander abhängen, um zu überleben. Im Grunde erfand er das gesamte moderne Konzept des \"Ökosystems\"!","bio_fr":"En étudiant les bancs d'huîtres, il a compris que toutes les plantes et tous les animaux d'une région dépendent secrètement les uns des autres pour survivre. Il a pratiquement inventé tout le concept moderne d'« écosystème » !","birth_de":"Eilenburg (Mulde), Deutschland","birth_fr":"Eilenburg (Mulde River), Allemagne"},"Thomas Henry Huxley":{"name":"Thomas Henry Huxley","bio_de":"Wegen seiner leidenschaftlichen Verteidigung der Evolution \"Darwins Bulldogge\" genannt! Er prägte den Begriff \"Agnostiker\" und war einer der Ersten, der bewies, dass sich moderne Vögel aus Dinosauriern entwickelt haben.","bio_fr":"Surnommé « le bouledogue de Darwin » pour sa défense acharnée de l'évolution ! Il a inventé le terme « agnostique » et fut l'un des premiers à prouver que les oiseaux modernes descendent des dinosaures.","birth_de":"Ealing (London) (Themse), England","birth_fr":"Ealing (London) (la Tamise), Angleterre"},"Armand David":{"name":"Armand David","bio_de":"Ein französischer Missionar und Naturforscher in China, der die westliche Wissenschaft sowohl mit dem Großen Panda als auch mit dem Davidshirsch bekannt machte und Tausende konservierter Pflanzen und Tiere an Museen in Europa schickte.","bio_fr":"Un missionnaire et naturaliste français en Chine qui a fait connaître à la science occidentale le panda géant et le cerf du Père David, expédiant des milliers de plantes et d'animaux conservés vers les musées d'Europe.","birth_de":"Espelette, Frankreich","birth_fr":"Espelette, France"},"Carl Gegenbaur":{"name":"Carl Gegenbaur","bio_de":"Ein Wegbereiter der vergleichenden Anatomie, der bewies, dass der Vergleich der Skelettstrukturen verschiedener Tiere ihre gemeinsame Evolutionsgeschichte offenbart.","bio_fr":"Un pionnier de l'anatomie comparée qui a prouvé que comparer les structures du squelette de différents animaux révèle leur histoire évolutive commune.","birth_de":"Würzburg, Deutschland","birth_fr":"Würzburg, Allemagne"},"Henri Mouhot":{"name":"Henri Mouhot","bio_de":"Französischer Naturforscher und Entdecker, berühmt dafür, die uralten Ruinen von Angkor Wat für den Westen \"entdeckt\" zu haben, während er die Pflanzen- und Tierwelt Indochinas dokumentierte.","bio_fr":"Naturaliste et explorateur français célèbre pour avoir \"découvert\" les ruines anciennes d'Angkor Vat pour l'Occident tout en documentant la flore et la faune de l'Indochine.","birth_de":"Montbéliard (Allan), Frankreich","birth_fr":"Montbéliard (Allan), France"},"Sereno Watson":{"name":"Sereno Watson","bio_de":"Auf seinem Marsch durch zerklüftete, unerforschte Gebirgsketten und Wüsten während der 40th Parallel Survey katalogisierte er Hunderte brandneuer wilder Pflanzen aus dem amerikanischen Westen.","bio_fr":"En traversant des chaînes de montagnes escarpées et inexplorées ainsi que des déserts lors du 40th Parallel Survey, il a catalogué des centaines de plantes sauvages toutes nouvelles de l'Ouest américain.","birth_de":"East Windsor (Connecticut River), USA","birth_fr":"East Windsor (Connecticut River), Etats-Unis"},"Albert Gaudry":{"name":"Albert Gaudry","bio_de":"Lange vor *Jurassic Park* grub Gaudry versteinerte Knochenlager in Griechenland aus und zeigte der Welt, wie sich prähistorische Tiere im Laufe der Zeit veränderten. Er war einer der allerersten Paläontologen, die anschauliche \"Stammbäume der Evolution\" erstellten, um zu zeigen, wie sich uralte mehrzehige Säugetiere allmählich in moderne Pferde verwandelten.","bio_fr":"Bien avant *Jurassic Park*, Gaudry déterrait des gisements d'os fossilisés en Grèce et montrait au monde comment les animaux préhistoriques changeaient au fil du temps. Il fut l'un des tout premiers paléontologues à construire des \"arbres évolutifs\" visuels illustrant comment d'anciens mammifères à plusieurs doigts se sont peu à peu transformés en chevaux modernes.","birth_de":"Saint-Germain-en-Laye, Frankreich","birth_fr":"Saint-Germain-en-Laye, France"},"Carl Johann Maximovich":{"name":"Carl Johann Maximovich","bio_de":"Ein russischer Botaniker, der ausgiebig durch das Amurgebiet, die Mandschurei und Japan reiste und der westlichen Wissenschaft Hunderte ostasiatischer Pflanzenarten vorstellte.","bio_fr":"Un botaniste russe qui a beaucoup voyagé dans l'Amour, la Mandchourie et le Japon, faisant découvrir à la science occidentale des centaines d'espèces de plantes d'Asie de l'Est.","birth_de":"Tula, Russland","birth_fr":"Tula, Russie"},"St. George Jackson Mivart":{"name":"St. George Jackson Mivart","bio_de":"Ein brillanter Biologe, der Charles Darwins Theorien bekanntermaßen herausforderte, indem er die Frage stellte, wie evolutionäre Zwischenstufen (wie halb entwickelte Flügel) einen Überlebensvorteil bieten könnten!","bio_fr":"Un biologiste brillant qui a défié les théories de Charles Darwin de façon célèbre en se demandant comment des structures évolutives intermédiaires (comme des ailes à moitié formées) pouvaient offrir un avantage de survie !","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"Carl Robert Osten-Sacken":{"name":"Carl Robert Osten-Sacken","bio_de":"Ein russischer Diplomat und Insektenforscher, der in Amerika lebte und die nordamerikanischen Zweiflügler (echte Fliegen) und Schnaken sorgfältig untersuchte und klassifizierte.","bio_fr":"Un diplomate et entomologiste russe qui a vécu en Amérique, étudiant et classant méticuleusement les diptères (vraies mouches) et les tipules d'Amérique du Nord.","birth_de":"St. Petersburg, Russland","birth_fr":"St. Petersburg, Russie"},"Eleanor Ormerod":{"name":"Eleanor Ormerod","bio_de":"Bahnbrechende Agrarwissenschaftlerin, deren selbst veröffentlichte Berichte über Insektenschädlinge den Grundstein für die moderne Schädlingsbekämpfung und den Pflanzenschutz in Großbritannien legten.","bio_fr":"Scientifique agricole pionnière dont les rapports auto-publiés sur les insectes ravageurs ont posé les bases de la lutte antiparasitaire et de la protection des cultures modernes en Grande-Bretagne.","birth_de":"Sedbury (Severn), England","birth_fr":"Sedbury (Severn), Angleterre"},"Alfred Brehm":{"name":"Alfred Brehm","bio_de":"Brehm reiste durch afrikanische Wüsten und sibirische Tundren, um Tiere zu erforschen, aber berühmt machte ihn seine Erzählkunst. Er schrieb *Brehms Tierleben*, eine Buchreihe, die tierisches Verhalten mit so viel Persönlichkeit und Dramatik beschrieb, dass sie die Zoologie zu einem riesigen Popkultur-Hit in ganz Europa machte.","bio_fr":"Brehm a parcouru les déserts d'Afrique et les toundras de Sibérie pour étudier les animaux, mais ce qui l'a rendu célèbre, c'est son art de raconter. Il a écrit *La Vie des animaux*, une série de livres qui décrivait le comportement animal avec tant de personnalité et de drame qu'elle a fait de la zoologie un immense succès de la culture populaire dans toute l'Europe.","birth_de":"Renthendorf, Deutschland","birth_fr":"Renthendorf, Allemagne"},"Alfred Newton":{"name":"Alfred Newton","bio_de":"Newton war ein Vogelfanatiker, der früh erkannte, dass die Menschen Tiere an den Rand des Aussterbens trieben. Entsetzt über das Aussterben des Riesenalks und des Dodos nutzte er seine Position als Professor in Cambridge, um für die allerersten Schutzgesetze für Wildvögel weltweit zu kämpfen.","bio_fr":"Newton était un passionné d'oiseaux qui a compris très tôt que les humains poussaient les animaux au bord du gouffre. Horrifié par l'extinction du grand pingouin et du dodo, il a utilisé son poste de professeur à Cambridge pour mener une croisade en faveur des toutes premières lois au monde protégeant les oiseaux sauvages.","birth_de":"Genf, Schweiz","birth_fr":"Genève, Suisse"},"Allan Octavian Hume":{"name":"Allan Octavian Hume","bio_de":"Ein britischer Beamter in Indien mit einem Doppelleben: Tagsüber sammelte er über 80.000 Vogelexemplare (die größte jemals angelegte Sammlung asiatischer Vögel), und später half er, den Indischen Nationalkongress zu gründen, um die indische Selbstverwaltung zu unterstützen.","bio_fr":"Un fonctionnaire britannique en Inde à la double vie : le jour, il a collecté plus de 80 000 spécimens d'oiseaux (la plus grande collection d'oiseaux asiatiques jamais réalisée), et plus tard, il a contribué à fonder le Congrès national indien pour soutenir l'autonomie de l'Inde.","birth_de":"St Mary Cray, England","birth_fr":"St Mary Cray, Angleterre"},"Hermann Müller":{"name":"Hermann Müller","bio_de":"Lieferte entscheidende Feldbeweise für Darwins Theorien, indem er intensiv untersuchte, wie sich Blüten und bestäubende Insekten gemeinsam entwickelten.","bio_fr":"A fourni des preuves de terrain essentielles aux théories de Darwin en étudiant intensément comment les fleurs et les insectes pollinisateurs ont co-évolué ensemble.","birth_de":"Mühlberg (Apfelstädt), Deutschland","birth_fr":"Mühlberg (Apfelstädt), Allemagne"},"Philip Lutley Sclater":{"name":"Philip Lutley Sclater","bio_de":"Teilte die gesamte Weltkarte in 6 riesige zoologische Zonen ein, die Wissenschaftler noch heute verwenden, und bestimmte und benannte dabei persönlich über 2.000 verschiedene Vogelarten!","bio_fr":"A divisé la carte du monde entière en 6 immenses zones zoologiques que les scientifiques utilisent encore aujourd'hui, tout en identifiant et nommant personnellement plus de 2 000 espèces d'oiseaux différentes !","birth_de":"Wootton St Lawrence (Loddon), England","birth_fr":"Wootton St Lawrence (Loddon), Angleterre"},"Albert Günther":{"name":"Albert Günther","bio_de":"Als Chefzoologe des British Museum war Günther der ultimative Katalogisierer des Meereslebens und beschrieb persönlich über 68.000 Fischexemplare! Wenn im 19. Jahrhundert ein seltsames Geschöpf aus den Tiefen des Ozeans gezogen wurde, landete es fast sicher zuerst auf seinem Schreibtisch.","bio_fr":"En tant que zoologiste en chef du British Museum, Günther était le catalogueur ultime de la vie marine, décrivant personnellement plus de 68 000 spécimens de poissons ! Si une créature étrange était remontée des profondeurs de l'océan au XIXe siècle, elle atterrissait presque certainement d'abord sur son bureau.","birth_de":"Esslingen, Deutschland","birth_fr":"Esslingen, Allemagne"},"Charles Wyville Thomson":{"name":"Charles Wyville Thomson","bio_de":"Chefwissenschaftler der berühmten *Challenger*-Expedition, der eine weltweite Reise leitete, die bewies, dass in den tiefsten Teilen der Ozeane Leben existiert, und damit die moderne Ozeanographie begründete.","bio_fr":"Scientifique en chef de la célèbre expédition du *Challenger*, il a mené un voyage mondial qui a prouvé que la vie existe dans les parties les plus profondes des océans, fondant l'océanographie moderne.","birth_de":"Bonsyde, Schottland","birth_fr":"Bonsyde, Ecosse"},"Gustav Mayr":{"name":"Gustav Mayr","bio_de":"Österreichischer Spezialist für Hautflügler, der immens zur wissenschaftlichen Klassifizierung von Ameisen, Gallwespen und Schlupfwespen weltweit beitrug.","bio_fr":"Spécialiste autrichien des hyménoptères qui a énormément contribué à la classification scientifique des fourmis, des cynips et des guêpes parasites dans le monde entier.","birth_de":"Wien (Donau), Österreich","birth_fr":"Wien (le Danube), Autriche"},"Harriet Scott":{"name":"Harriet Scott","bio_de":"Bedeutende australische Illustratorin des 19. Jahrhunderts, die zusammen mit ihrer Schwester wegweisende Veröffentlichungen über einheimische Motten und Säugetiere illustrierte.","bio_fr":"Illustratrice australienne de premier plan du XIXe siècle qui, aux côtés de sa sœur, a illustré des publications majeures sur les papillons de nuit et les mammifères indigènes.","birth_de":"Sydney (Parramatta River), Australien","birth_fr":"Sydney (Parramatta River), Australie"},"Marianne North":{"name":"Marianne North","bio_de":"Eine furchtlose Alleinreisende, die im 19. Jahrhundert durch die Dschungel fast aller Kontinente wanderte und über 800 unglaublich lebendige Bilder der außerirdischsten Pflanzen der Welt malte!","bio_fr":"Une voyageuse solitaire intrépide qui a parcouru les jungles de presque tous les continents au XIXe siècle, peignant plus de 800 tableaux incroyablement éclatants des plantes les plus extraterrestres du monde !","birth_de":"Hastings (Ärmelkanal (Küste)), England","birth_fr":"Hastings (la Manche (côte)), Angleterre"},"Otto Staudinger":{"name":"Otto Staudinger","bio_de":"Betrieb das absolut größte Insektenhandels-Imperium der Welt! Dschungelforscher schickten ihm Millionen seltener, riesiger Schmetterlinge, die er dann an besessene Sammler auf der ganzen Welt verkaufte!","bio_fr":"Il dirigeait le plus grand empire de vente d'insectes au monde ! Des explorateurs de la jungle lui expédiaient des millions de papillons rares et gigantesques, qu'il revendait ensuite à des collectionneurs passionnés partout dans le monde !","birth_de":"Groß Wüstenfelde (Peene (in der Nähe)), Deutschland","birth_fr":"Groß Wüstenfelde (Peene (à proximité)), Allemagne"},"Albert Oppel":{"name":"Albert Oppel","bio_de":"Oppel erkannte, dass Wissenschaftler versteinerte Spiralschalen namens Ammoniten als \"Zeitstempel\" für Gesteinsschichten nutzen konnten. Indem er diese Fossilien kartierte, bewies er, dass man das genaue relative Alter einer Gesteinsschicht überall in Europa bestimmen konnte, und revolutionierte damit die Geologie, bevor er tragischerweise mit nur 34 Jahren starb.","bio_fr":"Oppel a compris que les scientifiques pouvaient utiliser des coquilles en spirale fossilisées appelées ammonites comme \"horodatage\" des couches rocheuses. En cartographiant ces fossiles, il a prouvé qu'on pouvait déterminer l'âge relatif exact d'une couche rocheuse n'importe où en Europe, révolutionnant la géologie avant de disparaître tragiquement à seulement 34 ans.","birth_de":"Hohenheim, Deutschland","birth_fr":"Hohenheim, Allemagne"},"Anton de Bary":{"name":"Anton de Bary","bio_de":"Bekannt als der \"Vater der Pflanzenpathologie\", löste De Bary das Rätsel der Irischen Hungersnot, indem er bewies, dass ein pilzähnlicher Organismus sie verursachte. Er prägte auch den Begriff Symbiose, um zu beschreiben, wie völlig verschiedene Organismen in der Natur zusammenleben!","bio_fr":"Connu comme le \"père de la pathologie végétale\", De Bary a résolu le mystère de la Grande Famine irlandaise en prouvant qu'un organisme semblable à un champignon en était la cause. Il a aussi inventé le terme symbiose pour décrire comment des organismes totalement différents vivent ensemble dans la nature !","birth_de":"Frankfurt, Deutschland","birth_fr":"Frankfurt, Allemagne"},"Othniel Charles Marsh":{"name":"Othniel Charles Marsh","bio_de":"Entdeckte den Stegosaurus und den Triceratops, während er die berüchtigten \"Bone Wars\" austrug – eine buchstäbliche, gnadenlose Rivalität, bei der Dinosaurierjäger die Fossilienfundstellen der anderen mit Dynamit in die Luft sprengten!","bio_fr":"A découvert le Stégosaure et le Tricératops tout en menant les tristement célèbres \"Guerres des os\" : une rivalité littérale et impitoyable où les chasseurs de dinosaures faisaient sauter à la dynamite les sites de fossiles les uns des autres !","birth_de":"Lockport (Eriekanal), USA","birth_fr":"Lockport (canal Érié), Etats-Unis"},"William Henry Flower":{"name":"William Henry Flower","bio_de":"Direktor des Londoner Natural History Museum, der die Museumsgestaltung revolutionierte! Er führte öffentliche interaktive Ausstellungen ein und organisierte riesige, ikonische Ausstellungen von Walskeletten.","bio_fr":"Directeur du Muséum d'histoire naturelle de Londres qui a révolutionné la conception des musées ! Il a introduit des expositions interactives ouvertes au public et organisé d'immenses et emblématiques présentations de squelettes de baleines.","birth_de":"Stratford-upon-Avon (Avon), England","birth_fr":"Stratford-upon-Avon (Avon), Angleterre"},"Henry Seebohm":{"name":"Henry Seebohm","bio_de":"Englischer Stahlfabrikant, der zu einem führenden Experten für Vogeleier und Vogelzug wurde und sich auf gewaltige Expeditionen in die sibirische Tundra begab.","bio_fr":"Fabricant d'acier anglais qui est devenu un expert de premier plan des œufs d'oiseaux et de la migration, se lançant dans d'immenses expéditions vers la toundra sibérienne.","birth_de":"Bradford (Aire), England","birth_fr":"Bradford (Aire), Angleterre"},"Julius von Sachs":{"name":"Julius von Sachs","bio_de":"Begründer der modernen Pflanzenphysiologie. Er bewies, dass Stärke während der Photosynthese in Chloroplasten produziert wird, und standardisierte strenge experimentelle Methoden in der Botanik.","bio_fr":"Fondateur de la physiologie végétale moderne. Il a prouvé que l'amidon est produit dans les chloroplastes pendant la photosynthèse et a standardisé des méthodes expérimentales rigoureuses en botanique.","birth_de":"Breslau (Oder), Preußen (Polen)","birth_fr":"Breslau (Oder), Prusse (Pologne)"},"Thomas Belt":{"name":"Thomas Belt","bio_de":"Ein Bergbauingenieur in Mittelamerika, der erstaunliche Entdeckungen über die tropische Ökologie machte, darunter, wie Akazienbäume Armeen stechender Ameisen ernähren und beherbergen, um sich selbst zu schützen!","bio_fr":"Un ingénieur minier en Amérique centrale qui a fait d'incroyables découvertes sur l'écologie tropicale, notamment comment les acacias nourrissent et abritent des armées de fourmis piqueuses pour se protéger !","birth_de":"Newcastle upon Tyne (Tyne), England","birth_fr":"Newcastle upon Tyne (Tyne), Angleterre"},"August Weismann":{"name":"August Weismann","bio_de":"Weismann schlug die \"Keimplasmatheorie\" vor und bewies, dass vererbte Merkmale ausschließlich über die Fortpflanzungszellen (Eizellen und Spermien) weitergegeben werden, und widerlegte damit den Mythos, dass im Laufe des Lebens erworbene Merkmale vererbt werden können!","bio_fr":"Weismann a proposé la \"théorie du plasma germinatif\", prouvant que les caractères héréditaires ne se transmettent que par les cellules reproductrices (ovules et spermatozoïdes), démolissant le mythe selon lequel les caractères acquis au cours de la vie peuvent être hérités !","birth_de":"Frankfurt, Deutschland","birth_fr":"Frankfurt, Allemagne"},"Ernst Haeckel":{"name":"Ernst Haeckel","bio_de":"Entdeckte Tausende von Arten, zeichnete einen Stammbaum, der alle Lebensformen miteinander verband, und beeinflusste mit seinem atemberaubenden Werk *Kunstformen der Natur* sowohl die Wissenschaft als auch das Design.","bio_fr":"A découvert des milliers d'espèces, tracé un arbre généalogique reliant toutes les formes de vie et influencé à la fois la science et le design avec son magnifique *Formes artistiques de la nature*.","birth_de":"Potsdam (Havel), Deutschland","birth_fr":"Potsdam (Havel), Allemagne"},"Frederick DuCane Godman":{"name":"Frederick DuCane Godman","bio_de":"Verfasste und redigierte gemeinsam mit anderen das gewaltige, 63-bändige Werk *Biologia Centrali-Americana*, eine unverzichtbare Enzyklopädie, die die Pflanzen- und Tierwelt Mittelamerikas dokumentiert.","bio_fr":"A co-écrit et édité l'immense ouvrage en 63 volumes *Biologia Centrali-Americana*, une encyclopédie essentielle documentant la flore et la faune de l'Amérique centrale.","birth_de":"Park Hatch (Wey), England","birth_fr":"Park Hatch (Wey), Angleterre"},"John Lubbock":{"name":"John Lubbock","bio_de":"Nachbar und enger Verbündeter von Charles Darwin. Er erfand die Begriffe \"Paläolithikum\" und \"Neolithikum\" und führte bahnbrechende Verhaltensforschung an Ameisen und Bienen durch.","bio_fr":"Voisin et proche allié de Charles Darwin. Il a inventé les termes \"Paléolithique\" et \"Néolithique\" et a mené des recherches pionnières sur le comportement des fourmis et des abeilles.","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"Daniel Giraud Elliot":{"name":"Daniel Giraud Elliot","bio_de":"Mitbegründer der American Ornithologists' Union, der atemberaubende, lebensgroße, von Hand kolorierte Kunstbücher veröffentlichte, die exotische Fasane, Wildkatzen und prächtige Paradiesvögel darstellten!","bio_fr":"Cofondateur de l'American Ornithologists' Union, il a publié de superbes livres d'art grandeur nature et coloriés à la main représentant des faisans exotiques, des chats sauvages et de magnifiques oiseaux de paradis !","birth_de":"New York City (Hudson River), USA","birth_fr":"New York City (Hudson River), Etats-Unis"},"Osbert Salvin":{"name":"Osbert Salvin","bio_de":"Wagte sich tief in die schlangenreichen Regenwälder Mittelamerikas vor und verfasste gemeinsam mit anderen eine gewaltige, umwerfende 63-bändige Enzyklopädie, die fast jedes wilde Dschungelgeschöpf dort behandelte!","bio_fr":"S'est aventuré au plus profond des forêts tropicales d'Amérique centrale infestées de serpents et a co-écrit une immense et stupéfiante encyclopédie en 63 volumes couvrant presque toutes les créatures sauvages de la jungle là-bas !","birth_de":"Finchley (London) (Dollis Brook), England","birth_fr":"Finchley (London) (Dollis Brook), Angleterre"},"Tommaso Salvadori":{"name":"Tommaso Salvadori","bio_de":"Ein brillanter italienischer Vogelspezialist, der über 20.000 exotische Vogelexemplare katalogisierte und klassifizierte, die aus den unerforschten tropischen Wäldern Neuguineas und Australiens stammten!","bio_fr":"Un brillant spécialiste italien des oiseaux qui a catalogué et classé plus de 20 000 spécimens d'oiseaux exotiques rassemblés dans les forêts tropicales inexplorées de Nouvelle-Guinée et d'Australie !","birth_de":"Porto San Giorgio (Ete Vivo), Italien","birth_fr":"Porto San Giorgio (Ete Vivo), Italie"},"Worthington George Smith":{"name":"Worthington George Smith","bio_de":"Ein berühmter Pilzillustrator und Höhlendetektiv, der tödlich giftige Pilze kartierte, Pflanzenkrankheiten bekämpfte und uralte prähistorische Steinäxte aufspürte, die im Boden verborgen lagen!","bio_fr":"Un célèbre illustrateur de champignons et détective des cavernes qui a répertorié des champignons mortellement vénéneux, combattu des maladies des cultures et repéré d'anciennes haches de pierre préhistoriques cachées dans le sol !","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"Georg Schweinfurth":{"name":"Georg Schweinfurth","bio_de":"Erforschte Zentral- und Nordafrika, dokumentierte die regionale Pflanzenwelt und trug erheblich zum botanischen Wissen der Europäer über Afrika bei.","bio_fr":"A exploré l'Afrique centrale et septentrionale, documentant la flore régionale et contribuant de manière significative aux connaissances botaniques européennes sur l'Afrique.","birth_de":"Riga (Düna), Lettland","birth_fr":"Riga (Dvina occidentale), Lettonie"},"Herman Strecker":{"name":"Herman Strecker","bio_de":"Amerikanischer Steinbildhauer, der eine der größten privaten Schmetterlings- und Mottensammlungen der Geschichte zusammentrug und seine wissenschaftlichen Kataloge selbst illustrierte.","bio_fr":"Sculpteur sur pierre américain qui a rassemblé l'une des plus grandes collections privées de papillons diurnes et nocturnes de l'histoire, illustrant lui-même ses catalogues scientifiques.","birth_de":"Philadelphia (Delaware River), USA","birth_fr":"Philadelphia (Delaware River), Etats-Unis"},"Robert McLachlan":{"name":"Robert McLachlan","bio_de":"Der weltweit führende Experte für Netzflügler! Er verbrachte sein Leben damit, Tausende von Libellen, Florfliegen und Köcherfliegen in ganz Europa zu fangen, zu klassifizieren und zu kartieren.","bio_fr":"Le plus grand expert mondial des insectes à ailes réticulées ! Il a passé sa vie à capturer, classer et cartographier des milliers de libellules, de chrysopes et de phryganes à travers l'Europe.","birth_de":"Ongar (Roding), England","birth_fr":"Ongar (Roding), Angleterre"},"Samuel Hubbard Scudder":{"name":"Samuel Hubbard Scudder","bio_de":"Amerikas oberste Insektenautorität seiner Zeit! Er beschrieb Tausende lebender Schmetterlinge und Heuschrecken sowie versteinerte Rieseninsekten, die in prähistorischem Gestein eingeschlossen waren.","bio_fr":"La plus haute autorité américaine sur les insectes de son époque ! Il a décrit des milliers de papillons et de sauterelles vivants ainsi que des insectes géants fossilisés piégés dans des roches préhistoriques.","birth_de":"Boston (Charles River), USA","birth_fr":"Boston (Charles River), Etats-Unis"},"William Boyd Dawkins":{"name":"William Boyd Dawkins","bio_de":"Grub sich durch uralte britische Höhlen, um zu beweisen, dass prähistorische Menschen Seite an Seite mit wilden Wollmammuts, Höhlenhyänen und Säbelzahnkatzen mitten im alten Britannien lebten!","bio_fr":"A fouillé d'anciennes grottes britanniques pour prouver que les humains préhistoriques vivaient côte à côte avec des mammouths laineux sauvages, des hyènes des cavernes et des tigres à dents de sabre en pleine Bretagne ancienne !","birth_de":"Buttington (Severn), Wales","birth_fr":"Buttington (Severn), Pays de Galles"},"Henry Eeles Dresser":{"name":"Henry Eeles Dresser","bio_de":"Verfasste das monumentale, mehrbändige Werk *A History of the Birds of Europe*, ein maßgebliches Werk, das umfassende Forschung über Vogelarten zusammenfasst.","bio_fr":"A écrit l'œuvre monumentale en plusieurs volumes *A History of the Birds of Europe*, un ouvrage de référence rassemblant des recherches exhaustives sur les espèces d'oiseaux.","birth_de":"Thirsk (Cod Beck), England","birth_fr":"Thirsk (Cod Beck), Angleterre"},"Harry Govier Seeley":{"name":"Harry Govier Seeley","bio_de":"Britischer Paläontologe, der Dinosaurier anhand ihrer Beckenstruktur in zwei grundlegende Gruppen einteilte: *Saurischia* und *Ornithischia*.","bio_fr":"Paléontologue britannique qui a classé les dinosaures en deux groupes fondamentaux selon la structure de leur bassin : *Saurischia* et *Ornithischia*.","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"Nikolai Przhevalsky":{"name":"Nikolai Przhevalsky","bio_de":"Ein furchtloser russischer Abenteurer, der die gefährlichsten, unerforschten Wüsten Zentralasiens kartierte und bekanntermaßen die allerletzte Art wirklich wilder Pferde der Erde entdeckte!","bio_fr":"Un aventurier russe intrépide qui a cartographié les déserts les plus dangereux et inexplorés d'Asie centrale et qui a découvert, de façon célèbre, la toute dernière espèce de cheval vraiment sauvage de la planète !","birth_de":"Kimborovo (Dnjepr (in der Nähe)), Russland","birth_fr":"Kimborovo (Dniepr (à proximité)), Russie"},"Otto Finsch":{"name":"Otto Finsch","bio_de":"Erforschte die wildesten Inseln des Pazifischen Ozeans! Er beschrieb Unmengen verrückter, neonbunter tropischer Vögel und war so legendär, dass sie sogar eine Stadt in Neuguinea nach ihm benannten!","bio_fr":"A exploré les îles les plus sauvages de l'océan Pacifique ! Il a décrit des tonnes d'oiseaux tropicaux fous aux couleurs fluo, et il était si légendaire qu'on a même donné son nom à une ville de Nouvelle-Guinée !","birth_de":"Warmbrunn (Kamienna), Preußen (Polen)","birth_fr":"Warmbrunn (Kamienna), Prusse (Pologne)"},"Alexander Kovalevsky":{"name":"Alexander Kovalevsky","bio_de":"Kovalevsky lüftete ein großes Geheimnis der Evolution, indem er weiche Seescheiden-Larven unter dem Mikroskop betrachtete. Er entdeckte, dass diese hirnlosen Meeresklümpchen in jungen Jahren tatsächlich eine Vorstufe der Wirbelsäule (*Chorda dorsalis*) besitzen, und bewies damit, dass wirbellose Tiere und Wirbeltiere wie der Mensch uralte gemeinsame Vorfahren haben!","bio_fr":"Kovalevsky a percé un grand secret de l'évolution en observant au microscope de molles larves d'ascidies. Il a découvert que ces bulles marines sans cervelle possèdent en réalité, dans leur jeunesse, l'ébauche d'une colonne vertébrale (*notochorde*), prouvant que les invertébrés et les animaux vertébrés comme l'homme partagent d'anciens ancêtres communs !","birth_de":"Daugavpils, Lettland","birth_fr":"Daugavpils, Lettonie"},"Anton Dohrn":{"name":"Anton Dohrn","bio_de":"Dohrn gründete die weltberühmte Stazione Zoologica in Neapel, Italien, und schuf damit ein offenes Meereslabor, in dem Wissenschaftler aus aller Welt lebende Meerestiere direkt am Ufer erforschen konnten.","bio_fr":"Dohrn a fondé la célèbre Stazione Zoologica de Naples, en Italie, créant un laboratoire en pleine mer où des scientifiques du monde entier pouvaient venir étudier les créatures marines vivantes directement au bord de la mer.","birth_de":"Stettin, Preußen (heute Szczecin, Polen)","birth_fr":"Stettin, Prusse (aujourd'hui Szczecin, Pologne)"},"David Sharp":{"name":"David Sharp","bio_de":"Einer der größten Käferexperten Großbritanniens, der über 3.000 Insektenarten benannte und das monumentale, zweibändige Werk *Insects* schrieb, das Generationen von Insektenliebhabern bildete!","bio_fr":"L'une des plus grandes autorités britanniques sur les coléoptères, qui a nommé plus de 3 000 espèces d'insectes et écrit le monumental traité en deux volumes *Insects* qui a instruit des générations de passionnés d'insectes !","birth_de":"Towcester (Tove), England","birth_fr":"Towcester (Tove), Angleterre"},"Edward Drinker Cope":{"name":"Edward Drinker Cope","bio_de":"Ein kämpferischer amerikanischer Paläontologe und eine zentrale Figur der „Bone Wars“ (Knochenkriege). Er benannte über 1.000 Wirbeltierarten und half dabei, Amerikas berühmteste Dinosaurier zu entdecken!","bio_fr":"Un paléontologue américain redoutable et une figure centrale des « Bone Wars » (la guerre des os), qui a nommé plus de 1 000 espèces de vertébrés et a contribué à découvrir les dinosaures les plus célèbres d'Amérique !","birth_de":"Philadelphia (Delaware River), USA","birth_fr":"Philadelphia (Delaware River), États-Unis"},"Otto Wilhelm Thomé":{"name":"Otto Wilhelm Thomé","bio_de":"Er schuf eine illustrierte botanische Enzyklopädie, die so unglaublich prächtig und detailreich war, dass sie über hundert Jahre lang das absolute Standardwerk war, um Deutschlands wilde Pflanzen kennenzulernen!","bio_fr":"Il a créé une encyclopédie botanique illustrée tellement magnifique et détaillée qu'elle est devenue, pendant plus d'un siècle, LE guide de référence pour découvrir les plantes sauvages d'Allemagne !","birth_de":"Cologne (Rhein), Deutschland","birth_fr":"Cologne (le Rhin), Allemagne"},"Roland Trimen":{"name":"Roland Trimen","bio_de":"Er erforschte südafrikanische Schmetterlinge und bewies Charles Darwins Evolutionstheorie, indem er zeigte, wie harmlose Schmetterlinge giftige nachahmen, um hungrige Fressfeinde auszutricksen!","bio_fr":"Il a étudié les papillons d'Afrique du Sud et a prouvé la théorie de l'évolution de Charles Darwin en montrant comment des papillons inoffensifs imitent des papillons venimeux pour tromper les prédateurs affamés !","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"Augustus Radcliffe Grote":{"name":"Augustus Radcliffe Grote","bio_de":"Ein Insektenforscher, der in die USA auswanderte und sein Leben damit verbrachte, Tausende nordamerikanische Mottenarten zu benennen und einzuordnen – und dabei riesige Insektensammlungen aufzubauen.","bio_fr":"Un entomologiste qui a émigré aux États-Unis et a passé sa vie à nommer et à classer des milliers d'espèces de papillons de nuit d'Amérique du Nord, tout en constituant d'immenses collections d'insectes.","birth_de":"Aigburth, England","birth_fr":"Aigburth, Angleterre"},"Eugenius Warming":{"name":"Eugenius Warming","bio_de":"Dänischer Botaniker und einer der Begründer der Ökologie. Er schrieb das allererste Lehrbuch über Pflanzenökologie und verlagerte den Fokus der Botanik grundlegend von der bloßen Einteilung der Arten hin zu ganzen Ökosystemen.","bio_fr":"Botaniste danois et l'un des fondateurs de l'écologie. Il a écrit le tout premier manuel sur l'écologie des plantes, faisant passer la botanique de la simple classification des espèces à l'étude des écosystèmes entiers.","birth_de":"Mandø (Wattenmeer), Dänemark","birth_fr":"Mandø (mer des Wadden), Danemark"},"John Murray":{"name":"John Murray","bio_de":"Er gilt als der Vater der modernen Meereskunde. Er spielte eine riesige Rolle bei der bahnbrechenden Challenger-Expedition und der anschließenden Kartierung der Tiefsee.","bio_fr":"Considéré comme le père de l'océanographie moderne. Il a joué un rôle énorme dans la révolutionnaire expédition du Challenger et dans la cartographie des grands fonds marins qui a suivi.","birth_de":"Cobourg (Ontariosee), Kanada","birth_fr":"Cobourg (lac Ontario), Canada"},"Luigi Maria D'Albertis":{"name":"Luigi Maria D'Albertis","bio_de":"Ein exzentrischer Entdecker, der mit einem winzigen Dampfschiff die unerforschten, tödlichen Flüsse Neuguineas hinauffuhr und Feuerwerk zündete, um Angreifer zu verscheuchen, während er nach seltenen Paradiesvögeln jagte!","bio_fr":"Un explorateur excentrique qui a remonté, à bord d'un minuscule bateau à vapeur, les rivières inexplorées et mortelles de Nouvelle-Guinée, faisant exploser des feux d'artifice pour effrayer les assaillants tout en cherchant de rares oiseaux de paradis !","birth_de":"Voltri (Leira River), Italien","birth_fr":"Voltri (Leira River), Italie"},"Elliott Coues":{"name":"Elliott Coues","bio_de":"Ein äußerst einflussreicher amerikanischer Ornithologe, Militärarzt und Mitbegründer der American Ornithologists' Union, berühmt für sein Werk *Key to North American Birds*.","bio_fr":"Un ornithologue américain très influent, chirurgien militaire et cofondateur de l'American Ornithologists' Union, célèbre pour son ouvrage *Key to North American Birds*.","birth_de":"Portsmouth (Piscataqua River), USA","birth_fr":"Portsmouth (Piscataqua River), États-Unis"},"John Gerrard Keulemans":{"name":"John Gerrard Keulemans","bio_de":"Der gefragteste Vogelillustrator des späten 19. Jahrhunderts. Er fertigte Tausende von Lithografien für die wichtigsten ornithologischen Werke seiner Zeit an.","bio_fr":"L'illustrateur d'oiseaux le plus demandé de la fin du XIXe siècle, qui a produit des milliers de lithographies pour les ouvrages ornithologiques les plus importants de son époque.","birth_de":"Rotterdam (Nieuwe Maas), Niederlande","birth_fr":"Rotterdam (Nieuwe Maas), Pays-Bas"},"Vladimir Kovalevsky":{"name":"Vladimir Kovalevsky","bio_de":"Er war ein Pionier der evolutionären Fossilienforschung: Durch die Untersuchung uralter Skelettgliedmaßen bewies er Schritt für Schritt, wie sich moderne einzehige Pferde aus winzigen, vierzehigen Urahnen entwickelten!","bio_fr":"Il a été un pionnier de l'étude des fossiles et de l'évolution : en analysant d'anciens membres de squelettes, il a prouvé étape par étape comment les chevaux modernes à un seul doigt ont évolué à partir de minuscules ancêtres préhistoriques à quatre doigts !","birth_de":"Vārkava (Daugava River), Lettland","birth_fr":"Vārkava (Daugava River), Lettonie"},"Charles Valentine Riley":{"name":"Charles Valentine Riley","bio_de":"Er war ein Pionier der biologischen Schädlingsbekämpfung: Er importierte räuberische Marienkäfer, um Kaliforniens Zitrusindustrie vor verheerendem Befall durch Schildläuse zu retten!","bio_fr":"Il a été un pionnier de la lutte biologique contre les nuisibles : il a importé des coccinelles prédatrices pour sauver l'industrie des agrumes de Californie d'invasions dévastatrices de cochenilles !","birth_de":"London, England","birth_fr":"London, Angleterre"},"Odoardo Beccari":{"name":"Odoardo Beccari","bio_de":"Er schlug sich durch die tödlichen, dampfenden Dschungel Borneos und entdeckte den legendären Titanenwurz – die größte Blume der Welt, die genau wie eine verwesende Zombieleiche stinkt!","bio_fr":"Il s'est frayé un chemin à travers les jungles mortelles et étouffantes de Bornéo et a découvert le légendaire arum titan – la plus grande fleur du monde, qui sent exactement comme un cadavre de zombie en décomposition !","birth_de":"Florence (Arno River), Italien","birth_fr":"Florence (Arno River), Italie"},"Adolf Engler":{"name":"Adolf Engler","bio_de":"Engler entwarf ein gewaltiges, umfassendes System zur Einteilung v
