iver","country":"France","field":"Comparative Anatomy & Embryology"},"Pancrace Bessa":{"hook":"Painted flowers so vibrantly that French royalty hired him to teach their kids art! He turned boring plant science into absolute visual masterpieces.","birth":"Paris (Seine River), France","town":"Paris","river":"Seine River","country":"France","field":"Botanical Art"},"Aime Bonpland":{"hook":"Bonpland was a botanist-adventurer who survived jaguar encounters, electric eel shocks, and climbing high up the Andes mountains alongside Alexander von Humboldt. His life was so wild that a South American dictator once kidnapped him and held him under house arrest in Paraguay for nine years because he was worried Bonpland would start a lucrative tea farm!","birth":"La Rochelle, France","town":"La Rochelle","river":null,"country":"France","field":null},"Aimé Bonpland":{"hook":"Bonpland was a botanist-adventurer who survived jaguar encounters, electric eel shocks, and climbing high up the Andes mountains alongside Alexander von Humboldt. His life was so wild that a South American dictator once kidnapped him and held him under house arrest in Paraguay for nine years because he was worried Bonpland would start a lucrative tea farm!","birth":"La Rochelle, France","town":"La Rochelle","river":null,"country":"France","field":null},"Robert Brown":{"hook":"Discovered the nucleus inside living cells AND noticed microscopic pollen grains randomly dancing around in water—a physical phenomenon now known everywhere as \"Brownian Motion\"!","birth":"Montrose (River South Esk), Scotland","town":"Montrose","river":"River South Esk","country":"Scotland","field":"Botany & Physics"},"Thomas Horsfield":{"hook":"An American physician who spent years exploring the dense, untamed jungles of Java, cataloging and describing dozens of brand-new Asian mammal and bird species!","birth":"Bethlehem (Lehigh River), USA","town":"Bethlehem","river":"Lehigh River","country":"USA","field":"Botany & Zoology"},"André Marie Constant Duméril":{"hook":"Duméril was Paris's go-to reptile and fish expert. He created a massive, 9-volume encyclopedia of reptiles (*Erpétologie Générale*) that classified over 1,300 species of snakes, lizards, and turtles, setting the standard for how we study cold-blooded creatures.","birth":"Amiens, France","town":"Amiens","river":null,"country":"France","field":null},"Frederick Traugott Pursh":{"hook":"German-American botanist who compiled *Flora Americae Septentrionalis*, one of the earliest complete descriptions of North American plants.","birth":"Großenhain (Röder River), Germany","town":"Großenhain","river":"Röder River","country":"Germany","field":"Botany"},"Georg Heinrich von Langsdorff":{"hook":"Led major scientific expeditions into the interior of Brazil, compiling immense collections of botanical and zoological specimens.","birth":"Wöllstein (Appelbach River), Germany","town":"Wöllstein","river":"Appelbach River","country":"Germany","field":"Natural History & Exploration"},"Friedrich Schelling":{"hook":"Major German Idealist philosopher whose work attempted to bridge the gap between human spirit and the organic natural world.","birth":"Leonberg (Glems River), Germany","town":"Leonberg","river":"Glems River","country":"Germany","field":"Philosophy of Nature"},"Jean Guillaume Audinet-Serville":{"hook":"French entomologist who created highly significant, early structural classifications for grasshoppers (Orthoptera) and true bugs (Hemiptera).","birth":"Paris (Seine River), France","town":"Paris","river":"Seine River","country":"France","field":"Entomology"},"Johann Karl Wilhelm Illiger":{"hook":"Developed early systematic classifications of mammals and insects, emphasizing the importance of family structures in biological taxonomy.","birth":"Braunschweig (Oker River), Germany","town":"Braunschweig","river":"Oker River","country":"Germany","field":"Entomology & Zoology"},"Pierre Jean François Turpin":{"hook":"Combined extreme artistic beauty with microscopic precision! He peered through lenses to draw hyper-accurate plant cells, revealing microscopic biological structures never seen before.","birth":"Vire (Vire River), France","town":"Vire","river":"Vire River","country":"France","field":"Botanical Art & Microscopic Illustration"},"Henri Marie Ducrotay de Blainville":{"hook":"French zoologist who coined the term *paleontology* and succeeded Cuvier in the chair of comparative anatomy in Paris.","birth":"Arques-la-Bataille (Varenne River), France","town":"Arques-la-Bataille","river":"Varenne River","country":"France","field":"Comparative Anatomy"},"Augustin-Pyramus de Candolle":{"hook":"A famous botanist who coined the term taxonomy to describe the science of sorting living things, and discovered that plant leaf movements follow an internal biological clock.","birth":"Geneva, Switzerland","town":"Geneva","river":null,"country":"Switzerland","field":null},"Charles Alexandre Lesueur":{"hook":"An artist-naturalist who explored Australia and North America, producing thousands of beautiful drawings of ocean sea jellies, fish, and freshwater turtles.","birth":"Le Havre, France","town":"Le Havre","river":null,"country":"France","field":null},"Coenraad Jacob Temminck":{"hook":"Founder and longtime director of the Naturalis Museum in Leiden, who analyzed and named thousands of new mammal and bird species brought back from East Asian and African expeditions!","birth":"Amsterdam (Amstel River), Netherlands","town":"Amsterdam","river":"Amstel River","country":"Netherlands","field":"Zoology & Ornithology"},"Auguste de Saint-Hilaire":{"hook":"A brave French botanist who spent six years trekking through Brazil's wild interior, collecting over 30,000 plant specimens and mapping South American ecosystems.","birth":"Orléans, France","town":"Orléans","river":null,"country":"France","field":null},"Lorenz Oken":{"hook":"A wild, rebel scientist who thought the entire universe was like one giant living organism. He predicted that all animals were made of tiny \"infusoria\" before cell theory was fully proven!","birth":"Bohlsbach (Kinzig River), Germany","town":"Bohlsbach","river":"Kinzig River","country":"Germany","field":"Naturphilosophie"},"William Hooker (fruit painter)":{"hook":"Renowned fruit painter for the London Horticultural Society! His incredibly realistic, mouth-watering paintings of apples, plums, and peaches set the gold standard for fruit art!","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Horticultural Art"},"Johann Friedrich Naumann":{"hook":"Recognized as the founder of modern ornithology in Europe. His multi-volume *Natural History of the Birds of Germany* set a gold standard for field guides.","birth":"Ziebigk (Elbe River), Germany","town":"Ziebigk","river":"Elbe River","country":"Germany","field":"Ornithology"},"Maximilian Spinola":{"hook":"An Italian nobleman born in France who was utterly obsessed with bugs! He named and described hundreds of new insect species, creating a massive catalog of wasps and beetles!","birth":"Toulouse (Garonne River), France","town":"Toulouse","river":"Garonne River","country":"France","field":"Entomology"},"Pierre François Marie Auguste Dejean":{"hook":"A high-ranking general under Napoleon who collected beetles *on active battlefields*! Legend says he pinned rare specimens straight onto his military helmet mid-combat!","birth":"Amiens (Somme River), France","town":"Amiens","river":"Somme River","country":"France","field":"Entomology"},"Adelbert von Chamisso":{"hook":"A remarkable polymath who sailed around the world on a scientific expedition, discovered new plants (including the California poppy), and made breakthroughs in organism reproduction. A French aristocrat forced to flee the French Revolution, he grew up to become a celebrated German poet and a rugged round-the-world explorer.","birth":"Champagne, France","town":"Champagne","river":null,"country":"France","field":null},"Johann Baptist von Spix":{"hook":"Led a monumental expedition to Brazil alongside Carl Friedrich Philipp von Martius, bringing back thousands of previously unknown animal species to Europe.","birth":"Höchstadt (Aisch River), Germany","town":"Höchstadt","river":"Aisch River","country":"Germany","field":"Zoology & Exploration"},"Pauline Knip":{"hook":"She painted pigeons. Sounds boring? Her pigeon paintings were so unbelievably hyper-realistic that she became the official artist for the Queen of Naples!","birth":"Paris (Seine River), France","town":"Paris","river":"Seine River","country":"France","field":"Bird Illustration"},"William John Burchell":{"hook":"Trekked over 4,500 miles through wild South Africa in a custom ox-wagon, collecting 60,000 specimens (including Burchell's Zebra) and making super-accurate wilderness maps!","birth":"Fulham (London) (River Thames), England","town":"Fulham (London)","river":"River Thames","country":"England","field":"Exploration & Natural History"},"Charles Waterton":{"hook":"An eccentric naturalist who created one of the world's first nature reserves on his estate and experimented with the Amazonian arrow poison curare to discover its medical properties.","birth":"Wakefield, England","town":"Wakefield","river":null,"country":"England","field":null},"Georg August Goldfuss":{"hook":"German paleontologist who coined the term *protozoa* and performed crucial early work describing German fossil invertebrates and vertebrates.","birth":"Thurnau (Red Main River), Germany","town":"Thurnau","river":"Red Main River","country":"Germany","field":"Paleontology & Zoology"},"Maximilian zu Wied-Neuwied":{"hook":"A real-life prince who gave up his luxurious castle life to journey deep into the Amazon jungle and the American Wild West to study grizzly bears and indigenous tribes!","birth":"Neuwied (Rhine River), Germany","town":"Neuwied","river":"Rhine River","country":"Germany","field":"Exploration & Ethnography"},"Constantine Samuel Rafinesque":{"hook":"An eccentric self-taught genius who named thousands of North American plant and animal species, explored wild frontier river valleys, and accurately predicted evolution before Darwin!","birth":"Galata (Istanbul) (Bosphorus Strait), Turkey","town":"Galata (Istanbul)","river":"Bosphorus Strait","country":"Turkey","field":"Evolutionary Botany & Zoology"},"William Spence":{"hook":"Co-authored the legendary 4-volume *Introduction to Entomology* with William Kirby—the runaway bestseller that turned insect-hunting into a mainstream global sensation!","birth":"Bishop Burton (River Hull), England","town":"Bishop Burton","river":"River Hull","country":"England","field":"Entomology"},"William Buckland":{"hook":"Scientifically described the very first named dinosaur—*Megalosaurus*—in 1824! He was famous for eccentric experiments and trying to taste every single animal species on Earth!","birth":"Axminster (River Axe), England","town":"Axminster","river":"River Axe","country":"England","field":"Paleontology & Geology"},"William Yarrell":{"hook":"A London newsagent turned super-naturalist who wrote master reference books on British birds and fishes, and successfully proved that Bewick's Swan was an entirely separate species!","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Zoology & Ornithology"},"John James Audubon":{"hook":"Painted, cataloged, and described the birds of North America in a style far superior to any preceding work in his epic masterpiece, *The Birds of America*.","birth":"Les Cayes (Ravine du Sud), Saint-Domingue (Haiti)","town":"Les Cayes","river":"Ravine du Sud","country":"Saint-Domingue (Haiti)","field":"Ornithology & Art"},"William Jackson Hooker":{"hook":"Transformed Kew Gardens into the supreme global power for plant science! As official Director, he organized expeditions across the British Empire and built huge plant herbariums.","birth":"Norwich (River Wensum), England","town":"Norwich","river":"River Wensum","country":"England","field":"Botany & Administration"},"Nathaniel Wallich":{"hook":"Ran the legendary Calcutta Botanical Gardens and loaded entire fleets of ships with over 8,000 completely crazy, unknown Indian jungle plants to amaze scientists back in Europe!","birth":"Copenhagen (Øresund Strait), Denmark","town":"Copenhagen","river":"Øresund Strait","country":"Denmark","field":"Botany"},"Thomas Nuttall":{"hook":"A fearless explorer who trekked across thousands of miles of wild American frontier, identifying hundreds of new plant species and writing classic botanical reference guides.","birth":"Settle (River Ribble), England","town":"Settle","river":"River Ribble","country":"England","field":"Botany & Exploration"},"Christian Ludwig Brehm":{"hook":"A pastor and bird collector who accumulated over 9,000 bird skins, proving how subtle variations in plumage exist within individual bird species across regions.","birth":"Schönau vor dem Walde, Germany","town":"Schönau vor dem Walde","river":null,"country":"Germany","field":null},"John Richardson":{"hook":"Scottish naval surgeon and naturalist who surveyed the harsh Canadian Arctic alongside John Franklin, thoroughly documenting its flora and fauna in *Fauna Boreali-Americana*.","birth":"Dumfries (River Nith), Scotland","town":"Dumfries","river":"River Nith","country":"Scotland","field":"Exploration & Ichthyology"},"Thomas Say":{"hook":"The \"Father of American Entomology\"! He braved dangerous frontier expeditions across the American West to discover and describe thousands of brand-new insect and shell species!","birth":"Philadelphia (Delaware River), USA","town":"Philadelphia","river":"Delaware River","country":"USA","field":"Entomology & Conchology"},"Carl Sigismund Kunth":{"hook":"Spent 24 years in Paris organizing, describing, and publishing thousands of new South American plant specimens brought back by Humboldt and Bonpland's expedition.","birth":"Leipzig, Germany","town":"Leipzig","river":null,"country":"Germany","field":null},"Jacques Boucher de Perthes":{"hook":"Pioneered the study of prehistoric flint tools in France, providing some of the very first proof of the ancient antiquity of humankind.","birth":"Rethel (Aisne River), France","town":"Rethel","river":"Aisne River","country":"France","field":"Archaeology & Antiquarianism"},"Prideaux John Selby":{"hook":"Etched life-sized, hand-colored prints of British birds onto giant sheets of paper—creating British ornithological artwork so large and detailed it rivaled Audubon's work in America!","birth":"Alnwick (River Aln), England","town":"Alnwick","river":"River Aln","country":"England","field":"Ornithology & Engraving"},"Joakim Frederik Schouw":{"hook":"Danish pioneer who shifted botany toward ecology by correlating the global distribution of plant species directly with specific climate zones.","birth":"Copenhagen (Øresund (Strait)), Denmark","town":"Copenhagen","river":"Øresund (Strait)","country":"Denmark","field":"Phytogeography (Plant Geography)"},"William Scoresby":{"hook":"A fearless Arctic whaling captain turned scientist who mapped Greenland's icy coastline, studied frozen ocean currents, drew complex snowflake crystals, and solved iron ship magnetic interference!","birth":"Whitby (River Esk), England","town":"Whitby","river":"River Esk","country":"England","field":"Arctic Exploration & Geophysics"},"William Swainson":{"hook":"A gifted artist and daring explorer who published ultra-detailed, vibrant lithographs of wild tropical birds, colorful fish, and shells collected during his journeys through South America!","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Ornithology & Zoological Illustration"},"Gideon Mantell":{"hook":"Discovered and identified the first fossil teeth and bones of *Iguanodon*, playing a pivotal role in the early scientific discovery of dinosaurs.","birth":"Lewes (River Ouse), England","town":"Lewes","river":"River Ouse","country":"England","field":"Paleontology & Geology"},"Jules Dumont d'Urville":{"hook":"French naval officer who commanded crucial expeditions to the South Pacific and Antarctica, gathering vast biological specimens and acquiring the Venus de Milo for France.","birth":"Condé-sur-Noireau (Noireau River), France","town":"Condé-sur-Noireau","river":"Noireau River","country":"France","field":"Exploration & Botany"},"John Curtis":{"hook":"Produced the majestic 16-volume *British Entomology*, lauded as some of the finest, most accurate insect illustrations ever printed in England.","birth":"Norwich (River Wensum), England","town":"Norwich","river":"River Wensum","country":"England","field":"Entomology & Illustration"},"Sarah Bowdich Lee":{"hook":"The first woman ever to collect and systematically describe new plant species in West Africa! She wrote ground-breaking natural history books and illustrated exotic wildlife.","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Natural History & Exploration"},"William Elford Leach":{"hook":"A energetic natural history curator at the British Museum who revolutionized the study of crustaceans, insects, and mollusks through intense, non-stop laboratory analysis!","birth":"Plymouth (River Plym), England","town":"Plymouth","river":"River Plym","country":"England","field":"Zoology & Marine Biology"},"Augusta Innes Withers":{"hook":"An extraordinary English botanical painter who served as Flower Painter in Ordinary to Queen Adelaide, painting wildly detailed orchids and exotic fruit plants for top scientific books.","birth":"Gloucestershire, England","town":"Gloucestershire","river":null,"country":"England","field":null},"James Francis Stephens":{"hook":"Authored the colossal *Illustrations of British Entomology*, serving as a critical reference point for Charles Darwin's early insect research.","birth":"Shoreham-by-Sea (River Adur), England","town":"Shoreham-by-Sea","river":"River Adur","country":"England","field":"Entomology"},"Karl Ernst von Baer":{"hook":"He discovered the mammalian egg! He proved that massive animals (and humans) don't start as fully-formed mini-creatures, but grow from a single, microscopic little dot!","birth":"Piibe (Põltsamaa River), Estonia","town":"Piibe","river":"Põltsamaa River","country":"Estonia","field":"Embryology & Biology"},"Roderick Murchison":{"hook":"Solved massive ancient rock puzzles across Britain and Europe! He established and named the Silurian geological period, revealing millions of years of hidden Earth history.","birth":"Tarradale (River Beauly), Scotland","town":"Tarradale","river":"River Beauly","country":"Scotland","field":"Geology"},"William Sharp Macleay":{"hook":"Invented the \"Quinarian System\"—a wild, mind-bending 19th-century theory that proposed every single living creature on Earth was organized in repeating patterns of five intersecting circles!","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Entomology & Evolutionary Theory"},"Johann Friedrich von Eschscholtz":{"hook":"Baltic-German naturalist who served as physician and scientist on Otto von Kotzebue's exploratory voyages, profoundly contributing to the biology of the Pacific.","birth":"Tartu (Dorpat) (Emajõgi River), Estonia","town":"Tartu (Dorpat)","river":"Emajõgi River","country":"Estonia","field":"Biology & Exploration"},"Robert Havell":{"hook":"The master printmaker who spent 11 relentless years engraving and printing giant copper plates for John James Audubon’s world-famous masterpiece *The Birds of America*!","birth":"Reading (River Thames), England","town":"Reading","river":"River Thames","country":"England","field":"Printmaking & Art"},"Achille Valenciennes":{"hook":"Valenciennes spent decades meticulously describing fish and microscopic parasites, co-authoring a massive 22-volume encyclopedia on fish still relied upon today. Born directly inside the famous Paris Natural History Museum where his father worked, he grew up surrounded by exotic specimens and dedicated his life to ocean creatures.","birth":"Paris, France","town":"Paris","river":null,"country":"France","field":null},"Carl Friedrich Philipp von Martius":{"hook":"An explorer who spent three years exploring the Amazon basin, producing a legendary multi-volume encyclopedia on palm trees (*Flora Brasiliensis*) that remains a botanical landmark.","birth":"Erlangen, Germany","town":"Erlangen","river":null,"country":"Germany","field":null},"Christian Heinrich Pander":{"hook":"Discovered the embryonic germ layers (ectoderm, mesoderm, endoderm) that form all animal body organs, laying the foundation for modern embryology.","birth":"Riga, Latvia","town":"Riga","river":null,"country":"Latvia","field":null},"Eduard Rueppell":{"hook":"German naturalist and explorer who extensively surveyed Northeastern Africa and the Middle East, describing many new species including Rüppell's vulture.","birth":"Frankfurt am Main (Main River), Germany","town":"Frankfurt am Main","river":"Main River","country":"Germany","field":"Zoology & Exploration"},"Eduard Rüppell":{"hook":"German naturalist and explorer who extensively surveyed Northeastern Africa and the Middle East, describing many new species including Rüppell's vulture.","birth":"Frankfurt am Main (Main River), Germany","town":"Frankfurt am Main","river":"Main River","country":"Germany","field":"Zoology & Exploration"},"Elias Magnus Fries":{"hook":"Known as the \"Linnaeus of Mycology,\" this Swedish botanist established the foundational taxonomic classification system for mushrooms and fungi still used today.","birth":"Femsjö (Nissan River), Sweden","town":"Femsjö","river":"Nissan River","country":"Sweden","field":"Mycology & Botany"},"Rene Primevere Lesson":{"hook":"Double entry for the iconic French naval naturalist! Beyond Birds-of-Paradise, he discovered dozens of unknown hummingbird species and unique marine creatures during his 2-year voyage around the planet.","birth":"Rochefort (Charente River), France","town":"Rochefort","river":"Charente River","country":"France","field":"Zoology & Exploration"},"René Primevère Lesson":{"hook":"Double entry for the iconic French naval naturalist! Beyond Birds-of-Paradise, he discovered dozens of unknown hummingbird species and unique marine creatures during his 2-year voyage around the planet.","birth":"Rochefort (Charente River), France","town":"Rochefort","river":"Charente River","country":"France","field":"Zoology & Exploration"},"Christian Gottfried Ehrenberg":{"hook":"Discovered that giant chalk cliffs and ocean sediment deposits are actually made up of billions of microscopic fossil skeletons, revealing microscopic life's massive geological power.","birth":"Delitzsch, Germany","town":"Delitzsch","river":null,"country":"Germany","field":null},"Thaddeus William Harris":{"hook":"The \"Father of Economic Entomology in America\"! He showed farmers how to protect their crops by studying agricultural insect pests and their life cycles.","birth":"Dorchester (Boston) (Neponset River), USA","town":"Dorchester (Boston)","river":"Neponset River","country":"USA","field":"Economic Entomology"},"Carl Ludwig Blume":{"hook":"A botanist who spent years studying the tropical biodiversity of Java and the East Indies, naming hundreds of exotic plants including rare orchids and giant jungle flowers.","birth":"Brunswick, Germany","town":"Brunswick","river":null,"country":"Germany","field":null},"Henry De la Beche":{"hook":"First director of the Geological Survey of Great Britain, creating pioneering geological maps that set the standard for stratigraphy.","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Geology"},"John Torrey":{"hook":"A pivotal figure in American science who collaborated with Asa Gray to catalog the immense floral diversity brought back from western American expeditions.","birth":"New York City (Hudson River), USA","town":"New York City","river":"Hudson River","country":"USA","field":"Botany"},"Orra White Hitchcock":{"hook":"America’s first female scientific illustrator! She painted huge, wall-sized classroom posters of terrifying prehistoric fossils and giant dinosaur tracks to blow the minds of university students!","birth":"Amherst (Connecticut River), USA","town":"Amherst","river":"Connecticut River","country":"USA","field":"Scientific Illustration"},"William MacGillivray":{"hook":"Collaborated with John James Audubon on *Ornithological Biography*, dissecting and describing the internal anatomy and digestive systems of hundreds of bird species!","birth":"Aberdeen (River Dee), Scotland","town":"Aberdeen","river":"River Dee","country":"Scotland","field":"Ornithology & Comparative Anatomy"},"Andrew Smith":{"hook":"An army surgeon sent to South Africa who spent his free time trekking into uncharted territory. He was the first scientist to officially describe the infamous, highly venomous Black Mamba snake and founded South Africa's very first natural history museum.","birth":"Hawick, Scotland","town":"Hawick","river":null,"country":"Scotland","field":null},"Charles Lyell":{"hook":"The geologist who popularized **uniformitarianism**, proving that Earth's geological features were formed over millions of years by slow, natural forces still at work today.","birth":"Kinnordy, Scotland","town":"Kinnordy","river":null,"country":"Scotland","field":null},"Étienne Mulsant":{"hook":"An unstoppable French naturalist who classified hundreds of newly discovered beetle species and co-authored a massive multi-volume masterpiece on every hummingbird species on Earth!","birth":"Mornant (Garon River), France","town":"Mornant","river":"Garon River","country":"France","field":"Entomology & Ornithology"},"Frederick William Hope":{"hook":"Founder of the Hope Department of Entomology at the University of Oxford and a founder of the Royal Entomological Society.","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Entomology"},"Anna Atkins":{"hook":"Atkins created the world's very first book illustrated with photographs! Using early photographic blueprints (cyanotypes), she placed real seaweeds and ferns onto light-sensitive paper, creating stunning, deep-blue visual prints of plant life.","birth":"Tonbridge, England","town":"Tonbridge","river":null,"country":"England","field":null},"David Douglas":{"hook":"Daring Scottish plant hunter who braved dangerous wilderness in the Pacific Northwest to introduce the massive Douglas-fir tree and over 200 species of wild plants to gardens worldwide!","birth":"Scone (River Tay), Scotland","town":"Scone","river":"River Tay","country":"Scotland","field":"Botanical Exploration & Forestry"},"Félix Édouard Guérin-Méneville":{"hook":"Prolific French entomologist who illustrated and described thousands of insect species, editing key serial publications like *Revue Zoologique*.","birth":"Toulon (Las River), France","town":"Toulon","river":"Las River","country":"France","field":"Entomology"},"Gottlieb August Wilhelm Herrich-Schäffer":{"hook":"Leading German specialist; authored comprehensive multi-volume guides classifying European butterflies and moths.","birth":"Regensburg (Danube River), Germany","town":"Regensburg","river":"Danube River","country":"Germany","field":"Entomology & Medicine"},"Jean Baptiste Boisduval":{"hook":"One of the foremost lepidopterists of his era, painstakingly describing butterfly collections returned from major French naval exploratory voyages.","birth":"Ticheville (Touques River), France","town":"Ticheville","river":"Touques River","country":"France","field":"Entomology"},"John Lindley":{"hook":"Fought tirelessly to save the Royal Botanic Gardens at Kew and became one of the foremost authorities on orchids, fundamentally reshaping plant taxonomy.","birth":"Old Catton (River Wensum), England","town":"Old Catton","river":"River Wensum","country":"England","field":"Botany & Orchidology"},"Mary Anning":{"hook":"Survived a lightning strike as a baby to become the greatest fossil hunter ever! She dug whole sea monsters (Plesiosaurs) out of crumbling cliffs, proving to scientists that animals could go extinct!","birth":"Lyme Regis (River Lim), England","town":"Lyme Regis","river":"River Lim","country":"England","field":"Paleontology"},"Priscilla Susan Bury":{"hook":"A brilliant self-taught artist who published enormous, dramatic prints of lilies and amaryllis flowers that left the world's most experienced male botanists completely awestruck!","birth":"Liverpool (River Mersey), England","town":"Liverpool","river":"River Mersey","country":"England","field":"Botanical Illustration"},"Titian Peale":{"hook":"An adventurer, wildlife artist, and bug collector who trekked across the untamed American West and sailed around the globe on the U.S. Exploring Expedition to sketch rare wildlife!","birth":"Philadelphia (Delaware River), USA","town":"Philadelphia","river":"Delaware River","country":"USA","field":"Entomology & Scientific Art"},"George Bentham":{"hook":"Leading 19th-century English botanist who co-authored *Genera Plantarum*, creating a comprehensive classification system for seed plants.","birth":"Stoke (River Tamar), England","town":"Stoke","river":"River Tamar","country":"England","field":"Systematic Botany"},"Heinrich Georg Bronn":{"hook":"German paleontologist known for his extensive encyclopedia of fossil organisms and for translating Charles Darwin's works into German.","birth":"Ziegelhausen (Neckar River), Germany","town":"Ziegelhausen","river":"Neckar River","country":"Germany","field":"Geology & Paleontology"},"Henri Milne-Edwards":{"hook":"French zoologist recognized for pioneer studies on marine invertebrates, physiological division of labor, and comprehensive works on crustaceans.","birth":"Bruges (Reie Canals), Belgium","town":"Bruges","river":"Reie Canals","country":"Belgium","field":"Marine Biology & Zoology"},"James Clark Ross":{"hook":"Commanded the legendary Antarctic expedition of the *Erebus* and *Terror*, conducting massive biological surveys and discovering the Ross Sea.","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Polar Exploration"},"Johann Georg Wagler":{"hook":"Assistant to Spix and later director of the Zoological Museum in Munich, establishing critical taxonomic frameworks for amphibians and reptiles.","birth":"Nuremberg (Pegnitz River), Germany","town":"Nuremberg","river":"Pegnitz River","country":"Germany","field":"Herpetology & Ornithology"},"Adolphe Brongniart":{"hook":"Widely celebrated as the \"father of paleobotany,\" Brongniart unlocked the secrets of ancient prehistoric plant life by comparing stone fossils to living plants, proving that Earth's vegetation underwent massive changes long before humans existed. He also helped discover how pollen tubes develop in flowering plants!","birth":"Paris, France","town":"Paris","river":null,"country":"France","field":null},"Christian Erich Hermann von Meyer":{"hook":"A German paleontologist who discovered and named the famous fossil bird *Archaeopteryx*, proving a crucial evolutionary link between reptiles and birds!","birth":"Frankfurt, Germany","town":"Frankfurt","river":null,"country":"Germany","field":null},"Edward Newman":{"hook":"Founding member of the Entomological Society of London. He published numerous science magazines and authored highly popular books on British ferns and moths.","birth":"Hampstead (London) (River Thames), England","town":"Hampstead (London)","river":"River Thames","country":"England","field":"Entomology & Botany"},"Félix Dujardin":{"hook":"French zoologist who described single-celled organisms and identified protoplasm, laying vital groundwork for cell theory.","birth":"Tours (Loire River), France","town":"Tours","river":"Loire River","country":"France","field":"Microscopic Biology"},"Johannes Peter Müller":{"hook":"Considered one of the founders of modern physiology, he made immense contributions to the understanding of the nervous system and the biology of marine invertebrates.","birth":"Koblenz (Rhine River), Germany","town":"Koblenz","river":"Rhine River","country":"Germany","field":"Physiology & Marine Biology"},"Alcide d'Orbigny":{"hook":"At just 24 years old, d'Orbigny set off on an eight-year trek across South America, collecting thousands of plant and animal species and mapping unexplored regions. He was also a pioneer in studying microscopic fossil shells called *foraminifera*, proving that microscopic life tells gigantic stories about Earth's history.","birth":"Couëron, France","town":"Couëron","river":null,"country":"France","field":null},"Johann Moritz Rugendas":{"hook":"Traveled extensively throughout Latin America, documenting the people, flora, and landscapes with an artistic flair that heavily influenced European perceptions of the New World.","birth":"Augsburg (Lech River), Germany","town":"Augsburg","river":"Lech River","country":"Germany","field":"Scientific Illustration"},"Robert Chambers":{"hook":"Secretly published an anonymous runaway bestseller (*Vestiges of Creation*) that introduced the public to evolutionary ideas 15 years before Charles Darwin published *Origin of Species*!","birth":"Peebles (River Tweed), Scotland","town":"Peebles","river":"River Tweed","country":"Scotland","field":"Evolutionary Science & Publishing"},"Charles Lucien Bonaparte":{"hook":"Napoleon Bonaparte's nephew who became a world-class ornithologist, naming many American birds and writing major field guides on bird classification.","birth":"Paris, France","town":"Paris","river":null,"country":"France","field":null},"Constantin Wilhelm Lambert Gloger":{"hook":"Discovered \"Gloger's Rule\"—a fundamental ecological law proving that warm-blooded animals in warm, humid regions adapt by producing darker skin and feather pigments than cold-climate relatives!","birth":"Kaszyce (Oder River), Poland","town":"Kaszyce","river":"Oder River","country":"Poland","field":"Evolutionary Biology & Zoology"},"Miles Joseph Berkeley":{"hook":"He was the ultimate fungus detective! He literally solved the mystery of the catastrophic Irish Potato Famine by proving a creepy microscopic water-mold was destroying all the crops!","birth":"Benefield (River Nene), England","town":"Benefield","river":"River Nene","country":"England","field":"Mycology & Plant Pathology"},"Sarah Anne Drake":{"hook":"A brilliant English illustrator who created over 1,000 hyper-detailed, stunning paintings of exotic tropical orchids shipped in from rain forests all over the globe!","birth":"Skeyton (River Bure), England","town":"Skeyton","river":"River Bure","country":"England","field":"Botanical Illustration"},"Elizabeth Gould":{"hook":"Outstanding artist who produced more than 600 exquisite lithographs for her husband John Gould's bird books and Charles Darwin's *Zoology of the Voyage of H.M.S. Beagle*.","birth":"Ramsgate (River Stour), England","town":"Ramsgate","river":"River Stour","country":"England","field":"Zoological Illustration"},"Hermann Schlegel":{"hook":"Director of the Leiden Museum who oversaw immense global collections, systematically describing scores of new birds, snakes, and amphibians.","birth":"Altenburg (Pleiße River), Germany","town":"Altenburg","river":"Pleiße River","country":"Germany","field":"Ornithology & Herpetology"},"John Gould":{"hook":"The \"Bird Man\" of his time. He published monumental folio volumes of bird illustrations and identified the \"Darwin's finches\" that helped spark the theory of evolution.","birth":"Lyme Regis (River Lim), England","town":"Lyme Regis","river":"River Lim","country":"England","field":"Ornithology"},"Karl Theodor Ernst von Siebold":{"hook":"He figured out that some living things are made of just ONE single cell (protozoa) and spent his career hunting down bizarre, tiny parasites living inside other animals!","birth":"Würzburg (Main River), Germany","town":"Würzburg","river":"Main River","country":"Germany","field":"Zoology & Parasitology"},"Matthias Jakob Schleiden":{"hook":"A grumpy lawyer turned botanist who looked under a microscope and made the mind-blowing discovery that EVERY single plant is built entirely out of microscopic living blocks called cells!","birth":"Hamburg (Elbe River), Germany","town":"Hamburg","river":"Elbe River","country":"Germany","field":"Botany & Cell Theory"},"Richard Owen":{"hook":"He literally invented the word \"DINOSAUR\" (\"Terrible Lizard\") in 1842! He was a brilliant scientist who went on to create London's iconic Natural History Museum.","birth":"Lancaster (River Lune), England","town":"Lancaster","river":"River Lune","country":"England","field":"Paleontology & Comparative Anatomy"},"Stephan Endlicher":{"hook":"Designed a major new system of plant classification and officially named the genus for the gigantic, towering Coast Redwood tree (*Sequoia*)!","birth":"Pressburg (Bratislava (Danube River), Slovakia)","town":"Pressburg (Bratislava","river":"Danube River","country":"Slovakia)","field":"Botany & Linguistics"},"Anna Maria Hussey":{"hook":"A mushroom-hunting enthusiast who wrote witty, energetic guidebooks about fungi. She didn't just illustrate mushrooms with incredible precision; she also wrote hilarious warnings about which wild mushrooms would make you sick versus which ones tasted delicious in a stew.","birth":"Leek, England","town":"Leek","river":null,"country":"England","field":null},"Elizabeth Twining":{"hook":"English botanical artist and philanthropist best known for her beautiful two-volume masterwork *Illustrations of the Natural Orders of Plants*.","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Botanical Illustration"},"Frederick Smith":{"hook":"British entomologist at the Natural History Museum, London, renowned for his extensive classification and cataloging of Hymenoptera (ants, bees, and wasps).","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Entomology"},"Hugo von Mohl":{"hook":"Pioneering plant anatomist who coined the term \"protoplasm\" and crucially advanced the scientific understanding of cell division in plants.","birth":"Stuttgart (Neckar River), Germany","town":"Stuttgart","river":"Neckar River","country":"Germany","field":"Botany"},"Isidore Geoffroy Saint-Hilaire":{"hook":"Coined the term \"ethology\" (animal behavior), founded the Acclimatization Society, and performed early research on anatomical anomalies (teratology).","birth":"Paris (Seine River), France","town":"Paris","river":"Seine River","country":"France","field":"Zoology"},"John Obadiah Westwood":{"hook":"The first Hope Professor of Zoology at Oxford. He was a spectacular illustrator and one of the most prolific entomological writers of the Victorian era.","birth":"Sheffield (River Don), England","town":"Sheffield","river":"River Don","country":"England","field":"Entomology"},"Michael Sars":{"hook":"A priest who spent his free time dredging the freezing, pitch-black depths of the Norwegian fjords, proving that creepy, alien-like life forms actually lived at the bottom of the deep ocean!","birth":"Bergen (Byfjorden / Vågen), Norway","town":"Bergen","river":"Byfjorden / Vågen","country":"Norway","field":"Marine Biology"},"Alphonse de Candolle":{"hook":"De Candolle wanted to know *why* plants grow where they do. He mapped global plant geography, figured out where key crop plants originally came from, and created the international rulebook that scientists still use today to name new plant species.","birth":"Paris, France","town":"Paris","river":null,"country":"France","field":null},"Anne Pratt":{"hook":"Pratt was a self-taught Victorian artist who couldn't play outdoor sports due to health issues, so she spent her childhood drawing plants. She went on to write and illustrate over 20 popular plant books, using bright colors to make science accessible to millions of everyday readers.","birth":"Strood, England","town":"Strood","river":null,"country":"England","field":null},"Friedrich Welwitsch":{"hook":"Austrian botanist best known for discovering the unique desert plant *Welwitschia mirabilis* in Angola.","birth":"Maria Saal (Glan River), Austria","town":"Maria Saal","river":"Glan River","country":"Austria","field":"Botany"},"William Chapman Hewitson":{"hook":"A wealthy collector and artist who published thousands of exquisite, hand-colored prints of tropical butterflies, building one of the greatest butterfly collections in history!","birth":"Newcastle upon Tyne (River Tyne), England","town":"Newcastle upon Tyne","river":"River Tyne","country":"England","field":"Entomology & Illustration"},"Benjamin Waterhouse Hawkins":{"hook":"The sculptor who created the world's very first life-sized dinosaur statues for London's Crystal Palace park, even holding a famous dinner party inside a hollowed-out Iguanodon model before it was finished!","birth":"London, England","town":"London","river":null,"country":"England","field":null},"Hermann Burmeister":{"hook":"German-Argentine naturalist who revolutionized paleontology and zoology in South America, directing the national museum in Buenos Aires.","birth":"Stralsund (Strelasund (Strait)), Germany","town":"Stralsund","river":"Strelasund (Strait)","country":"Germany","field":"Zoology & Entomology"},"Hermann Loew":{"hook":"World’s foremost expert on Diptera (true flies) during the 19th century, meticulously classifying thousands of species across Europe and North America.","birth":"Weissenfels (Saale River), Germany","town":"Weissenfels","river":"Saale River","country":"Germany","field":"Entomology"},"Jane Loudon":{"hook":"Created highly popular, accessible gardening manuals that broke through academic barriers and democratized horticulture for Victorian women.","birth":"Edgbaston (River Rea), England","town":"Edgbaston","river":"River Rea","country":"England","field":"Botany & Horticultural Writing"},"Louis Agassiz":{"hook":"He looked at giant scratched rocks and realized the whole Earth used to be frozen solid under massive glaciers, blowing everyone's mind with the radical idea of \"Ice Ages\"!","birth":"Môtier (Lake Murten), Switzerland","town":"Môtier","river":"Lake Murten","country":"Switzerland","field":"Glaciology & Paleontology"},"Camillo Rondani":{"hook":"An Italian entomologist who devoted his life to studying flies (Diptera), discovering how two-winged insects play vital roles in agriculture and controlling crop pests.","birth":"Parma, Italy","town":"Parma","river":null,"country":"Italy","field":null},"Hugh Falconer":{"hook":"Uncovered incredible fossil mammal deposits in the Siwalik Hills of India and was instrumental in establishing the Indian tea industry.","birth":"Forres (River Findhorn), Scotland","town":"Forres","river":"River Findhorn","country":"Scotland","field":"Paleontology & Botany"},"Achille Guenée":{"hook":"A brilliant entomologist who dedicated his life to classifying thousands of species of moths, writing the ultimate global guides for night-flying insects. By day he practiced law, but by night his heart belonged entirely to butterflies and moths—even protecting his precious insect collections when his hometown burned during war!","birth":"Chartres, France","town":"Chartres","river":null,"country":"France","field":null},"Asa Fitch":{"hook":"America's first officially appointed professional entomologist, Fitch spent years investigating farm pests and showing farmers how insects affected crops, pioneering the field of economic entomology.","birth":"Salem, New York, USA","town":"Salem","river":null,"country":"New York, USA","field":null},"Charles Darwin":{"hook":"Proposed the theory of evolution by **natural selection**, explaining how traits change over generations as organisms adapt to survive, fundamentally changing biology forever.","birth":"Shrewsbury, England","town":"Shrewsbury","river":null,"country":"England","field":null},"Francis Walker":{"hook":"English entomologist at the British Museum noted for cataloging immense numbers of insect species, despite controversies over his rapid taxonomic methods.","birth":"Southgate (River Lea), England","town":"Southgate","river":"River Lea","country":"England","field":"Entomology"},"Franz Wilhelm Junghuhn":{"hook":"Often called the \"Humboldt of Java,\" this explorer mapped Indonesia's volcanoes and fundamentally linked the region's plant life to its varying altitudes.","birth":"Mansfeld (Böse Sieben River), Germany","town":"Mansfeld","river":"Böse Sieben River","country":"Germany","field":"Botany & Geology"},"Friedrich August Quenstedt":{"hook":"Leading German geologist noted for detailed stratigraphical and paleontological studies of the Jurassic geology of Swabia.","birth":"Eisleben (Böse Sieben River), Germany","town":"Eisleben","river":"Böse Sieben River","country":"Germany","field":"Geology & Paleontology"},"Karl Bodmer":{"hook":"Traveled deep up the wild Missouri River in the 1830s! He painted some of the most insanely detailed, legendary portraits of Native American chiefs and warriors ever recorded.","birth":"Zurich (Limmat River), Switzerland","town":"Zurich","river":"Limmat River","country":"Switzerland","field":"Illustration & Ethnography"},"Oswald Heer":{"hook":"Looked at leaf fossils dug up from the freezing Arctic ice and proved a mind-bending truth: millions of years ago, the freezing North Pole was actually a hot, steamy tropical jungle!","birth":"Niederutzwil (Thur River), Switzerland","town":"Niederutzwil","river":"Thur River","country":"Switzerland","field":"Paleobotany"},"Wilhelm Ferdinand Erichson":{"hook":"Master beetle detective at the Berlin Museum who systematically named and organized thousands of bug species sent in from expeditions around the world!","birth":"Stralsund (Strelasund (Baltic Sea)), Germany","town":"Stralsund","river":"Strelasund (Baltic Sea)","country":"Germany","field":"Entomology"},"Asa Gray":{"hook":"Considered the most important American botanist of the 19th century, Gray unified North American plant classification and served as Charles Darwin's chief advocate and ally in the United States.","birth":"Sauquoit, New York, USA","town":"Sauquoit","river":null,"country":"New York, USA","field":null},"Edward Blyth":{"hook":"English zoologist and pioneer of Indian ornithology. As curator of the Asiatic Society of Bengal, his meticulous work heavily influenced Charles Darwin.","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Zoology & Ornithology"},"Edward Doubleday":{"hook":"English entomologist celebrated for his pivotal, exquisitely illustrated work on butterflies, *The Genera of Diurnal Lepidoptera*.","birth":"Epping (River Roding), England","town":"Epping","river":"River Roding","country":"England","field":"Entomology"},"Francis Orpen Morris":{"hook":"Irish-born clergyman whose highly accessible, beautifully illustrated books on British birds and butterflies became Victorian-era bestsellers.","birth":"Cobh (River Lee), Ireland","town":"Cobh","river":"River Lee","country":"Ireland","field":"Ornithology & Entomology"},"Philip Henry Gosse":{"hook":"He invented the world's very first public indoor seawater aquarium at the London Zoo! He single-handedly started the massive craze of keeping colorful sea anemones and fish inside glass tanks!","birth":"Worcester (River Severn), England","town":"Worcester","river":"River Severn","country":"England","field":"Marine Biology"},"Pierre Edmond Boissier":{"hook":"Explored remote mountains from Spain all the way across the Middle East, publishing a massive 5-volume encyclopedia containing descriptions of over 12,000 desert and alpine plants!","birth":"Geneva (Rhône River), Switzerland","town":"Geneva","river":"Rhône River","country":"Switzerland","field":"Botany"},"Theodor Schwann":{"hook":"Co-founded Cell Theory! He proved that all living animal tissues are composed of microscopic cells, discovered the nerve Schwann cells, and isolated the digestive enzyme pepsin!","birth":"Neuss (Rhine River), Germany","town":"Neuss","river":"Rhine River","country":"Germany","field":"Physiology & Cell Biology"},"William Griffith":{"hook":"A fearless botanical explorer who trekked across India, Myanmar, and Afghanistan under brutal conditions, collecting over 12,000 plant species for science before tragically dying young!","birth":"Ham (London) (River Thames), England","town":"Ham (London)","river":"River Thames","country":"England","field":"Botany & Field Exploration"},"Isaac Sprague":{"hook":"The premier American botanical artist of his era, working closely alongside legends like Asa Gray and John James Audubon.","birth":"Hingham (Weir River), USA","town":"Hingham","river":"Weir River","country":"USA","field":"Botanical Illustration"},"Thomas C. Jerdon":{"hook":"A British surgeon in India who mapped out hundreds of Indian birds, mammals, and reptiles, identifying dozens of new species including the rare Jerdon's Courser!","birth":"Durham (River Wear), England","town":"Durham","river":"River Wear","country":"England","field":"Zoology & Ornithology"},"William Henry Harvey":{"hook":"The ultimate marine algae hunter! He traveled across South Africa, Australia, and the Pacific islands, collecting, naming, and classifying thousands of colorful ocean seaweeds.","birth":"Limerick (River Shannon), Ireland","town":"Limerick","river":"River Shannon","country":"Ireland","field":"Phycology (Seaweed Studies)"},"Edward Lear":{"hook":"Before finding fame as a nonsense poet, he was a masterful natural history artist whose *Illustrations of the Family of Psittacidae, or Parrots* revolutionized bird illustration.","birth":"Holloway (London) (River Thames), England","town":"Holloway (London)","river":"River Thames","country":"England","field":"Zoological Illustration & Literature"},"Robert Fortune":{"hook":"A real-life plant spy! He disguised himself as a local merchant to sneak forbidden tea plants and secrets out of China and into India, altering global trade and tea culture forever!","birth":"Kelloe (Blackadder Water), Scotland","town":"Kelloe","river":"Blackadder Water","country":"Scotland","field":"Botany & Botanical Espionage"},"David Livingstone":{"hook":"Fearless Scottish explorer and physician who mapped vast uncharted African river systems, named Victoria Falls, recorded countless wild animals, and fought passionately to end the slave trade!","birth":"Blantyre (River Clyde), Scotland","town":"Blantyre","river":"River Clyde","country":"Scotland","field":"Geographic Exploration & Natural History"},"James Dwight Dana":{"hook":"A towering figure in American science who authored the standard *System of Mineralogy* and fundamentally explained coral reef formations.","birth":"Utica (Mohawk River), USA","town":"Utica","river":"Mohawk River","country":"USA","field":"Geology & Mineralogy"},"Japetus Steenstrup":{"hook":"Danish biologist who changed the understanding of reproduction by discovering the phenomenon of \"alternation of generations\" in animal groups.","birth":"Vang (Limfjord), Denmark","town":"Vang","river":"Limfjord","country":"Denmark","field":"Zoology"},"John Cassin":{"hook":"A giant in 19th-century American ornithology. He named nearly 200 bird species and curated the vast collections of the Philadelphia Academy of Natural Sciences.","birth":"Upper Providence (Schuylkill River), USA","town":"Upper Providence","river":"Schuylkill River","country":"USA","field":"Ornithology"},"August Grisebach":{"hook":"A pioneer in plant geography who mapped global vegetation zones based on climate, laying early foundations for ecological studies on how environment shapes plant life.","birth":"Hanover, Germany","town":"Hanover","river":null,"country":"Germany","field":null},"Carl Bergmann":{"hook":"Formulated \"Bergmann's Rule,\" discovering that warm-blooded animal species living in cold climates tend to be larger than their relatives living in hot climates to conserve body heat!","birth":"Göttingen, Germany","town":"Göttingen","river":null,"country":"Germany","field":null},"Gustav Hartlaub":{"hook":"German physician and ornithologist who specialized in cataloging bird species from Africa and Oceania, co-authoring important taxonomic guides.","birth":"Bremen (Weser River), Germany","town":"Bremen","river":"Weser River","country":"Germany","field":"Ornithology"},"Heinrich Gätke":{"hook":"Naturalist based on the island of Heligoland who conducted pioneer long-term studies on bird migration patterns and weather relationships.","birth":"Pritzwalk (Dömnitz River), Germany","town":"Pritzwalk","river":"Dömnitz River","country":"Germany","field":"Ornithology"},"Thomas Mayo Brewer":{"hook":"A leading American bird expert who specialized in studying bird nests and eggs, co-authoring classic landmark volumes on North American bird life!","birth":"Boston (Charles River), USA","town":"Boston","river":"Charles River","country":"USA","field":"Ornithology & Oology"},"Jean Cabanis":{"hook":"Founded the prestigious *Journal für Ornithologie*, cementing Germany's role in bird science through the world's longest-running ornithological journal.","birth":"Berlin (Spree River), Germany","town":"Berlin","river":"Spree River","country":"Germany","field":"Ornithology"},"Paul Gervais":{"hook":"A serious fossil hunter! He pieced together the bizarre bones of extinct giant mammals and helped humanity realize just how weird prehistoric Earth actually looked.","birth":"Paris (Seine River), France","town":"Paris","river":"Seine River","country":"France","field":"Paleontology"},"Albert von Kölliker":{"hook":"Kölliker spent his life peering through early microscopes and made game-changing discoveries: he proved that eggs and sperm are individual cells and was among the first to spot mitochondria (the \"powerhouses of the cell\") inside muscle tissue!","birth":"Zürich, Switzerland","town":"Zürich","river":null,"country":"Switzerland","field":null},"Berthe Hoola van Nooten":{"hook":"A botanical illustrator who traveled to Java and produced a magnificent, celebrated book of illustrations featuring the wild tropical fruits and flowers of the East Indies.","birth":"Utrecht, Netherlands","town":"Utrecht","river":null,"country":"Netherlands","field":null},"Hermann August Hagen":{"hook":"Leading expert on Neuroptera (net-winged insects) and the very first professor of entomology at a university in the United States (Harvard).","birth":"Königsberg (Pregel River), Germany","town":"Königsberg","river":"Pregel River","country":"Germany","field":"Entomology"},"Joseph Dalton Hooker":{"hook":"One of the greatest British botanists of all time. He explored the Himalayas, succeeded his father as director of Kew Gardens, and was Charles Darwin's closest confidant.","birth":"Halesworth (River Blyth), England","town":"Halesworth","river":"River Blyth","country":"England","field":"Botany & Exploration"},"Richard Spruce":{"hook":"Spent 15 brutal years mapping the Amazon basin! He collected seeds of the Cinchona tree, allowing doctors to cultivate quinine on a large scale to treat and save millions from malaria!","birth":"Ganthorpe (River Derwent), England","town":"Ganthorpe","river":"River Derwent","country":"England","field":"Botany & Amazonian Exploration"},"Walter Hood Fitch":{"hook":"One of the most prolific scientific artists in human history! He created over 10,000 hyper-detailed lithographs of exotic plants—including giant Amazon water lilies—for Kew Gardens!","birth":"Glasgow (River Clyde), Scotland","town":"Glasgow","river":"River Clyde","country":"Scotland","field":"Botanical Art"},"Pieter Bleeker":{"hook":"A Dutch army surgeon in Indonesia who amassed over 12,000 fish specimens and created a legendary 3,000-illustration atlas detailing the underwater world of Indo-Pacific marine life!","birth":"Zaandam (Zaan River), Netherlands","town":"Zaandam","river":"Zaan River","country":"Netherlands","field":"Ichthyology (Fish)"},"Alfred Riocreux":{"hook":"Before cameras could capture crisp close-ups, scientists relied on artists like Riocreux to see microscopic plant anatomy. His botanical drawings were so flawlessly accurate and detailed that master botanists around the world refused to publish their research unless Riocreux drew the illustrations.","birth":"Sèvres, France","town":"Sèvres","river":null,"country":"France","field":null},"Herbert Spencer":{"hook":"Integrated evolutionary theory across philosophy and sociology, coining the famous phrase \"survival of the fittest.\"","birth":"Derby (River Derwent), England","town":"Derby","river":"River Derwent","country":"England","field":"Philosophy, Biology & Sociology"},"Joseph Wolf":{"hook":"Revered as the absolute master of animal painting in the Victorian era, combining rigorous scientific exactness with extraordinary, lifelike artistic vitality.","birth":"Mörz (Moselle River), Germany","town":"Mörz","river":"Moselle River","country":"Germany","field":"Zoological Illustration"},"Henry Constantine Richter":{"hook":"Produced some of the most stunning and scientifically accurate lithographs for John Gould's highly influential bird and mammal folios.","birth":"Brompton (London) (River Thames), England","town":"Brompton (London)","river":"River Thames","country":"England","field":"Zoological Illustration"},"John MacGillivray":{"hook":"Scottish naturalist who served on several major Royal Navy survey voyages, collecting vital biological and ethnographic data across the Pacific and Australia.","birth":"Aberdeen (River Dee), Scotland","town":"Aberdeen","river":"River Dee","country":"Scotland","field":"Natural History & Exploration"},"Fritz Mueller":{"hook":"Provided early field evidence supporting Darwin’s theory. Known for identifying Müllerian mimicry in butterflies.","birth":"Windischholzhausen (Gera River), Germany","town":"Windischholzhausen","river":"Gera River","country":"Germany","field":"Evolutionary Biology"},"Fritz Müller":{"hook":"Provided early field evidence supporting Darwin’s theory. Known for identifying Müllerian mimicry in butterflies.","birth":"Windischholzhausen (Gera River), Germany","town":"Windischholzhausen","river":"Gera River","country":"Germany","field":"Evolutionary Biology"},"Gregor Mendel":{"hook":"\"Father of Modern Genetics.\" Uncovered the fundamental laws of inheritance through disciplined breeding experiments with pea plants.","birth":"Heinzendorf (Oder River), Czech Republic","town":"Heinzendorf","river":"Oder River","country":"Czech Republic","field":"Genetics & Botany"},"Henry Tibbats Stainton":{"hook":"Specialized in Microlepidoptera (small moths) and edited *The Entomologist's Weekly Intelligencer*, fostering a vibrant community of amateur scientists.","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Entomology"},"Rudolf Leuckart":{"hook":"The \"Father of Parasitology\"! Unraveled the horrifying, complex lifecycles of parasitic tapeworms and roundworms, helping doctors save countless human and animal lives!","birth":"Helmstedt (Aller River (nearby)), Germany","town":"Helmstedt","river":"Aller River (nearby)","country":"Germany","field":"Parasitology & Zoology"},"Thomas Vernon Wollaston":{"hook":"An obsessive beetle hunter who collected thousands of unique insect species across remote Atlantic islands like Madeira and the Canaries, revealing how island species evolve over time!","birth":"Scotter (River Trent), England","town":"Scotter","river":"River Trent","country":"England","field":"Entomology & Island Biology"},"William Henry Edwards":{"hook":"The premier American butterfly authority of the 19th century! He authored the 3-volume masterwork *Butterflies of North America* and discovered that butterflies change color depending on the season!","birth":"Hunter (Schoharie Creek), USA","town":"Hunter","river":"Schoharie Creek","country":"USA","field":"Entomology"},"Alfred Russel Wallace":{"hook":"Wallace co-discovered the theory of evolution alongside Charles Darwin, but his journey was pure survival against the odds. He survived a ship fire that destroyed all his specimens, survived malaria in tropical jungles, and mapped the line in Indonesia where Asian wildlife ends and Australian wildlife begins (now called the *Wallace Line*).","birth":"Usk, Wales","town":"Usk","river":null,"country":"Wales","field":null},"Jean-Henri Fabre":{"hook":"The \"Poet of Science.\" Famed for his exceptionally well-written, observational books on the complex, dramatic lives of living insects in the wild.","birth":"Saint-Léons (Muze River), France","town":"Saint-Léons","river":"Muze River","country":"France","field":"Entomology"},"Joseph Leidy":{"hook":"The \"Father of American Vertebrate Paleontology.\" He described the first relatively complete dinosaur skeleton (*Hadrosaurus*) and made massive leaps in parasitology.","birth":"Philadelphia (Delaware River), USA","town":"Philadelphia","river":"Delaware River","country":"USA","field":"Paleontology & Parasitology"},"Spencer Fullerton Baird":{"hook":"The second Secretary of the Smithsonian Institution! He personally amassed giant natural history collections and mapped out North American fish, birds, and mammals.","birth":"Reading (Schuylkill River), USA","town":"Reading","river":"Schuylkill River","country":"USA","field":"Zoology & Ichthyology"},"Carl Gustaf Thomson":{"hook":"A Swedish entomologist who spent decades at Lund University systematically naming tens of thousands of Scandinavian beetles, flies, and parasitic wasps.","birth":"Mellan-Grevie, Sweden","town":"Mellan-Grevie","river":null,"country":"Sweden","field":null},"Wilhelm Hofmeister":{"hook":"A self-taught genius who discovered the \"alternation of generations\" in plants, proving that simple mosses, ferns, and giant trees all share a single deep evolutionary lineage!","birth":"Leipzig (White Elster River), Germany","town":"Leipzig","river":"White Elster River","country":"Germany","field":"Plant Genetics & Anatomy"},"Berthold Carl Seemann":{"hook":"A globe-trotting botanist who explored the Pacific, Fiji, and Central America, identifying hundreds of new plants while editing major international botany magazines.","birth":"Hanover, Germany","town":"Hanover","river":null,"country":"Germany","field":null},"Ferdinand von Mueller":{"hook":"German-Australian botanist who served as the first Government Botanist of Victoria, establishing the National Herbarium and discovering thousands of Australian plants.","birth":"Rostock (Warnow River), Germany","town":"Rostock","river":"Warnow River","country":"Germany","field":"Botany"},"Henry Walter Bates":{"hook":"Explored the Amazon alongside Alfred Russel Wallace. Formulated the concept of *Batesian mimicry*, providing early concrete proof of natural selection.","birth":"Leicester (River Soar), England","town":"Leicester","river":"River Soar","country":"England","field":"Evolutionary Biology & Entomology"},"Karl Möbius":{"hook":"By studying oyster beds, he realized all the plants and animals in an area secretly rely on each other to survive. He basically invented the entire modern concept of an \"ecosystem\"!","birth":"Eilenburg (Mulde River), Germany","town":"Eilenburg","river":"Mulde River","country":"Germany","field":"Ecology & Marine Biology"},"Thomas Henry Huxley":{"hook":"Nicknamed \"Darwin's Bulldog\" for fiercely defending evolution! He coined the term \"agnostic\" and was among the first to prove that modern birds evolved from dinosaurs.","birth":"Ealing (London) (River Thames), England","town":"Ealing (London)","river":"River Thames","country":"England","field":"Evolutionary Biology & Anatomy"},"Armand David":{"hook":"A French missionary and naturalist in China who introduced Western science to both the Giant Panda and Père David's Deer, shipping thousands of preserved plants and animals back to museums in Europe.","birth":"Espelette, France","town":"Espelette","river":null,"country":"France","field":null},"Carl Gegenbaur":{"hook":"A pioneer of comparative anatomy who proved that comparing the skeleton structures of different animals reveals their shared evolutionary history.","birth":"Würzburg, Germany","town":"Würzburg","river":null,"country":"Germany","field":null},"Henri Mouhot":{"hook":"French naturalist and explorer famous for \"discovering\" the ancient ruins of Angkor Wat for the West while documenting the flora and fauna of Indochina.","birth":"Montbéliard (Allan River), France","town":"Montbéliard","river":"Allan River","country":"France","field":"Exploration & Natural History"},"Sereno Watson":{"hook":"Trekking across rugged, uncharted mountain ranges and deserts on the 40th Parallel Survey, he cataloged hundreds of brand-new wild western American plants.","birth":"East Windsor (Connecticut River), USA","town":"East Windsor","river":"Connecticut River","country":"USA","field":"Botany"},"Albert Gaudry":{"hook":"Long before *Jurassic Park*, Gaudry was digging up fossilized bone beds in Greece and showing the world how prehistoric animals changed over time. He was one of the very first paleontologists to construct visual \"evolutionary trees\" showing how ancient multi-toed mammals gradually transformed into modern horses.","birth":"Saint-Germain-en-Laye, France","town":"Saint-Germain-en-Laye","river":null,"country":"France","field":null},"Carl Johann Maximovich":{"hook":"A Russian botanist who traveled extensively in Amur, Manchuria, and Japan, introducing Western science to hundreds of East Asian plant species.","birth":"Tula, Russia","town":"Tula","river":null,"country":"Russia","field":null},"St. George Jackson Mivart":{"hook":"A brilliant biologist who famously challenged Charles Darwin's theories by questioning how intermediate evolutionary structures (like half-formed wings) could provide survival value!","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Comparative Anatomy & Biology"},"Carl Robert Osten-Sacken":{"hook":"A Russian diplomat and entomologist who lived in America, meticulously studying and classifying North American diptera (true flies) and crane flies.","birth":"St. Petersburg, Russia","town":"St. Petersburg","river":null,"country":"Russia","field":null},"Eleanor Ormerod":{"hook":"Pioneering agricultural scientist whose self-published reports on insect pests laid the foundation for modern pest control and crop protection in Britain.","birth":"Sedbury (River Severn), England","town":"Sedbury","river":"River Severn","country":"England","field":"Economic Entomology"},"Alfred Brehm":{"hook":"Brehm traveled through African deserts and Siberian tundras to study animals, but what made him famous was his storytelling. He wrote *Brehm's Animal Life*, a book series that described animal behavior with so much personality and drama that it made zoology a massive pop-culture hit across Europe.","birth":"Renthendorf, Germany","town":"Renthendorf","river":null,"country":"Germany","field":null},"Alfred Newton":{"hook":"Newton was a bird fanatic who realized early on that humans were pushing animals to the brink. Horrified by the extinction of the Great Auk and the Dodo, he used his position as a Cambridge professor to crusade for the world's very first wild bird protection laws.","birth":"Geneva, Switzerland","town":"Geneva","river":null,"country":"Switzerland","field":null},"Allan Octavian Hume":{"hook":"A British official in India with a double life: by day, he collected over 80,000 bird specimens (the largest collection of Asian birds ever made), and later, he helped found the Indian National Congress to support Indian self-rule.","birth":"St Mary Cray, England","town":"St Mary Cray","river":null,"country":"England","field":null},"Hermann Müller":{"hook":"Provided critical field evidence for Darwin's theories by intensely studying how flowers and pollinating insects co-evolved together.","birth":"Mühlberg (Apfelstädt River), Germany","town":"Mühlberg","river":"Apfelstädt River","country":"Germany","field":"Botany & Evolutionary Biology"},"Philip Lutley Sclater":{"hook":"Divided the whole world map into 6 giant zoological zones that scientists still use today, while personally identifying and naming over 2,000 different species of birds!","birth":"Wootton St Lawrence (River Loddon), England","town":"Wootton St Lawrence","river":"River Loddon","country":"England","field":"Zoology & Ornithology"},"Albert Günther":{"hook":"As the head zoologist at the British Museum, Günther was the ultimate cataloger of marine life, personally describing over 68,000 fish specimens! If a weird creature was pulled from the ocean depths in the 19th century, it almost certainly landed on his desk first.","birth":"Esslingen, Germany","town":"Esslingen","river":null,"country":"Germany","field":null},"Charles Wyville Thomson":{"hook":"Chief scientist on the famous *Challenger* expedition, leading a global voyage that proved life exists in the deepest parts of the oceans, founding modern oceanography.","birth":"Bonsyde, Scotland","town":"Bonsyde","river":null,"country":"Scotland","field":null},"Gustav Mayr":{"hook":"Austrian specialist in Hymenoptera who contributed immensely to the scientific classification of ants, gall wasps, and parasitic wasps worldwide.","birth":"Vienna (Danube River), Austria","town":"Vienna","river":"Danube River","country":"Austria","field":"Entomology"},"Harriet Scott":{"hook":"Prominent 19th-century Australian illustrator who, alongside her sister, illustrated landmark publications on native moths and mammals.","birth":"Sydney (Parramatta River), Australia","town":"Sydney","river":"Parramatta River","country":"Australia","field":"Natural History Illustration"},"Marianne North":{"hook":"A fearless solo traveler who trekked through jungles on almost every continent in the 1800s, painting over 800 incredibly vivid pictures of the world's most alien-looking plants!","birth":"Hastings (English Channel (Coastal)), England","town":"Hastings","river":"English Channel (Coastal)","country":"England","field":"Botanical Art & Exploration"},"Otto Staudinger":{"hook":"Ran the world's absolute biggest bug-selling empire! Jungle explorers shipped him millions of rare, massive butterflies, which he then sold to obsessed collectors all over the globe!","birth":"Groß Wüstenfelde (Peene River (nearby)), Germany","town":"Groß Wüstenfelde","river":"Peene River (nearby)","country":"Germany","field":"Entomology"},"Albert Oppel":{"hook":"Oppel realized that scientists could use fossilized spiral shells called ammonites as a \"time stamp\" for rock layers. By mapping these fossils, he proved that you could figure out the exact relative age of a rock layer anywhere in Europe, revolutionizing geology before he tragically passed away at just 34.","birth":"Hohenheim, Germany","town":"Hohenheim","river":null,"country":"Germany","field":null},"Anton de Bary":{"hook":"Known as the \"father of plant pathology,\" De Bary solved the mystery of the Irish Potato Famine by proving a fungus-like organism caused it. He also coined the term symbiosis to describe how totally different organisms live together in nature!","birth":"Frankfurt, Germany","town":"Frankfurt","river":null,"country":"Germany","field":null},"Othniel Charles Marsh":{"hook":"Discovered Stegosaurus and Triceratops while fighting the infamous \"Bone Wars\"—a literal, ruthless rivalry where dinosaur hunters blew up each other's fossil sites with dynamite!","birth":"Lockport (Erie Canal), USA","town":"Lockport","river":"Erie Canal","country":"USA","field":"Paleontology"},"William Henry Flower":{"hook":"Director of London’s Natural History Museum who revolutionized museum design! He introduced public interactive exhibits and organized massive, iconic whale skeletal displays.","birth":"Stratford-upon-Avon (River Avon), England","town":"Stratford-upon-Avon","river":"River Avon","country":"England","field":"Comparative Anatomy & Museum Science"},"Henry Seebohm":{"hook":"English steel manufacturer who became a leading expert on bird eggs and migration, embarking on massive expeditions to the Siberian tundra.","birth":"Bradford (River Aire), England","town":"Bradford","river":"River Aire","country":"England","field":"Ornithology"},"Julius von Sachs":{"hook":"Founder of modern plant physiology. He proved that starch is produced in chloroplasts during photosynthesis and standardized rigorous experimental methods in botany.","birth":"Breslau (Oder River), Prussia (Poland)","town":"Breslau","river":"Oder River","country":"Prussia (Poland)","field":"Botany"},"Thomas Belt":{"hook":"A mining engineer in Central America who made amazing discoveries about tropical ecology, including how Acacia trees feed and house stinging ant armies to protect themselves!","birth":"Newcastle upon Tyne (River Tyne), England","town":"Newcastle upon Tyne","river":"River Tyne","country":"England","field":"Geology & Natural History"},"August Weismann":{"hook":"Weismann proposed the \"germ plasm theory,\" proving that inherited traits are passed down solely through reproductive cells (eggs and sperm), debunking the myth that traits acquired during life can be inherited!","birth":"Frankfurt, Germany","town":"Frankfurt","river":null,"country":"Germany","field":null},"Ernst Haeckel":{"hook":"Discovered thousands of species, mapped a genealogical tree relating all life forms, and influenced both science and design with his stunning *Art Forms in Nature*.","birth":"Potsdam (Havel River), Germany","town":"Potsdam","river":"Havel River","country":"Germany","field":"Zoology & Biological Art"},"Frederick DuCane Godman":{"hook":"Co-authored and edited the massive 63-volume *Biologia Centrali-Americana*, an essential encyclopedia documenting the flora and fauna of Central America.","birth":"Park Hatch (River Wey), England","town":"Park Hatch","river":"River Wey","country":"England","field":"Entomology, Ornithology & Natural History"},"John Lubbock":{"hook":"Neighbor and close ally to Charles Darwin. He invented the terms \"Paleolithic\" and \"Neolithic\" and conducted pioneering behavioral research on ants and bees.","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Biology & Archaeology"},"Daniel Giraud Elliot":{"hook":"Co-founded the American Ornithologists' Union and published breathtaking life-sized, hand-colored art books depicting exotic pheasants, wild cats, and magnificent birds-of-paradise!","birth":"New York City (Hudson River), USA","town":"New York City","river":"Hudson River","country":"USA","field":"Ornithology & Scientific Illustration"},"Osbert Salvin":{"hook":"Ventured deep into snake-filled Central American rainforests and co-authored a massive, mind-boggling 63-volume encyclopedia covering almost every wild jungle creature there!","birth":"Finchley (London) (Dollis Brook), England","town":"Finchley (London)","river":"Dollis Brook","country":"England","field":"Ornithology & Entomology"},"Tommaso Salvadori":{"hook":"A brilliant Italian bird specialist who cataloged and classified over 20,000 exotic bird specimens gathered from the uncharted tropical forests of New Guinea and Australia!","birth":"Porto San Giorgio (Ete Vivo River), Italy","town":"Porto San Giorgio","river":"Ete Vivo River","country":"Italy","field":"Ornithology"},"Worthington George Smith":{"hook":"A famous fungal illustrator and cave detective who mapped out deadly poisonous mushrooms, fought crop diseases, and unspotted ancient prehistoric stone axes hidden in the soil!","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Mycology & Archaeology"},"Georg Schweinfurth":{"hook":"Explored central and northern Africa, documenting regional flora and contributing significantly to European botanical knowledge of Africa.","birth":"Riga (Daugava River), Latvia","town":"Riga","river":"Daugava River","country":"Latvia","field":"Botany & Exploration"},"Herman Strecker":{"hook":"American stone sculptor who amassed one of the largest private butterfly and moth collections in history, personally illustrating his scientific catalogs.","birth":"Philadelphia (Delaware River), USA","town":"Philadelphia","river":"Delaware River","country":"USA","field":"Entomology & Sculpture"},"Robert McLachlan":{"hook":"The world’s top expert on net-winged insects! He spent his life catching, classifying, and mapping thousands of dragonflies, lacewings, and caddisflies across Europe.","birth":"Ongar (River Roding), England","town":"Ongar","river":"River Roding","country":"England","field":"Entomology"},"Samuel Hubbard Scudder":{"hook":"America’s supreme insect authority of his era! He described thousands of living butterflies and grasshoppers alongside fossilized giant insects trapped in prehistoric rock.","birth":"Boston (Charles River), USA","town":"Boston","river":"Charles River","country":"USA","field":"Entomology & Paleontology"},"William Boyd Dawkins":{"hook":"Dug through ancient British caves to prove that prehistoric humans lived side-by-side with wild woolly mammoths, cave hyenas, and sabertooth cats right in ancient Britain!","birth":"Buttington (River Severn), Wales","town":"Buttington","river":"River Severn","country":"Wales","field":"Cave Geology & Archaeology"},"Henry Eeles Dresser":{"hook":"Authored the monumental multi-volume *A History of the Birds of Europe*, a definitive work compiling exhaustive research on avian species.","birth":"Thirsk (Cod Beck), England","town":"Thirsk","river":"Cod Beck","country":"England","field":"Ornithology"},"Harry Govier Seeley":{"hook":"British paleontologist who classified dinosaurs into two fundamental groups based on pelvic structure: *Saurischia* and *Ornithischia*.","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Paleontology"},"Nikolai Przhevalsky":{"hook":"A fearless Russian adventurer who mapped the most dangerous, uncharted deserts of Central Asia and famously discovered the very last species of truly wild horse on Earth!","birth":"Kimborovo (Dnieper River (nearby)), Russia","town":"Kimborovo","river":"Dnieper River (nearby)","country":"Russia","field":"Exploration"},"Otto Finsch":{"hook":"Explored the wildest islands of the Pacific Ocean! He described tons of crazy, neon-colored tropical birds, and was so legendary they even named a town in New Guinea after him!","birth":"Warmbrunn (Kamienna River), Prussia (Poland)","town":"Warmbrunn","river":"Kamienna River","country":"Prussia (Poland)","field":"Ethnography & Ornithology"},"Alexander Kovalevsky":{"hook":"Kovalevsky unlocked a major secret of evolution by looking at squishy sea squirt larvae under a microscope. He discovered that these brainless marine blobs actually have a precursor to a backbone (*notochord*) when they're young, proving that invertebrates and backboned animals like humans share ancient ancestors!","birth":"Daugavpils, Latvia","town":"Daugavpils","river":null,"country":"Latvia","field":null},"Anton Dohrn":{"hook":"Dohrn founded the world-famous Stazione Zoologica in Naples, Italy, creating an open ocean laboratory where scientists from all over the world could come to study living marine creatures right at the seashore.","birth":"Stettin, Prussia (now Szczecin, Poland)","town":"Stettin","river":null,"country":"Prussia (now Szczecin, Poland)","field":null},"David Sharp":{"hook":"One of Britain's greatest beetle authorities who named over 3,000 insect species and wrote the monumental two-volume *Insects* treatise that educated generations of bug lovers!","birth":"Towcester (River Tove), England","town":"Towcester","river":"River Tove","country":"England","field":"Entomology & Beetle Studies"},"Edward Drinker Cope":{"hook":"Fierce American paleontologist
