 and central figure of the \"Bone Wars,\" who named over 1,000 vertebrate species and helped discover America's most famous dinosaurs.","birth":"Philadelphia (Delaware River), USA","town":"Philadelphia","river":"Delaware River","country":"USA","field":"Paleontology & Herpetology"},"Otto Wilhelm Thomé":{"hook":"Created an illustrated botanical encyclopedia so incredibly gorgeous and detailed that it became the absolute go-to guide for learning about Germany's wild plants for over a century!","birth":"Cologne (Rhine River), Germany","town":"Cologne","river":"Rhine River","country":"Germany","field":"Botany & Illustration"},"Roland Trimen":{"hook":"Studied South African butterflies and proved Charles Darwin’s theory of evolution by showing how harmless butterflies mimic poisonous ones to trick hungry predators!","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Entomology & Evolutionary Biology"},"Augustus Radcliffe Grote":{"hook":"An entomologist who moved to the United States and spent his life naming and classifying thousands of North American moth species, building massive insect collections.","birth":"Aigburth, England","town":"Aigburth","river":null,"country":"England","field":null},"Eugenius Warming":{"hook":"Danish botanist and a founding figure of ecology. He wrote the very first textbook on plant ecology, fundamentally shifting botany from taxonomy to ecosystems.","birth":"Mandø (Wadden Sea), Denmark","town":"Mandø","river":"Wadden Sea","country":"Denmark","field":"Botany & Ecology"},"John Murray":{"hook":"Considered the father of modern oceanography. He played a massive role in the groundbreaking Challenger Expedition and the subsequent charting of the deep sea.","birth":"Cobourg (Lake Ontario), Canada","town":"Cobourg","river":"Lake Ontario","country":"Canada","field":"Oceanography & Marine Biology"},"Luigi Maria D'Albertis":{"hook":"An eccentric explorer who sailed a tiny steamship up the uncharted, deadly rivers of New Guinea, blasting fireworks to scare attackers while hunting for rare Birds of Paradise!","birth":"Voltri (Leira River), Italy","town":"Voltri","river":"Leira River","country":"Italy","field":"Exploration"},"Elliott Coues":{"hook":"Highly influential American ornithologist, army surgeon, and co-founder of the American Ornithologists' Union, famous for his *Key to North American Birds*.","birth":"Portsmouth (Piscataqua River), USA","town":"Portsmouth","river":"Piscataqua River","country":"USA","field":"Ornithology"},"John Gerrard Keulemans":{"hook":"The most sought-after bird illustrator of the late 19th century, producing thousands of lithographs for the era’s most important ornithological works.","birth":"Rotterdam (Nieuwe Maas), Netherlands","town":"Rotterdam","river":"Nieuwe Maas","country":"Netherlands","field":"Zoological Illustration"},"Vladimir Kovalevsky":{"hook":"Pioneered evolutionary fossil studies by analyzing ancient skeletal limbs to prove step-by-step how modern single-toed horses evolved from tiny, four-toed prehistoric ancestors!","birth":"Vārkava (Daugava River), Latvia","town":"Vārkava","river":"Daugava River","country":"Latvia","field":"Evolutionary Paleontology"},"Charles Valentine Riley":{"hook":"Pioneered biological pest control by importing predatory ladybug beetles to save California's citrus industry from devastating scale insect infestations!","birth":"London, England","town":"London","river":null,"country":"England","field":null},"Odoardo Beccari":{"hook":"Hacked his way through the deadly, steamy jungles of Borneo and discovered the legendary Titan Arum—the world's largest flower, which smells exactly like a rotting zombie corpse!","birth":"Florence (Arno River), Italy","town":"Florence","river":"Arno River","country":"Italy","field":"Botany & Exploration"},"Adolf Engler":{"hook":"Engler created a monumental, comprehensive system for classifying plants—from tiny algae to giant flowering trees—that laid the groundwork for modern herbaria. A true adventurer, he didn’t just stay behind a desk; he traveled to Africa, India, Java, and around the globe to study how plants adapt to different environments firsthand!","birth":"Sagan, Prussia (now Żagań, Poland)","town":"Sagan","river":null,"country":"Prussia (now Żagań, Poland)","field":null},"Élie Metchnikoff":{"hook":"Discovered phagocytes—special white blood cells that devour invading bacteria like microscopic Pac-Man creatures—winning a Nobel Prize for unlocking how our body defends itself!","birth":"Ivanovka (Lopan River), Ukraine","town":"Ivanovka","river":"Lopan River","country":"Ukraine","field":"Immunology & Microbiology"},"Eugene William Oates":{"hook":"English naturalist and civil servant who authored major foundational works cataloging the birds of India, Burma, and their nests and eggs.","birth":"Agrigento (Salso River), Italy","town":"Agrigento","river":"Salso River","country":"Italy","field":"Ornithology"},"William Lucas Distant":{"hook":"The world’s top authority on true bugs and loud tropical cicadas! He traveled through South Africa and South America, describing thousands of bizarre sucking insects for science.","birth":"Rotherhithe (London) (River Thames), England","town":"Rotherhithe (London)","river":"River Thames","country":"England","field":"Entomology"},"Anton Reichenow":{"hook":"Reichenow was an ornithologist who spent decades cataloging African birds, identifying hundreds of new species and helping found the scientific journals that bird researchers still read today.","birth":"Charlottenburg, Germany","town":"Charlottenburg","river":null,"country":"Germany","field":null},"Genevieve Jones":{"hook":"American illustrator known for creating *Illustrations of the Nests and Eggs of Birds of Ohio*, often compared in quality to Audubon's work.","birth":"Circleville (Scioto River), USA","town":"Circleville","river":"Scioto River","country":"USA","field":"Scientific Illustration"},"Richard Bowdler Sharpe":{"hook":"Curated the British Museum's bird department, single-handedly expanding its collection from 35,000 to over 500,000 bird specimens and compiling a colossal 27-volume catalog of birds!","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Ornithology"},"Auguste Forel":{"hook":"A neuroanatomist and ant specialist who made major discoveries about the human brain while simultaneously proving that ants have complex social structures and communication methods.","birth":"Morges, Switzerland","town":"Morges","river":null,"country":"Switzerland","field":null},"Ellis Rowan":{"hook":"Daring Australian artist and explorer who braved remote terrains in Australia and New Guinea to paint previously unrecorded wildflowers and birds.","birth":"Melbourne (Yarra River), Australia","town":"Melbourne","river":"Yarra River","country":"Australia","field":"Botanical Illustration"},"Eugène Simon":{"hook":"Prolific French naturalist who dedicated his life to spiders, describing over 4,000 species and creating the most comprehensive taxonomic framework for arachnids.","birth":"Paris (Seine River), France","town":"Paris","river":"Seine River","country":"France","field":"Arachnology"},"Abbott Handerson Thayer":{"hook":"Known as the \"father of camouflage,\" Thayer was an artist and naturalist who figured out how animals use color patterns (like countershading) to blend seamlessly into their environments, heavily influencing modern military camouflage. Passionate and obsessive about wildlife, he spent his childhood tracking animals in rural New Hampshire and used his fine-art skills to prove how nature acts as a master illusionist.","birth":"Boston, USA","town":"Boston","river":null,"country":"USA","field":null},"John Henry Comstock":{"hook":"American entomologist and Cornell University professor who developed the standardized Comstock-Needham system for naming insect wing veins.","birth":"Janesville (Rock River), USA","town":"Janesville","river":"Rock River","country":"USA","field":"Entomology"},"Richard Lydekker":{"hook":"Mapped out \"Lydekker's Line\"—a sharp boundary line in Indonesia dividing Asian animal species from Australian ones—and named hundreds of fossil mammals, dinosaurs, and reptiles!","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Paleontology & Biogeography"},"Robert Ridgway":{"hook":"The Smithsonian's first official bird curator! He named hundreds of bird species and created a legendary standard color dictionary so scientists could accurately describe exact animal hues.","birth":"Mount Carmel (Wabash River), USA","town":"Mount Carmel","river":"Wabash River","country":"USA","field":"Ornithology & Color Science"},"William Brewster":{"hook":"Co-founded the American Ornithologists' Union! He accumulated a massive private collection of 40,000 North American birds and led crucial early laws to protect wild birds from hunting.","birth":"Wakefield (Saugus River), USA","town":"Wakefield","river":"Saugus River","country":"USA","field":"Ornithology"},"Oscar Drude":{"hook":"He proved that the Earth is covered in distinct global \"plant zones\"—explaining once and for all why you will NEVER find a thorny cactus in the Arctic or a pine tree in the Amazon jungle!","birth":"Braunschweig (Oker River), Germany","town":"Braunschweig","river":"Oker River","country":"Germany","field":"Plant Ecology"},"Anna Botsford Comstock":{"hook":"Comstock believed kids learn science best by getting outside and turning over rocks. She wrote the famous *Handbook of Nature Study*, filled with fun activities and artwork that revolutionized how science was taught in schools across North America.","birth":"Otto, New York, USA","town":"Otto","river":null,"country":"New York, USA","field":null},"Edward Meyrick":{"hook":"English schoolmaster who became the world's leading authority on Microlepidoptera (small moths), incredibly describing over 20,000 species in his lifetime.","birth":"Ramsbury (River Kennet), England","town":"Ramsbury","river":"River Kennet","country":"England","field":"Entomology"},"Florentino Ameghino":{"hook":"Argentine naturalist who amassed one of the largest fossil collections of South American mammals, pioneering the field of paleontology across the continent.","birth":"Luján (Luján River), Argentina","town":"Luján","river":"Luján River","country":"Argentina","field":"Paleontology"},"Matilda Smith":{"hook":"An incredible artist who drew over 10,000 insanely detailed illustrations of plants for Kew Gardens, becoming only the second woman ever to join the prestigious Linnean Society!","birth":"Bombay (Mithi River), India","town":"Bombay","river":"Mithi River","country":"India","field":"Botanical Art"},"Andreas Franz Wilhelm Schimper":{"hook":"If your students know the word \"rainforest,\" they have Schimper to thank—he literally coined the term! He traveled the tropics to figure out how plants adapt to extreme water conditions, from drenched jungle canopies to bone-dry deserts.","birth":"Strasbourg, France","town":"Strasbourg","river":null,"country":"France","field":null},"Edward Bagnall Poulton":{"hook":"British zoologist and fervent early defender of natural selection who pioneered the study of warning coloration, protective mimicry, and camouflage in insects.","birth":"Reading (River Thames), England","town":"Reading","river":"River Thames","country":"England","field":"Evolutionary Biology"},"Louis Dollo":{"hook":"Supervised the assembly of huge, spiky Iguanodon dinosaur skeletons found hundreds of feet deep in a coal mine, and made a law stating that evolution can never go backward!","birth":"Lille (Deûle River), France","town":"Lille","river":"Deûle River","country":"France","field":"Paleontology"},"Eugène Dubois":{"hook":"Dutch anatomist who discovered *Pithecanthropus erectus* (Java Man) in Indonesia, providing the first critical fossil evidence for human evolution outside of Europe.","birth":"Eijsden (Meuse River (Maas)), Netherlands","town":"Eijsden","river":"Meuse River (Maas)","country":"Netherlands","field":"Paleoanthropology"},"Alice Eastwood":{"hook":"Eastwood was a self-taught botanist hero. During the devastating 1906 San Francisco earthquake and fire, while buildings collapsed around her, she climbed the ruined stairs of her museum to rescue over 1,000 irreplaceable, rare plant specimens, saving a century of scientific history!","birth":"Toronto, Canada","town":"Toronto","river":null,"country":"Canada","field":null},"Ernst Hartert":{"hook":"Curator of the legendary Rothschild collection at Tring and author of *Die Vögel der paläarktischen Fauna*, revolutionizing modern bird taxonomy in Europe.","birth":"Hamburg (Elbe River), Germany","town":"Hamburg","river":"Elbe River","country":"Germany","field":"Ornithology"},"Archibald Thorburn":{"hook":"Thorburn was a master wildlife artist whose breathtaking watercolor paintings of British birds in their natural habitats set the standard for field identification long before photography took over.","birth":"Lasswade, Scotland","town":"Lasswade","river":null,"country":"Scotland","field":null},"George Hampson":{"hook":"Specialized in Lepidoptera at the Natural History Museum in London, compiling massive descriptive catalogues of the world's moth species.","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Entomology"},"Fridtjof Nansen":{"hook":"Pioneer of modern neurobiology, Arctic explorer, and Nobel Peace Prize laureate for his later humanitarian work.","birth":"Store Frøen (Akerselva River), Norway","town":"Store Frøen","river":"Akerselva River","country":"Norway","field":"Neuroscience & Polar Exploration"},"William Morton Wheeler":{"hook":"The world's premier ant expert! He unlocked the secrets of ant colony societies, studying how ant colonies function like single mega-organisms with complex division of labor!","birth":"Milwaukee (Milwaukee River), USA","town":"Milwaukee","river":"Milwaukee River","country":"USA","field":"Myrmecology (Ant Science) & Entomology"},"Louis Agassiz Fuertes":{"hook":"Instead of painting dead, stuffed birds on boring branches, he painted them hunting, flying, and fighting, creating the most lifelike, epic bird action-paintings of the 20th century!","birth":"Ithaca (Cayuga Lake), USA","town":"Ithaca","river":"Cayuga Lake","country":"USA","field":"Bird Illustration"}};

function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function sig(f){return LANG==='de'?f.sig_de:LANG==='fr'?f.sig_fr:f.sig_en;}
function wikiURL(n){return 'https://'+LANG+'.wikipedia.org/w/index.php?search='+encodeURIComponent(n);}
function bhlURL(n){return 'https://www.biodiversitylibrary.org/search?searchTerm='+encodeURIComponent(n);}
function archURL(n){return 'https://archive.org/search?query='+encodeURIComponent(n);}
function escAttr(s){return (s||'').replace(/"/g,'&quot;');}

// ---- decoration: people links (themes) + glossary tooltips ----
function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
const NAME_KEYS=Object.keys(NAMEMAP).sort((a,b)=>b.length-a.length);
const NAME_RE=new RegExp('(?<![A-Za-zÀ-ÿ])('+NAME_KEYS.map(reEsc).join('|')+')(?![A-Za-zÀ-ÿ])','g');
const GLOSSES={en:GLOSS,de:GLOSS_DE,fr:GLOSS_FR};
let GCUR={},GLOW={},GRE=null;
function buildGloss(){GCUR=GLOSSES[LANG]||{};GLOW={};Object.keys(GCUR).forEach(k=>GLOW[k.toLowerCase()]=GCUR[k]);
  const keys=Object.keys(GCUR).sort((a,b)=>b.length-a.length);
  GRE=keys.length?new RegExp('(?<![A-Za-zÀ-ÿ])('+keys.map(reEsc).join('|')+')(?![A-Za-zÀ-ÿ])','gi'):null;}
function splitTags(h){return h.split(/(<[^>]+>)/).filter(x=>x!=='');}
function linkPeople(text,seen){
  return text.replace(NAME_RE,function(m){
    const full=NAMEMAP[m]; if(!full) return m;
    if(seen.has(full)) return m; seen.add(full);
    return "<a href='https://en.wikipedia.org/wiki/"+encodeURIComponent(full.replace(/ /g,'_'))+"' target='_blank' rel='noopener'>"+m+"</a>";
  });
}
function glossText(text,seen){
  if(!GRE) return text;
  return text.replace(GRE,function(m){
    const key=m.toLowerCase(); const def=GLOW[key]; if(!def) return m;
    if(seen.has(key)) return m; seen.add(key);
    return "<span class='gloss' data-def='"+escAttr(def)+"' title='"+escAttr(def)+"'>"+m+"</span>";
  });
}
function decorate(html, linkPpl){
  const pSeen=new Set(), gSeen=new Set();
  return html.split(/(<em>[\s\S]*?<\/em>)/g).map(seg=>{
    if(seg.slice(0,4)==='<em>') return seg;      // leave book titles untouched
    let step = linkPpl ? linkPeople(seg,pSeen) : seg;
    return splitTags(step).map(s=> (s&&s[0]==='<')? s : glossText(s,gSeen)).join('');
  }).join('');
}

        var enBio=(C&&C.hook)||(H&&(H.hook||H.desc))||'';
        var enBirth=(C&&C.birth)||(H&&H.birth)||'';
        var bioTxt=(LANG==='de'?(tr.bio_de):LANG==='fr'?(tr.bio_fr):null)||enBio;
        var birthTxt=(LANG==='de'?(tr.birth_de):LANG==='fr'?(tr.birth_fr):null)||enBirth;
        var facts=birthTxt?("<b>"+t.born+":</b> "+esc(birthTxt)):"";
        var ap=H?[H.peak,H.active].filter(Boolean).join(' — '):'';
        if(ap){facts+=(facts?" &nbsp;·&nbsp; ":"")+"<b>"+t.activeLbl+":</b> "+esc(ap);}
        if(!bioTxt&&!facts) return '';
        return "<div class='hero'><p class='herobio'>"+decorate(md(esc(bioTxt)),false)+"</p><p class='herofacts'>"+facts+"</p></div>";})()+
      "<p class='sig'>"+decorate(esc(sig(f)),false)+"</p>"+
      (f.work?"<p class='work'>"+t.work+": "+esc(f.work)+(f.year?" ("+f.year+")":"")+"</p>":"")+
      "<div class='links'><a href='"+wikiURL(f.name)+"' target='_blank' rel='noopener'>"+t.wiki+"</a>"+
        "<a href='"+bhlURL(f.name)+"' target='_blank' rel='noopener'>"+t.bhl+"</a>"+
        "<a href='"+archURL(f.name)+"' target='_blank' rel='noopener'>"+t.arch+"</a></div></div>";
    frag.appendChild(el);
  });
  list.appendChild(frag);
  document.getElementById('count').textContent=t.count(shown,FIGS.length);
}
function renderChips(){
  const t=T[LANG];const c=document.getElementById('chips');
  let h="<button class='fchip"+(activeField===''?' active':'')+"' data-f=''>"+t.all+" ("+FIGS.length+")</button>";
  Object.keys(FIELDS).forEach(k=>{const n=FIGS.filter(f=>f.fields.includes(k)).length;
    h+="<button class='fchip"+(activeField===k?' active':'')+"' data-f='"+k+"'><span class='dot' style='background:"+FIELDS[k].c+"'></span>"+FIELDS[k][LANG]+" ("+n+")</button>";});
  c.innerHTML=h;
  c.querySelectorAll('.fchip').forEach(b=>b.onclick=()=>{activeField=b.dataset.f;renderChips();render();});
}
function renderThemes(){
  document.getElementById('themes').innerHTML=THEMES.map(th=>
    "<div class='theme'><h3>"+esc(th['title_'+LANG])+"</h3><p>"+decorate(th['body_'+LANG],true)+"</p></div>").join('');
}
function renderGloss(){
  const keys=Object.keys(GLOSS).sort((a,b)=>a.localeCompare(b));
  document.getElementById('glossBody').innerHTML=keys.map(k=>"<div class='gterm'><b>"+esc(k)+"</b> — "+esc(GLOSS[k])+"</div>").join('');
}
function setLang(l){
  LANG=l;document.documentElement.lang=l;
  ['De','En','Fr'].forEach(x=>document.getElementById('l'+x).classList.toggle('active',x.toLowerCase()===l));
  const t=T[l];
  document.getElementById('h1').textContent=t.h1;
  document.getElementById('sub').textContent=t.sub;
  document.getElementById('intro').textContent=t.intro;
  document.getElementById('tabIdeas').textContent=t.secThemes;
  document.getElementById('tabPeople').textContent=t.secPeople;
  document.getElementById('glossSummary').textContent=t.glossSummary;
  document.getElementById('search').placeholder=t.searchPh;
  document.getElementById('footer').textContent=t.footer;
  buildGloss();
  renderThemes();renderChips();render();
}
function showSec(which){
  const ideas=(which==='ideas');
  document.getElementById('ideasSec').hidden=!ideas;
  document.getElementById('peopleSec').hidden=ideas;
  document.getElementById('tabIdeas').classList.toggle('active',ideas);
  document.getElementById('tabPeople').classList.toggle('active',!ideas);
}
document.getElementById('tabIdeas').onclick=()=>showSec('ideas');
document.getElementById('tabPeople').onclick=()=>showSec('people');
showSec('people');
renderGloss();
document.getElementById('search').addEventListener('input',render);
document.getElementById('lDe').onclick=()=>setLang('de');
document.getElementById('lEn').onclick=()=>setLang('en');
document.getElementById('lFr').onclick=()=>setLang('fr');
setLang('en');
</script>
</body>
</html>
