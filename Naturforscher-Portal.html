sheim (Nidda), Deutschland","birth_fr":"Wölfersheim (la Nidda), Allemagne"},"John Ray":{"name":"John Ray","bio_de":"Wird oft als Vater der englischen Naturgeschichte bezeichnet. Lange vor Linnaeus führte er das Konzept der biologischen „Art\" als grundlegende Einheit der Klassifikation ein.","bio_fr":"Souvent appelé le père de l'histoire naturelle anglaise. Bien avant Linnaeus, il a introduit le concept d'« espèce » biologique comme unité fondamentale de la classification.","birth_de":"Black Notley (Brain), England","birth_fr":"Black Notley (la Brain), Angleterre"},"Marcello Malpighi":{"name":"Marcello Malpighi","bio_de":"Einer der ersten Menschen überhaupt, der Haut und Lungen unter dem Mikroskop betrachtete – und bewies, dass winzige versteckte Röhrchen (Kapillaren) unsere Blutgefäße miteinander verbinden!","bio_fr":"L'un des premiers humains à observer la peau et les poumons au microscope, prouvant que de minuscules tubes cachés (les capillaires) relient nos vaisseaux sanguins entre eux !","birth_de":"Crevalcore (Panaro), Italien","birth_fr":"Crevalcore (le Panaro), Italie"},"Jan Commelin":{"name":"Jan Commelin","bio_de":"Die treibende Kraft hinter dem berühmten Hortus Botanicus Amsterdam. Er war ein Wegbereiter für den massenhaften Import und die Zucht exotischer Pflanzen in Europa.","bio_fr":"La force motrice derrière le célèbre Hortus Botanicus Amsterdam, il fut un pionnier de l'importation et de la culture à grande échelle de plantes exotiques en Europe.","birth_de":"Leiden (Oude Rijn), Niederlande","birth_fr":"Leiden (Oude Rijn), Pays-Bas"},"Antonie van Leeuwenhoek":{"name":"Antonie van Leeuwenhoek","bio_de":"Bekannt als „Vater der Mikrobiologie\": In seiner Freizeit baute Leeuwenhoek superstarke Mikroskope mit nur einer Linse und wurde so zum ersten Menschen, der lebende Bakterien und mikroskopisch kleine Zellen sah – er nannte sie „Tierchen\" (animalcules)!","bio_fr":"Surnommé le « père de la microbiologie », Leeuwenhoek fabriquait pendant son temps libre des microscopes à lentille unique incroyablement puissants. Il devint ainsi le premier humain à voir des bactéries vivantes et des cellules microscopiques, qu'il appelait des « animalcules » !","birth_de":"Delft, Niederlande","birth_fr":"Delft, Pays-Bas"},"Francis Willughby":{"name":"Francis Willughby","bio_de":"Ein bahnbrechender englischer Wissenschaftler, der zusammen mit John Ray mythische Legenden über Bord warf, um eine moderne, strukturierte wissenschaftliche Einteilung für Vögel und Fische zu schaffen.","bio_fr":"Un scientifique anglais pionnier qui, aux côtés de John Ray, a écarté les légendes mythiques pour établir une classification scientifique moderne et structurée des oiseaux et des poissons.","birth_de":"Middleton (Tame), England","birth_fr":"Middleton (la Tame), Angleterre"},"Hendrik van Rheede":{"name":"Hendrik van Rheede","bio_de":"Ein niederländischer Kolonialverwalter, der *Hortus Malabaricus* zusammenstellte – ein wegweisendes zwölfbändiges Werk über die Heil- und Nutzpflanzen Indiens.","bio_fr":"Un administrateur colonial néerlandais qui a compilé *Hortus Malabaricus*, un traité majeur en douze volumes sur les plantes médicinales et utiles de l'Inde.","birth_de":"Amsterdam (Amstel), Niederlande","birth_fr":"Amsterdam (l'Amstel), Pays-Bas"},"Jan Swammerdam":{"name":"Jan Swammerdam","bio_de":"Ein genialer Pionier des Mikroskops, der bewies, dass Insekten feste Entwicklungsstadien durchlaufen (Metamorphose) und nicht einfach aus dem Nichts entstehen.","bio_fr":"Un brillant pionnier du microscope qui a prouvé que les insectes passent par des stades de vie bien définis (la métamorphose) au lieu d'apparaître spontanément.","birth_de":"Amsterdam (Amstel), Niederlande","birth_fr":"Amsterdam (l'Amstel), Pays-Bas"},"Filippo Bonanni":{"name":"Filippo Bonanni","bio_de":"Ein italienischer Jesuitengelehrter, der das erste Buch schrieb, das sich ganz den Meeresmuscheln widmete (*Recreatio mentis et oculi*), und damit den Grundstein für die Malakologie legte.","bio_fr":"Un savant jésuite italien qui a écrit le premier livre entièrement consacré aux coquillages (*Recreatio mentis et oculi*), posant les fondations de la malacologie.","birth_de":"Rome (Tiber), Italien","birth_fr":"Rome (le Tibre), Italie"},"Pierre Magnol":{"name":"Pierre Magnol","bio_de":"Er kam auf die revolutionäre Idee, Pflanzen anhand gemeinsamer Merkmale in eigene „Familien\" einzuteilen. Der prächtige, duftende Magnolienbaum wurde ihm zu Ehren benannt!","bio_fr":"Il a eu l'idée révolutionnaire de regrouper les plantes en « familles » distinctes selon leurs traits communs. Le magnifique magnolia parfumé a été nommé en son honneur !","birth_de":"Montpellier (Lez), Frankreich","birth_fr":"Montpellier (le Lez), France"},"Martin Lister":{"name":"Martin Lister","bio_de":"Während alle dachten, seltsame spiralförmige Steine seien einfach nur hübsche Felsbrocken, erkannte er, dass es in Wirklichkeit die versteinerten Schalen uralter, ausgestorbener Meerestiere waren!","bio_fr":"Alors que tout le monde pensait que ces étranges pierres en spirale n'étaient que de jolis cailloux, il a compris qu'il s'agissait en réalité des coquilles fossilisées d'anciennes créatures marines disparues !","birth_de":"Radclive (Great Ouse), England","birth_fr":"Radclive (la Great Ouse), Angleterre"},"Nehemiah Grew":{"name":"Nehemiah Grew","bio_de":"Er starrte im 17. Jahrhundert tief in sein einfaches Mikroskop und verblüffte die Welt mit der Entdeckung, dass Pflanzen tatsächlich männliche und weibliche Teile besitzen und sich mithilfe von Pollen fortpflanzen!","bio_fr":"Penché sur son microscope rudimentaire au XVIIe siècle, il a stupéfié le monde en découvrant que les plantes possèdent bel et bien des parties mâles et femelles et se reproduisent grâce au pollen !","birth_de":"Mancetter (Anker), England","birth_fr":"Mancetter (l'Anker), Angleterre"},"Isaac Newton":{"name":"Isaac Newton","bio_de":"Er formulierte die Bewegungsgesetze und das Gesetz der allgemeinen Gravitation und wurde damit zur Schlüsselfigur der Wissenschaftlichen Revolution.","bio_fr":"Il a formulé les lois du mouvement et de la gravitation universelle, devenant la figure centrale de la révolution scientifique.","birth_de":"Woolsthorpe (Witham), England","birth_fr":"Woolsthorpe (la Witham), Angleterre"},"Leonard Plukenet":{"name":"Leonard Plukenet","bio_de":"Er war der persönliche Botaniker von Königin Maria II.! Ohne sein Zuhause je wirklich zu verlassen, baute er ein gewaltiges „Pflanzenreich\" auf, indem er sich von Forschern über 8.000 exotische Pflanzen aus aller Welt schicken ließ.","bio_fr":"Il était le botaniste personnel de la reine Marie II ! Sans jamais vraiment quitter sa maison, il a bâti un immense « empire végétal » en se faisant envoyer plus de 8 000 plantes exotiques du monde entier par des explorateurs.","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"Charles Plumier":{"name":"Charles Plumier","bio_de":"Ein Franziskanermönch und Botaniker, der drei Reisen zu den Westindischen Inseln unternahm und berühmte Pflanzengattungen wie *Begonia*, *Fuchsia* und *Lobelia* nach befreundeten Wissenschaftlern benannte.","bio_fr":"Un moine franciscain et botaniste qui a effectué trois voyages aux Antilles, donnant à de célèbres genres de plantes comme *Begonia*, *Fuchsia* et *Lobelia* le nom de collègues scientifiques.","birth_de":"Marseille, Frankreich","birth_fr":"Marseille, France"},"Gottfried Wilhelm Leibniz":{"name":"Gottfried Wilhelm Leibniz","bio_de":"Ein Universalgelehrter, der die Infinitesimalrechnung mitbegründete, Beiträge zur frühen Physik und Geologie leistete und Theorien über das Wesen der Substanz entwickelte.","bio_fr":"Un génie universel qui a co-inventé le calcul infinitésimal, contribué aux débuts de la physique et de la géologie, et développé des théories sur la nature de la substance.","birth_de":"Leipzig (Weiße Elster), Deutschland","birth_fr":"Leipzig (White Elster), Allemagne"},"Paul Hermann":{"name":"Paul Hermann","bio_de":"Er segelte als Schiffsarzt bis nach Ceylon (dem heutigen Sri Lanka), nur um völlig unbekannte, exotische Pflanzen zu sammeln – und wurde so zu einem der größten Botanik-Superstars Europas.","bio_fr":"Il a navigué jusqu'à Ceylan (l'actuel Sri Lanka) comme médecin de bord, juste pour récolter des plantes exotiques totalement inconnues, devenant l'une des plus grandes stars de la botanique en Europe.","birth_de":"Halle (Saale), Deutschland","birth_fr":"Halle (la Saale), Allemagne"},"Maria Sibylla Merian":{"name":"Maria Sibylla Merian","bio_de":"Eine absolute Legende, die 1699 in die Dschungel Südamerikas segelte, *nur* um riesige Vogelspinnen zu malen, die Vögel fressen, und gewaltige Raupen, die sich in prächtige Schmetterlinge verwandeln!","bio_fr":"Une véritable légende qui a navigué jusqu'aux jungles d'Amérique du Sud en 1699, *juste* pour peindre des mygales géantes dévorant des oiseaux et d'énormes chenilles se transformant en superbes papillons !","birth_de":"Frankfurt (Main), Deutschland","birth_fr":"Frankfurt (le Main), Allemagne"},"Engelbert Kaempfer":{"name":"Engelbert Kaempfer","bio_de":"Ein deutscher Arzt, dessen ausführliche Reisen im 17. Jahrhundert die asiatische Pflanzenwelt – darunter den Ginkgobaum – in die europäische Wissenschaft einführten.","bio_fr":"Un médecin allemand dont les voyages détaillés au XVIIe siècle ont fait découvrir la flore asiatique – dont le ginkgo – à la science européenne.","birth_de":"Lemgo (Bega), Deutschland","birth_fr":"Lemgo (la Bega), Allemagne"},"William Dampier":{"name":"William Dampier","bio_de":"Pirat, Kapitän und Naturforscher! Er war der erste Mensch, der dreimal die Welt umsegelte, und machte dabei akribische Notizen über exotische tropische Tiere, Pflanzen und Meeresströmungen!","bio_fr":"Pirate, capitaine et naturaliste ! Il fut le premier à faire trois fois le tour du monde en bateau, prenant des notes méticuleuses sur les animaux tropicaux exotiques, les plantes et les courants marins !","birth_de":"East Coker (Yeo), England","birth_fr":"East Coker (la Yeo), Angleterre"},"Joseph Pitton de Tournefort":{"name":"Joseph Pitton de Tournefort","bio_de":"Ein französischer Botaniker, der ein sehr einflussreiches System zur Pflanzeneinteilung schuf und – besonders wichtig – erstmals das Konzept der „Gattung\" definierte.","bio_fr":"Un botaniste français qui a créé un système de classification des plantes très influent et, fait important, a défini pour la première fois le concept de « genre ».","birth_de":"Aix-en-Provence (Arc), Frankreich","birth_fr":"Aix-en-Provence (l'Arc), France"},"Hans Sloane":{"name":"Hans Sloane","bio_de":"Ein Arzt, dessen riesige private Sammlung von Pflanzen, Tieren und Altertümern den Grundstock für die Gründung des British Museum bildete.","bio_fr":"Un médecin dont l'immense collection personnelle de plantes, d'animaux et d'antiquités a constitué le noyau fondateur du British Museum.","birth_de":"Killyleagh (Quoile), Nordirland","birth_fr":"Killyleagh (la Quoile), Irlande du Nord"},"Olof Rudbeck the Younger":{"name":"Olof Rudbeck the Younger","bio_de":"Er erkundete den eisigen, unberührten Polarkreis, um die bizarren Pflanzen Lapplands zu kartieren, und stürzte sich dann heldenhaft in die Rettung seines Lebenswerks, als ein gewaltiges Feuer seine Stadt niederbrannte!","bio_fr":"Il a exploré le cercle polaire glacial et intact pour cartographier les plantes étranges de Laponie, puis s'est précipité héroïquement pour sauver l'œuvre de sa vie lorsqu'un gigantesque incendie a ravagé sa ville !","birth_de":"Uppsala (Fyris), Schweden","birth_fr":"Uppsala (la Fyris), Suède"},"Albertus Seba":{"name":"Albertus Seba","bio_de":"Seba war ein Apotheker, der das ultimative „Kuriositätenkabinett\" des 18. Jahrhunderts führte: Er sammelte exotische Schlangen, konservierte Meerestiere und bizarre Insekten von Seeleuten, die in Amsterdam anlegten. All das stellte er in einem riesigen, herrlich illustrierten Buch zusammen, das zum berühmtesten Naturgeschichts-Bilderbuch seiner Zeit wurde.","bio_fr":"Seba était un apothicaire qui tenait le plus incroyable « cabinet de curiosités » du XVIIIe siècle : il collectionnait des serpents exotiques, des créatures marines conservées et des insectes étranges auprès des marins accostant à Amsterdam. Il rassembla le tout dans un livre gigantesque et magnifiquement illustré, qui devint le plus célèbre livre d'images d'histoire naturelle de son époque.","birth_de":"Etzel, Deutschland","birth_fr":"Etzel, Allemagne"},"Claude Aubriet":{"name":"Claude Aubriet","bio_de":"Ein französischer Meister der botanischen Illustration, der Expeditionen durch den Nahen Osten begleitete und dabei ultrapräzise, wunderschöne Aquarelle wilder Pflanzen schuf, die die Pflanzenkunst des 18. Jahrhunderts prägten!","bio_fr":"Un maître français de l'illustration botanique qui a accompagné des expéditions à travers le Moyen-Orient, réalisant des aquarelles d'une extrême précision et d'une grande beauté de la flore sauvage, qui ont marqué l'art végétal du XVIIIe siècle !","birth_de":"Châlons-en-Champagne (Marne), Frankreich","birth_fr":"Châlons-en-Champagne (la Marne), France"},"James Petiver":{"name":"James Petiver","bio_de":"Ein früher Londoner Apotheker, der Handelsschiffe nutzte, um ein riesiges weltumspannendes Museum aufzubauen, und wichtige Exemplare für John Ray aufbewahrte.","bio_fr":"Un apothicaire londonien des débuts qui a profité des navires marchands pour bâtir un immense musée mondial, conservant des spécimens essentiels pour John Ray.","birth_de":"Hillmorton (Avon), England","birth_fr":"Hillmorton (l'Avon), Angleterre"},"Rudolf Jakob Camerarius":{"name":"Rudolf Jakob Camerarius","bio_de":"Er schockierte 1694 die Wissenschaftswelt, indem er experimentell bewies, dass Pflanzen sich geschlechtlich fortpflanzen – der Pollen aus den männlichen Staubblättern befruchtet dabei die weiblichen Samenorgane!","bio_fr":"Il a stupéfié la communauté scientifique en 1694 en prouvant par l'expérience que les plantes se reproduisent de façon sexuée, le pollen des étamines mâles fécondant les organes femelles porteurs de graines !","birth_de":"Tübingen (Neckar), Deutschland","birth_fr":"Tübingen (le Neckar), Allemagne"},"Herman Boerhaave":{"name":"Herman Boerhaave","bio_de":"Ein Pionier des klinischen Unterrichts am Krankenbett. Er machte Leiden zur medizinischen Hauptstadt Europas und erweiterte dessen botanische Gärten enorm.","bio_fr":"Un pionnier de l'enseignement clinique au chevet des malades. Il a fait de Leiden la capitale médicale de l'Europe et a considérablement agrandi ses jardins botaniques.","birth_de":"Voorhout (Oude Rijn), Niederlande","birth_fr":"Voorhout (Oude Rijn), Pays-Bas"},"Sébastien Vaillant":{"name":"Sébastien Vaillant","bio_de":"Er hielt in Paris einen bahnbrechenden Vortrag, in dem er bewies, dass Staubblätter und Stempel von Blüten Fortpflanzungsorgane sind – und inspirierte damit Linnaeus zu seinem revolutionären System der Pflanzenbenennung!","bio_fr":"Il a donné à Paris une conférence révolutionnaire prouvant que les étamines et les pistils des fleurs sont des organes reproducteurs, inspirant à Linnaeus son système révolutionnaire de dénomination des plantes !","birth_de":"Vigny (Viosne), Frankreich","birth_fr":"Vigny (la Viosne), France"},"Stephen Hales":{"name":"Stephen Hales","bio_de":"Der erste Mensch, der den Saftdruck in Pflanzen und den Blutdruck in Tieren maß! Er bewies, dass Pflanzen Luft aufnehmen und Wasser ununterbrochen durch ihre Stängel nach oben steigt.","bio_fr":"La première personne à mesurer la pression de la sève dans les plantes et la pression sanguine chez les animaux ! Il a prouvé que les plantes absorbent l'air et que l'eau monte en continu le long de leurs tiges.","birth_de":"Bekesbourne (Stour), England","birth_fr":"Bekesbourne (la Stour), Angleterre"},"Pier Antonio Micheli":{"name":"Pier Antonio Micheli","bio_de":"Der „Vater der modernen Mykologie\"! Er bewies, dass Pilze nicht einfach aus dem Nichts auftauchen – als erster Mensch beobachtete er unter der Lupe, wie mikroskopisch kleine Pilzsporen keimten!","bio_fr":"Le « père de la mycologie moderne » ! Il a prouvé que les champignons n'apparaissent pas spontanément à partir de rien : il fut le premier à observer sous une loupe des spores de champignons microscopiques en train de germer !","birth_de":"Florence (Arno), Italien","birth_fr":"Florence (l'Arno), Italie"},"Mark Catesby":{"name":"Mark Catesby","bio_de":"Er trotzte Piraten und Wirbelstürmen, um im 18. Jahrhundert Nordamerika zu erkunden, und zeichnete das allererste vollständige, epische Buch über amerikanische Vögel, Schlangen, Frösche und Pflanzen!","bio_fr":"Il a bravé les pirates et les ouragans pour explorer l'Amérique du Nord au XVIIIe siècle, dessinant le tout premier livre complet et épique sur les oiseaux, serpents, grenouilles et plantes d'Amérique !","birth_de":"Castle Hedingham (Colne), England","birth_fr":"Castle Hedingham (la Colne), Angleterre"},"René Antoine Ferchault de Réaumur":{"name":"René Antoine Ferchault de Réaumur","bio_de":"Er erfand eine Temperaturskala und schrieb ein gewaltiges sechsbändiges Insekten-Meisterwerk, das bewies, dass Ameisen miteinander kommunizieren und Bienen in komplexen sozialen Königreichen zusammenarbeiten!","bio_fr":"Il a inventé une échelle de température et écrit un immense chef-d'œuvre en six volumes sur les insectes, prouvant que les fourmis communiquent et que les abeilles travaillent ensemble dans de complexes royaumes sociaux !","birth_de":"La Rochelle (Atlantik (Küste)), Frankreich","birth_fr":"La Rochelle (océan Atlantique (côte)), France"},"Johann Jacob Dillenius":{"name":"Johann Jacob Dillenius","bio_de":"Der erste Sherardianische Professor für Botanik in Oxford, bekannt für sein meisterhaftes, herrlich illustriertes Werk über Moose und niedere Pflanzen, *Historia Muscorum*.","bio_fr":"Le premier professeur sherardien de botanique à Oxford, connu pour son œuvre magistrale et superbement illustrée sur les mousses et les plantes inférieures, *Historia Muscorum*.","birth_de":"Darmstadt (Darmbach), Deutschland","birth_fr":"Darmstadt (le Darmbach), Allemagne"},"Cadwallader Colden":{"name":"Cadwallader Colden","bio_de":"Einer der ersten europäisch-amerikanischen Wissenschaftler, der Linnaeus' System der Pflanzenbenennung in Nordamerika übernahm und die einheimische Pflanzenwelt des kolonialen New York akribisch katalogisierte.","bio_fr":"L'un des premiers scientifiques euro-américains à adopter le système de dénomination des plantes de Linnaeus en Amérique du Nord, cataloguant méticuleusement la flore indigène du New York colonial.","birth_de":"Duns, Schottland","birth_fr":"Duns, Écosse"},"Philip Miller":{"name":"Philip Miller","bio_de":"Der Meistergärtner des Chelsea Physic Garden! Er verschiffte die allerersten Baumwollsamen in die amerikanische Kolonie Georgia und brachte den Europäern bei, wie man geheimnisvolle tropische Tomaten sicher anbaut und isst!","bio_fr":"Le maître jardinier du Chelsea Physic Garden ! Il a expédié les toutes premières graines de coton vers la colonie américaine de Georgia et a appris aux Européens à cultiver et à manger sans danger les mystérieuses tomates tropicales !","birth_de":"Deptford (London) (Themse), England","birth_fr":"Deptford (London) (la Tamise), Angleterre"},"George Edwards":{"name":"George Edwards","bio_de":"Bekannt als „Vater der britischen Ornithologie\", veröffentlichte er Werke, die Hunderte zuvor unbeschriebener Vogelarten abbildeten.","bio_fr":"Surnommé le « père de l'ornithologie britannique », il a publié des ouvrages illustrant des centaines d'espèces d'oiseaux jusque-là inconnues.","birth_de":"Stratford (Lea), England","birth_fr":"Stratford (la Lea), Angleterre"},"Bernard de Jussieu":{"name":"Bernard de Jussieu","bio_de":"Ein französischer Botaniker, der den Königlichen Garten von Trianon gestaltete, indem er lebende Pflanzen nach körperlichen Verwandtschaften in natürliche Familien einteilte – statt nach willkürlichen Listen.","bio_fr":"Un botaniste français qui a organisé le Jardin royal de Trianon en regroupant les plantes vivantes en familles naturelles selon leurs liens physiques plutôt que selon des listes arbitraires.","birth_de":"Lyon, Frankreich","birth_fr":"Lyon, France"},"John Bartram":{"name":"John Bartram","bio_de":"Bekannt als „Vater der amerikanischen Botanik\". Er gründete den ältesten noch erhaltenen botanischen Garten Nordamerikas und schickte unermüdlich Samen an begeisterte europäische Wissenschaftler zurück.","bio_fr":"Surnommé le « père de la botanique américaine ». Il a fondé le plus ancien jardin botanique encore existant d'Amérique du Nord et n'a cessé d'envoyer des graines à des scientifiques européens enthousiastes.","birth_de":"Darby (Delaware), USA","birth_fr":"Darby (le Delaware), États-Unis"},"Charles Marie de La Condamine":{"name":"Charles Marie de La Condamine","bio_de":"Ein Forschungsreisender, der die Form der Erde am Äquator vermaß und Naturkautschuk (Gummi) sowie Chinin (ein Mittel gegen Malaria) aus Südamerika nach Europa brachte.","bio_fr":"Un explorateur qui a mesuré la forme de la Terre à l'équateur et a introduit en Europe le caoutchouc naturel et la quinine (un remède contre le paludisme) venus d'Amérique du Sud.","birth_de":"Paris, Frankreich","birth_fr":"Paris, France"},"Madeleine Françoise Basseporte":{"name":"Madeleine Françoise Basseporte","bio_de":"Eine absolut wegweisende Künstlerin, die zur offiziellen Malerin des Königs von Frankreich wurde, hochgenaue wissenschaftliche Pflanzenbilder malte und den königlichen Prinzessinnen das Zeichnen beibrachte!","bio_fr":"Une artiste totalement pionnière qui devint la peintre officielle du roi de France, peignant des plantes scientifiques d'une extrême précision et apprenant à dessiner aux princesses royales !","birth_de":"Paris (Seine), Frankreich","birth_fr":"Paris (la Seine), France"},"August Johann Rösel von Rosenhof":{"name":"August Johann Rösel von Rosenhof","bio_de":"Ein Miniaturmaler, der zum Insektenfan wurde und mit zarten Kunstwerken die Lebenszyklen und Metamorphosen von Fröschen, Insekten und Reptilien in atemberaubender mikroskopischer Detailtreue festhielt.","bio_fr":"Un peintre miniaturiste devenu passionné d'insectes, qui a su capturer, grâce à de délicates œuvres d'art, les cycles de vie et les métamorphoses des grenouilles, des insectes et des reptiles avec un détail microscopique époustouflant.","birth_de":"Arnstadt, Deutschland","birth_fr":"Arnstadt, Allemagne"},"Georg Wolfgang Knorr":{"name":"Georg Wolfgang Knorr","bio_de":"Ein deutscher Kupferstecher, dessen wunderschön illustrierte Bücher über Fossilien und Muscheln neue visuelle Maßstäbe in der naturwissenschaftlichen Dokumentation setzten.","bio_fr":"Un graveur allemand dont les livres magnifiquement illustrés sur les fossiles et les coquillages ont établi de nouveaux standards visuels dans la documentation des sciences naturelles.","birth_de":"Nuremberg (Pegnitz), Deutschland","birth_fr":"Nuremberg (la Pegnitz), Allemagne"},"Carl Linnaeus":{"name":"Carl Linnaeus","bio_de":"Der „Vater der modernen Taxonomie\", der die binäre Nomenklatur erfand – das aus zwei lateinischen Wörtern bestehende Benennungssystem (wie *Homo sapiens*), das Wissenschaftler auf der ganzen Welt bis heute nutzen, um jedes Lebewesen zu benennen!","bio_fr":"Le « père de la taxonomie moderne », qui a inventé la nomenclature binomiale – le système de dénomination en deux mots latins (comme *Homo sapiens*) que les scientifiques du monde entier utilisent encore pour nommer chaque être vivant !","birth_de":"Råshult, Schweden","birth_fr":"Råshult, Suède"},"Elizabeth Blackwell":{"name":"Elizabeth Blackwell","bio_de":"Schottische Illustratorin, die *A Curious Herbal* – ein wichtiges Nachschlagewerk über Heilpflanzen – zeichnete, in Kupfer stach und von Hand kolorierte, um ihren Mann aus dem Schuldnergefängnis freizukaufen.","bio_fr":"Illustratrice écossaise qui a dessiné, gravé et colorié à la main *A Curious Herbal* – un ouvrage de référence essentiel sur les plantes médicinales – pour faire libérer son mari de la prison pour dettes.","birth_de":"Aberdeen (Dee), Schottland","birth_fr":"Aberdeen (Dee), Écosse"},"Georges-Louis Leclerc de Buffon":{"name":"Georges-Louis Leclerc de Buffon","bio_de":"Verfasste das gewaltige, 36-bändige Werk *Histoire Naturelle* und machte die Naturgeschichte zu einer bedeutenden Wissenschaft für die breite Öffentlichkeit.","bio_fr":"Auteur de la monumentale *Histoire Naturelle* en 36 volumes, il a transformé l'histoire naturelle en une grande science accessible au public.","birth_de":"Montbard (Brenne), Frankreich","birth_fr":"Montbard (Brenne), France"},"Georges-Louis Leclerc, Comte de Buffon":{"name":"Georges-Louis Leclerc, Comte de Buffon","bio_de":"Verfasste das gewaltige, 36-bändige Werk *Histoire Naturelle* und machte die Naturgeschichte zu einer bedeutenden Wissenschaft für die breite Öffentlichkeit.","bio_fr":"Auteur de la monumentale *Histoire Naturelle* en 36 volumes, il a transformé l'histoire naturelle en une grande science accessible au public.","birth_de":"Montbard (Brenne), Frankreich","birth_fr":"Montbard (Brenne), France"},"Johannes Burman":{"name":"Johannes Burman","bio_de":"Niederländischer Botaniker und Freund von Linnaeus. Er veröffentlichte zahlreiche Werke über die Pflanzenwelt von Ceylon (Sri Lanka) und Südafrika und brachte exotische Pflanzen aus aller Welt in die europäische Wissenschaft.","bio_fr":"Botaniste néerlandais et ami de Linnaeus. Il a beaucoup publié sur la flore de Ceylan (Sri Lanka) et d'Afrique du Sud, faisant découvrir à la science européenne des plantes exotiques du monde entier.","birth_de":"Amsterdam (Amstel), Niederlande","birth_fr":"Amsterdam (Amstel), Pays-Bas"},"Albrecht von Haller":{"name":"Albrecht von Haller","bio_de":"Als Wunderkind schrieb Haller schon vor seinem zehnten Geburtstag Gedichte und lernte mehrere Sprachen – später wurde er zum Vater der modernen Physiologie. Mit raffinierten Experimenten an tierischem Gewebe bewies er, dass die Nerven Schmerz und Empfindungen zum Gehirn leiten, während sich die Muskeln zusammenziehen und so Bewegung erzeugen.","bio_fr":"Enfant prodige qui écrivait des poèmes et parlait plusieurs langues avant l'âge de dix ans, Haller est devenu le père de la physiologie moderne. Grâce à des expériences ingénieuses sur des tissus animaux, il a prouvé que ce sont les nerfs qui transmettent la douleur et les sensations au cerveau, tandis que les muscles se contractent pour créer le mouvement.","birth_de":"Bern, Schweiz","birth_fr":"Bern, Suisse"},"Georg Dionysius Ehret":{"name":"Georg Dionysius Ehret","bio_de":"Der bedeutendste Pflanzenmaler des 18. Jahrhunderts, berühmt für seine wissenschaftliche Genauigkeit und seine Zusammenarbeit mit Carl Linnaeus und Hans Sloane.","bio_fr":"Le plus grand artiste botanique du XVIIIe siècle, réputé pour sa précision scientifique et sa collaboration avec Carl Linnaeus et Hans Sloane.","birth_de":"Heidelberg (Neckar), Deutschland","birth_fr":"Heidelberg (Neckar), Allemagne"},"Carl Alexander Clerck":{"name":"Carl Alexander Clerck","bio_de":"Ein Spinnenforscher, der mit dem bahnbrechenden Buch *Aranei Svecici* den allerersten wissenschaftlichen Bestimmungsführer für Spinnen der Welt schuf.","bio_fr":"Un arachnologue qui a publié le livre révolutionnaire *Aranei Svecici*, créant ainsi le tout premier guide scientifique de dénomination des araignées au monde.","birth_de":"Stockholm, Schweden","birth_fr":"Stockholm, Suède"},"Carl Clerck":{"name":"Carl Clerck","bio_de":"Ein enger Freund von Linnaeus, der seinen Garten in ein Insektenlabor verwandelte und schwedische Spinnen und Schmetterlinge präzise in einheitliche wissenschaftliche Gruppen einteilte.","bio_fr":"Un ami proche de Linnaeus qui a transformé son jardin en laboratoire d'insectes, classant avec précision les araignées et les papillons de Suède en groupes scientifiques cohérents.","birth_de":"Stockholm, Schweden","birth_fr":"Stockholm, Suède"},"Georg Wilhelm Steller":{"name":"Georg Wilhelm Steller","bio_de":"Ein bahnbrechender Naturforscher der Bering-Expedition; er dokumentierte die Ökologie Alaskas und gab Arten wie der Stellerschen Seekuh seinen Namen.","bio_fr":"Naturaliste pionnier de l'expédition du Béring ; il a documenté l'écologie de l'Alaska et a laissé son nom à des espèces comme la rhytine de Steller.","birth_de":"Windsheim (Aisch), Deutschland","birth_fr":"Windsheim (Aisch), Allemagne"},"Johann Georg Gmelin":{"name":"Johann Georg Gmelin","bio_de":"Unternahm eine historische, ein Jahrzehnt dauernde Erforschung Sibiriens, veröffentlichte das wegweisende Werk *Flora Sibirica* und brachte die Erforschung des Permafrosts voran.","bio_fr":"Il a mené une exploration historique de la Sibérie pendant dix ans, publiant l'ouvrage majeur *Flora Sibirica* et faisant progresser l'étude du pergélisol.","birth_de":"Tübingen (Neckar), Deutschland","birth_fr":"Tübingen (Neckar), Allemagne"},"Abraham Trembley":{"name":"Abraham Trembley","bio_de":"Trembley entdeckte die Hydra, ein mikroskopisch kleines Süßwasserwesen, und bewies, dass sie sich aus winzigen abgeschnittenen Stücken wieder vollständig regenerieren kann – eine verblüffende Erkenntnis, die die Grenze zwischen Pflanzen und Tieren verwischte! Unglaublich geduldig und grenzenlos neugierig, baute er seine eigenen Vergrößerungslinsen und führte wilde Experimente im Garten durch – damit erfand er praktisch die experimentelle Biologie.","bio_fr":"Trembley a découvert l'hydre, une créature d'eau douce microscopique, et a prouvé qu'elle pouvait se régénérer à partir de minuscules morceaux coupés – une révélation stupéfiante qui brouillait la frontière entre les plantes et les animaux ! Extrêmement patient et infiniment curieux, il fabriquait ses propres loupes et menait des expériences folles dans son jardin, inventant ainsi pratiquement la biologie expérimentale.","birth_de":"Geneva, Schweiz","birth_fr":"Geneva, Suisse"},"Stepan Krasheninnikov":{"name":"Stepan Krasheninnikov","bio_de":"Trotzte während der Großen Nordischen Expedition eisigen arktischen Bedingungen, um den allerersten ausführlichen wissenschaftlichen Bericht über die Vulkane, die Tierwelt und die Menschen von Kamtschatka zu verfassen!","bio_fr":"Il a bravé le froid glacial de l'Arctique pendant la Grande Expédition du Nord pour rédiger le tout premier compte rendu scientifique détaillé des volcans, de la faune et des habitants du Kamtchatka !","birth_de":"Moscow (Moskwa), Russland","birth_fr":"Moscow (Moskova), Russie"},"John Miller":{"name":"John Miller","bio_de":"Geboren als Johann Sebastian Müller, schuf er einige der genauesten und schönsten Pflanzenstiche des 18. Jahrhunderts, die sogar von Carl Linnaeus persönlich gelobt wurden.","bio_fr":"Né Johann Sebastian Müller, il a réalisé certaines des gravures botaniques les plus précises et les plus belles du XVIIIe siècle, chaudement recommandées par Carl Linnaeus lui-même.","birth_de":"Nuremberg (Pegnitz), Deutschland","birth_fr":"Nuremberg (Pegnitz), Allemagne"},"Pehr Kalm":{"name":"Pehr Kalm","bio_de":"Segelte in die wilden Weiten Nordamerikas, verfasste die allererste wissenschaftliche Beschreibung der Niagarafälle und brachte großartige Pflanzen wie den Berglorbeer zurück nach Europa!","bio_fr":"Il a navigué vers les contrées sauvages de l'Amérique du Nord, rédigé la toute première description scientifique des chutes du Niagara et rapporté en Europe des plantes fabuleuses comme le laurier des montagnes !","birth_de":"Ångermanland (Ångermanälven), Schweden","birth_fr":"Ångermanland (Ångermanälven), Suède"},"Peter Kalm":{"name":"Peter Kalm","bio_de":"Die englische Form des schwedischen Entdeckers Pehr Kalm! Er durchquerte die Wildnis Nordamerikas, verfasste einen der frühesten Augenzeugenberichte über die Niagarafälle und brachte Hunderte amerikanischer Samen mit zurück nach Europa.","bio_fr":"La forme anglaise du nom de l'explorateur suédois Pehr Kalm ! Il a traversé les étendues sauvages de l'Amérique du Nord, rédigé l'un des tout premiers témoignages oculaires sur les chutes du Niagara et rapporté des centaines de graines américaines en Europe.","birth_de":"Ångermanland (Ångermanälven), Schweden","birth_fr":"Ångermanland (Ångermanälven), Suède"},"Charles Bonnet":{"name":"Charles Bonnet","bio_de":"Entdeckte die **Parthenogenese** (Jungfernzeugung bei Tieren), als er beobachtete, dass sich weibliche Blattläuse ohne Paarung fortpflanzen können – und stellte damit jahrhundertealte biologische Annahmen infrage!","bio_fr":"Il a découvert la **parthénogenèse** (la reproduction sans fécondation chez les animaux) en observant que les pucerons femelles pouvaient se reproduire sans s'accoupler, remettant en question des siècles de certitudes biologiques !","birth_de":"Geneva, Schweiz","birth_fr":"Geneva, Suisse"},"Charles De Geer":{"name":"Charles De Geer","bio_de":"Ein schwedischer Industrieller und Insektenforscher, der eine legendäre, siebenbändige Studie über den Körperbau, die Fortpflanzung und die Entwicklungsstadien von Insekten verfasste.","bio_fr":"Un industriel et entomologiste suédois qui a produit une étude légendaire en 7 volumes détaillant l'anatomie, la reproduction et les cycles de développement des insectes.","birth_de":"Finspång, Schweden","birth_fr":"Finspång, Suède"},"Gilbert White":{"name":"Gilbert White","bio_de":"Verfasser von *The Natural History and Antiquities of Selborne*, einem frühen Meisterwerk der örtlichen Naturgeschichte und der beobachtenden Ökologie.","bio_fr":"Auteur de *The Natural History and Antiquities of Selborne*, un chef-d'œuvre précoce d'histoire naturelle locale et d'écologie fondée sur l'observation.","birth_de":"Selborne (Wey), England","birth_fr":"Selborne (Wey), Angleterre"},"Patrick Browne":{"name":"Patrick Browne","bio_de":"Ein irischer Arzt, der im 18. Jahrhundert die tropischen Dschungel Jamaikas durchstreifte, um ein riesiges, maßgebliches Buch über jede noch so seltsame, wilde und heilkräftige Pflanze zu schreiben, die er finden konnte!","bio_fr":"Un médecin irlandais qui a bravé les jungles tropicales de la Jamaïque au XVIIIe siècle pour écrire un livre énorme et incontournable sur chaque plante étrange, sauvage ou médicinale qu'il pouvait trouver !","birth_de":"Woodstock (Robe), Irland","birth_fr":"Woodstock (Robe), Irlande"},"Pieter Cramer":{"name":"Pieter Cramer","bio_de":"Ein wohlhabender niederländischer Kaufmann, der sein riesiges Vermögen in den Aufbau einer weltberühmten Sammlung leuchtend bunter, exotischer Schmetterlinge und Nachtfalter steckte, die aus tropischen Kolonien rund um den Globus herbeigeschafft wurden!","bio_fr":"Un riche marchand néerlandais qui a englouti son immense fortune dans la constitution d'une collection mondialement célèbre de papillons de jour et de nuit aux couleurs éclatantes, expédiés depuis des colonies tropicales du monde entier !","birth_de":"Amsterdam (Amstel), Niederlande","birth_fr":"Amsterdam (Amstel), Pays-Bas"},"Fredric Hasselquist":{"name":"Fredric Hasselquist","bio_de":"Ein Schüler von Carl Linnaeus, der frühe wissenschaftliche Reisen nach Palästina und Ägypten unternahm, um die Pflanzen- und Tierwelt des Nahen Ostens zu erfassen.","bio_fr":"Un élève de Carl Linnaeus qui a entrepris de premiers voyages scientifiques en Palestine et en Égypte pour cataloguer la flore et la faune du Proche-Orient.","birth_de":"Törnevalla (Stångån), Schweden","birth_fr":"Törnevalla (Stångån), Suède"},"Giovanni Antonio Scopoli":{"name":"Giovanni Antonio Scopoli","bio_de":"Ein früher Tiroler Naturforscher, der die Systematik von Linnaeus auf die Pflanzen, Tiere und Insekten der Alpenregion anwandte.","bio_fr":"Un des premiers naturalistes tyroliens, qui a appliqué la taxonomie de Linnaeus à la flore, à la faune et aux insectes de la région alpine.","birth_de":"Cavalese (Avisio), Italien","birth_fr":"Cavalese (Avisio), Italie"},"Marcus Elieser Bloch":{"name":"Marcus Elieser Bloch","bio_de":"Ein Arzt, der völlig besessen von Fischen war! Er schuf eine riesige, spektakuläre Enzyklopädie mit gewaltigen, glänzenden, von Hand kolorierten Abbildungen fast aller Fische, die die Wissenschaft damals kannte!","bio_fr":"Un médecin devenu complètement obsédé par les poissons ! Il a créé une encyclopédie gigantesque et spectaculaire, remplie d'immenses illustrations brillantes et coloriées à la main de presque tous les poissons connus de la science !","birth_de":"Ansbach (Fränkische Rezat), Deutschland","birth_fr":"Ansbach (Fränkische Rezat), Allemagne"},"Mathurin Jacques Brisson":{"name":"Mathurin Jacques Brisson","bio_de":"Ein Wissenschaftsstar, der zunächst Tausende Vögel und Säugetiere bis ins kleinste Detail katalogisierte und dann ganz nebenbei die Fächer wechselte, um als Physiker die Natur in reine Mathematik zu übersetzen!","bio_fr":"Une superstar de la science qui a d'abord catalogué des milliers d'oiseaux et de mammifères dans les moindres détails, avant de changer tranquillement de carrière pour la physique et de traduire le monde naturel en pures mathématiques !","birth_de":"Fontenay-le-Comte (Vendée), Frankreich","birth_fr":"Fontenay-le-Comte (la Vendée), France"},"Pehr Osbeck":{"name":"Pehr Osbeck","bio_de":"Reiste im 18. Jahrhundert bis nach China, überstand gewaltige Stürme und Piratenangriffe – nur um über 600 seltsame und wunderbare asiatische Pflanzen und Tiere für die Wissenschaft zu katalogisieren!","bio_fr":"Il a voyagé jusqu'en Chine au XVIIIe siècle, survivant à des tempêtes gigantesques et à des pirates, juste pour cataloguer plus de 600 plantes et animaux asiatiques étranges et merveilleux au service de la science !","birth_de":"Oland Parish (Fyris (in der Nähe)), Schweden","birth_fr":"Oland Parish (Fyris (à proximité)), Suède"},"Dru Drury":{"name":"Dru Drury","bio_de":"Ein bedeutender englischer Silberschmied und Insektenforscher, der eine der größten Insektensammlungen seiner Zeit zusammentrug und das prachtvoll illustrierte Werk *Illustrations of Natural History* veröffentlichte.","bio_fr":"Éminent orfèvre et entomologiste anglais qui a rassemblé l'une des plus grandes collections d'insectes de son époque et publié le somptueux ouvrage illustré *Illustrations of Natural History*.","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"Immanuel Kant":{"name":"Immanuel Kant","bio_de":"Einer der bedeutendsten Philosophen der Geschichte. Er stellte außerdem die Nebularhypothese auf, die die Entstehung des Sonnensystems erklärt.","bio_fr":"L'un des philosophes les plus importants de l'histoire. Il a également proposé l'hypothèse de la nébuleuse, qui explique la formation du système solaire.","birth_de":"Königsberg (Pregel), Deutschland","birth_fr":"Königsberg (Pregel), Allemagne"},"Étienne Louis Geoffroy":{"name":"Étienne Louis Geoffroy","bio_de":"Ein französischer Apotheker und Insektenpionier, der einen der allerersten umfassenden und übersichtlich geordneten Bestimmungsführer schrieb, in dem alle rund um Paris herumkrabbelnden Insektenarten beschrieben wurden!","bio_fr":"Un apothicaire français et pionnier de l'étude des insectes, qui a rédigé l'un des tout premiers guides catalogues complets et très bien organisés décrivant toutes les espèces d'insectes qui grouillaient autour de Paris !","birth_de":"Paris (Seine), Frankreich","birth_fr":"Paris (la Seine), France"},"James Hutton":{"name":"James Hutton","bio_de":"Bekannt als „Vater der modernen Geologie\". Er revolutionierte die Wissenschaft, indem er bewies, dass die Erdkruste durch langsame Prozesse über eine unvorstellbar lange „Tiefenzeit\" hinweg geformt wurde.","bio_fr":"Surnommé le « père de la géologie moderne ». Il a révolutionné la science en prouvant que la croûte terrestre a été façonnée par des processus lents au cours d'un « temps profond ».","birth_de":"Edinburgh (Water of Leith), Schottland","birth_fr":"Edinburgh (Water of Leith), Écosse"},"Thomas Pennant":{"name":"Thomas Pennant","bio_de":"Ein führender walisischer Naturforscher, dessen riesige, wunderschön illustrierte Zoologiebücher gewaltige Bestseller waren und Generationen von Naturbeobachtern sowie Charles Darwin selbst inspirierten!","bio_fr":"Grand naturaliste gallois dont les gigantesques livres de zoologie superbement illustrés furent d'énormes best-sellers, inspirant des générations d'observateurs de la nature et Charles Darwin lui-même !","birth_de":"Whitford (Dee), Wales","birth_fr":"Whitford (Dee), Pays de Galles"},"Ignaz Schiffermüller":{"name":"Ignaz Schiffermüller","bio_de":"Ein österreichischer Naturforscher, der die Schmetterlinge der Wiener Gegend katalogisierte und eines der ersten standardisierten biologischen Farbsysteme entwickelte.","bio_fr":"Naturaliste autrichien qui a catalogué les papillons de la région de Vienne et mis au point l'un des premiers systèmes de couleurs biologiques standardisés.","birth_de":"Hellmonsödt (Donau), Österreich","birth_fr":"Hellmonsödt (Danube), Autriche"},"Michel Adanson":{"name":"Michel Adanson","bio_de":"Reiste in die Hitze des Senegal, erforschte den riesigen, bizarren Baobab-Baum (der heute ihm zu Ehren wissenschaftlich *Adansonia* heißt!) und entwickelte ein völlig neues System, um alle Pflanzen der Erde zu ordnen!","bio_fr":"Il a voyagé sous la chaleur du Sénégal, étudié l'immense et étrange baobab (aujourd'hui nommé scientifiquement *Adansonia* en son honneur !) et créé un tout nouveau système pour classer toutes les plantes de la Terre !","birth_de":"Aix-en-Provence (Arc), Frankreich","birth_fr":"Aix-en-Provence (Arc), France"},"Nikolaus Joseph von Jacquin":{"name":"Nikolaus Joseph von Jacquin","bio_de":"Der Kaiser des Heiligen Römischen Reiches befahl ihm persönlich, in die von Piraten wimmelnde Karibik zu segeln – nur um Hunderte wilder, tropischer Pflanzen zu holen und damit die kaiserlichen Paläste in Wien zu schmücken!","bio_fr":"L'empereur du Saint-Empire romain germanique lui a personnellement ordonné de naviguer jusqu'aux Caraïbes infestées de pirates, juste pour rapporter des centaines de plantes tropicales sauvages destinées à décorer les palais royaux de Vienne !","birth_de":"Leiden (Oude Rijn), Niederlande","birth_fr":"Leiden (Oude Rijn), Pays-Bas"},"Carlo Allioni":{"name":"Carlo Allioni","bio_de":"Ein italienischer Arzt und Botaniker, der *Flora Pedemontana* veröffentlichte, ein Meisterwerk, das über 2.800 in Nordwestitalien heimische alpine Pflanzenarten beschreibt.","bio_fr":"Un médecin et botaniste italien qui a publié *Flora Pedemontana*, un chef-d'œuvre décrivant plus de 2 800 espèces de plantes alpines originaires du nord-ouest de l'Italie.","birth_de":"Turin, Italien","birth_fr":"Turin, Italie"},"Georg Christian Oeder":{"name":"Georg Christian Oeder","bio_de":"Gründer und erster Herausgeber von *Flora Danica*, einem monumentalen botanischen Atlas, der alle in den dänischen Kronländern heimischen Pflanzen beschreibt.","bio_fr":"Fondateur et premier éditeur de *Flora Danica*, un atlas botanique monumental décrivant toutes les plantes originaires des terres de la couronne danoise.","birth_de":"Ansbach (Rezat), Deutschland","birth_fr":"Ansbach (Rezat), Allemagne"},"John Hunter":{"name":"John Hunter","bio_de":"Revolutionierte die Chirurgie, indem er eine wissenschaftliche Grundlage für die Medizin forderte, und trug eine unglaubliche anatomische Sammlung zusammen, aus der das Hunterian Museum entstand.","bio_fr":"Il a révolutionné la chirurgie en exigeant une base scientifique pour la médecine et a rassemblé une incroyable collection anatomique qui a donné naissance au Hunterian Museum.","birth_de":"East Kilbride (Clyde), Schottland","birth_fr":"East Kilbride (Clyde), Écosse"},"Johann Reinhold Forster":{"name":"Johann Reinhold Forster","bio_de":"Diente als offizieller Naturforscher auf Kapitän James Cooks zweiter Reise und legte damit den Grundstein für die Ökologie der Antarktis und die Biogeografie.","bio_fr":"Il a été le naturaliste officiel du deuxième voyage du capitaine James Cook, jetant les bases de l'écologie antarctique et de la biogéographie.","birth_de":"Tczew (Weichsel), Königlich-Preußen (Polen)","birth_fr":"Tczew (Vistule), Prusse royale (Pologne)"},"Lazzaro Spallanzani":{"name":"Lazzaro Spallanzani","bio_de":"Bewies, dass Insekten nicht einfach wie durch Zauberei aus dem Nichts in verrottendem Fleisch entstehen – UND er fand als Erster heraus, wie Fledermäuse sich in völliger Dunkelheit mithilfe der Echoortung zurechtfinden!","bio_fr":"Il a prouvé que les insectes n'apparaissent pas comme par magie, à partir de rien, dans la viande en décomposition – ET il a été le premier à comprendre comment les chauves-souris se repèrent dans l'obscurité totale grâce à l'écholocalisation !","birth_de":"Scandiano (Tresinaro), Italien","birth_fr":"Scandiano (Tresinaro), Italie"},"Louis Antoine de Bougainville":{"name":"Louis Antoine de Bougainville","bio_de":"Ein draufgängerischer Entdecker, der einmal um die ganze Welt segelte, die Französische Revolution überlebte und die leuchtend neonpinke Blume „Bougainvillea\" nach Europa mitbrachte!","bio_fr":"Un explorateur intrépide qui a fait le tour du monde, survécu à la Révolution française et rapporté en Europe la fleur d'un rose fluo éclatant, la « bougainvillée » !","birth_de":"Paris (Seine), Frankreich","birth_fr":"Paris (la Seine), France"},"Pehr Loefling":{"name":"Pehr Loefling","bio_de":"Linnaeus' Lieblingsschüler. Er wurde auf eine höchst gefährliche Expedition in die südamerikanischen Regenwälder geschickt, um dort seltene Pflanzen aufzuspüren, und starb mit nur 27 Jahren als Held der Wissenschaft.","bio_fr":"L'élève préféré de Linnaeus. Il a été envoyé en expédition très dangereuse dans les forêts tropicales d'Amérique du Sud pour y chercher des plantes rares, et il est mort en héros de la science à seulement 27 ans.","birth_de":"Valbo (Gavleån), Schweden","birth_fr":"Valbo (Gavleån), Suède"},"Pehr Löfling":{"name":"Pehr Löfling","bio_de":"Linnaeus' Lieblingsschüler. Er wurde auf eine höchst gefährliche Expedition in die südamerikanischen Regenwälder geschickt, um dort seltene Pflanzen aufzuspüren, und starb mit nur 27 Jahren als Held der Wissenschaft.","bio_fr":"L'élève préféré de Linnaeus. Il a été envoyé en expédition très dangereuse dans les forêts tropicales d'Amérique du Sud pour y chercher des plantes rares, et il est mort en héros de la science à seulement 27 ans.","birth_de":"Valbo (Gavleån), Schweden","birth_fr":"Valbo (Gavleån), Suède"},"Moses Harris":{"name":"Moses Harris","bio_de":"Schmetterlingsflügel waren so unglaublich farbenprächtig, dass er buchstäblich den modernen Farbkreis erfinden musste, damit Wissenschaftler ihre wahnsinnigen, schillernden Muster überhaupt genau beschreiben konnten!","bio_fr":"Les ailes des papillons étaient si incroyablement colorées qu'il a littéralement dû inventer la roue chromatique moderne pour que les scientifiques puissent décrire avec précision leurs motifs irisés et hallucinants !","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"Otto Friedrich Müller":{"name":"Otto Friedrich Müller","bio_de":"Er war einer der allerersten Menschen, die durch ein Mikroskop blickten und die völlig bizarren, unsichtbaren, außerirdisch anmutenden Lebewesen erfolgreich einordneten, die in einem einzigen winzigen Wassertropfen wimmeln!","bio_fr":"Il a été l'une des toutes premières personnes à regarder dans un microscope et à réussir à classer les organismes totalement bizarres, invisibles et quasi extraterrestres qui grouillent dans une seule minuscule goutte d'eau !","birth_de":"Copenhagen (Öresund), Dänemark","birth_fr":"Copenhagen (détroit de l'Øresund), Danemark"},"Erasmus Darwin":{"name":"Erasmus Darwin","bio_de":"Großvater von Charles Darwin. In seinem gewaltigen dichterisch-wissenschaftlichen Werk *Zoonomia* formulierte er eine der ersten förmlichen Evolutionstheorien.","bio_fr":"Grand-père de Charles Darwin. Il a formulé l'une des premières théories formelles de l'évolution dans son œuvre poétique et scientifique magistrale *Zoonomia*.","birth_de":"Elston (Trent), England","birth_fr":"Elston (Trent), Angleterre"},"William Aiton":{"name":"William Aiton","bio_de":"Der allererste Direktor der Königlichen Botanischen Gärten von Kew! Er überwachte die Anzucht Tausender exotischer Pflanzen aus aller Welt und veröffentlichte den ultimativen Katalog mit über 5.500 Gartenarten!","bio_fr":"Le tout premier directeur des jardins botaniques royaux de Kew ! Il a supervisé la culture de milliers de plantes exotiques du monde entier et publié le catalogue ultime de plus de 5 500 espèces de jardin !","birth_de":"Avondale (Avon), Schottland","birth_fr":"Avondale (Avon), Écosse"},"Jose Celestino Mutis":{"name":"Jose Celestino Mutis","bio_de":"Leitete die legendäre Königliche Botanische Expedition nach Neugranada (Kolumbien), gründete gewaltige wissenschaftliche Einrichtungen und dokumentierte Tausende südamerikanischer Pflanzen.","bio_fr":"Il a dirigé la légendaire Expédition botanique royale en Nouvelle-Grenade (Colombie), fondant d'immenses institutions scientifiques et documentant des milliers de plantes d'Amérique du Sud.","birth_de":"Cádiz (Guadalete), Spanien","birth_fr":"Cádiz (Guadalete), Espagne"},"Joseph Gärtner":{"name":"Joseph Gärtner","bio_de":"Deutscher Botaniker, der bahnbrechende Fortschritte in der Karpologie (der Lehre von Samen und Früchten) erzielte und grundlegende Fachbegriffe für den Aufbau von Früchten prägte, die noch heute verwendet werden.","bio_fr":"Botaniste allemand qui a réalisé des avancées monumentales en carpologie (l'étude des graines et des fruits), établissant une terminologie structurelle fondamentale encore utilisée aujourd'hui.","birth_de":"Calw (Nagold), Deutschland","birth_fr":"Calw (Nagold), Allemagne"},"Pehr Forsskal":{"name":"Pehr Forsskal","bio_de":"Ein genialer Rebell! Er verkleidete sich in einheimischer Kleidung, um die verbotenen Wüsten Arabiens zu erkunden, entdeckte bizarre Meerestiere und starb dann tragischerweise an Malaria.","bio_fr":"Un rebelle génial ! Il se déguisait avec des vêtements locaux pour explorer les déserts interdits d'Arabie, découvrant d'étranges créatures marines avant de mourir tragiquement du paludisme.","birth_de":"Helsinki (Vantaa), Finnland","birth_fr":"Helsinki (Vantaa), Finlande"},"Antoine Gouan":{"name":"Antoine Gouan","bio_de":"Gouan war ein französischer Pionier, der half, den naturwissenschaftlichen Unterricht zu modernisieren. Er gehörte zu den Allerersten in Frankreich, die Carl Linnaeus' neues System zur Benennung von Arten übernahmen, und er machte den Botanischen Garten von Montpellier zu einem weltberühmten Zentrum der Pflanzenforschung.","bio_fr":"Gouan fut un pionnier français qui contribua à moderniser l'enseignement des sciences. Il fut parmi les tout premiers en France à adopter le nouveau système de Carl Linnaeus pour nommer les espèces, et il transforma le Jardin botanique de Montpellier en un centre mondialement célèbre pour la découverte des plantes.","birth_de":"Montpellier, Frankreich","birth_fr":"Montpellier, France"},"Carsten Niebuhr":{"name":"Carsten Niebuhr","bio_de":"Als einziger Überlebender einer tragischen dänischen Forschungsexpedition nach Arabien kartierte Niebuhr erfolgreich die Region und brachte unschätzbar wertvolle botanische und geografische Daten mit.","bio_fr":"Seul survivant d'une tragique expédition scientifique danoise en Arabie, Niebuhr cartographia avec succès la région et rapporta des données botaniques et géographiques d'une valeur inestimable.","birth_de":"Lüdingworth, Deutschland","birth_fr":"Lüdingworth, Allemagne"},"Daniel Solander":{"name":"Daniel Solander","bio_de":"Carl Linnaeus' liebster Musterschüler, der auf Kapitän Cooks *Endeavour* um die Welt segelte, dabei Tausende exotischer Pflanzen aus dem Pazifik sammelte und half, die Artenvielfalt der Botany Bay zu dokumentieren!","bio_fr":"L'élève préféré et vedette de Carl Linnaeus, qui fit le tour du monde à bord de l'*Endeavour* du capitaine Cook, récoltant des milliers de plantes exotiques du Pacifique et contribuant à documenter la biodiversité de Botany Bay !","birth_de":"Piteå (Pite), Schweden","birth_fr":"Piteå (Pite), Suède"},"Joseph Gottlieb Kölreuter":{"name":"Joseph Gottlieb Kölreuter","bio_de":"Ein echter Pionier bei der Erforschung der Befruchtung und Kreuzung von Pflanzen, der seiner Zeit im Verständnis von Pollenübertragung und Vererbung um Jahrhunderte voraus war.","bio_fr":"Un véritable pionnier de l'étude de la fécondation et de l'hybridation des plantes, en avance de plusieurs siècles sur son temps dans la compréhension du transport du pollen et de la génétique.","birth_de":"Sulz am Neckar (Neckar), Deutschland","birth_fr":"Sulz am Neckar (Neckar), Allemagne"},"Nicolaas Laurens Burman":{"name":"Nicolaas Laurens Burman","bio_de":"Er arbeitete Seite an Seite mit dem legendären Linnaeus und erfasste dennoch die wilde, farbenprächtige Pflanzenwelt Indiens – und das, ohne jemals seine Heimat in den Niederlanden zu verlassen!","bio_fr":"Il travailla côte à côte avec le légendaire Linnaeus et parvint pourtant à répertorier la flore sauvage et éclatante de l'Inde, le tout sans jamais quitter sa demeure aux Pays-Bas !","birth_de":"Amsterdam (Amstel), Niederlande","birth_fr":"Amsterdam (Amstel), Pays-Bas"},"James Bolton":{"name":"James Bolton","bio_de":"Autodidaktischer englischer Naturforscher, der mit größter Sorgfalt das allererste englischsprachige Werk schrieb und illustrierte, das sich ausschließlich den Pilzen widmete.","bio_fr":"Naturaliste anglais autodidacte qui rédigea et illustra minutieusement le tout premier ouvrage en langue anglaise entièrement consacré aux champignons.","birth_de":"Warley Town (River Calder), England","birth_fr":"Warley Town (River Calder), Angleterre"},"Jan Christiaan Sepp":{"name":"Jan Christiaan Sepp","bio_de":"Meisterhafter niederländischer Kupferstecher, der atemberaubend detaillierte, mehrbändige Werke schuf, die die Insekten und Vögel der Niederlande anschaulich darstellten.","bio_fr":"Maître graveur néerlandais qui réalisa des ouvrages en plusieurs volumes d'un détail époustouflant, mettant en lumière les insectes et les oiseaux des Pays-Bas.","birth_de":"Amsterdam (Amstel), Niederlande","birth_fr":"Amsterdam (Amstel), Pays-Bas"},"William Bartram":{"name":"William Bartram","bio_de":"Er verbrachte vier abenteuerliche Jahre damit, den ungezähmten Süden Amerikas zu erkunden, und schrieb ein legendäres Buch voller mitreißender Geschichten über Kämpfe mit riesigen Alligatoren und die Entdeckung seltener Pflanzen der Wildnis!","bio_fr":"Il passa quatre années mouvementées à explorer le Sud sauvage de l'Amérique et écrivit un livre légendaire rempli d'histoires saisissantes de combats contre d'énormes alligators et de découvertes de plantes rares de la frontière !","birth_de":"Kingsessing (Philadelphia) (Schuylkill), USA","birth_fr":"Kingsessing (Philadelphia) (Schuylkill), États-Unis"},"John Latham":{"name":"John Latham","bio_de":"Der „Großvater der australischen Vogelkunde\". Er beschrieb und benannte zahlreiche berühmte australische Vögel (wie den Emu und den Leierschwanz) anhand von Exemplaren, die nach England geschickt wurden.","bio_fr":"Le « grand-père de l'ornithologie australienne ». Il décrivit et nomma de nombreux oiseaux australiens célèbres (comme l'émeu et l'oiseau-lyre) à partir de spécimens envoyés en Angleterre.","birth_de":"Eltham (Themse), England","birth_fr":"Eltham (la Tamise), Angleterre"},"Juan Ignacio Molina":{"name":"Juan Ignacio Molina","bio_de":"Chilenischer Jesuitenpater, der im italienischen Exil die ersten umfassenden, wissenschaftlichen Beschreibungen der Pflanzenwelt, Tierwelt und Geografie Chiles verfasste.","bio_fr":"Prêtre jésuite chilien qui, depuis son exil en Italie, rédigea les premières descriptions scientifiques complètes de la flore, de la faune et de la géographie du Chili.","birth_de":"Villa Alegre (Maule), Chile","birth_fr":"Villa Alegre (Maule), Chili"},"Peter Simon Pallas":{"name":"Peter Simon Pallas","bio_de":"Er durchquerte das eisige Sibirien im Auftrag der Kaiserin Katharina der Großen! Er grub ausgestorbene Mammuts aus, die im Eis eingeschlossen waren, und entdeckte die Pallaskatze – die flauschigste und grimmigst dreinblickende Wildkatze der Welt!","bio_fr":"Il traversa la Sibérie glaciale pour le compte de l'impératrice Catherine la Grande ! Il déterra des mammouths disparus emprisonnés dans la glace et découvrit le chat de Pallas, le chat sauvage le plus duveteux et le plus grognon de la planète !","birth_de":"Berlin (Spree), Deutschland","birth_fr":"Berlin (la Sprée), Allemagne"},"Eugenius Johann Christoph Esper":{"name":"Eugenius Johann Christoph Esper","bio_de":"Deutscher Zoologe, dessen wunderschön illustriertes Hauptwerk *Die Schmetterlinge in Abbildungen* einen gewaltigen Fortschritt in der Systematik der Schmetterlinge darstellte.","bio_fr":"Zoologiste allemand dont le magnum opus superbement illustré, *Die Schmetterlinge in Abbildungen*, marqua un bond monumental dans la taxonomie des papillons.","birth_de":"Wunsiedel (Röslau), Deutschland","birth_fr":"Wunsiedel (Röslau), Allemagne"},"Felix de Azara":{"name":"Felix de Azara","bio_de":"Spanischer Militäringenieur, der die Säugetiere und Vögel Südamerikas ausführlich dokumentierte und dabei biologische Grundsätze aufdeckte, die Charles Darwin stark beeinflussten.","bio_fr":"Ingénieur militaire espagnol qui documenta en détail les mammifères et les oiseaux d'Amérique du Sud, mettant au jour des principes biologiques qui influencèrent fortement Charles Darwin.","birth_de":"Barbuñales (Alcanadre), Spanien","birth_fr":"Barbuñales (Alcanadre), Espagne"},"Carl Peter Thunberg":{"name":"Carl Peter Thunberg","bio_de":"Bekannt als „Vater der japanischen Botanik\", gab sich Thunberg als niederländischer Arzt aus, um in das abgeschottete Japan des 18. Jahrhunderts zu gelangen und dort heimlich die einzigartigen Pflanzen und Tiere zu sammeln und zu dokumentieren.","bio_fr":"Surnommé le « père de la botanique japonaise », Thunberg se fit passer pour un médecin néerlandais afin d'entrer dans le Japon isolé du XVIIIe siècle et d'y collecter et documenter secrètement ses plantes et animaux uniques.","birth_de":"Jönköping, Schweden","birth_fr":"Jönköping, Suède"},"Eberhard August Wilhelm von Zimmermann":{"name":"Eberhard August Wilhelm von Zimmermann","bio_de":"Deutscher Geograf, der *Specimen Zoologiae Geographicae* verfasste, das weithin als eines der grundlegenden Werke der Tiergeografie (Zoogeografie) gilt.","bio_fr":"Géographe allemand, auteur de *Specimen Zoologiae Geographicae*, largement considéré comme l'un des ouvrages fondateurs de l'étude de la géographie animale (la zoogéographie).","birth_de":"Uelzen (Ilmenau), Deutschland","birth_fr":"Uelzen (Ilmenau), Allemagne"},"Joseph Banks":{"name":"Joseph Banks","bio_de":"Er segelte mit Kapitän Cook auf der *Endeavour*. Als mächtiger Präsident der Royal Society bestimmte er den Kurs der britischen Wissenschaft und der weltweiten Pflanzensammlung.","bio_fr":"Il navigua avec le capitaine Cook à bord de l'*Endeavour*. Devenu le puissant président de la Royal Society, il dicta l'orientation de la science britannique et de la collecte botanique dans le monde entier.","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"Marmaduke Tunstall":{"name":"Marmaduke Tunstall","bio_de":"Ein schrulliger Adliger, der sein gesamtes vornehmes Anwesen in ein riesiges Museum voller ausgestopfter Vögel und Tiere verwandelte. Ach ja, und er war derjenige, der dem Wanderfalken offiziell seinen wissenschaftlichen Namen gab!","bio_fr":"Un noble farfelu qui transforma toute sa belle demeure en un immense musée d'oiseaux et d'animaux empaillés. Ah, et c'est lui qui donna officiellement son nom scientifique au faucon pèlerin !","birth_de":"Burton Constable (Humber-Mündung (in der Nähe)), England","birth_fr":"Burton Constable (estuaire de la Humber (à proximité)), Angleterre"},"William Paley":{"name":"William Paley","bio_de":"Er entwickelte den berühmten „Uhrmacher-Vergleich\" – er argumentierte, dass jemand eine komplizierte Taschenuhr, über die man in der Heide stolpert, entworfen haben muss, und dass die überwältigende Komplexität der Natur daher einen Schöpfer haben muss!","bio_fr":"Il créa la célèbre « analogie de l'horloger » : il soutenait que si l'on tombe sur une montre de poche complexe au milieu d'une lande, quelqu'un a forcément dû la concevoir, et que la complexité vertigineuse de la nature doit donc avoir un créateur !","birth_de":"Peterborough (Nene), England","birth_fr":"Peterborough (Nene), Angleterre"},"Jean-Baptiste Lamarck":{"name":"Jean-Baptiste Lamarck","bio_de":"Er prägte das Wort „Biologie\" und stellte kühn eine der ersten umfassenden – wenn auch später heftig umstrittenen – Evolutionstheorien auf (den Lamarckismus).","bio_fr":"Il inventa le mot « biologie » et formula audacieusement l'une des premières théories complètes de l'évolution (le lamarckisme), bien que celle-ci fût plus tard vivement contestée.","birth_de":"Bazentin (Somme), Frankreich","birth_fr":"Bazentin (Somme), France"},"Johann Andreas Naumann":{"name":"Johann Andreas Naumann","bio_de":"Oberhaupt einer berühmten deutschen Gelehrtenfamilie und Autor des grundlegenden, viel zitierten Werks *Natural History of the Birds of Germany*.","bio_fr":"Patriarche d'une célèbre famille de savants allemands et auteur de l'ouvrage fondateur et abondamment cité *Natural History of the Birds of Germany*.","birth_de":"Ziebigk (Elbe), Deutschland","birth_fr":"Ziebigk (l'Elbe), Allemagne"},"Johann Gottfried Herder":{"name":"Johann Gottfried Herder","bio_de":"Eine Schlüsselfigur der Sturm-und-Drang-Bewegung, deren philosophische Ideen die romantische Sicht auf die Natur und die historische Biologie tief prägten.","bio_fr":"Une figure clé du mouvement Sturm und Drang, dont les idées philosophiques influencèrent profondément l'approche romantique de la nature et de la biologie historique.","birth_de":"Mohrungen (Pasłęka), Preußen (Polen)","birth_fr":"Mohrungen (Pasłęka), Prusse (Pologne)"},"Antonio José Cavanilles":{"name":"Antonio José Cavanilles","bio_de":"Ein spanischer Priester, der zum Botaniker wurde und Hunderte von Pflanzenarten aus Australien und Amerika katalogisierte, die von spanischen Expeditionen mitgebracht wurden, und der den Königlichen Botanischen Garten von Madrid zu internationalem Ruhm führte.","bio_fr":"Un prêtre espagnol devenu botaniste, qui catalogua des centaines d'espèces de plantes d'Australie et des Amériques rapportées par les expéditions espagnoles, menant le Jardin botanique royal de Madrid à une renommée internationale.","birth_de":"Valencia, Spanien","birth_fr":"Valencia, Espagne"},"Johan Christian Fabricius":{"name":"Johan Christian Fabricius","bio_de":"Ein brillanter Schüler von Linnaeus, der die Systematik der Insekten enorm verbesserte, indem er die Arten anhand des Baus ihrer Mundwerkzeuge einordnete.","bio_fr":"Un brillant élève de Linnaeus qui améliora considérablement la taxonomie des insectes en classant les espèces d'après la structure de leurs pièces buccales.","birth_de":"Tønder (Vidå), Dänemark","birth_fr":"Tønder (Vidå), Danemark"},"Johann Christian Fabricius":{"name":"Johann Christian Fabricius","bio_de":"Ein brillanter Schüler von Linnaeus, der die Systematik der Insekten enorm verbesserte, indem er die Arten anhand des Baus ihrer Mundwerkzeuge einordnete.","bio_fr":"Un brillant élève de Linnaeus qui améliora considérablement la taxonomie des insectes en classant les espèces d'après la structure de leurs pièces buccales.","birth_de":"Tønder (Vidå), Dänemark","birth_fr":"Tønder (Vidå), Danemark"},"Sydney Parkinson":{"name":"Sydney Parkinson","bio_de":"Er segelte mit Kapitän Cook auf der HMS *Endeavour* und wurde zum allerersten europäischen Künstler, der australische Pflanzen, Tiere und Landschaften zeichnete, bevor er tragischerweise auf See starb.","bio_fr":"Il navigua avec le capitaine Cook à bord du HMS *Endeavour* et devint le tout premier artiste européen à dessiner des plantes, des animaux et des paysages australiens, avant de mourir tragiquement en mer.","birth_de":"Edinburgh (Water of Leith), Schottland","birth_fr":"Edinburgh (Water of Leith), Écosse"},"Andre Michaux":{"name":"Andre Michaux","bio_de":"Vom König von Frankreich ausgesandt, um neue Baumarten für den Bau von Kriegsschiffen zu finden, trotzte Michaux der wilden nordamerikanischen Grenzregion und überlebte unberührte Wildnis, eiskalte Flüsse und Schiffbrüche. Unterwegs brachte er charakteristische Pflanzen wie Kreppmyrten, Kamelien und Duftblüten in die amerikanischen Gärten!","bio_fr":"Envoyé par le roi de France pour trouver de nouvelles espèces d'arbres destinées à la construction de navires de guerre, Michaux affronta les régions sauvages de la frontière nord-américaine, survivant à la nature hostile, aux rivières glaciales et aux naufrages. Chemin faisant, il introduisit dans les jardins américains des plantes emblématiques comme le lilas des Indes, les camélias et les osmanthes !","birth_de":"Versailles, Frankreich","birth_fr":"Versailles, France"},"Gerard van Spaendonck":{"name":"Gerard van Spaendonck","bio_de":"Niederländischer Maler und Professor am Jardin des Plantes in Paris, der die wissenschaftliche Pflanzenillustration mithilfe der Technik des Aquarells auf Pergament auf ein neues Niveau hob.","bio_fr":"Peintre néerlandais et professeur au Jardin des Plantes à Paris, qui éleva l'illustration botanique scientifique grâce aux techniques de l'aquarelle sur vélin.","birth_de":"Tilburg (Wilhelminakanaal), Niederlande","birth_fr":"Tilburg (Wilhelminakanaal), Pays-Bas"},"William Curtis":{"name":"William Curtis","bio_de":"Er gründete 1787 das *Curtis's Botanical Magazine* – die am längsten erscheinende botanische Zeitschrift der Geschichte, die Tausende von wunderschönen Blumenbildern als Kupferstiche zu Pflanzenliebhabern in aller Welt brachte!","bio_fr":"Il fonda en 1787 le *Curtis's Botanical Magazine*, le périodique botanique le plus ancien de l'histoire, apportant des milliers de magnifiques illustrations florales gravées sur cuivre aux amateurs de plantes du monde entier !","birth_de":"Alton (Wey), England","birth_fr":"Alton (Wey), Angleterre"},"Anders Sparrman":{"name":"Anders Sparrman","bio_de":"Ein mutiger Schüler von Carl Linnaeus, der an Kapitän Cooks berühmter zweiter Weltumseglung teilnahm. Sparrman trotzte eisigen antarktischen Eisstürmen und tropischen Krankheiten und kehrte mit exotischen Pflanzen und Tieren nach Hause zurück, die noch nie ein Europäer gesehen hatte.","bio_fr":"Un courageux élève de Carl Linnaeus qui participa au célèbre deuxième tour du monde du capitaine Cook. Sparrman affronta les tempêtes de glace de l'Antarctique et les maladies tropicales, et rentra chez lui avec des plantes et des animaux exotiques que nul Européen n'avait jamais vus auparavant.","birth_de":"Tensta, Schweden","birth_fr":"Tensta, Suède"},"Antoine-Laurent de Jussieu":{"name":"Antoine-Laurent de Jussieu","bio_de":"Jussieu brachte Ordnung in das botanische Chaos. Anstatt Pflanzen nach zufälligen Einzelmerkmalen zu sortieren (etwa nach der Anzahl der Blütenblätter), fasste er sie anhand aller gemeinsamen Merkmale zu natürlichen „Familien\" zusammen – ein System, das noch heute das Rückgrat der Pflanzenklassifikation bildet!","bio_fr":"Jussieu mit de l'ordre dans le chaos botanique. Au lieu de trier les plantes selon des caractéristiques uniques et arbitraires (comme le nombre de pétales), il les regroupa en « familles » naturelles d'après l'ensemble de leurs traits communs, un système qui constitue aujourd'hui encore la colonne vertébrale de la classification des plantes !","birth_de":"Lyon, Frankreich","birth_fr":"Lyon, France"},"Félix Vicq d'Azyr":{"name":"Félix Vicq d'Azyr","bio_de":"Pionier der Neuroanatomie; er führte das Konzept der anatomischen Homologie ein und beschrieb das Vicq-d'Azyr-Bündel im Gehirn.","bio_fr":"Pionnier de la neuroanatomie ; il introduisit le concept d'homologie anatomique et décrivit le faisceau de Vicq d'Azyr dans le cerveau.","birth_de":"Valognes (Merderet), Frankreich","birth_fr":"Valognes (Merderet), France"},"Johann Friedrich Gmelin":{"name":"Johann Friedrich Gmelin","bio_de":"Er gab die 13. Auflage von Linnaeus' *Systema Naturae* heraus und erweiterte sie enorm, wobei er unzählige von frühen Forschungsreisenden entdeckte Arten offiziell benannte.","bio_fr":"Il édita et enrichit considérablement la 13e édition du *Systema Naturae* de Linnaeus, nommant officiellement d'innombrables espèces découvertes par les premiers explorateurs.","birth_de":"Tübingen (Neckar), Deutschland","birth_fr":"Tübingen (Neckar), Allemagne"},"Louis Jean Pierre Vieillot":{"name":"Louis Jean Pierre Vieillot","bio_de":"Ein echter Vogel-Detektiv! Er erkannte, dass manche vermeintlich „unterschiedlichen\" Vogelarten in Wirklichkeit ein und derselbe Vogel mit anderem Gefieder waren – weil es sich um Jungtiere, Weibchen oder Tiere in der Mauser handelte!","bio_fr":"Un véritable détective des oiseaux ! Il comprit que certaines espèces d'oiseaux soi-disant « différentes » n'étaient en fait qu'un seul et même oiseau au plumage différent, parce qu'il s'agissait de petits, de femelles ou d'oiseaux en train de muer !","birth_de":"Yvetot (Seine (in der Nähe)), Frankreich","birth_fr":"Yvetot (la Seine (à proximité)), France"},"Thomas Marsham":{"name":"Thomas Marsham","bio_de":"Mitbegründer und langjähriger Sekretär der Linnean Society of London, der *Entomologia Britannica* schrieb, einen wegweisenden wissenschaftlichen Katalog der britischen Käfer.","bio_fr":"Cofondateur et secrétaire de longue date de la Linnean Society of London, il rédigea *Entomologia Britannica*, un catalogue scientifique de référence sur les coléoptères britanniques.","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"Johann Wolfgang von Goethe":{"name":"Johann Wolfgang von Goethe","bio_de":"Obwohl er als literarischer Riese berühmt ist, war er auch ein leidenschaftlicher Botaniker und Anatom, der den Begriff „Morphologie\" prägte und den menschlichen Zwischenkieferknochen entdeckte.","bio_fr":"Bien que célèbre comme géant de la littérature, il fut aussi un botaniste et anatomiste passionné, qui inventa le terme « morphologie » et découvrit l'os intermaxillaire chez l'être humain.","birth_de":"Frankfurt (Main), Deutschland","birth_fr":"Frankfurt (le Main), Allemagne"},"Christian Konrad Sprengel":{"name":"Christian Konrad Sprengel","bio_de":"Er entdeckte, dass Blüten gezielt Farben, Düfte und Nektar einsetzen, um Insekten zur Bestäubung anzulocken, und bewies damit, dass sich Pflanzen und Insekten gemeinsam entwickelt haben, um voneinander abhängig zu sein.","bio_fr":"Il découvrit que les fleurs utilisent des couleurs, des parfums et du nectar spécialement pour attirer les insectes en vue de la pollinisation, prouvant que les plantes et les insectes ont co-évolué pour dépendre les uns des autres.","birth_de":"Brandenburg, Deutschland","birth_fr":"Brandenburg, Allemagne"},"René Louiche Desfontaines":{"name":"René Louiche Desfontaines","bio_de":"Er reiste in unruhigen Zeiten durch Nordafrika, um Tausende seltener Wüstenpflanzen zu sammeln, und bewies dabei, dass Baumstämme unterschiedlich wachsen, je nachdem, ob es sich um Einkeimblättrige oder Zweikeimblättrige handelt!","bio_fr":"Il parcourut l'Afrique du Nord en des temps troublés pour récolter des milliers de plantes désertiques rares, tout en prouvant que les troncs d'arbres poussent différemment selon qu'il s'agit de monocotylédones ou de dicotylédones !","birth_de":"Tremblay (Couesnon), Frankreich","birth_fr":"Tremblay (Couesnon), France"},"John Abbot":{"name":"John Abbot","bio_de":"Ein in England geborener amerikanischer Künstler, der sein ganzes Leben damit verbrachte, die Lebenszyklen nordamerikanischer Insekten und Vögel in Georgia wunderschön zu malen und zu dokumentieren.","bio_fr":"Un artiste américain né en Angleterre qui consacra toute sa vie à peindre et à documenter magnifiquement les cycles de vie des insectes et des oiseaux d'Amérique du Nord, en Géorgie.","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"William Roxburgh":{"name":"William Roxburgh","bio_de":"Der „Vater der indischen Botanik\"! Er leitete den riesigen Botanischen Garten von Kalkutta, katalogisierte Tausende tropischer Pflanzen Indiens und revolutionierte die nachhaltige Forst- und Landwirtschaft in ganz Asien!","bio_fr":"Le « père de la botanique indienne » ! Il dirigea l'immense Jardin botanique de Calcutta, catalogua des milliers de plantes tropicales indiennes et révolutionna la sylviculture et l'agriculture durables dans toute l'Asie !","birth_de":"Symington (Irvine), Schottland","birth_fr":"Symington (Irvine), Écosse"},"Johann Friedrich Blumenbach":{"name":"Johann Friedrich Blumenbach","bio_de":"Er gilt als Begründer der Zoologie und der Anthropologie als vergleichende Wissenschaften und ist für seine umfangreiche Schädelsammlung und seine Ideen zur naturgeschichtlichen Klassifikation bekannt.","bio_fr":"Considéré comme l'un des fondateurs de la zoologie et de l'anthropologie en tant que sciences comparatives, il est connu pour sa vaste collection de crânes et ses idées sur la classification en histoire naturelle.","birth_de":"Gotha (Nesse), Deutschland","birth_fr":"Gotha (Nesse), Allemagne"},"François Levaillant":{"name":"François Levaillant","bio_de":"Französischer Forschungsreisender, der die Vogelarten Afrikas ausgiebig untersuchte und reich illustrierte, populäre Bände über die Vogelkunde veröffentlichte, wodurch er die Naturgeschichte im Europa des 18. Jahrhunderts populär machte.","bio_fr":"Explorateur français qui étudia en profondeur les espèces d'oiseaux africaines et publia des ouvrages d'ornithologie richement illustrés et populaires, contribuant à populariser l'histoire naturelle dans l'Europe du XVIIIe siècle.","birth_de":"Paramaribo (Suriname), Niederländisch-Surinam","birth_fr":"Paramaribo (Suriname), Surinam néerlandais"},"George Montagu":{"name":"George Montagu","bio_de":"Früher englischer Naturforscher, der das *Ornithological Dictionary* verfasste, in dem er klare, auf Beobachtung gestützte Beschreibungen des Verhaltens britischer Vögel lieferte.","bio_fr":"Naturaliste anglais des débuts qui réalisa l'*Ornithological Dictionary*, offrant des descriptions empiriques claires du comportement des oiseaux britanniques.","birth_de":"Lackham House (Avon), England","birth_fr":"Lackham House (Avon), Angleterre"},"Thomas Bewick":{"name":"Thomas Bewick","bio_de":"Meisterhafter Künstler, der den Holzstich revolutionierte! Seine illustrierten Bücher *A History of British Birds* inspirierten Generationen von Naturforschern und Vogelbeobachtern.","bio_fr":"Artiste de génie qui révolutionna la gravure sur bois ! Ses livres illustrés *A History of British Birds* inspirèrent des générations de naturalistes et d'ornithologues amateurs.","birth_de":"Cherryburn (Tyne), England","birth_fr":"Cherryburn (Tyne), Angleterre"},"Archibald Menzies":{"name":"Archibald Menzies","bio_de":"Ein Schiffsarzt und Pflanzenjäger, der mit Kapitän George Vancouver segelte, dabei charakteristische Bäume wie die Douglasie entdeckte und den berühmten Affenschwanzbaum (Chilenische Araukarie) nach Europa brachte, nachdem er dessen Samen bei einer Abendgesellschaft in seine Tasche gesteckt hatte!","bio_fr":"Un chirurgien de marine et chasseur de plantes qui navigua avec le capitaine George Vancouver, découvrant des arbres emblématiques comme le sapin de Douglas et introduisant en Europe le célèbre araucaria du Chili (désespoir des singes) après avoir glissé ses graines dans sa poche lors d'un dîner !","birth_de":"Aberfeldy, Schottland","birth_fr":"Aberfeldy, Écosse"},"Georg Forster":{"name":"Georg Forster","bio_de":"Begleitete James Cook auf dessen zweiter Weltreise; schrieb einflussreiche völkerkundliche und naturkundliche Berichte über die Inseln des Pazifiks.","bio_fr":"Accompagna James Cook lors de son deuxième voyage ; il rédigea d'influents récits ethnologiques et d'histoire naturelle sur les îles du Pacifique.","birth_de":"Nassenhuben (Motława River), Polen","birth_fr":"Nassenhuben (Motława River), Pologne"},"Hipolito Ruiz Lopez":{"name":"Hipolito Ruiz Lopez","bio_de":"Leitete die gewaltige Spanische Botanische Expedition ins Vizekönigreich Peru und brachte Hunderte bis dahin unbekannter südamerikanischer Pflanzen nach Europa.","bio_fr":"Dirigea la monumentale expédition botanique espagnole vers la vice-royauté du Pérou, faisant découvrir à l'Europe des centaines de plantes sud-américaines jusque-là inconnues.","birth_de":"Belorado (Tirón River), Spanien","birth_fr":"Belorado (Tirón River), Espagne"},"Bernard Germain de Lacépède":{"name":"Bernard Germain de Lacépède","bio_de":"Ein französischer Naturforscher, der Buffons berühmte naturkundliche Reihe fortführte und mitten in den Wirren der Französischen Revolution umfassende Werke über Reptilien, Amphibien, Fische und Wale schrieb.","bio_fr":"Un naturaliste français qui poursuivit la célèbre série d'histoire naturelle de Buffon, écrivant des ouvrages complets sur les reptiles, les amphibiens, les poissons et les cétacés pendant les troubles de la Révolution française.","birth_de":"Agen, Frankreich","birth_fr":"Agen, France"},"Guillaume-Antoine Olivier":{"name":"Guillaume-Antoine Olivier","bio_de":"Französischer Insektenkundler, der wichtige Bände der *Encyclopédie Méthodique* verfasste und darin Tausende neuer Insektenarten beschrieb.","bio_fr":"Entomologiste français qui rédigea d'importants volumes de l'*Encyclopédie Méthodique*, décrivant des milliers de nouvelles espèces d'insectes.","birth_de":"Les Arcs (Argens River), Frankreich","birth_fr":"Les Arcs (Argens River), France"},"Erik Acharius":{"name":"Erik Acharius","bio_de":"Der letzte Schüler von Linné, bekannt als der \"Vater der Flechtenkunde\", weil er als Erster die Flechten umfassend und wegweisend erforschte und ordnete.","bio_fr":"Le dernier élève de Linné, surnommé le « père de la lichénologie » pour avoir été le pionnier d'une classification et d'une étude complètes des lichens.","birth_de":"Gävle (Gavleån River), Schweden","birth_fr":"Gävle (Gavleån River), Suède"},"James Sowerby":{"name":"James Sowerby","bio_de":"Gründete eine ganze Dynastie wissenschaftlicher Zeichner und brachte mit Werken wie *English Botany* enorme bildliche Klarheit in Botanik und Paläontologie.","bio_fr":"Fonda une véritable dynastie d'illustrateurs scientifiques et apporta une immense clarté visuelle à la botanique et à la paléontologie avec des ouvrages comme *English Botany*.","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"Johann Matthäus Bechstein":{"name":"Johann Matthäus Bechstein","bio_de":"Begründete die Naturschutzökologie in Deutschland, gründete eine der ersten Forstschulen und schrieb unermüdlich über die Pflege von Käfigvögeln und über Waldtiere.","bio_fr":"Pionnier de l'écologie de la conservation en Allemagne, il fonda l'une des premières écoles forestières et écrivit abondamment sur les soins des oiseaux en cage et sur la faune des forêts.","birth_de":"Waltershausen (Hörsel River), Deutschland","birth_fr":"Waltershausen (Hörsel River), Allemagne"},"Franz Bauer":{"name":"Franz Bauer","bio_de":"Wurde der allererste feste Pflanzenmaler der Kew Gardens. Er war weltweit berühmt für seine atemberaubenden, bis ins mikroskopisch Kleinste genauen Orchideenbilder.","bio_fr":"Devint le tout premier artiste botanique permanent des jardins de Kew. Il était universellement réputé pour ses peintures d'orchidées à couper le souffle, d'une précision microscopique.","birth_de":"Feldsberg (Thaya River (Dyje)), Österreich (Tschechien)","birth_fr":"Feldsberg (Thaya River (Dyje)), Autriche (Tchéquie)"},"John Sibthorp":{"name":"John Sibthorp","bio_de":"Englischer Botaniker, berühmt für sein Werk *Flora Graeca*, ein unglaublich prachtvolles, legendäres zehnbändiges Meisterwerk über die Pflanzenwelt Griechen
