lands und der Levante.","bio_fr":"Botaniste anglais célèbre pour sa *Flora Graeca*, un chef-d'œuvre légendaire d'une richesse incroyable, en dix volumes, décrivant la flore de la Grèce et du Levant.","birth_de":"Oxford (Themse), England","birth_fr":"Oxford (la Tamise), Angleterre"},"James Edward Smith":{"name":"James Edward Smith","bio_de":"Kaufte Linnés gesamte Bibliothek und Sammlung und gründete daraufhin die angesehene Linnean Society of London, um die Naturforschung weltweit zu fördern.","bio_fr":"Acheta l'intégralité de la bibliothèque et des spécimens de Linné, puis fonda la prestigieuse Linnean Society of London pour encourager l'étude de la nature dans le monde entier.","birth_de":"Norwich (River Wensum), England","birth_fr":"Norwich (River Wensum), Angleterre"},"Jean-Baptiste Audebert":{"name":"Jean-Baptiste Audebert","bio_de":"Erfand bahnbrechende Drucktechniken mit Gold- und Silberfolie, um den schimmernden Glanz exotischer Vogelfedern perfekt einzufangen.","bio_fr":"Inventa des techniques d'impression révolutionnaires utilisant des feuilles d'or et d'argent pour restituer parfaitement les reflets chatoyants des plumes d'oiseaux exotiques.","birth_de":"Rochefort (Charente River), Frankreich","birth_fr":"Rochefort (Charente River), France"},"Pierre-Joseph Redouté":{"name":"Pierre-Joseph Redouté","bio_de":"Sein Spitzname war der \"Raffael der Blumen\"! Er überstand das politische Chaos und wurde offizieller Hofmaler von Marie Antoinette und Kaiserin Joséphine und schuf die berühmtesten Rosen-Aquarelldrucke der Welt.","bio_fr":"Surnommé le « Raphaël des fleurs » ! Il survécut au chaos politique pour devenir le peintre officiel de la cour de Marie-Antoinette et de l'impératrice Joséphine, réalisant les plus célèbres aquarelles de roses au monde.","birth_de":"Saint-Hubert (Lhomme River), Belgien","birth_fr":"Saint-Hubert (Lhomme River), Belgique"},"William Kirby":{"name":"William Kirby","bio_de":"Der \"Vater der Insektenkunde in Großbritannien\"! Er verfasste zusammen mit einem Kollegen das allererste beliebte englische Lehrbuch über Insekten (*An Introduction to Entomology*) und begeisterte damit ganze Generationen von Kindern fürs Käferfangen!","bio_fr":"Le « père de l'entomologie en Grande-Bretagne » ! Il coécrivit le tout premier manuel populaire anglais sur les insectes (*An Introduction to Entomology*), donnant à des générations d'enfants l'envie d'attraper des bestioles !","birth_de":"Witnesham (River Fynn), England","birth_fr":"Witnesham (River Fynn), Angleterre"},"Ferdinand Bauer":{"name":"Ferdinand Bauer","bio_de":"Berühmt für seine bemerkenswerte wissenschaftliche Genauigkeit und sein einzigartiges Farbcode-System, das er auf der historischen Flinders-Expedition zur Erfassung der australischen Pflanzenwelt einsetzte.","bio_fr":"Célèbre pour sa remarquable précision scientifique et son système unique de codage des couleurs lors de la célèbre expédition Flinders visant à répertorier la flore australienne.","birth_de":"Feldsberg (Thaya River (Dyje)), Österreich (Tschechien)","birth_fr":"Feldsberg (Thaya River (Dyje)), Autriche (Tchéquie)"},"Olof Swartz":{"name":"Olof Swartz","bio_de":"Ein echter botanischer Pirat! Er segelte über die gefährlichen Gewässer der Karibik auf der Suche nach Schätzen, doch statt Gold fand und benannte er Tausende unbekannter, außerirdisch anmutender Orchideen!","bio_fr":"Un véritable pirate botaniste ! Il navigua sur les mers dangereuses des Caraïbes à la recherche de trésors, mais au lieu d'or, il trouva et nomma des milliers d'orchidées inconnues aux allures extraterrestres !","birth_de":"Norrköping (Motala ström), Schweden","birth_fr":"Norrköping (Motala ström), Suède"},"Sarah Stone":{"name":"Sarah Stone","bio_de":"Malte Hunderte fremdartiger, unbekannter Tiere aus dem Pazifik und Australien, die auf Kapitän James Cooks historischen Weltumseglungen nach England gebracht wurden!","bio_fr":"Peignit des centaines de créatures étranges et inconnues du Pacifique et d'Australie, rapportées en Angleterre lors des voyages historiques du capitaine James Cook autour du monde !","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"Christiaan Hendrik Persoon":{"name":"Christiaan Hendrik Persoon","bio_de":"Gilt als Wegbereiter der systematischen Pilzkunde: Persoon schuf das erste geordnete System zur Einteilung von Pilzarten.","bio_fr":"Considéré comme un pionnier de la mycologie systématique, Persoon créa le premier système organisé pour classer les champignons.","birth_de":"Kap der Guten Hoffnung, Südafrika","birth_fr":"Cap de Bonne-Espérance, Afrique du Sud"},"Jacob Hübner":{"name":"Jacob Hübner","bio_de":"Deutscher Insektenkundler, dessen unglaublich umfassende, reich bebilderte Werke die Grundlagen der Systematik für Schmetterlinge und Motten legten.","bio_fr":"Entomologiste allemand dont les ouvrages illustrés, d'une richesse incroyable, posèrent les bases de la classification des papillons de jour et de nuit.","birth_de":"Augsburg (Lech River), Deutschland","birth_fr":"Augsbourg (Lech River), Allemagne"},"Kaspar Maria von Sternberg":{"name":"Kaspar Maria von Sternberg","bio_de":"Der \"Vater der Paläobotanik\"! Er betrachtete Kohlebrocken und erkannte, dass es sich in Wirklichkeit um zusammengepresste, Millionen Jahre alte versteinerte Urzeitpflanzen handelte!","bio_fr":"Le « père de la paléobotanique » ! En observant des morceaux de charbon, il comprit qu'il s'agissait en réalité de plantes préhistoriques fossilisées, écrasées et vieilles de millions d'années !","birth_de":"Prag (Moldau), Böhmen (Tschechien)","birth_fr":"Prague (Vltava), Bohême (Tchéquie)"},"Pierre André Latreille":{"name":"Pierre André Latreille","bio_de":"Während der Französischen Revolution vor der Guillotine gerettet, weil er in den Dielen seiner Gefängniszelle einen seltenen Käfer fand! Der Gefängnisarzt erkannte das seltene Insekt, begriff, dass Latreille ein Genie war, und sorgte für seine Freilassung!","bio_fr":"Sauvé de la guillotine pendant la Révolution française parce qu'il avait trouvé un coléoptère rare dans le plancher de sa cellule ! Le médecin de la prison reconnut l'insecte rare, comprit que Latreille était un génie et le fit libérer !","birth_de":"Brive-la-Gaillarde (Corrèze River), Frankreich","birth_fr":"Brive-la-Gaillarde (Corrèze River), France"},"Johann Wilhelm Meigen":{"name":"Johann Wilhelm Meigen","bio_de":"Ein Begründer der modernen Fliegenkunde (Dipterologie), der ein bahnbrechendes Klassifizierungssystem auf Grundlage der Flügeladerung von Insekten aufstellte.","bio_fr":"Un fondateur de la diptérologie moderne (l'étude des mouches), qui établit un système de classification révolutionnaire fondé sur la nervation des ailes des insectes.","birth_de":"Solingen (Wupper River), Deutschland","birth_fr":"Solingen (Wupper River), Allemagne"},"Carl Ludwig Willdenow":{"name":"Carl Ludwig Willdenow","bio_de":"Als Mentor von Alexander von Humboldt war Willdenow ein früher Wegbereiter der Pflanzengeografie und untersuchte, wie Klima und Gelände bestimmen, wo bestimmte Pflanzenarten wachsen können.","bio_fr":"Mentor d'Alexander von Humboldt, Willdenow fut un pionnier de la phytogéographie, étudiant comment le climat et le relief déterminent les endroits où certaines espèces de plantes peuvent pousser.","birth_de":"Berlin, Deutschland","birth_fr":"Berlin, Allemagne"},"Alexander Wilson":{"name":"Alexander Wilson","bio_de":"Ein früherer Weber und Dichter, der nach Amerika floh. Wilson wanderte Tausende Kilometer durch wilde Wälder und Sümpfe, um jede Vogelart zu zeichnen und zu malen, die er finden konnte. Er veröffentlichte den ersten umfassenden Führer über die Vögel Amerikas und erhielt dafür den Titel \"Vater der amerikanischen Vogelkunde\".","bio_fr":"Ancien tisserand et poète qui s'enfuit en Amérique, Wilson parcourut des milliers de kilomètres à travers forêts sauvages et marécages pour dessiner et peindre chaque espèce d'oiseau qu'il pouvait trouver. Il publia le premier guide complet des oiseaux d'Amérique, ce qui lui valut le titre de « père de l'ornithologie américaine ».","birth_de":"Paisley, Schottland","birth_fr":"Paisley, Écosse"},"Pierre Antoine Poiteau":{"name":"Pierre Antoine Poiteau","bio_de":"Stieg vom mittellosen Gartenarbeiter auf und malte für Kaiserin Joséphine von Frankreich überaus detailreiche, appetitanregende Bilder exotischer Früchte und tropischer Pflanzen!","bio_fr":"Simple ouvrier de jardin sans le sou au départ, il s'éleva jusqu'à peindre pour l'impératrice Joséphine de France des illustrations ultra-détaillées et appétissantes de fruits exotiques et de feuillages tropicaux !","birth_de":"Ambleny (Aisne River), Frankreich","birth_fr":"Ambleny (Aisne River), France"},"Thomas Robert Malthus":{"name":"Thomas Robert Malthus","bio_de":"Erkannte, dass Bevölkerungen schneller wachsen als die Nahrungsmittel und dass daraus ein erbitterter Kampf ums Überleben entsteht — genau die Idee, die Charles Darwin und Alfred Russel Wallace den zündenden Funken zur Entdeckung der natürlichen Selektion gab!","bio_fr":"Comprit que les populations croissent plus vite que les réserves de nourriture, entraînant une lutte acharnée pour la survie — l'idée précise qui donna à Charles Darwin et à Alfred Russel Wallace l'étincelle pour découvrir la sélection naturelle !","birth_de":"Westcott (River Tillingbourne), England","birth_fr":"Westcott (River Tillingbourne), Angleterre"},"Adrian Hardy Haworth":{"name":"Adrian Hardy Haworth","bio_de":"Haworth war so besessen von Sukkulenten und Schmetterlingen, dass er sein Zuhause in ein lebendes Labor voller fleischiger Kakteen und flatternder Falter verwandelte. Er liebte es, winzige Details zu beschreiben, die andere Wissenschaftler übersahen, und verbrachte Stunden damit, feine Unterschiede in Blattformen und Schmetterlingsflügelmustern zu klassifizieren.","bio_fr":"Haworth était si obsédé par les plantes grasses et les papillons qu'il transforma sa maison en un laboratoire vivant rempli de cactus charnus et de spécimens voletants. Il adorait décrire les moindres détails que les autres scientifiques manquaient, passant des heures à classer les subtiles différences dans la forme des feuilles et les motifs des ailes de papillons.","birth_de":"Hull, England","birth_fr":"Hull, Angleterre"},"Edward Donovan":{"name":"Edward Donovan","bio_de":"Anglo-irischer Autor und Illustrator, der außergewöhnlich beliebte, sehr detailreiche Werke wie *The Natural History of British Insects* und *British Birds* veröffentlichte.","bio_fr":"Écrivain et illustrateur anglo-irlandais qui publia des ouvrages extrêmement populaires et très détaillés, tels que *The Natural History of British Insects* et *British Birds*.","birth_de":"Cork (River Lee), Irland","birth_fr":"Cork (River Lee), Irlande"},"Jacques Barraband":{"name":"Jacques Barraband","bio_de":"Ein hoch angesehener französischer Künstler, der einige der lebendigsten, genauesten und begehrtesten Darstellungen tropischer Vögel schuf, die je gedruckt wurden.","bio_fr":"Un artiste français très estimé qui réalisa certaines des illustrations d'oiseaux tropicaux les plus éclatantes, les plus fidèles et les plus prisées jamais imprimées.","birth_de":"Aubusson (Creuse River), Frankreich","birth_fr":"Aubusson (Creuse River), France"},"Robert John Thornton":{"name":"Robert John Thornton","bio_de":"Ruinierte sich finanziell, um *The Temple of Flora* herauszugeben — die dramatisch-romantischste und üppigst bebilderte Sammlung von Blumendrucken der Geschichte!","bio_fr":"Se ruina pour publier *The Temple of Flora* — la collection d'estampes florales la plus spectaculairement romantique et la plus richement illustrée de l'histoire !","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"Sydenham Edwards":{"name":"Sydenham Edwards","bio_de":"Ein meisterhafter Künstler, der jahrzehntelang Tausende exotischer Pflanzen für *Curtis's Botanical Magazine* illustrierte und das weltberühmte *Botanical Register* gründete!","bio_fr":"Un artiste hors pair qui passa des décennies à illustrer des milliers de plantes exotiques pour le *Curtis's Botanical Magazine* et fonda le célèbre *Botanical Register* !","birth_de":"Abergavenny (River Usk), Wales","birth_fr":"Abergavenny (River Usk), Pays de Galles"},"Alexander von Humboldt":{"name":"Alexander von Humboldt","bio_de":"Humboldt war der ultimative Wissenschafts-Superstar — er testete Zitteraale an der eigenen Haut, bestieg aktive Vulkane ohne moderne Ausrüstung und erkannte, dass die Natur ein einziges, miteinander verwobenes Netz ist, lange bevor es das Wort \"Ökologie\" überhaupt gab. Nach ihm sind mehr Orte, Flüsse und Gebirge benannt als nach jedem anderen Menschen der Geschichte!","bio_fr":"Humboldt était la superstar absolue de la science — il testa des anguilles électriques sur sa propre peau, gravit des volcans en activité sans équipement moderne et comprit que la nature forme un seul et même réseau interconnecté bien avant que le mot « écologie » n'existe. Plus de lieux, de rivières et de chaînes de montagnes portent son nom que celui de n'importe qui d'autre dans l'histoire !","birth_de":"Berlin, Deutschland","birth_fr":"Berlin, Allemagne"},"Georges Cuvier":{"name":"Georges Cuvier","bio_de":"\"Vater der Paläontologie.\" Er wies nach, dass das Aussterben eine biologische Tatsache ist, und entwickelte das Konzept des Katastrophismus.","bio_fr":"« Père de la paléontologie. » Il établit que l'extinction est une réalité biologique et développa le concept de catastrophisme.","birth_de":"Montbéliard (Allan River), Frankreich","birth_fr":"Montbéliard (Allan River), France"},"William Smith":{"name":"William Smith","bio_de":"Mit dem Spitznamen \"Strata Smith\"! Er schuf die allererste landesweite geologische Karte der Welt, als er erkannte, dass sich bestimmte Fossilschichten unter der Erde nutzen lassen, um die Gesteinsschichten eines ganzen Landes zu kartieren!","bio_fr":"Surnommé « Strata Smith » ! Il créa la toute première carte géologique nationale au monde en comprenant que certaines couches de fossiles souterraines pouvaient servir à cartographier les strates rocheuses de tout un pays !","birth_de":"Churchill (River Evenlode), England","birth_fr":"Churchill (River Evenlode), Angleterre"},"Amédée Louis Michel Lepeletier de Saint-Fargeau":{"name":"Amédée Louis Michel Lepeletier de Saint-Fargeau","bio_de":"Lepeletier war besessen von den Stacheln und dem Gemeinschaftsleben der Bienen, Wespen und Ameisen. Sein Leben lang fing er stechende Insekten und ordnete ihr komplexes Verhalten. Er schrieb die maßgeblichen Handbücher darüber, wie diese winzigen Geschöpfe ihre Stöcke und unterirdischen Festungen organisieren.","bio_fr":"Lepeletier était obsédé par les dards et la vie sociale des abeilles, des guêpes et des fourmis. Il passa sa vie à capturer des insectes piqueurs et à répertorier leurs comportements complexes, écrivant les guides de référence sur la manière dont ces minuscules créatures organisent leurs ruches et leurs forteresses souterraines.","birth_de":"Paris, Frankreich","birth_fr":"Paris, France"},"Christian Rudolph Wilhelm Wiedemann":{"name":"Christian Rudolph Wilhelm Wiedemann","bio_de":"Der ultimative Fliegenspezialist! Er verfasste die allerersten systematischen wissenschaftlichen Studien über tropische Fliegen, Mücken und Stechmücken, die aus Ökosystemen rund um die Welt gesammelt wurden.","bio_fr":"Le spécialiste absolu des mouches ! Il rédigea les toutes premières études scientifiques systématiques sur les mouches, les moustiques et les moucherons tropicaux récoltés dans des écosystèmes du monde entier.","birth_de":"Braunschweig (Oker River), Deutschland","birth_fr":"Brunswick (Oker River), Allemagne"},"Francois Andre Michaux":{"name":"Francois Andre Michaux","bio_de":"Französischer Botaniker, der *The North American Sylva* verfasste, ein bahnbrechendes Grundlagenwerk der amerikanischen Forstwirtschaft und Baumökologie.","bio_fr":"Botaniste français qui rédigea *The North American Sylva*, une œuvre fondatrice et majeure de la sylviculture et de l'écologie forestière américaines.","birth_de":"Versailles (Seine), Frankreich","birth_fr":"Versailles (la Seine), France"},"Charles Athanase Walckenaer":{"name":"Charles Athanase Walckenaer","bio_de":"Ein französischer Beamter, der von Spinnen besessen war und wegweisende Bestimmungswerke für Spinnentiere schuf und ihr wildes Verhalten kartierte.","bio_fr":"Un fonctionnaire français obsédé par les araignées, qui créa des guides de classification révolutionnaires pour les arachnides et cartographia leurs comportements fascinants.","birth_de":"Paris, Frankreich","birth_fr":"Paris, France"},"Jakob Sturm":{"name":"Jakob Sturm","bio_de":"Deutscher Kupferstecher, dessen wunderschön gestaltete naturkundliche Miniaturbücher hochwertiges wissenschaftliches Wissen für die breite Öffentlichkeit zugänglich machten.","bio_fr":"Graveur allemand dont les petits livres d'histoire naturelle magnifiquement réalisés rendirent des connaissances scientifiques de grande qualité accessibles au grand public.","birth_de":"Nürnberg (Pegnitz River), Deutschland","birth_fr":"Nuremberg (Pegnitz River), Allemagne"},"Carl Johan Schönherr":{"name":"Carl Johan Schönherr","bio_de":"Ein wohlhabender Seidenfabrikant, der sich früh zur Ruhe setzte, um sich ganz den Käfern zu widmen, und schließlich ein weltweit maßgebliches, mehrbändiges Werk über Rüsselkäfer veröffentlichte.","bio_fr":"Un riche fabricant de soie qui prit sa retraite tôt pour se consacrer entièrement aux coléoptères, publiant finalement un guide de référence mondiale en plusieurs volumes sur les charançons.","birth_de":"Stockholm, Schweden","birth_fr":"Stockholm, Suède"},"Pancrace Bessa":{"name":"Pancrace Bessa","bio_de":"Malte Blumen so lebendig, dass der französische Adel ihn anstellte, um seinen Kindern das Malen beizubringen! Er verwandelte trockene Pflanzenkunde in wahre optische Meisterwerke.","bio_fr":"Peignait des fleurs si éclatantes que la royauté française l'engagea pour enseigner l'art à ses enfants ! Il transforma la science des plantes, plutôt ennuyeuse, en véritables chefs-d'œuvre visuels.","birth_de":"Paris (Seine), Frankreich","birth_fr":"Paris (la Seine), France"},"Étienne Geoffroy Saint-Hilaire":{"name":"Étienne Geoffroy Saint-Hilaire","bio_de":"Stellte die These auf, dass alle Tierarten auf einem einzigen zugrunde liegenden anatomischen \"Bauplan\" beruhen, und löste damit eine legendäre, hitzige Debatte mit Georges Cuvier darüber aus, wie das Leben sich entwickelt hat!","bio_fr":"Avança l'idée que toutes les espèces animales reposent sur un unique « plan d'organisation » anatomique fondamental, déclenchant un débat légendaire et explosif avec Georges Cuvier sur la façon dont la vie a évolué !","birth_de":"Étampes (Juine River), Frankreich","birth_fr":"Étampes (Juine River), France"},"Aime Bonpland":{"name":"Aime Bonpland","bio_de":"Bonpland war ein Botaniker-Abenteurer, der Begegnungen mit Jaguaren, Stromschläge von Zitteraalen und den Aufstieg hoch in die Anden an der Seite von Alexander von Humboldt überstand. Sein Leben war so wild, dass ihn ein südamerikanischer Diktator einmal entführte und neun Jahre lang in Paraguay unter Hausarrest hielt, weil er fürchtete, Bonpland könnte eine einträgliche Teeplantage gründen!","bio_fr":"Bonpland était un botaniste-aventurier qui survécut à des rencontres avec des jaguars, aux décharges d'anguilles électriques et à l'ascension des hauteurs des Andes aux côtés d'Alexander von Humboldt. Sa vie fut si mouvementée qu'un dictateur sud-américain le kidnappa un jour et le retint en résidence surveillée au Paraguay pendant neuf ans, craignant que Bonpland ne lance une lucrative plantation de thé !","birth_de":"La Rochelle, Frankreich","birth_fr":"La Rochelle, France"},"Robert Brown":{"name":"Robert Brown","bio_de":"Entdeckte den Zellkern im Inneren lebender Zellen UND bemerkte, wie mikroskopisch kleine Pollenkörner zufällig im Wasser umhertanzten — ein physikalisches Phänomen, das heute überall als \"Brownsche Bewegung\" bekannt ist!","bio_fr":"Découvrit le noyau à l'intérieur des cellules vivantes ET remarqua que de minuscules grains de pollen dansaient au hasard dans l'eau — un phénomène physique aujourd'hui connu partout sous le nom de « mouvement brownien » !","birth_de":"Montrose (River South Esk), Schottland","birth_fr":"Montrose (River South Esk), Écosse"},"Thomas Horsfield":{"name":"Thomas Horsfield","bio_de":"Ein amerikanischer Arzt, der jahrelang die dichten, ungezähmten Dschungel Javas erkundete und dabei Dutzende brandneuer asiatischer Säugetier- und Vogelarten katalogisierte und beschrieb!","bio_fr":"Un médecin américain qui passa des années à explorer les jungles denses et sauvages de Java, cataloguant et décrivant des dizaines de nouvelles espèces de mammifères et d'oiseaux d'Asie !","birth_de":"Bethlehem (Lehigh River), USA","birth_fr":"Bethlehem (Lehigh River), États-Unis"},"André Marie Constant Duméril":{"name":"André Marie Constant Duméril","bio_de":"Duméril war der gefragte Reptilien- und Fischexperte von Paris. Er schuf eine gewaltige, neunbändige Enzyklopädie der Reptilien (*Erpétologie Générale*), die über 1.300 Arten von Schlangen, Echsen und Schildkröten einordnete und den Maßstab dafür setzte, wie wir wechselwarme Tiere erforschen.","bio_fr":"Duméril était l'expert incontournable de Paris pour les reptiles et les poissons. Il créa une immense encyclopédie des reptiles en 9 volumes (*Erpétologie Générale*) qui classa plus de 1 300 espèces de serpents, de lézards et de tortues, établissant la référence pour l'étude des animaux à sang froid.","birth_de":"Amiens, Frankreich","birth_fr":"Amiens, France"},"Frederick Traugott Pursh":{"name":"Frederick Traugott Pursh","bio_de":"Deutsch-amerikanischer Botaniker, der *Flora Americae Septentrionalis* zusammenstellte, eine der frühesten vollständigen Beschreibungen der Pflanzen Nordamerikas.","bio_fr":"Botaniste germano-américain qui compila *Flora Americae Septentrionalis*, l'une des toutes premières descriptions complètes des plantes d'Amérique du Nord.","birth_de":"Großenhain (Röder River), Deutschland","birth_fr":"Großenhain (Röder River), Allemagne"},"Georg Heinrich von Langsdorff":{"name":"Georg Heinrich von Langsdorff","bio_de":"Leitete bedeutende wissenschaftliche Expeditionen ins Landesinnere Brasiliens und trug riesige Sammlungen botanischer und zoologischer Exemplare zusammen.","bio_fr":"A dirigé d'importantes expeditions scientifiques dans l'interieur du Bresil, rassemblant d'immenses collections de specimens botaniques et zoologiques.","birth_de":"Wöllstein (Appelbach), Deutschland","birth_fr":"Wöllstein (Appelbach), Allemagne"},"Friedrich Schelling":{"name":"Friedrich Schelling","bio_de":"Bedeutender deutscher Philosoph des Idealismus, dessen Werk versuchte, die Kluft zwischen dem menschlichen Geist und der lebendigen Natur zu überbrücken.","bio_fr":"Grand philosophe idealiste allemand dont l'oeuvre a tente de combler le fosse entre l'esprit humain et le monde naturel vivant.","birth_de":"Leonberg (Glems), Deutschland","birth_fr":"Leonberg (Glems), Allemagne"},"Jean Guillaume Audinet-Serville":{"name":"Jean Guillaume Audinet-Serville","bio_de":"Französischer Insektenforscher, der bahnbrechende frühe Einteilungen für Heuschrecken (Orthoptera) und Wanzen (Hemiptera) nach Körperbau schuf.","bio_fr":"Entomologiste francais qui a cree des classifications structurelles precoces et tres importantes pour les sauterelles (Orthoptera) et les punaises (Hemiptera).","birth_de":"Paris (Seine), Frankreich","birth_fr":"Paris (Seine), France"},"Johann Karl Wilhelm Illiger":{"name":"Johann Karl Wilhelm Illiger","bio_de":"Entwickelte frühe systematische Einteilungen von Säugetieren und Insekten und betonte, wie wichtig Familienstrukturen für die biologische Systematik sind.","bio_fr":"A elabore des classifications systematiques precoces des mammiferes et des insectes, soulignant l'importance des structures familiales dans la taxonomie biologique.","birth_de":"Braunschweig (Oker), Deutschland","birth_fr":"Braunschweig (Oker), Allemagne"},"Pierre Jean François Turpin":{"name":"Pierre Jean François Turpin","bio_de":"Verband höchste künstlerische Schönheit mit mikroskopischer Genauigkeit! Er blickte durch Linsen, um hochpräzise Pflanzenzellen zu zeichnen, und enthüllte so mikroskopische biologische Strukturen, die nie zuvor gesehen worden waren.","bio_fr":"Il alliait une extreme beaute artistique a une precision microscopique ! Il scrutait a travers des lentilles pour dessiner des cellules vegetales ultra-precises, revelant des structures biologiques microscopiques jamais vues auparavant.","birth_de":"Vire (Vire), Frankreich","birth_fr":"Vire (Vire), France"},"Henri Marie Ducrotay de Blainville":{"name":"Henri Marie Ducrotay de Blainville","bio_de":"Französischer Zoologe, der den Begriff *paleontology* prägte und Cuvier auf dem Lehrstuhl für vergleichende Anatomie in Paris nachfolgte.","bio_fr":"Zoologiste francais qui a invente le terme *paleontology* et a succede a Cuvier a la chaire d'anatomie comparee de Paris.","birth_de":"Arques-la-Bataille (Varenne), Frankreich","birth_fr":"Arques-la-Bataille (Varenne), France"},"Augustin-Pyramus de Candolle":{"name":"Augustin-Pyramus de Candolle","bio_de":"Ein berühmter Botaniker, der den Begriff Taxonomie prägte, um die Wissenschaft vom Ordnen der Lebewesen zu beschreiben, und der entdeckte, dass die Blattbewegungen von Pflanzen einer inneren biologischen Uhr folgen.","bio_fr":"Un botaniste celebre qui a invente le terme taxonomie pour decrire la science du classement des etres vivants, et qui a decouvert que les mouvements des feuilles des plantes suivent une horloge biologique interne.","birth_de":"Genf, Schweiz","birth_fr":"Geneve, Suisse"},"Charles Alexandre Lesueur":{"name":"Charles Alexandre Lesueur","bio_de":"Ein Künstler und Naturforscher, der Australien und Nordamerika erkundete und Tausende wunderschöner Zeichnungen von Quallen, Fischen und Süßwasserschildkröten anfertigte.","bio_fr":"Un artiste-naturaliste qui a explore l'Australie et l'Amerique du Nord, produisant des milliers de superbes dessins de meduses, de poissons et de tortues d'eau douce.","birth_de":"Le Havre, Frankreich","birth_fr":"Le Havre, France"},"Coenraad Jacob Temminck":{"name":"Coenraad Jacob Temminck","bio_de":"Gründer und langjähriger Direktor des Naturalis-Museums in Leiden, der Tausende neuer Säugetier- und Vogelarten untersuchte und benannte, die von Expeditionen aus Ostasien und Afrika mitgebracht wurden!","bio_fr":"Fondateur et directeur de longue date du musee Naturalis a Leyde, qui a analyse et nomme des milliers de nouvelles especes de mammiferes et d'oiseaux rapportees d'expeditions en Asie de l'Est et en Afrique !","birth_de":"Amsterdam (Amstel), Niederlande","birth_fr":"Amsterdam (Amstel), Pays-Bas"},"Auguste de Saint-Hilaire":{"name":"Auguste de Saint-Hilaire","bio_de":"Ein mutiger französischer Botaniker, der sechs Jahre lang durch das wilde Landesinnere Brasiliens wanderte, dabei über 30 000 Pflanzenexemplare sammelte und südamerikanische Ökosysteme kartierte.","bio_fr":"Un courageux botaniste francais qui a passe six ans a parcourir l'interieur sauvage du Bresil, collectant plus de 30 000 specimens de plantes et cartographiant les ecosystemes sud-americains.","birth_de":"Orléans, Frankreich","birth_fr":"Orleans, France"},"Lorenz Oken":{"name":"Lorenz Oken","bio_de":"Ein wilder, rebellischer Wissenschaftler, der glaubte, das gesamte Universum sei wie ein einziger riesiger lebender Organismus. Er sagte voraus, dass alle Tiere aus winzigen \"Infusorien\" bestehen, noch bevor die Zelltheorie vollständig bewiesen war!","bio_fr":"Un scientifique sauvage et rebelle qui pensait que l'univers entier etait comme un unique gigantesque organisme vivant. Il a predit que tous les animaux etaient faits de minuscules \"infusoires\" avant meme que la theorie cellulaire ne soit pleinement prouvee !","birth_de":"Bohlsbach (Kinzig), Deutschland","birth_fr":"Bohlsbach (Kinzig), Allemagne"},"William Hooker (fruit painter)":{"name":"William Hooker (fruit painter)","bio_de":"Berühmter Obstmaler der London Horticultural Society! Seine unglaublich realistischen, geradezu köstlich aussehenden Gemälde von Äpfeln, Pflaumen und Pfirsichen setzten den Goldstandard für die Obstmalerei!","bio_fr":"Celebre peintre de fruits pour la London Horticultural Society ! Ses tableaux incroyablement realistes et alléchants de pommes, de prunes et de peches ont etabli la reference absolue en matiere de peinture de fruits !","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"Johann Friedrich Naumann":{"name":"Johann Friedrich Naumann","bio_de":"Gilt als Begründer der modernen Vogelkunde in Europa. Sein mehrbändiges Werk *Natural History of the Birds of Germany* setzte den Goldstandard für Bestimmungsbücher.","bio_fr":"Reconnu comme le fondateur de l'ornithologie moderne en Europe. Son ouvrage en plusieurs volumes *Natural History of the Birds of Germany* a etabli la reference absolue pour les guides d'identification.","birth_de":"Ziebigk (Elbe), Deutschland","birth_fr":"Ziebigk (Elbe), Allemagne"},"Maximilian Spinola":{"name":"Maximilian Spinola","bio_de":"Ein italienischer Adliger, in Frankreich geboren, der völlig besessen von Insekten war! Er benannte und beschrieb Hunderte neuer Insektenarten und erstellte einen riesigen Katalog von Wespen und Käfern!","bio_fr":"Un noble italien ne en France qui etait totalement obsede par les insectes ! Il a nomme et decrit des centaines de nouvelles especes d'insectes, creant un immense catalogue de guepes et de coleopteres !","birth_de":"Toulouse (Garonne), Frankreich","birth_fr":"Toulouse (la Garonne), France"},"Pierre François Marie Auguste Dejean":{"name":"Pierre François Marie Auguste Dejean","bio_de":"Ein hochrangiger General unter Napoleon, der Käfer *auf aktiven Schlachtfeldern* sammelte! Der Legende nach spießte er seltene Exemplare mitten im Kampf direkt an seinem Militärhelm auf!","bio_fr":"Un general de haut rang sous Napoleon qui collectionnait des coleopteres *sur des champs de bataille en pleine action* ! La legende raconte qu'il epinglait des specimens rares directement sur son casque militaire en plein combat !","birth_de":"Amiens (Somme), Frankreich","birth_fr":"Amiens (la Somme), France"},"Adelbert von Chamisso":{"name":"Adelbert von Chamisso","bio_de":"Ein bemerkenswertes Universalgenie, das auf einer wissenschaftlichen Expedition die Welt umsegelte, neue Pflanzen entdeckte (darunter den Kalifornischen Mohn) und Durchbrüche bei der Fortpflanzung von Organismen erzielte. Als französischer Adliger, der vor der Französischen Revolution fliehen musste, wurde er später ein gefeierter deutscher Dichter und ein zäher Weltumsegler.","bio_fr":"Un remarquable esprit universel qui a fait le tour du monde lors d'une expedition scientifique, a decouvert de nouvelles plantes (dont le pavot de Californie) et a realise des percees sur la reproduction des organismes. Aristocrate francais contraint de fuir la Revolution francaise, il est devenu un poete allemand celebre et un robuste explorateur du tour du monde.","birth_de":"Champagne, Frankreich","birth_fr":"Champagne, France"},"Johann Baptist von Spix":{"name":"Johann Baptist von Spix","bio_de":"Leitete zusammen mit Carl Friedrich Philipp von Martius eine gewaltige Expedition nach Brasilien und brachte Tausende bis dahin unbekannter Tierarten nach Europa.","bio_fr":"A dirige une expedition monumentale au Bresil aux cotes de Carl Friedrich Philipp von Martius, ramenant en Europe des milliers d'especes animales jusqu'alors inconnues.","birth_de":"Höchstadt (Aisch), Deutschland","birth_fr":"Höchstadt (Aisch), Allemagne"},"Pauline Knip":{"name":"Pauline Knip","bio_de":"Sie malte Tauben. Klingt langweilig? Ihre Taubengemälde waren so unglaublich hyperrealistisch, dass sie zur offiziellen Künstlerin der Königin von Neapel wurde!","bio_fr":"Elle peignait des pigeons. Ca a l'air ennuyeux ? Ses tableaux de pigeons etaient si incroyablement hyperrealistes qu'elle est devenue l'artiste officielle de la reine de Naples !","birth_de":"Paris (Seine), Frankreich","birth_fr":"Paris (Seine), France"},"William John Burchell":{"name":"William John Burchell","bio_de":"Legte über 4 500 Meilen durch das wilde Südafrika in einem maßgefertigten Ochsenwagen zurück, sammelte 60 000 Exemplare (darunter Burchells Zebra) und erstellte superpräzise Wildniskarten!","bio_fr":"A parcouru plus de 4 500 miles a travers l'Afrique du Sud sauvage dans un chariot a boeufs sur mesure, collectant 60 000 specimens (dont le zebre de Burchell) et dressant des cartes ultra-precises des regions sauvages !","birth_de":"Fulham (London) (Themse), England","birth_fr":"Fulham (London) (la Tamise), Angleterre"},"Charles Waterton":{"name":"Charles Waterton","bio_de":"Ein exzentrischer Naturforscher, der auf seinem Gut eines der weltweit ersten Naturschutzgebiete anlegte und mit dem amazonischen Pfeilgift Curare experimentierte, um seine medizinischen Eigenschaften zu entdecken.","bio_fr":"Un naturaliste excentrique qui a cree l'une des premieres reserves naturelles au monde sur son domaine et a experimente le curare, un poison de fleche amazonien, pour en decouvrir les proprietes medicales.","birth_de":"Wakefield, England","birth_fr":"Wakefield, Angleterre"},"Georg August Goldfuss":{"name":"Georg August Goldfuss","bio_de":"Deutscher Paläontologe, der den Begriff *protozoa* prägte und wichtige frühe Arbeiten zur Beschreibung deutscher fossiler Wirbelloser und Wirbeltiere leistete.","bio_fr":"Paleontologue allemand qui a invente le terme *protozoa* et a realise des travaux precoces essentiels sur la description des invertebres et des vertebres fossiles allemands.","birth_de":"Thurnau (Roter Main), Deutschland","birth_fr":"Thurnau (Roter Main), Allemagne"},"Maximilian zu Wied-Neuwied":{"name":"Maximilian zu Wied-Neuwied","bio_de":"Ein echter Prinz, der sein luxuriöses Schlossleben aufgab, um tief in den Amazonas-Dschungel und den Wilden Westen Amerikas zu reisen und dort Grizzlybären und indigene Völker zu erforschen!","bio_fr":"Un veritable prince qui a renonce a sa vie de chateau luxueuse pour s'enfoncer dans la jungle amazonienne et le Far West americain afin d'etudier les grizzlis et les peuples autochtones !","birth_de":"Neuwied (Rhein), Deutschland","birth_fr":"Neuwied (le Rhin), Allemagne"},"Constantine Samuel Rafinesque":{"name":"Constantine Samuel Rafinesque","bio_de":"Ein exzentrisches, autodidaktisches Genie, das Tausende nordamerikanischer Pflanzen- und Tierarten benannte, wilde Flusstäler an der Grenze erkundete und die Evolution treffsicher vor Darwin vorhersagte!","bio_fr":"Un genie excentrique et autodidacte qui a nomme des milliers d'especes vegetales et animales nord-americaines, explore des vallees fluviales sauvages aux frontieres, et predit avec justesse l'evolution avant Darwin !","birth_de":"Galata (Istanbul) (Bosporus), Türkei","birth_fr":"Galata (Istanbul) (le Bosphore), Turquie"},"William Spence":{"name":"William Spence","bio_de":"Verfasste zusammen mit William Kirby das legendäre vierbändige Werk *Introduction to Entomology* – den überragenden Bestseller, der die Insektenjagd zu einer weltweiten Massenbegeisterung machte!","bio_fr":"A co-ecrit avec William Kirby le legendaire ouvrage en 4 volumes *Introduction to Entomology* — le best-seller phenomenal qui a transforme la chasse aux insectes en une passion mondiale grand public !","birth_de":"Bishop Burton (River Hull), England","birth_fr":"Bishop Burton (River Hull), Angleterre"},"William Buckland":{"name":"William Buckland","bio_de":"Beschrieb 1824 wissenschaftlich den allerersten benannten Dinosaurier – *Megalosaurus*! Er war berühmt für seine exzentrischen Experimente und dafür, dass er jede einzelne Tierart der Erde probieren wollte!","bio_fr":"A decrit scientifiquement le tout premier dinosaure nomme — *Megalosaurus* — en 1824 ! Il etait celebre pour ses experiences excentriques et pour vouloir gouter chaque espece animale de la Terre !","birth_de":"Axminster (River Axe), England","birth_fr":"Axminster (River Axe), Angleterre"},"William Yarrell":{"name":"William Yarrell","bio_de":"Ein Londoner Zeitungshändler, der zum Supernaturforscher wurde, meisterhafte Nachschlagewerke über britische Vögel und Fische schrieb und erfolgreich bewies, dass der Zwergschwan eine völlig eigenständige Art ist!","bio_fr":"Un marchand de journaux londonien devenu super-naturaliste qui a ecrit des ouvrages de reference majeurs sur les oiseaux et les poissons britanniques, et a prouve avec succes que le cygne de Bewick etait une espece entierement distincte !","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"John James Audubon":{"name":"John James Audubon","bio_de":"Malte, katalogisierte und beschrieb die Vögel Nordamerikas in einem Stil, der jedem früheren Werk weit überlegen war, in seinem epischen Meisterwerk *The Birds of America*.","bio_fr":"A peint, catalogue et decrit les oiseaux d'Amerique du Nord dans un style bien superieur a tout ouvrage precedent, dans son chef-d'oeuvre epique *The Birds of America*.","birth_de":"Les Cayes (Ravine du Sud), Saint-Domingue (Haiti)","birth_fr":"Les Cayes (Ravine du Sud), Saint-Domingue (Haiti)"},"William Jackson Hooker":{"name":"William Jackson Hooker","bio_de":"Verwandelte die Kew Gardens in die weltweit führende Macht der Pflanzenwissenschaft! Als offizieller Direktor organisierte er Expeditionen quer durch das Britische Weltreich und baute riesige Pflanzenherbarien auf.","bio_fr":"A transforme les jardins de Kew en la puissance mondiale supreme de la science vegetale ! En tant que directeur officiel, il a organise des expeditions a travers l'Empire britannique et constitue d'immenses herbiers.","birth_de":"Norwich (River Wensum), England","birth_fr":"Norwich (River Wensum), Angleterre"},"Nathaniel Wallich":{"name":"Nathaniel Wallich","bio_de":"Leitete den legendären Botanischen Garten von Kalkutta und belud ganze Schiffsflotten mit über 8 000 völlig verrückten, unbekannten indischen Dschungelpflanzen, um die Wissenschaftler in Europa zu verblüffen!","bio_fr":"A dirige le legendaire jardin botanique de Calcutta et a charge des flottes entieres de navires avec plus de 8 000 plantes de la jungle indienne totalement folles et inconnues pour epater les scientifiques d'Europe !","birth_de":"Kopenhagen (Öresund), Dänemark","birth_fr":"Copenhague (l'Oresund), Danemark"},"Thomas Nuttall":{"name":"Thomas Nuttall","bio_de":"Ein furchtloser Entdecker, der Tausende Meilen durch die wilde amerikanische Grenzregion wanderte, dabei Hunderte neuer Pflanzenarten bestimmte und klassische botanische Nachschlagewerke verfasste.","bio_fr":"Un explorateur intrepide qui a parcouru des milliers de miles a travers la frontiere sauvage americaine, identifiant des centaines de nouvelles especes vegetales et ecrivant des guides botaniques de reference classiques.","birth_de":"Settle (River Ribble), England","birth_fr":"Settle (River Ribble), Angleterre"},"Christian Ludwig Brehm":{"name":"Christian Ludwig Brehm","bio_de":"Ein Pfarrer und Vogelsammler, der über 9 000 Vogelbälge zusammentrug und damit bewies, wie feine Unterschiede im Gefieder innerhalb einzelner Vogelarten von Region zu Region bestehen.","bio_fr":"Un pasteur et collectionneur d'oiseaux qui a rassemble plus de 9 000 peaux d'oiseaux, prouvant comment de subtiles variations de plumage existent au sein d'une meme espece d'oiseau selon les regions.","birth_de":"Schönau vor dem Walde, Deutschland","birth_fr":"Schönau vor dem Walde, Allemagne"},"John Richardson":{"name":"John Richardson","bio_de":"Schottischer Marinechirurg und Naturforscher, der zusammen mit John Franklin die raue kanadische Arktis erkundete und ihre Pflanzen- und Tierwelt gründlich in *Fauna Boreali-Americana* dokumentierte.","bio_fr":"Chirurgien de marine et naturaliste ecossais qui a explore le rude Arctique canadien aux cotes de John Franklin, documentant en detail sa flore et sa faune dans *Fauna Boreali-Americana*.","birth_de":"Dumfries (River Nith), Schottland","birth_fr":"Dumfries (River Nith), Ecosse"},"Thomas Say":{"name":"Thomas Say","bio_de":"Der \"Vater der amerikanischen Insektenkunde\"! Er wagte sich auf gefährliche Expeditionen durch den amerikanischen Westen, um Tausende brandneuer Insekten- und Muschelarten zu entdecken und zu beschreiben!","bio_fr":"Le \"pere de l'entomologie americaine\" ! Il a brave de dangereuses expeditions a travers l'Ouest americain pour decouvrir et decrire des milliers d'especes toutes nouvelles d'insectes et de coquillages !","birth_de":"Philadelphia (Delaware River), USA","birth_fr":"Philadelphia (Delaware River), Etats-Unis"},"Carl Sigismund Kunth":{"name":"Carl Sigismund Kunth","bio_de":"Verbrachte 24 Jahre in Paris damit, Tausende neuer südamerikanischer Pflanzenexemplare zu ordnen, zu beschreiben und zu veröffentlichen, die von Humboldts und Bonplands Expedition mitgebracht worden waren.","bio_fr":"A passe 24 ans a Paris a organiser, decrire et publier des milliers de nouveaux specimens de plantes sud-americaines rapportes par l'expedition de Humboldt et Bonpland.","birth_de":"Leipzig, Deutschland","birth_fr":"Leipzig, Allemagne"},"Jacques Boucher de Perthes":{"name":"Jacques Boucher de Perthes","bio_de":"War ein Pionier der Erforschung prähistorischer Feuersteinwerkzeuge in Frankreich und lieferte einige der allerersten Beweise für das hohe Alter der Menschheit.","bio_fr":"A ete un pionnier de l'etude des outils prehistoriques en silex en France, fournissant certaines des toutes premieres preuves de la grande anciennete de l'humanite.","birth_de":"Rethel (Aisne), Frankreich","birth_fr":"Rethel (l'Aisne), France"},"Prideaux John Selby":{"name":"Prideaux John Selby","bio_de":"Radierte lebensgroße, handkolorierte Drucke britischer Vögel auf riesige Papierbögen – und schuf damit britische Vogelkunst, die so groß und detailliert war, dass sie mit Audubons Werk in Amerika mithalten konnte!","bio_fr":"A grave des estampes grandeur nature et coloriees a la main d'oiseaux britanniques sur d'immenses feuilles de papier — creant un art ornithologique britannique si grand et detaille qu'il rivalisait avec l'oeuvre d'Audubon en Amerique !","birth_de":"Alnwick (River Aln), England","birth_fr":"Alnwick (River Aln), Angleterre"},"Joakim Frederik Schouw":{"name":"Joakim Frederik Schouw","bio_de":"Dänischer Pionier, der die Botanik in Richtung Ökologie lenkte, indem er die weltweite Verbreitung von Pflanzenarten direkt mit bestimmten Klimazonen in Verbindung brachte.","bio_fr":"Pionnier danois qui a oriente la botanique vers l'ecologie en reliant directement la repartition mondiale des especes vegetales a des zones climatiques precises.","birth_de":"Kopenhagen (Öresund), Dänemark","birth_fr":"Copenhague (l'Oresund), Danemark"},"William Scoresby":{"name":"William Scoresby","bio_de":"Ein furchtloser arktischer Walfangkapitän, der zum Wissenschaftler wurde: Er kartierte Grönlands eisige Küste, erforschte kalte Meeresströmungen, zeichnete komplexe Schneekristalle und löste das Problem der magnetischen Störungen bei Eisenschiffen!","bio_fr":"Un intrepide capitaine baleinier de l'Arctique devenu scientifique, qui a cartographie la cote glacee du Groenland, etudie les courants oceaniques glaces, dessine des cristaux de neige complexes et resolu les interferences magnetiques des navires en fer !","birth_de":"Whitby (River Esk), England","birth_fr":"Whitby (River Esk), Angleterre"},"William Swainson":{"name":"William Swainson","bio_de":"Ein begabter Künstler und wagemutiger Entdecker, der ultra-detaillierte, farbenprächtige Lithografien wilder Tropenvögel, bunter Fische und Muscheln veröffentlichte, die er auf seinen Reisen durch Südamerika gesammelt hatte!","bio_fr":"Un artiste talentueux et un explorateur audacieux qui a publie des lithographies ultra-detaillees et eclatantes d'oiseaux tropicaux sauvages, de poissons colores et de coquillages recueillis lors de ses voyages en Amerique du Sud !","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"Gideon Mantell":{"name":"Gideon Mantell","bio_de":"Entdeckte und identifizierte die ersten fossilen Zähne und Knochen des *Iguanodon* und spielte damit eine entscheidende Rolle bei der frühen wissenschaftlichen Entdeckung der Dinosaurier.","bio_fr":"A decouvert et identifie les toutes premieres dents et os fossiles de l'*Iguanodon*, jouant un role decisif dans la decouverte scientifique precoce des dinosaures.","birth_de":"Lewes (River Ouse), England","birth_fr":"Lewes (River Ouse), Angleterre"},"Jules Dumont d'Urville":{"name":"Jules Dumont d'Urville","bio_de":"Französischer Marineoffizier, der wichtige Expeditionen in den Südpazifik und in die Antarktis leitete, dabei riesige Mengen biologischer Exemplare sammelte und die Venus von Milo für Frankreich erwarb.","bio_fr":"Officier de marine francais qui a commande des expeditions decisives dans le Pacifique Sud et en Antarctique, rassemblant de vastes collections de specimens biologiques et acquerant la Venus de Milo pour la France.","birth_de":"Condé-sur-Noireau (Noireau), Frankreich","birth_fr":"Conde-sur-Noireau (Noireau), France"},"John Curtis":{"name":"John Curtis","bio_de":"Schuf das großartige 16-bändige Werk *British Entomology*, das als eine der schönsten und genauesten Insektenillustrationen gilt, die je in England gedruckt wurden.","bio_fr":"A realise le majestueux ouvrage en 16 volumes *British Entomology*, salue comme comptant parmi les plus belles et les plus precises illustrations d'insectes jamais imprimees en Angleterre.","birth_de":"Norwich (River Wensum), England","birth_fr":"Norwich (River Wensum), Angleterre"},"Sarah Bowdich Lee":{"name":"Sarah Bowdich Lee","bio_de":"Die erste Frau überhaupt, die in Westafrika neue Pflanzenarten sammelte und systematisch beschrieb! Sie schrieb bahnbrechende naturkundliche Bücher und illustrierte exotische Tierwelt.","bio_fr":"La toute premiere femme a collecter et decrire systematiquement de nouvelles especes vegetales en Afrique de l'Ouest ! Elle a ecrit des livres d'histoire naturelle revolutionnaires et illustre une faune exotique.","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"William Elford Leach":{"name":"William Elford Leach","bio_de":"Ein energiegeladener naturkundlicher Kurator am British Museum, der die Erforschung von Krebstieren, Insekten und Weichtieren durch intensive, pausenlose Laborarbeit revolutionierte!","bio_fr":"Un conservateur en histoire naturelle plein d'energie au British Museum qui a revolutionne l'etude des crustaces, des insectes et des mollusques grace a une analyse de laboratoire intense et incessante !","birth_de":"Plymouth (River Plym), England","birth_fr":"Plymouth (River Plym), Angleterre"},"Augusta Innes Withers":{"name":"Augusta Innes Withers","bio_de":"Eine außergewöhnliche englische Pflanzenmalerin, die als Hofblumenmalerin von Königin Adelaide diente und für erstklassige wissenschaftliche Bücher unglaublich detailreiche Orchideen und exotische Obstpflanzen malte.","bio_fr":"Une extraordinaire peintre botanique anglaise qui fut peintre de fleurs attitree de la reine Adelaide, peignant des orchidees d'un detail fou et des plantes fruitieres exotiques pour de grands ouvrages scientifiques.","birth_de":"Gloucestershire, England","birth_fr":"Gloucestershire, Angleterre"},"James Francis Stephens":{"name":"James Francis Stephens","bio_de":"Verfasste das gewaltige Werk *Illustrations of British Entomology*, das als wichtiger Bezugspunkt für Charles Darwins frühe Insektenforschung diente.","bio_fr":"A ecrit le colossal ouvrage *Illustrations of British Entomology*, qui a servi de reference essentielle aux premieres recherches de Charles Darwin sur les insectes.","birth_de":"Shoreham-by-Sea (River Adur), England","birth_fr":"Shoreham-by-Sea (River Adur), Angleterre"},"Karl Ernst von Baer":{"name":"Karl Ernst von Baer","bio_de":"Er entdeckte die Eizelle der Säugetiere! Er bewies, dass riesige Tiere (und auch Menschen) nicht als fertige Mini-Wesen anfangen, sondern aus einem einzigen, mikroskopisch kleinen Pünktchen heranwachsen!","bio_fr":"Il a découvert l'ovule des mammifères ! Il a prouvé que les animaux gigantesques (et les humains) ne commencent pas comme de mini-créatures déjà toutes formées, mais qu'ils grandissent à partir d'un seul petit point microscopique !","birth_de":"Piibe (Põltsamaa), Estland","birth_fr":"Piibe (Põltsamaa), Estonie"},"Roderick Murchison":{"name":"Roderick Murchison","bio_de":"Er löste gewaltige Rätsel uralter Gesteine in ganz Großbritannien und Europa! Er begründete und benannte das geologische Zeitalter des Silurs und enthüllte damit Millionen Jahre verborgener Erdgeschichte.","bio_fr":"Il a résolu d'énormes énigmes de roches anciennes à travers la Grande-Bretagne et l'Europe ! Il a défini et nommé la période géologique du Silurien, révélant des millions d'années d'histoire cachée de la Terre.","birth_de":"Tarradale (Beauly), Schottland","birth_fr":"Tarradale (Beauly), Écosse"},"William Sharp Macleay":{"name":"William Sharp Macleay","bio_de":"Er erfand das „Quinäre System“ – eine verrückte, verblüffende Theorie aus dem 19. Jahrhundert, die behauptete, jedes einzelne Lebewesen der Erde sei in sich wiederholenden Mustern aus fünf sich überschneidenden Kreisen angeordnet!","bio_fr":"Il a inventé le « système quinaire » – une théorie folle et déroutante du XIXe siècle selon laquelle chaque être vivant de la Terre était organisé selon des motifs répétés de cinq cercles qui se croisent !","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"Johann Friedrich von Eschscholtz":{"name":"Johann Friedrich von Eschscholtz","bio_de":"Deutschbaltischer Naturforscher, der als Arzt und Wissenschaftler an Otto von Kotzebues Entdeckungsreisen teilnahm und die Biologie des Pazifiks entscheidend bereicherte.","bio_fr":"Naturaliste germano-balte qui a servi comme médecin et scientifique lors des voyages d'exploration d'Otto von Kotzebue, contribuant profondément à la biologie du Pacifique.","birth_de":"Tartu (Dorpat) (Emajõgi), Estland","birth_fr":"Tartu (Dorpat) (Emajõgi), Estonie"},"Robert Havell":{"name":"Robert Havell","bio_de":"Der Meister der Druckkunst, der 11 unermüdliche Jahre damit verbrachte, riesige Kupferplatten für John James Audubons weltberühmtes Meisterwerk *The Birds of America* zu gravieren und zu drucken!","bio_fr":"Le maître graveur qui a passé 11 années acharnées à graver et imprimer de gigantesques plaques de cuivre pour le chef-d'œuvre mondialement célèbre de John James Audubon, *The Birds of America* !","birth_de":"Reading (Themse), England","birth_fr":"Reading (la Tamise), Angleterre"},"Achille Valenciennes":{"name":"Achille Valenciennes","bio_de":"Valenciennes verbrachte Jahrzehnte damit, Fische und mikroskopisch kleine Parasiten akribisch zu beschreiben, und war Mitautor einer gewaltigen 22-bändigen Fisch-Enzyklopädie, die noch heute genutzt wird. Er wurde direkt im berühmten Naturkundemuseum von Paris geboren, wo sein Vater arbeitete, wuchs umgeben von exotischen Exemplaren auf und widmete sein Leben den Meerestieren.","bio_fr":"Valenciennes a passé des décennies à décrire minutieusement des poissons et des parasites microscopiques, coécrivant une immense encyclopédie des poissons en 22 volumes, encore utilisée aujourd'hui. Né directement à l'intérieur du célèbre Muséum d'histoire naturelle de Paris, où travaillait son père, il a grandi entouré de spécimens exotiques et a consacré sa vie aux créatures des océans.","birth_de":"Paris, Frankreich","birth_fr":"Paris, France"},"Carl Friedrich Philipp von Martius":{"name":"Carl Friedrich Philipp von Martius","bio_de":"Ein Entdecker, der drei Jahre lang das Amazonasbecken erforschte und eine legendäre, mehrbändige Enzyklopädie über Palmen (*Flora Brasiliensis*) schuf, die bis heute ein Meilenstein der Botanik ist.","bio_fr":"Un explorateur qui a passé trois ans à parcourir le bassin de l'Amazone, produisant une légendaire encyclopédie en plusieurs volumes sur les palmiers (*Flora Brasiliensis*) qui reste une référence en botanique.","birth_de":"Erlangen, Deutschland","birth_fr":"Erlangen, Allemagne"},"Christian Heinrich Pander":{"name":"Christian Heinrich Pander","bio_de":"Er entdeckte die embryonalen Keimblätter (Ektoderm, Mesoderm, Entoderm), aus denen alle Organe des Tierkörpers entstehen, und legte damit den Grundstein für die moderne Embryologie.","bio_fr":"Il a découvert les feuillets embryonnaires (ectoderme, mésoderme, endoderme) qui forment tous les organes du corps des animaux, posant les bases de l'embryologie moderne.","birth_de":"Riga, Lettland","birth_fr":"Riga, Lettonie"},"Eduard Rueppell":{"name":"Eduard Rueppell","bio_de":"Deutscher Naturforscher und Entdecker, der Nordostafrika und den Nahen Osten ausgiebig erforschte und viele neue Arten beschrieb, darunter den Sperbergeier (Rüppells Geier).","bio_fr":"Naturaliste et explorateur allemand qui a longuement exploré le nord-est de l'Afrique et le Moyen-Orient, décrivant de nombreuses nouvelles espèces, dont le vautour de Rüppell.","birth_de":"Frankfurt am Main (Main), Deutschland","birth_fr":"Frankfurt am Main (le Main), Allemagne"},"Eduard Rüppell":{"name":"Eduard Rüppell","bio_de":"Deutscher Naturforscher und Entdecker, der Nordostafrika und den Nahen Osten ausgiebig erforschte und viele neue Arten beschrieb, darunter den Sperbergeier (Rüppells Geier).","bio_fr":"Naturaliste et explorateur allemand qui a longuement exploré le nord-est de l'Afrique et le Moyen-Orient, décrivant de nombreuses nouvelles espèces, dont le vautour de Rüppell.","birth_de":"Frankfurt am Main (Main), Deutschland","birth_fr":"Frankfurt am Main (le Main), Allemagne"},"Elias Magnus Fries":{"name":"Elias Magnus Fries","bio_de":"Bekannt als der „Linné der Mykologie“, schuf dieser schwedische Botaniker das grundlegende System zur Einordnung von Pilzen, das noch heute verwendet wird.","bio_fr":"Surnommé le « Linné de la mycologie », ce botaniste suédois a établi le système de classification fondamental des champignons, encore utilisé aujourd'hui.","birth_de":"Femsjö (Nissan), Schweden","birth_fr":"Femsjö (Nissan), Suède"},"Rene Primevere Lesson":{"name":"Rene Primevere Lesson","bio_de":"Ein Doppeleintrag für den legendären französischen Marine-Naturforscher! Neben den Paradiesvögeln entdeckte er auf seiner zweijährigen Reise rund um den Planeten Dutzende unbekannter Kolibriarten und einzigartige Meerestiere.","bio_fr":"Une double entrée pour l'emblématique naturaliste de la marine française ! Au-delà des oiseaux de paradis, il a découvert des dizaines d'espèces de colibris inconnues et des créatures marines uniques lors de son voyage de deux ans autour de la planète.","birth_de":"Rochefort (Charente), Frankreich","birth_fr":"Rochefort (la Charente), France"},"Christian Gottfried Ehrenberg":{"name":"Christian Gottfried Ehrenberg","bio_de":"Er entdeckte, dass riesige Kreidefelsen und Meeresablagerungen in Wirklichkeit aus Milliarden mikroskopisch kleiner fossiler Skelette bestehen, und zeigte damit die gewaltige geologische Kraft des winzigen Lebens.","bio_fr":"Il a découvert que les gigantesques falaises de craie et les dépôts de sédiments océaniques sont en réalité composés de milliards de squelettes fossiles microscopiques, révélant l'énorme pouvoir géologique de la vie microscopique.","birth_de":"Delitzsch, Deutschland","birth_fr":"Delitzsch, Allemagne"},"Thaddeus William Harris":{"name":"Thaddeus William Harris","bio_de":"Der „Vater der ökonomischen Entomologie in Amerika“! Er zeigte den Bauern, wie sie ihre Ernte schützen können, indem er landwirtschaftliche Schadinsekten und deren Lebenszyklen erforschte.","bio_fr":"Le « père de l'entomologie économique en Amérique » ! Il a montré aux agriculteurs comment protéger leurs récoltes en étudiant les insectes ravageurs des cultures et leurs cycles de vie.","birth_de":"Dorchester (Boston) (Neponset), USA","birth_fr":"Dorchester (Boston) (Neponset), États-Unis"},"Carl Ludwig Blume":{"name":"Carl Ludwig Blume","bio_de":"Ein Botaniker, der jahrelang die tropische Artenvielfalt von Java und Ostindien erforschte und Hunderten exotischer Pflanzen einen Namen gab, darunter seltene Orchideen und riesige Dschungelblumen.","bio_fr":"Un botaniste qui a passé des années à étudier la biodiversité tropicale de Java et des Indes orientales, nommant des centaines de plantes exotiques, dont de rares orchidées et de gigantesques fleurs de la jungle.","birth_de":"Brunswick, Deutschland","birth_fr":"Brunswick, Allemagne"},"Henry De la Beche":{"name":"Henry De la Beche","bio_de":"Erster Direktor des Geologischen Dienstes von Großbritannien, der bahnbrechende geologische Karten erstellte, die den Maßstab für die Stratigrafie setzten.","bio_fr":"Premier directeur du service géologique de Grande-Bretagne, il a créé des cartes géologiques pionnières qui ont établi la norme pour la stratigraphie.","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"John Torrey":{"name":"John Torrey","bio_de":"Eine Schlüsselfigur der amerikanischen Wissenschaft, die gemeinsam mit Asa Gray die enorme Pflanzenvielfalt katalogisierte, die von Expeditionen aus dem amerikanischen Westen mitgebracht wurde.","bio_fr":"Une figure majeure de la science américaine qui a collaboré avec Asa Gray pour cataloguer l'immense diversité végétale rapportée des expéditions dans l'Ouest américain.","birth_de":"New York City (Hudson), USA","birth_fr":"New York City (l'Hudson), États-Unis"},"Orra White Hitchcock":{"name":"Orra White Hitchcock","bio_de":"Amerikas erste wissenschaftliche Illustratorin! Sie malte riesige, wandfüllende Klassenzimmer-Poster mit furchterregenden prähistorischen Fossilien und gigantischen Dinosaurierspuren, um Studierende an der Universität zum Staunen zu bringen!","bio_fr":"La toute première illustratrice scientifique d'Amérique ! Elle peignait d'immenses affiches de classe, grandes comme des murs, représentant de terrifiants fossiles préhistoriques et de gigantesques empreintes de dinosaures pour époustoufler les étudiants de l'université !","birth_de":"Amherst (Connecticut), USA","birth_fr":"Amherst (le Connecticut), États-Unis"},"William MacGillivray":{"name":"William MacGillivray","bio_de":"Er arbeitete mit John James Audubon an *Ornithological Biography* und sezierte und beschrieb die innere Anatomie und die Verdauungssysteme von Hunderten Vogelarten!","bio_fr":"Il a collaboré avec John James Audubon sur *Ornithological Biography*, disséquant et décrivant l'anatomie interne et les systèmes digestifs de centaines d'espèces d'oiseaux !","birth_de":"Aberdeen (Dee), Schottland","birth_fr":"Aberdeen (Dee), Écosse"},"Andrew Smith":{"name":"Andrew Smith","bio_de":"Ein Militärarzt, der nach Südafrika geschickt wurde und seine Freizeit damit verbrachte, in unerforschte Gebiete vorzudringen. Er war der erste Wissenschaftler, der die berüchtigte, hochgiftige Schwarze Mamba offiziell beschrieb, und gründete Südafrikas allererstes Naturkundemuseum.","bio_fr":"Un chirurgien de l'armée envoyé en Afrique du Sud qui passait son temps libre à explorer des territoires inconnus. Il fut le premier scientifique à décrire officiellement le tristement célèbre et très venimeux serpent mamba noir, et il a fondé le tout premier musée d'histoire naturelle d'Afrique du Sud.","birth_de":"Hawick, Schottland","birth_fr":"Hawick, Écosse"},"Charles Lyell":{"name":"Charles Lyell","bio_de":"Der Geologe, der den **Aktualismus** bekannt machte und bewies, dass die geologischen Merkmale der Erde über Millionen von Jahren durch langsame, natürliche Kräfte entstanden sind, die noch heute wirken.","bio_fr":"Le géologue qui a popularisé l'**uniformitarisme**, prouvant que les reliefs géologiques de la Terre se sont formés sur des millions d'années sous l'effet de forces naturelles lentes, toujours à l'œuvre aujourd'hui.","birth_de":"Kinnordy, Schottland","birth_fr":"Kinnordy, Écosse"},"Frederick William Hope":{"name":"Frederick William Hope","bio_de":"Gründer der Hope-Abteilung für Entomologie an der Universität Oxford und Mitbegründer der Royal Entomological Society.","bio_fr":"Fondateur du Hope Department of Entomology de l'université d'Oxford et cofondateur de la Royal Entomological Society.","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"Étienne Mulsant":{"name":"Étienne Mulsant","bio_de":"Ein unaufhaltsamer französischer Naturforscher, der Hunderte neu entdeckter Käferarten klassifizierte und ein gewaltiges, mehrbändiges Meisterwerk über jede einzelne Kolibriart der Erde mitverfasste!","bio_fr":"Un naturaliste français infatigable qui a classé des centaines d'espèces de coléoptères nouvellement découvertes et a coécrit un immense chef-d'œuvre en plusieurs volumes sur chaque espèce de colibri de la Terre !","birth_de":"Mornant (Garon), Frankreich","birth_fr":"Mornant (le Garon), France"},"Anna Atkins":{"name":"Anna Atkins","bio_de":"Atkins schuf das allererste Buch der Welt, das mit Fotografien illustriert war! Mithilfe früher fotografischer Blaupausen (Cyanotypien) legte sie echte Algen und Farne auf lichtempfindliches Papier und schuf so atemberaubende, tiefblaue Abbildungen von Pflanzen.","bio_fr":"Atkins a créé le tout premier livre au monde illustré par des photographies ! À l'aide des premiers procédés photographiques (les cyanotypes), elle plaçait de vraies algues et fougères sur du papier photosensible, créant de superbes images d'un bleu profond représentant le monde végétal.","birth_de":"Tonbridge, England","birth_fr":"Tonbridge, Angleterre"},"David Douglas":{"name":"David Douglas","bio_de":"Kühner schottischer Pflanzenjäger, der die gefährliche Wildnis im pazifischen Nordwesten durchstreifte, um die riesige Douglasie und über 200 Wildpflanzenarten in Gärten auf der ganzen Welt einzuführen!","bio_fr":"Intrépide chasseur de plantes écossais qui a bravé les étendues sauvages et dangereuses du nord-ouest du Pacifique pour introduire l'immense sapin de Douglas et plus de 200 espèces de plantes sauvages dans les jardins du monde entier !","birth_de":"Scone (Tay), Schottland","birth_fr":"Scone (Tay), Écosse"},"Félix Édouard Guérin-Méneville":{"name":"Félix Édouard Guérin-Méneville","bio_de":"Produktiver französischer Entomologe, der Tausende von Insektenarten illustrierte und beschrieb und wichtige Zeitschriftenreihen wie *Revue Zoologique* herausgab.","bio_fr":"Entomologiste français prolifique qui a illustré et décrit des milliers d'espèces d'insectes, dirigeant d'importantes publications en série comme la *Revue Zoologique*.","birth_de":"Toulon (Las), Frankreich","birth_fr":"Toulon (le Las), France"},"Gottlieb August Wilhelm Herrich-Schäffer":{"name":"Gottlieb August Wilhelm Herrich-Schäffer","bio_de":"Führender deutscher Fachmann; er verfasste umfassende, mehrbändige Werke zur Einordnung europäischer Schmetterlinge und Nachtfalter.","bio_fr":"Grand spécialiste allemand ; il a rédigé des ouvrages complets en plusieurs volumes classant les papillons de jour et de nuit d'Europe.","birth_de":"Regensburg (Donau), Deutschland","birth_fr":"Regensburg (le Danube), Allemagne"},"Jean Baptiste Boisduval":{"name":"Jean Baptiste Boisduval","bio_de":"Einer der bedeutendsten Schmetterlingsforscher seiner Zeit, der akribisch die Schmetterlingssammlungen beschrieb, die von großen französischen Marine-Entdeckungsreisen zurückgebracht wurden.","bio_fr":"L'un des plus grands lépidoptéristes de son époque, il a décrit minutieusement les collections de papillons rapportées des grands voyages d'exploration de la marine française.","birth_de":"Ticheville (Touques), Frankreich","birth_fr":"Ticheville (la Touques), France"},"John Lindley":{"name":"John Lindley","bio_de":"Er kämpfte unermüdlich für die Rettung der Royal Botanic Gardens in Kew und wurde einer der führenden Orchideen-Experten, der die Pflanzensystematik grundlegend umgestaltete.","bio_fr":"Il s'est battu sans relâche pour sauver les jardins botaniques royaux de Kew et est devenu l'une des plus grandes autorités sur les orchidées, remodelant en profondeur la taxonomie des plantes.","birth_de":"Old Catton (Wensum), England","birth_fr":"Old Catton (Wensum), Angleterre"},"Mary Anning":{"name":"Mary Anning","bio_de":"Als Baby überlebte sie einen Blitzeinschlag und wurde zur größten Fossilienjägerin aller Zeiten! Sie grub ganze Meeresungeheuer (Plesiosaurier) aus bröckelnden Klippen und bewies den Wissenschaftlern, dass Tiere aussterben können!","bio_fr":"Bébé, elle a survécu à un coup de foudre pour devenir la plus grande chasseuse de fossiles de tous les temps ! Elle a déterré des monstres marins entiers (des plésiosaures) dans des falaises qui s'effritaient, prouvant aux scientifiques que des animaux pouvaient disparaître à jamais !","birth_de":"Lyme Regis (Lim), England","birth_fr":"Lyme Regis (Lim), Angleterre"},"Priscilla Susan Bury":{"name":"Priscilla Susan Bury","bio_de":"Eine geniale, autodidaktische Künstlerin, die gewaltige, eindrucksvolle Drucke von Lilien und Amaryllisblüten veröffentlichte, die selbst die erfahrensten männlichen Botaniker der Welt völlig in Staunen versetzten!","bio_fr":"Une brillante artiste autodidacte qui a publié d'énormes et spectaculaires estampes de lys et de fleurs d'amaryllis qui ont laissé les botanistes masculins les plus expérimentés du monde complètement émerveillés !","birth_de":"Liverpool (Mersey), England","birth_fr":"Liverpool (Mersey), Angleterre"},"Titian Peale":{"name":"Titian Peale","bio_de":"Ein Abenteurer, Tiermaler und Insektensammler, der den ungezähmten amerikanischen Westen durchquerte und mit der U.S. Exploring Expedition um die Welt segelte, um seltene Tiere zu zeichnen!","bio_fr":"Un aventurier, peintre animalier et collectionneur d'insectes qui a traversé l'Ouest américain sauvage et fait le tour du globe lors de l'U.S. Exploring Expedition pour dessiner des animaux rares !","birth_de":"Philadelphia (Delaware), USA","birth_fr":"Philadelphia (le Delaware), États-Unis"},"George Bentham":{"name":"George Bentham","bio_de":"Führender englischer Botaniker des 19. Jahrhunderts, der *Genera Plantarum* mitverfasste und ein umfassendes Klassifikationssystem für Samenpflanzen schuf.","bio_fr":"Grand botaniste anglais du XIXe siècle qui a coécrit *Genera Plantarum*, créant un système de classification complet pour les plantes à graines.","birth_de":"Stoke (Tamar), England","birth_fr":"Stoke (Tamar), Angleterre"},"Heinrich Georg Bronn":{"name":"Heinrich Georg Bronn","bio_de":"Deutscher Paläontologe, bekannt für seine umfangreiche Enzyklopädie fossiler Lebewesen und für die Übersetzung von Charles Darwins Werken ins Deutsche.","bio_fr":"Paléontologue allemand connu pour sa vaste encyclopédie des organismes fossiles et pour avoir traduit les œuvres de Charles Darwin en allemand.","birth_de":"Ziegelhausen (Neckar), Deutschland","birth_fr":"Ziegelhausen (le Neckar), Allemagne"},"Henri Milne-Edwards":{"name":"Henri Milne-Edwards","bio_de":"Französischer Zoologe, bekannt für bahnbrechende Studien über wirbellose Meerestiere, die physiologische Arbeitsteilung und umfassende Werke über Krebstiere.","bio_fr":"Zoologiste français reconnu pour ses études pionnières sur les invertébrés marins, la division physiologique du travail et ses ouvrages complets sur les crustacés.","birth_de":"Bruges (Reie-Kanäle), Belgien","birth_fr":"Bruges (les canaux de la Reie), Belgique"},"James Clark Ross":{"name":"James Clark Ross","bio_de":"Er befehligte die legendäre Antarktis-Expedition der *Erebus* und der *Terror*, führte umfangreiche biologische Untersuchungen durch und entdeckte das Rossmeer.","bio_fr":"Il a commandé la légendaire expédition antarctique de l'*Erebus* et du *Terror*, menant de vastes relevés biologiques et découvrant la mer de Ross.","birth_de":"London (Themse), England","birth_fr":"London (la Tamise), Angleterre"},"Johann Georg Wagler":{"name":"Johann Georg Wagler","bio_de":"Assistent von Spix und später Direktor des Zoologischen Museums in München, der grundlegende taxonomische Systeme für Amphibien und Reptilien schuf.","bio_fr":"Assistant de Spix, puis directeur du Muséum zoologique de Munich, il a établi des cadres taxonomiques essentiels pour les amphibiens et les reptiles.","birth_de":"Nuremberg (Pegnitz), Deutschland","birth_fr":"Nuremberg (Pegnitz), Allemagne"},"Adolphe Brongniart":{"name":"Adolphe Brongniart","bio_de":"Weithin gefeiert als „Vater der Paläobotanik“, entschlüsselte Brongniart die Geheimnisse uralter, prähistorischer Pflanzen, indem er versteinerte Fossilien mit lebenden Pflanzen verglich, und bewies, dass sich die Vegetation der Erde lange vor dem Menschen gewaltig verändert hat. Außerdem trug er zur Entdeckung bei, wie sich Pollenschläuche in Blütenpflanzen entwickeln!","bio_fr":"Largement célébré comme le « père de la paléobotanique », Brongniart a percé les secrets des plantes préhistoriques anciennes en comparant des fossiles de pierre à des plantes vivantes, prouvant que la végétation de la Terre a subi d'énormes changements bien avant l'existence des humains. Il a aussi contribué à découvrir comment les tubes polliniques se développent chez les plantes à fleurs !","birth_de":"Paris, Frankreich","birth_fr":"Paris, France"},"Christian Erich Hermann von Meyer":{"name":"Christian Erich Hermann von Meyer","bio_de":"Ein deutscher Paläontologe, der den berühmten fossilen Vogel *Archaeopteryx* entdeckte und benannte und damit ein entscheidendes evolutionäres Bindeglied zwischen Reptilien und Vögeln nachwies!","bio_fr":"Un paléontologue allemand qui a découvert et nommé le célèbre oiseau fossile *Archaeopteryx*, prouvant un lien évolutif crucial entre les reptiles et les oiseaux !","birth_de":"Frankfurt, Deutschland","birth_fr":"Frankfurt, Allemagne"},"Edward Newman":{"name":"Edward Newman","bio_de":"Gründungsmitglied der Entomological Society of London. Er gab zahlreiche Wissenschaftsmagazine heraus und schrieb sehr beliebte Bücher über britische Farne und Nachtfalter.","bio_fr":"Membre fondateur de l'Entomological Society of London. Il a publié de nombreux magazines scientifiques et écrit des livres très populaires sur les fougères et les papillons de nuit britanniques.","birth_de":"Hampstead (London) (Themse), England","birth_fr":"Hampstead (London) (la Tamise), Angleterre"},"Félix Dujardin":{"name":"Félix Dujardin","bio_de":"Französischer Zoologe, der einzellige Organismen beschrieb und das Protoplasma erkannte und damit wichtige Grundlagen für die Zelltheorie legte.","bio_fr":"Zoologiste français qui a décrit des organismes unicellulaires et identifié le protoplasme, posant des bases essentielles pour la théorie cellulaire.","birth_de":"Tours (Loire), Frankreich","birth_fr":"Tours (la Loire), France"},"Johannes Peter Müller":{"name":"Johannes Peter Müller","bio_de":"Er gilt als einer der Begründer der modernen Physiologie und leistete gewaltige Beiträge zum Verständnis des Nervensystems und der Biologie wirbelloser Meerestiere.","bio_fr":"Considéré comme l'un des fondateurs de la physiologie moderne, il a apporté d'immenses contributions à la compréhension du système nerveux et de la biologie des invertébrés marins.","birth_de":"Koblenz (Rhein), Deutschland","birth_fr":"Koblenz (le Rhin), Allemagne"},"Alcide d'Orbigny":{"name":"Alcide d'Orbigny","bio_de":"Mit gerade einmal 24 Jahren brach d'Orbigny zu einer achtjährigen Expedition durch Südamerika auf, sammelte Tausende von Pflanzen- und Tierarten und kartierte unerforschte Regionen. Außerdem war er ein Pionier bei der Erforschung mikroskopisch kleiner fossiler Schalen, den *foraminifera*, und bewies, dass mikroskopisch kleines Leben gigantische Geschichten über die Erdgeschichte erzählt.","bio_fr":"À seulement 24 ans, d'Orbigny s'est lancé dans une expédition de huit ans à travers l'Amérique du Sud, récoltant des milliers d'espèces de plantes et d'animaux et cartographiant des régions inexplorées. Il fut aussi un pionnier de l'étude des coquilles fossiles microscopiques appelées *foraminifera*, prouvant que la vie microscopique raconte de gigantesques histoires sur le passé de la Terre.","birth_de":"Couëron, Frankreich","birth_fr":"Couëron, France"},"Johann Moritz Rugendas":{"name":"Johann Moritz Rugendas","bio_de":"Er reiste ausgiebig durch Lateinamerika und hielt die Menschen, die Pflanzenwelt und die Landschaften mit künstlerischem Gespür fest, was die europäische Sicht auf die Neue Welt stark prägte.","bio_fr":"Il a beaucoup voyagé à travers l'Amérique latine, documentant les habitants, la flore et les paysages avec un talent artistique qui a fortement influencé la perception européenne du Nouveau Monde.","birth_de":"Augsburg (Lech), Deutschland","birth_fr":"Augsburg (le Lech), Allemagne"},"Robert Chambers":{"name":"Robert Chambers","bio_de":"Er veröffentlichte heimlich einen anonymen Überraschungsbestseller (*Vestiges of Creation*), der die Öffentlichkeit 15 Jahre vor Charles Darwins *Origin of Species* mit den Ideen der Evolution vertraut machte!","bio_fr":"Il a publié en secret un best-seller anonyme à succès fulgurant (*Vestiges of Creation*) qui a fait découvrir au public les idées de l'évolution 15 ans avant que Charles Darwin ne publie *Origin of Species* !","birth_de":"Peebles (Tweed), Schottland","birth_fr":"Peebles (Tweed), Écosse"},"Charles Lucien Bonaparte":{"name":"Charles Lucien Bonaparte","bio_de":"Der Neffe von Napoleon Bonaparte, der zu einem Weltklasse-Ornithologen wurde, viele amerikanische Vögel benannte und bedeutende Bestimmungsbücher zur Vogelsystematik schrieb.","bio_fr":"Le neveu de Napoléon Bonaparte qui est devenu un ornithologue de renommée mondiale, nommant de nombreux oiseaux américains et rédigeant d'importants guides de terrain sur la classification des oiseaux.","birth_de":"Paris, Frankreich","birth_fr":"Paris, France"},"Constantin Wilhelm Lambert Gloger":{"name":"Constantin Wilhelm Lambert Gloger","bio_de":"Entdeckte die „Glogersche Regel\" – ein grundlegendes ökologisches Gesetz, das beweist, dass warmblütige Tiere in warmen, feuchten Regionen sich anpassen, indem sie dunklere Haut- und Federpigmente bilden als ihre Verwandten aus kalten Klimazonen!","bio_fr":"A découvert la « règle de Gloger » – une loi écologique fondamentale prouvant que les animaux à sang chaud vivant dans les régions chaudes et humides s'adaptent en produisant des pigments de peau et de plumes plus foncés que leurs cousins des climats froids !","birth_de":"Kaszyce (Oder), Polen","birth_fr":"Kaszyce (Oder), Pologne"},"Miles Joseph Berkeley":{"name":"Miles Joseph Berkeley","bio_de":"Er war der ultimative Pilzdetektiv! Er löste tatsächlich das Rätsel der katastrophalen Irischen Hungersnot, indem er bewies, dass ein gruseliger, mikroskopisch kleiner Wasserschimmel die gesamte Ernte vernichtete!","bio_fr":"C'était le détective des champignons par excellence ! Il a littéralement résolu le mystère de la catastrophique Grande Famine irlandaise en prouvant qu'une inquiétante moisissure aquatique microscopique détruisait toutes les récoltes !","birth_de":"Benefield (River Nene), England","birth_fr":"Benefield (River Nene), Angleterre"},"Sarah Anne Drake":{"name":"Sarah Anne Drake","bio_de":"Eine brillante englische Illustratorin, die über 1.000 hochdetaillierte, atemberaubende Gemälde exotischer tropischer Orchideen schuf, die aus Regenwäldern rund um den Globus herbeigeschafft wurden!","bio_fr":"Une brillante illustratrice anglaise qui a créé plus de 1 000 peintures d'une précision et d'une beauté époustouflantes représentant des orchidées tropicales exotiques venues de forêts tropicales du monde entier !","birth_de":"Skeyton (River Bure), England","birth_fr":"Skeyton (River Bure), Angleterre"},"Elizabeth Gould":{"name":"Elizabeth Gould","bio_de":"Herausragende Künstlerin, die mehr als 600 exquisite Lithografien für die Vogelbücher ihres Mannes John Gould und für Charles Darwins *Zoology of the Voyage of H.M.S. Beagle* anfertigte.","bio_fr":"Artiste exceptionnelle qui a produit plus de 600 lithographies raffinées pour les livres d'oiseaux de son mari John Gould et pour l'ouvrage de Charles Darwin *Zoology of the Voyage of H.M.S. Beagle*.","birth_de":"Ramsgate (River Stour), England","birth_fr":"Ramsgate (River Stour), Angleterre"},"Hermann Schlegel":{"name":"Hermann Schlegel","bio_de":"Direktor des Leidener Museums, der immense weltweite Sammlungen betreute und systematisch zahlreiche neue Vögel, Schlangen und Amphibien beschrieb.","bio_fr":"Directeur du musée de Leyde, il supervisa d'immenses collections venues du monde entier et décrivit systématiquement quantité de nouveaux oiseaux, serpents et amphibiens.","birth_de":"Altenburg (Pleiße), Deutschland","birth_fr":"Altenburg (Pleiße), Allemagne"},"John Gould":{"name":"John Gould","bio_de":"Der „Vogelmann\" seiner Zeit. Er veröffentlichte monumentale Folianten voller Vogelillustrationen und identifizierte die „Darwinfinken\", die zur Entstehung der Evolutionstheorie beitrugen.","bio_fr":"L'« homme aux oiseaux » de son époque. Il publia de monumentaux volumes in-folio d'illustrations d'oiseaux et identifia les « pinsons de Darwin » qui contribuèrent à faire naître la théorie de l'évolution.","birth_de":"Lyme Regis (River Lim), England","birth_fr":"Lyme Regis (River Lim), Angleterre"},"Karl Theodor Ernst von Siebold":{"name":"Karl Theodor Ernst von Siebold","bio_de":"Er fand heraus, dass manche Lebewesen aus nur einer EINZIGEN Zelle bestehen (Protozoen), und verbrachte seine Laufbahn damit, bizarre, winzige Parasiten aufzuspüren, die im Inneren anderer Tiere leben!","bio_fr":"Il a découvert que certains êtres vivants sont composés d'une SEULE et unique cellule (les protozoaires) et a passé toute sa carrière à traquer d'étranges et minuscules parasites vivant à l'intérieur d'autres animaux !","birth_de":"Würzburg (Main), Deutschland","birth_fr":"Würzburg (Main), Allemagne"},"Matthias Jakob Schleiden":{"name":"Matthias Jakob Schleiden","bio_de":"Ein griesgrämiger Anwalt, der zum Botaniker wurde, unter ein Mikroskop schaute und die verblüffende Entdeckung machte, dass JEDE einzelne Pflanze vollständig aus mikroskopisch kleinen lebenden Bausteinen namens Zellen aufgebaut ist!","bio_fr":"Un avocat grincheux devenu botaniste qui, en regardant au microscope, fit la découverte stupéfiante que CHAQUE plante est entièrement constituée de minuscules briques vivantes microscopiques appelées cellules !","birth_de":"Hamburg (Elbe), Deutschland","birth_fr":"Hamburg (Elbe), Allemagne"},"Richard Owen":{"name":"Richard Owen","bio_de":"Er erfand tatsächlich 1842 das Wort „DINOSAURIER\" („Schreckliche Echse\")! Er war ein brillanter Wissenschaftler, der später Londons berühmtes Natural History Museum schuf.","bio_fr":"Il a littéralement inventé le mot « DINOSAURE » (« terrible lézard ») en 1842 ! C'était un brillant scientifique qui créa par la suite le célèbre Natural History Museum de Londres.","birth_de":"Lancaster (River Lune), England","birth_fr":"Lancaster (River Lune), Angleterre"},"Stephan Endlicher":{"name":"Stephan Endlicher","bio_de":"Entwarf ein bedeutendes neues System zur Klassifizierung von Pflanzen und benannte offiziell die Gattung des riesigen, hoch aufragenden Küstenmammutbaums (*Sequoia*)!","bio_fr":"A conçu un nouveau système majeur de classification des plantes et a officiellement nommé le genre du gigantesque et imposant séquoia à feuilles d'if (*Sequoia*) !","birth_de":"Pressburg (Bratislava (Donau), Slowakei)","birth_fr":"Pressburg (Bratislava (Danube), Slovaquie)"},"Anna Maria Hussey":{"name":"Anna Maria Hussey","bio_de":"Eine begeisterte Pilzsammlerin, die geistreiche, temperamentvolle Ratgeber über Pilze schrieb. Sie zeichnete Pilze nicht nur mit unglaublicher Präzision, sondern verfasste auch urkomische Warnungen darüber, welche Wildpilze einen krank machen und welche in einem Eintopf köstlich schmecken.","bio_fr":"Une passionnée de cueillette de champignons qui écrivit des guides
